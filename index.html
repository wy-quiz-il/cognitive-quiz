בפרק?","o":["גודל ההטרמה היה זהה לקבוצות הביקורת, אף שהזיכרון הגלוי שלהם היה נמוך","גודל ההטרמה היה נמוך, בהתאמה לזיכרון הגלוי הנמוך שלהם","גם ההטרמה וגם הזיכרון הגלוי שלהם היו תקינים","ההטרמה הייתה גבוהה מקבוצות הביקורת, כפיצוי על הזיכרון הגלוי"],"a":0,"e":"אצל האמנזים ההטרמה הייתה תקינה למרות זיכרון גלוי פגוע. זה מראה שהזיכרון החבוי לא תלוי בגלוי."},{"t":"repetition-priming","q":"מה מייחד מבחן זיכרון חבוי, שבו מודדים הטרמה על ידי חזרה?","o":["הנבדקים מתבקשים לומר אם הם זוכרים או רק יודעים כל פריט","הנבדקים חוזרים על המילים בקול כדי לשנן אותן","הנבדקים מגיבים לגירוי שמולם, בלי שיידרשו להיזכר בשלב הלמידה","הנבדקים מבצעים מטלת הסחה לפני שהם נזכרים ברשימה"],"a":2,"e":"במבחני זיכרון חבוי מגיבים לגירויים שמופיעים באותו רגע, בלי צורך להיזכר בגירויים מהלמידה."},{"t":"remember-know","q":"חוקרת מבקשת מנבדק לומר על כל מילה מהלמידה אם הוא זוכר את הרגע שראה אותה או רק מכיר אותה. באיזו שיטה מדובר?","o":["מטלת המיקום הסדרתי","מבחן השלמת התחלות מילים","הטרמה על ידי חזרה","הליך זוכר/יודע"],"a":3,"e":"הליך זוכר/יודע נועד להבחין אם הפרט נשלף מהזיכרון האפיזודי (זוכר) או מהסמנטי (יודע)."},{"t":"remember-know","q":"בהליך זוכר/יודע, מה מבטאת תשובת \"יודע\"?","o":["שליפה מהזיכרון האפיזודי, עם ההקשר של הרגע","שליפה מהזיכרון הסמנטי, בלי מסע בזמן ובלי ההקשר","שליפה מהזיכרון לטווח קצר, כי הפריט הופיע לאחרונה","שליפה מהזיכרון החבוי, בלי מודעות לפריט"],"a":1,"e":"\"יודע\" אומר שמכירים את הפרט ממאגר הידע, בלי לזכור את הרגע שבו נחשפו אליו. זה הזיכרון הסמנטי."},{"t":"remember-know","q":"איזה ממצא התגלה במחקרים שהשתמשו בהליך זוכר/יודע?","o":["ככל שעובר יותר זמן מאירוע, יש פחות תחושות \"זוכר\" ויותר תחושות \"יודע\"","ככל שעובר יותר זמן מאירוע, יש יותר תחושות \"זוכר\" ופחות \"יודע\"","אמנזים ענו \"יודע\" באותה מידה כמו נבדקים בריאים","הפריטים הראשונים ברשימה קיבלו יותר תשובות \"זוכר\""],"a":0,"e":"זו הסמנטיזציה של זכרונות מהעבר הרחוק: עם הזמן הזיכרון מאבד את האופי האפיזודי."},{"t":"explicit","q":"שואלים אותך מה בירת צרפת, ואת עונה במודע \"פריז\". לאיזה סוג זיכרון לטווח ארוך זה שייך?","o":["זיכרון חבוי","זיכרון פרוצדורלי","זיכרון גלוי","הטרמה על ידי חזרה"],"a":2,"e":"שליפה מודעת של עובדה היא זיכרון סמנטי, שהוא חלק מהזיכרון הגלוי."},{"t":"explicit","q":"מה כולל הזיכרון הגלוי?","o":["זיכרון פרוצדורלי וזיכרון סמנטי","זיכרון אפיזודי וזיכרון סמנטי","זיכרון אפיזודי והטרמה על ידי חזרה","זיכרון סמנטי והתניה קלאסית"],"a":1,"e":"הזיכרון הגלוי כולל את האפיזודי (חזרה לרגעים מהעבר) ואת הסמנטי (מאגר הידע הכללי)."},{"t":"explicit","q":"איזה ממצא מדגים פגיעה בזיכרון הגלוי בלי פגיעה בזיכרון החבוי?","o":["אמנזים הראו הטרמה על ידי חזרה זהה לנבדקים לא אמנזים","הסחה אחרי הרשימה ביטלה את אפקט האחרונות","עם הזמן זכרונות אפיזודיים הופכים לידע סמנטי","גרף הלמידה בציור מבעד למראה הוא הדרגתי"],"a":0,"e":"אמנזים פגועים בזיכרון הגלוי, אבל ההטרמה שלהם תקינה. זו דיסוציאציה בין גלוי לחבוי."},{"t":"implicit","q":"כלב של פבלוב מתחיל לרייר כשהוא שומע את הפעמון, בלי היזכרות מודעת. לאיזה סוג זיכרון זה שייך?","o":["זיכרון גלוי","זיכרון אפיזודי","זיכרון סמנטי","זיכרון חבוי"],"a":3,"e":"התניה קלאסית בלי היזכרות מודעת היא אחד הסוגים של הזיכרון החבוי."},{"t":"implicit","q":"איזו טענה נכונה לגבי הזיכרון החבוי?","o":["הוא תלוי ביכולת להכיר את גירויי העבר ולהיזכר בהם","הוא השפעה של העבר שלא תלויה ביכולת להצהיר מה המידע","הוא כולל את הזיכרון האפיזודי ואת הזיכרון הסמנטי","הוא זיכרון לטווח קצר שדועך בלי שינון"],"a":1,"e":"זיכרון חבוי מתבטא בהשפעה של העבר בלי יכולת להצהיר מה המידע, ובלי צורך להכיר או להיזכר."},{"t":"implicit","q":"איזה מהבאים אינו חלק מהזיכרון החבוי?","o":["זיכרון פרוצדורלי","הטרמה על ידי חזרה","זיכרון סמנטי","התניה קלאסית בלי היזכרות מודעת"],"a":2,"e":"הזיכרון הסמנטי שייך לזיכרון הגלוי. החבוי כולל פרוצדורלי, הטרמה על ידי חזרה והתניה קלאסית."},{"t":"procedural","q":"נבדק מתאמן כמה ימים לצייר כשהוא רואה את היד רק דרך מראה, והביצוע שלו משתפר בהדרגה. איזה זיכרון נבדק כאן?","o":["זיכרון פרוצדורלי","זיכרון אפיזודי","הטרמה על ידי חזרה","זיכרון סמנטי"],"a":0,"e":"ציור מבעד למראה הוא מטלה שבודקת רכישת מיומנות חדשה, כלומר זיכרון פרוצדורלי."},{"t":"procedural","q":"מה מראה המקרה של HM לגבי הזיכרון הפרוצדורלי?","o":["שהזיכרון הפרוצדורלי נפגע יחד עם הזיכרון האפיזודי","שHM למד ציור מבעד למראה לאט יותר מנבדקים בריאים","שהזיכרון הפרוצדורלי לא תלוי בזיכרון האפיזודי","שHM זכר את האימונים עצמם אבל לא השתפר"],"a":2,"e":"HM לא יכול היה ליצור זכרונות אפיזודיים חדשים, אבל רכש מיומנות כמו נבדקים בריאים."},{"t":"procedural","q":"איזה ממצא לא מתאים להגדרה של זיכרון פרוצדורלי?","o":["הביצוע במיומנות משתפר בהדרגה עם התרגול","מיומנות חדשה נרכשת רק אם זוכרים במודע את שיעורי האימון","הוא כולל מיומנויות מוטוריות, תפיסתיות וקוגניטיביות","הוא כולל גם מיומנויות בסיסיות כמו הליכה ואחיזה"],"a":1,"e":"זיכרון פרוצדורלי הוא חלק מהזיכרון החבוי ומשמש בלי היזכרות מודעת, כמו אצל HM."},{"t":"semanticization","q":"על אירוע מלפני שנה אנשים זוכרים איפה היו כששמעו עליו. על אירוע מלפני 40 שנה הם רק יודעים שהוא קרה. מה התופעה?","o":["אפקט הראשונות","הטרמה על ידי חזרה","זיכרון פרוצדורלי","סמנטיזציה של זכרונות מהעבר הרחוק"],"a":3,"e":"זכרונות ישנים מאבדים את האופי האפיזודי והופכים לידע עובדתי. זו הסמנטיזציה."},{"t":"semanticization","q":"מה תוצאות המחקר שהדגים את הסמנטיזציה?","o":["ככל שהאירוע ישן יותר, עולה הסיכוי לתשובת \"יודע\" ויורד הסיכוי ל\"זוכר\"","ככל שהאירוע ישן יותר, עולה הסיכוי לתשובת \"זוכר\" ויורד הסיכוי ל\"יודע\"","ככל שהאירוע ישן יותר, עולה רק הסיכוי לתשובת \"לא מכיר\"","גיל האירוע לא השפיע על היחס בין \"זוכר\" ל\"יודע\""],"a":0,"e":"באירועים מוכרים, ככל שהאירוע רחוק יותר בעבר כך יותר \"יודע\" ופחות \"זוכר\"."},{"t":"semanticization","q":"מה תופעת הסמנטיזציה מראה על הקשר בין הזיכרון האפיזודי לסמנטי?","o":["שהם מערכות נפרדות ובלתי תלויות לגמרי","שהזיכרון הסמנטי הופך עם הזמן לאפיזודי","שאין ביניהם הפרדה, ויש ביניהם רצף","שהם שני חלקים של הזיכרון החבוי"],"a":2,"e":"מכיוון שזיכרון אפיזודי הופך בהדרגה לסמנטי, אין כאן שתי מערכות נפרדות אלא רצף."},{"t":"serial-position","q":"גרף מראה את סיכוי הזכירה של כל מילה לפי מקומה ברשימה, והוא בצורת U. איך נקרא הגרף?","o":["אפקט האחרונות","עקומת מיקום סדרתי","גרף למידה הדרגתי","הליך זוכר/יודע"],"a":1,"e":"עקומת המיקום הסדרתי מתארת סיכוי היזכרות כפונקציה של המקום הסדרתי, וצורתה U."},{"t":"serial-position","q":"לפי המודל המודאלי, איך מוסברים שני הקצוות של עקומת המיקום הסדרתי?","o":["ראשונים מהזיכרון לטווח קצר, אחרונים מהזיכרון לטווח ארוך","שני הקצוות נשלפים מהזיכרון לטווח ארוך בזכות שינון","ראשונים מהזיכרון הסמנטי, אחרונים מהזיכרון האפיזודי","ראשונים מהזיכרון לטווח ארוך, אחרונים מהזיכרון לטווח קצר"],"a":3,"e":"הראשונים זכו ליותר שינון ולכן בזיכרון לטווח ארוך. האחרונים עוד לא דעכו מהזיכרון לטווח קצר."},{"t":"serial-position","q":"מה חייב להופיע בהגדרה מלאה של עקומת המיקום הסדרתי?","o":["שהיא מראה שהזיכרון החבוי לא תלוי בגלוי","שהיא מראה מעבר מזיכרון אפיזודי לסמנטי עם הזמן","שהיא בצורת U, וחיזקה את ההבחנה בין זיכרון לטווח ארוך לטווח קצר","שהיא בצורת U, ומוכיחה שהזיכרון לטווח קצר הוא סמנטי"],"a":2,"e":"העקומה בצורת U (ראשונות ואחרונות) ושימשה חיזוק להבחנה של המודל המודאלי בין שני סוגי הזיכרון."}]},{"ch":"c8","title":"פרק 8: זיכרון יומיומי ושגיאות זיכרון","terms":[{"id":"misinfo","name":"אפקט המידע המטעה","one":"מישהו רומז לך פרט לא נכון על אירוע שראית, ואחר כך את \"זוכרת\" דווקא את הפרט הזה.","simple":"צופים בסרטון קצר של אירוע. אחר כך מקבלים תיאור מילולי שלו, ולחלק מהנבדקים מכניסים בתיאור, בלי שיבלוט, פרט לא נכון על התמרור. במבחן בוחרים בין שתי תמונות: אחת עם התמרור המקורי ואחת עם התמרור שתואם למידע המטעה. מי שקיבל מידע מטעה בוחר יותר בתמונה השגויה.","why":"האפקט מראה שסוגסטיה, כלומר מידע שנרמז לנו, משנה את הזיכרון האפיזודי של חוויות העבר. בפרק הוצגו לו שני הסברים: טעות בניטור מקור, והפרעה למוקדם.","example":"ראית תאונה ברחוב. שוטר שואל אותך \"באיזו מהירות נסע הרכב האדום?\" למרות שהרכב היה כסוף. כעבור שבוע את מספרת לחברה על רכב אדום.","points":["מדגים השפעת סוגסטיה (מידע שנרמז) על זיכרון אפיזודי של חוויות עבר","ניסוי לופטוס: צפייה בסרטון של אירוע, ואחר כך תיאור מילולי שלו. לקבוצת הניסוי נשתל בתיאור מידע מטעה על התמרור, ולקבוצת הביקורת לא","במבחן בוחרים בין תמונה עם התמרור המקורי לתמונה עם התמרור שתואם למידע המטעה","קבוצת המידע המטעה בחרה יותר מקבוצת הביקורת בתמונה השגויה","שני הסברים: טעות בניטור מקור (המידע המטעה מיוחס לסרטון) והפרעה למוקדם (המידע המטעה חוסם את שליפת המידע המקורי)"],"confuse":"הפרעה למוקדם: היא רק אחד ההסברים לאפקט, ואילו אפקט המידע המטעה הוא הממצא עצמו.","original":"אפקט זה הוא אחד מהממצאים שמדגימים השפעת סוגסטיה (מידע שנרמז לנו) על הזיכרון של חוויות העבר (זיכרון אפיזודי). האפקט הודגם בניסוי של לופטוס שבו צפו הנבדקים בסרטון קצר של ארוע, ואחר כך קיבלו תיאור מילולי המתייחס למה שהופיע בארוע. לקבוצת הניסוי שתלו בתיאור הארוע, באופן לא בולט, מידע מטעה שאיננו תואם למה שהופיע בארוע המקורי (שהתמרור בסרטון היה תמרור תן זכות קדימה), ולקבוצת הביקורת לא נתנו מידע מטעה. בשלב המבחן נתבקשו הנבדקים לבחור באיזו תמונה צפו בסרטון מבין שתי תמונות שבה הופיעה המכונית כשהיא עומדת לפני תמרור. אחת מהתמונות הייתה לקוחה מהסרטון וכללה את התמרור המקורי והתמונה השניה הייתה זהה פרט לכך שהתמרור הוחלף בתמרור שתאם למידע המטעה (שקיבלה קבוצת הניסוי). נמצא שהנבדקים בקבוצת המידע המטעה בחרו יותר מאשר נבדקי קבוצת הביקורת בתמונה השגויה שתאמה למידע המטעה. שני ההסברים שהוצגו לכך בפרק הם: 1. ההסבר על פי טעות בניטור מקור, כלומר שהנבדקים בקבוצת המידע המטעה מייחסים בטעות את המקור של המידע המטעה לסרטון, ו-2. ההסבר על פי הפרעה למוקדם, שעל פיו המידע המטעה שקיבלו חוסם את השליפה של המידע המקורי שראו."},{"id":"bump","name":"היזכרות מוגברת","one":"מי שעבר את גיל 40 זוכר הכי הרבה דברים מגיל הנעורים והבגרות הצעירה.","simple":"כשמבקשים מאנשים בני 40 ומעלה להיזכר בחייהם, הם מעלים יותר זיכרונות מתקופת הנעורים והבגרות הצעירה מאשר מכל תקופה אחרת. לתופעה הזו יש בספר שלושה הסברים.","why":"שלושת ההסברים: השערת הדימוי העצמי (אז נבנה הדימוי העצמי), ההשערה הקוגניטיבית (תקופה של שינויים מהירים ואחריה יציבות), והשערת תסריט החיים תלוי התרבות (התרבות קובעת אילו אירועים הם נקודות ציון, ורובן קורות בתקופה הזו).","example":"אמא בת 55 מספרת על החיים שלה, ורוב הסיפורים הם על הצבא, הלימודים, החתונה והדירה הראשונה.","points":["נטייה של אנשים בני 40 ומעלה להיזכר ביותר זיכרונות מתקופת הנעורים והבגרות הצעירה מאשר מתקופות אחרות","השערת הדימוי העצמי: בתקופה זו הדימוי העצמי מתהווה, ולכן זוכרים ממנה יותר","ההשערה הקוגניטיבית: נוטים לזכור אירועים מתקופה של שינויים מהירים שאחריה מגיעה תקופה של יציבות","השערת תסריט החיים תלוי התרבות: התרבות מכתיבה אילו אירועים הם נקודות ציון חשובות, מדווחים אותן קודם, ורובן מתרחשות בתקופה זו"],"original":"מדובר בנטייה של אנשים בגילאי 40 ומעלה להיזכר ביותר זכרונות מתקופת הנעורים והבגרות הצעירה, מאשר מתקופות אחרות בחייהם. לנטייה זו הוצגו בספר שלושה הסברים: 1. השערת הדימוי העצמי שעל פיה תקופת הנעורים והבגרות הצעירה היא התקופה שבה הדימוי העצמי של האדם מתהווה, ולכן זוכרים מתקופה זו יותר זכרונות. 2. ההשערה הקוגניטיבית שלפיה אנו נוטים יותר להיזכר בארועים שחלו בתקופה של שינויים מהירים שלאחריה מגיעה תקופה של יציבות. 3. השערת תסריט החיים תלוי התרבות שעל פיה התרבות מכתיבה לנו אלו אירועים בעברנו מהווים נקודות ציון חשובות בחיינו ולכן כשנתבקש לדווח זכרונות עבר, ניטה לדווח קודם כל אותם, ונקודות ציון אלו מתרחשות ברובן באותה תקופת חיים שלגביה יש לנו ההיזכרות המוגברת."},{"id":"proactive","name":"הפרעה למוקדם (כהסבר לאפקט המידע המטעה)","one":"מה שלמדת אחר כך חוסם את השליפה של מה שהיה קודם.","simple":"הפרעה למוקדם היא מצב שבו מידע חדש מפריע לשלוף מידע ישן. בהקשר של אפקט המידע המטעה: המידע המטעה שהגיע אחרי האירוע חוסם את המידע המקורי, ולכן שולפים את המידע המטעה במקומו. זה ההפך מהפרעה למאוחר, שבה מידע ישן מפריע לזכור מידע חדש.","why":"זה אחד משני ההסברים לאפקט המידע המטעה. ניסוי שבדק את שני ההסברים תמך דווקא בהסבר החלופי, טעויות בניטור מקור: כשהמידע המטעה ניתן אחרי זמן רב יותר ובקול אחר (\"התנאי הקל\"), הסיכוי לטעות ירד בחצי.","example":"עברת דירה, ועכשיו כשמישהו שואל את הכתובת הישנה שלך, צצה לך רק החדשה.","points":["הפרעה לשליפת מידע מוקדם שנגרמת על ידי מידע שנלמד מאוחר יותר (בשונה מהפרעה למאוחר)","כהסבר לאפקט המידע המטעה: המידע המטעה שניתן אחרי האירוע מונע לשלוף את המידע המקורי, ושולפים את המידע המטעה במקומו","ההסבר החלופי: טעות בניטור מקור, כלומר מייחסים את המידע המטעה לאירוע המקורי (הסרטון)","בניסוי: כשהמידע המטעה ניתן לאחר זמן רב יותר ובקול שונה (\"התנאי הקל\") הסיכוי לבחור בו קטן בחצי","הממצא תומך בהסבר של טעות בניטור מקור ולא בהפרעה למוקדם"],"confuse":"טעות בניטור מקור: שם המידע המקורי לא נחסם, אלא מבלבלים מאיפה הגיע המידע המטעה.","original":"הפרעה למוקדם היא ההפרעה לשליפת מידע מוקדם שנגרמת על ידי מידע שלמדנו מאוחר יותר (בשונה מהפרעה למאוחר שהיא ההפרעה לזכירת המידע המאוחר יותר שנגרמת על ידי מידע שנלמד לפניו). ההפרעה למוקדם הוצגה בפרק 8 כאחד משני ההסברים לאפקט המידע המטעה. על פי הסבר ההפרעה למוקדם, המידע המטעה שקיבלו נבדקי קבוצת המידע המטעה לאחר הארוע מונע מהם לעיתים לשלוף את המידע המקורי מהארוע, והם שולפים את המידע המטעה במקומו. על פי ההסבר החלופי, המתבסס על טעויות בניטור מקור, הנבדקים שקיבלו את המידע המטעה בטעות מייחסים אותו לארוע המקורי (הסרטון) ולכן הם בוחרים בו בטעות. בניסוי שנערך כדי לבחון את שני ההסברים הללו נמצא שכאשר המידע המטעה נמסר לנבדקים לאחר זמן רב יותר, ועל ידי קול ששונה מהקול שתיאר את הארוע בזמן שבו צפו בו (\"התנאי הקל\") הסיכוי שיבחרו בטעות במבחן הזיכרון במידע המטעה הוא קטן בחצי (לעומת התנאי הקשה). ממצאים אלה תומכים ברעיון שהמידע המטעה מפריע בגלל טעויות בניטור מקור ולא בגלל הפרעה למוקדם, ולכן כשניטור המקור נעשה קל יותר כך גם קטן אפקט המידע המטעה."},{"id":"narrative","name":"השערת שינון הנרטיב","one":"אנחנו לא זוכרים את הרגע עצמו, אלא את הסיפור ששמענו עליו שוב ושוב.","simple":"זה הסבר לכך שבזיכרונות הבזק הביטחון שלנו לא יורד עם הזמן, אף שהדיוק יורד. לפי ההשערה, נחשפנו לסיפור של האירוע שוב ושוב, למשל בתקשורת, ובעצם שיננו אותו. בסוף זוכרים את הסיפור החוזר ולא את החוויה המקורית.","why":"ההשערה מסבירה למה רבים בטוחים שראו את האירוע בטלוויזיה גם אם שמעו עליו מאדם אחר. חיזוק: באנגליה כחצי מהנשאלים דיווחו שראו סרט פפראצי של התאונה של הנסיכה דיאנה, למרות שסרט כזה לא קיים.","example":"מישהי \"זוכרת\" שראתה בשידור חי את הרגע ההיסטורי, אבל בעצם שמעה עליו ברדיו ואחר כך ראתה את הקטעים בחדשות עשרות פעמים.","points":["הסבר לזיכרונות הבזק: הביטחון בזכירתם לא יורד עם הזמן, אף שהדיוק יורד כמו בזיכרונות רגילים","נחשפנו לסיפור (נרטיב) האירוע שוב ושוב, למשל בתקשורת, ושיננו אותו","לכן זוכרים את הסיפור שהוצג שוב ושוב ולא את החוויה המקורית","מסביר למה אנשים חושבים שנחשפו לאירוע בטלוויזיה גם כשנחשפו אחרת (למשל מאדם אחר)","חיזוק: כחצי מהנשאלים באנגליה דיווחו שראו סרט פפראצי של תאונת הנסיכה דיאנה שכלל לא קיים"],"confuse":"זיכרון הבזק: זה המונח עצמו (זיכרון של אירוע ציבורי רגשי), ושינון הנרטיב הוא הסבר למה הביטחון בו נשאר גבוה.","original":"זוהי השערה שהוצגה כאחד מההסברים לגבי זכירת זכרונות הבזק שמיוחדת בכך שהביטחון שלנו בזכירתם לא יורד עם הזמן, על אף שהדיוק של זכירתם יורד עם הזמן כמו בזכרונות שגרתיים. על פי השערה זו הדבר נובע מכך שנחשפנו לסיפור (נרטיב) הארוע שיצר את זכרון ההבזק שוב ושוב, למשל בתקשורת, וחשיפות חוזרות אלה גרמו לנו לשנן את הסיפור (הנרטיב) של הארוע שוב ושוב. לכן בסופו של דבר מה שאנחנו זוכרים הוא לא את החווייה המקורית שבה נחשפנו לארוע, אלא את הסיפור שהוצג לנו שוב ושוב. השערה זו מסבירה מדוע אנשים רבים סבורים שנחשפו בטלויזיה לארועי זכרונות ההבזק, אפילו אם מלכתחילה נחשפו אליהם בצורה אחרת (למשל שמעו עליו מאדם אחר). חיזוק נוסף להשערה זו התקבל במחקר שבו נשאלו אנשים באנגליה אם ראו את סרט הוידאו שצילמו פפראצי על תאונת הדרכים שבה נהרגה הנסיכה דיאנה. וכחצי מהאנשים דיווחו שראו אותו למרות שסרט כזה לא קיים. התיאורים החוזרים של הארוע בטלויזיה ושל נוכחות צלמי הפאפארצ'י גרמו לנבדקים להאמין שראו את הסרט שכלל לא קיים."},{"id":"flashbulb","name":"זיכרון הבזק","one":"\"אני בדיוק זוכרת איפה הייתי כששמעתי על רצח רבין\", אבל הזיכרון הזה לא מדויק יותר מזיכרון רגיל.","simple":"חוקרים חשבו שאירועים ציבוריים לא צפויים וחזקים רגשית, כמו הפיגוע במגדלי התאומים או רצח רבין, נשמרים כמו צילום של הרגע שבו שמענו עליהם. לפי זה, הזיכרונות האלה מדויקים יותר ופחות משתנים. המחקרים מצאו שזה לא נכון: הם לא מדויקים יותר, ומשתנים ונשכחים כמו זיכרונות רגילים. ההבדל היחיד: הביטחון שלנו בהם לא יורד עם הזמן.","why":"זה מראה שתחושת ביטחון חזקה בזיכרון היא לא סימן לדיוק שלו. כמות הפרטים יורדת עם הזמן כמו בכל זיכרון, רק הביטחון נשאר גבוה.","example":"מישהו מספר כל שנה בביטחון מלא איפה עמד כששמע על אירוע גדול, אבל כל פעם הפרטים בסיפור קצת שונים.","points":["מונח של חוקרים שסברו שאירועים ציבוריים בלתי צפויים ועוצמתיים רגשית (למשל מגדלי התאומים, רצח רבין) יוצרים זיכרונות עזים ומדויקים יותר, כמו \"צילום\" של רגע החשיפה","לפי תפיסה זו הם מציגים במדויק את רגע החשיפה ופחות נתונים לשינוי ולשכחה","מחקרים מצאו שהם לא מדויקים יותר ומשתנים באותו אופן כמו זיכרונות רגילים","כמות הפרטים לא שונה מלכתחילה ויורדת עם הזמן כמו בזיכרונות רגילים","ההבדל: הביטחון בדיוק זיכרון הבזק לא משתנה עם הזמן, ובזיכרון רגיל הביטחון יורד"],"confuse":"השערת שינון הנרטיב: היא לא תופעת הזיכרון עצמה אלא ההסבר למה הביטחון בזיכרון ההבזק לא יורד.","original":"זהו מונח שטבעו חוקרים שסברו שארועים ציבוריים בלתי צפויים ועוצמתיים מבחינה רגשית, לדוגמה: הפיגוע במגדלי התאומים, או רצח רבין, גורמים לזכרונות עזים יותר ומדוייקים יותר מזכרונות רגילים, בגלל שהם כמו צילומים ששמרנו \"הדפסה שלהם\" ברגע שנחשפנו אליהם. על פי תפיסה זו זכרונות הבזק מציגים במדויק את רגע ההיחשפות שלנו לארוע הדרמטי, והם פחות נתונים לשינוי ולשכחה. מחקרים שנערכו כדי לבדוק טענות אלה מצאו שזכרונות הבזק אינם מדויקים יותר מזכרונות רגילים, וגם הם משתנים באותו אופן ככל שנבדקת ההיזכרות החוזרת בארוע לאחר יותר ויותר זמן. באופן ספציפי נמצא שכמות הפרטים שזוכרים מארועים אלה איננה שונה מלכתחילה מזכרונות רגילים, והיא יורדת עם הזמן בדיוק כמו לגבי זכרונות רגילים. ההבדל שכן נמצא הוא שלגבי זכרונות הבזק, הביטחון שלנו בכך שאנו זוכרים במדויק איננו משתנה ככל שמתארך הזמן, בעוד שלגבי זכרונות רגילים הביטחון בכך שפרטי הזיכרון מדוייקים הולך ויורד עם הזמן."},{"id":"constructive","name":"טבעו הקונסטרוקטיבי /המבנה של הזיכרון","one":"זיכרון של אירוע הוא לא הקלטה. בונים אותו מחדש ממה שקרה וממה שאנחנו יודעים ומצפים.","simple":"המונח מתייחס לזיכרון האפיזודי לטווח ארוך. הזיכרון של חוויות העבר לא תואם בדיוק את מה שקרה. כשמספרים על העבר אפשר להשמיט דברים, ואפילו לספר על דברים שלא קרו בכלל. הסיבה: הזיכרון נבנה גם מהחוויה עצמה, וגם מהידע הכללי, מהציפיות (הזיכרון הסמנטי) ומחוויות אחרות.","why":"זה העיקרון שמאחורי רוב שגיאות הזיכרון בפרק. בתשובה צריך להביא ממצא אחד שמדגים אותו: להתפרסם בין לילה, ניטור מקור וסטריאוטיפים מגדריים, סכמות ותסריטים, או השפעת ידע על העולם (השלמת מילה צפויה יותר, או \"זכירת\" מילה קשורה שלא הוצגה).","example":"את \"זוכרת\" שבחתונה של בת הדודה היה ריקוד עם הכיסא, כי בכל חתונה יש, אבל בחתונה הזו דווקא לא היה.","points":["מתייחס לזיכרון אפיזודי לטווח ארוך: זיכרון חוויות העבר לא תואם במדויק את מה שהתרחש","אנשים עלולים להשמיט פרטים ואף לדווח על דברים שלא התרחשו","הזיכרון נבנה מהחוויה עצמה וגם מידע כללי וציפיות (זיכרון סמנטי) ומחוויות אחרות","דוגמה אחת: להתפרסם בין לילה, ניטור מקור וסטריאוטיפים מגדריים, סכמות ותסריטים, או השפעת ידע על העולם","השפעת ידע על העולם: החליפו מילה במשפט במילה צפויה יותר, וחשבו שהוצגה מילה שרק מילים קשורות אליה הוצגו"],"confuse":"סכמות ותסריטים: הן רק דוגמה אחת לטבע המבנה של הזיכרון, ולא המונח הכללי.","original":"מונח זה מתייחס לזכרון לטווח ארוך האפיזודי והוא בא להדגיש שזיכרון חוויות העבר איננו תואם במדויק את מה שהתרחש בעבר בפועל, וכתוצאה מכך כשאנשים מדווחים זכרונות של ארועים מהעבר, לא רק שהם עלולים להשמיט דברים אלא הם אף עלולים לדווח על דברים שכלל לא התרחשו. הסיבה לשינויים אלה היא שזיכרונות חוויות העבר נבנים הן מהחוויות שאכן חווינו, והן מהשפעות של גורמים נוספים שמקורם אינו בחווייה עצמה אלא בידע הכללי שלנו ובציפיות שלנו (מהזיכרון הסמנטי) ובחוויות אחרות שחווינו. דוגמא לממצא שהדגים השפעות אלה היא (*יש להציג בקצרה אחד מארבעת הממצאים הבאים באופן הבא): 1. טעויות בניטור מקור ומוכרות (ניסוי \"להתפרסם בין לילה\"), ראו תחת מונח \"טעויות בניטור מקור\". 2. טעויות בניטור מקור וסטריאוטיפים מגדריים ראו תחת מונח \"טעויות בניטור מקור\". 3. השפעות של סכמות ותסריטים על זכירת ארועים, ראו תחת מונח \"סכמות ותסריטים\". 4. השפעות של ידע על העולם על זכרונות העבר: כשהשמיעו לאנשים משפטים וביקשו מהם להשלים מילה שהופיעה במשפט שהוצג להם נמצא שהם נטו להחליף את המילה המקורית במילה שהיתה צפויה יותר להשלים משפט זה, וכן כאשר הציגו לנבדקים אוסף מילים שקשורות למילה שלא הוצגה להם, הם סברו בטעות שהמילה עצמה גם הוצגה להם."},{"id":"source","name":"טעות בניטור מקור /ייחוס מקור שגוי","one":"את זוכרת את המידע, אבל טועה מאיפה הוא הגיע.","simple":"זו טעות בקביעת המקור של זיכרון. למשל, לא לזכור מי אמר לנו משהו, או איפה פגשנו מישהו. הטעויות האלה מראות שהזיכרון נבנה גם מהידע שלנו ולא רק מהחוויה, ולכן הן מדגימות את טבעו המבנה של הזיכרון.","why":"שתי דוגמאות בפרק: ניסוי \"להתפרסם בין לילה\", שבו מוכרות של שם מהלמידה יוחסה לכך שהוא מפורסם, ומחקר הסטריאוטיפים המגדריים, שבו משפט יוחס לדובר שתואם לציפייה המגדרית ולא לדובר האמיתי.","example":"את בטוחה שקראת את הטיפ הזה בכתבה רצינית, אבל בעצם חברה אמרה לך אותו בשיחה.","points":["טעות בקביעת המקור של זיכרון של אירוע מהעבר (מי אמר, איפה פגשנו)","מעידה שהזיכרון נבנה גם מהידע שלנו ולא רק מפרטי החוויה, ולכן מדגימה את טבעו המבנה של הזיכרון","להתפרסם בין לילה: שמות לא מפורסמים מהלמידה זוהו כמפורסמים כשהמבחן היה אחרי 24 שעות ולא מיד; המוכרות יוחסה לפרסום ולא לשלב הלמידה","סטריאוטיפים מגדריים: כשמגדר הדובר לא תאם את האופי המגדרי של המשפט היו יותר טעויות, והמשפט יוחס למקור שתואם לסטריאוטיפ","כשלא זוכרים מקור במדויק, משייכים אותו למקור שתואם את הציפיות"],"confuse":"הפרעה למוקדם: שם מידע חדש חוסם את שליפת הישן, ובניטור מקור המידע זמין אבל מקורו מיוחס בטעות.","original":"מדובר בטעות בקביעת המקור של זיכרון של ארוע בעברנו, לדוגמא הקושי לזכור מי אמר לנו משהו, או איפה נתקלנו באדם מסוים וכו'. טעויות בניטור מקור מעידות שזיכרון חוויות העבר נבנה לא רק מפרטי החווייה שחווינו, אלא גם מהידע שברשותנו, ולכן טעויות אלה מדגימות את טבעו המבנה של הזיכרון. דוגמא לטעות בניטור מקור היא (*יש להציג אחת מן הדוגמאות שלהלן): 1. טעויות בניטור מקור כתוצאה ממוכרות (ניסוי ה\"להתפרסם בין לילה\"): במחקר זה הציגו לנבדקים בשלב הלמידה שמות של אנשים לא מפורסמים, ובשלב המבחן הציגו להם רשימת שמות והם התבקשו לציין אלו שמות הם מפורסמים. נמצא שהנבדקים שקיבלו את המבחן מיד לאחר שלב הלמידה הצליחו בכך, ואילו בקרב הנבדקים שנבחנו 24 שעות לאחר שלב הלמידה, חלק מהשמות הלא-מפורסמים משלב הלמידה זוהו ע\"י הנבדקים כשמות של מפורסמים. לכן נראה שהנבדקים ייחסו בטעות את המוכרות של שמות אלה להיותם מפורסמים במקום לכך שהוצגו בשלב הלמידה, כלומר טעו בניטור המקור של ההכרות עם השמות הללו. מחקר זה מראה שמוכרות של גירוי מחוויה בעברנו עלולה לגרום לנו לשייך אותו בטעות לחוויית עבר אחרת שלנו, שלא הופיע בה. 2. טעויות בניטור מקור וסטריאוטיפים מגדריים: במחקר שנערך לגבי זכירת המקור של משפטים שונים (מי אמר/ה אותם) נמצא שהציפיות המגדריות לגבי אלו משפטים צפוי שיאמרו על ידי גברים ואלו צפוי שיאמרו על ידי נשים גורמות לטעויות בניטור המקור של משפטים אלה. כאשר המגדר של דובר המשפט לא תאם את האופי המגדרי של המשפט, כלומר את הציפיות המגדריות (למשל המשפט \"התחביב שלי הוא כדורסל\" כשנאמר על ידי אישה) היו יותר טעויות בניטור מקור (המשפט יוחס למקור שגוי התואם לסטריאוטיפ המגדרי) מאשר כשהמגדר של אומר המשפט תאם לאופי המגדרי של המשפט. נראה, לכן, שכאשר איננו זוכרים במדויק מקור של משפט, אנו עלולים לשייך אותו בטעות למקור שתואם את הציפיות שלנו, במקום למקור האמיתי שלו."},{"id":"schemas","name":"סכמות ותסריטים","one":"הידע שלך על \"איך נראה משרד\" או \"מה קורה אצל רופא שיניים\" מוסיף לזיכרון פרטים שלא היו.","simple":"סכמות ותסריטים הם תבניות של ידע על העולם, שנשמרות בזיכרון הסמנטי. סכמה היא מה סביר למצוא בסצנה, כמו מטבח, משרד או כיתה. תסריט הוא סדר השלבים של התרחשות, כמו הליכה לרופא שיניים, לסרט או למסעדה. התבניות האלה יכולות לשנות את מה שנזכור מחוויות העבר.","why":"הן מעידות על טבעו המבנה של הזיכרון: זיכרון של אירוע נבנה גם מהידע והציפיות שלנו. במחקרים, מי שקרא סיפור על רופא שיניים הוסיף רכיבים שתואמים לתסריט, ומי שהמתין במשרד \"נזכר\" בפריטים שלא היו בו אבל מתאימים לסכמה של משרד.","example":"שואלים אותך מה היה בכיתה שבה נבחנת, ואת אומרת \"לוח מחיק\", כי בכל כיתה יש, גם אם בכיתה הזו לא היה.","points":["תבניות של ידע על העולם שמקודדות בזיכרון הסמנטי","סכמה: אילו עצמים סביר שיימצאו בסצנה (מטבח, משרד, כיתה). תסריט: השלבים והפעילויות של התרחשות (רופא שיניים, סרט, מסעדה)","יכולות לשנות את מה שנזכור מחוויות העבר, ולכן מעידות על טבעו המבנה של הזיכרון","ממצא: מי שקרא סיפור על הליכה לרופא שיניים הוסיף בהיזכרות רכיבים שלא היו ותואמים לתסריט","ממצא: מי שהמתין במשרד הוסיף בהיזכרות פריטים שלא היו בו ותואמים לסכמה של משרד"],"confuse":"טבעו המבנה של הזיכרון: זה העיקרון הכללי, וסכמות ותסריטים הן אחד הממצאים שמדגימים אותו.","original":"סכמות ותסריטים הם תבניות של ידע על העולם שמקודדות בזיכרון הסמנטי, למשל סכמה של אלו עצמים סביר שיימצאו בסצנה מסוימת כמו מטבח, משרד, כיתה וכו', או תסריט של השלבים והפעילויות שהם חלק מהתרחשות מסוימת כמו הליכה לרופא שיניים, לסרט או למסעדה. מחקרים מצאו שסכמות ותסריטים שקיימים בידע שלנו יכולים לשנות את מה שנזכור מחוויות בעברנו, ולכן הם מעידים על טבעו המבנה של הזיכרון, כלומר שזיכרון ארוע נבנה לא רק ממה שקרה בארוע אלא גם מהידע והציפיות שלנו. במחקרים על סכמות ותסריטים נמצא 1. שנבדקים שקראו סיפור על הליכה לרופא שיניים, למשל, כשהתבקשו להיזכר בו אח\"כ הם הוסיפו לו רכיבים שלא היו בו שתואמים לתסריט של הליכה לרופא שיניים, ו-2. שנבדקים שהמתינו במשרד, ואחר כך התבקשו להיזכר במה שהיה במשרד, הוסיפו פריטים שלא היו בו, שתואמים לסכמה של משרד."}],"drill":[{"t":"misinfo","q":"נבדקים צפו בסרטון של תאונה. אחר כך קראו תיאור שבו הוזכר, בלי שיבלוט, תמרור אחר מזה שהיה בסרטון. במבחן רבים בחרו בתמונה עם התמרור מהתיאור. איזה מונח זה?","o":["טעות בניטור מקור בניסוי להתפרסם בין לילה","אפקט המידע המטעה","השפעת סכמה על זכירת סצנה","השערת שינון הנרטיב"],"a":1,"e":"זה ניסוי לופטוס: מידע שנרמז אחרי האירוע שינה את הזיכרון של האירוע. זה בדיוק אפקט המידע המטעה."},{"t":"misinfo","q":"איזה משפט נכון לגבי ניסוי לופטוס על אפקט המידע המטעה?","o":["קבוצת הביקורת בחרה יותר בתמונה השגויה, כי לא קיבלה תיאור מילולי בכלל","המידע המטעה ניתן לפני הצפייה בסרטון, כדי ליצור ציפייה","קבוצת המידע המטעה בחרה יותר מקבוצת הביקורת בתמונה שתאמה למידע המטעה","הנבדקים התבקשו לשחזר את הסרטון במילים, בלי לבחור בין תמונות"],"a":2,"e":"המידע המטעה ניתן אחרי הסרטון, בתיאור המילולי, ובמבחן בחרו בין שתי תמונות. מי שקיבל מידע מטעה בחר יותר בתמונה השגויה."},{"t":"misinfo","q":"מהם שני ההסברים לאפקט המידע המטעה שהוצגו בפרק?","o":["טעות בניטור מקור והפרעה למוקדם","הפרעה למאוחר והשערת הדימוי העצמי","שינון הנרטיב והשפעת סכמות","הפרעה למוקדם והשערת תסריט החיים"],"a":0,"e":"לפי ניטור מקור, מייחסים את המידע המטעה לסרטון. לפי הפרעה למוקדם, המידע המטעה חוסם את שליפת המידע המקורי."},{"t":"bump","q":"גבר בן 60 מתבקש לספר זיכרונות מחייו, ורובם מגיל 15 עד גיל 30 בערך. איזה מונח מתאר את זה?","o":["זיכרון הבזק","טבעו המבנה של הזיכרון","היזכרות מוגברת","השערת שינון הנרטיב"],"a":2,"e":"היזכרות מוגברת היא הנטייה של בני 40 ומעלה לזכור יותר מתקופת הנעורים והבגרות הצעירה."},{"t":"bump","q":"לפי ההשערה הקוגניטיבית, למה זוכרים יותר מתקופת הנעורים והבגרות הצעירה?","o":["כי זו התקופה שבה הדימוי העצמי מתהווה","כי התרבות קובעת שרוב נקודות הציון בחיים קורות בה","כי האירועים בה הם ציבוריים ועוצמתיים רגשית","כי זו תקופה של שינויים מהירים שאחריה מגיעה תקופה של יציבות"],"a":3,"e":"ההשערה הקוגניטיבית מדברת על שינויים מהירים ואחריהם יציבות. הדימוי העצמי והתרבות הם שתי ההשערות האחרות."},{"t":"bump","q":"מה צריך להופיע בהגדרה של השערת תסריט החיים תלוי התרבות?","o":["התרבות מכתיבה אילו אירועים הם נקודות ציון, מדווחים אותם קודם, ורובם קורים בתקופה הזו","התרבות יוצרת סכמה של סצנות, והיא מוסיפה פרטים שלא היו לזיכרון","התקשורת חוזרת על סיפור האירוע שוב ושוב, ולכן זוכרים את הסיפור","בתקופה הזו האדם בונה את הדימוי העצמי שלו, ולכן התרבות פחות משפיעה"],"a":0,"e":"לפי ההשערה, התרבות קובעת מה נחשב נקודת ציון בחיים, ונקודות הציון האלה קורות בעיקר בתקופת ההיזכרות המוגברת."},{"t":"proactive","q":"מהי הפרעה למוקדם?","o":["מידע שנלמד קודם מפריע לזכור מידע שנלמד אחריו","מידע שנלמד מאוחר יותר מפריע לשלוף מידע שנלמד קודם","טעות בזיהוי מאיפה הגיע מידע שזוכרים","מידע שנלמד קודם נשכח לגמרי עם הזמן"],"a":1,"e":"בהפרעה למוקדם המידע המאוחר פוגע בשליפת המידע המוקדם. האפשרות ההפוכה היא הפרעה למאוחר."},{"t":"proactive","q":"בניסוי שבדק את שני ההסברים לאפקט המידע המטעה, מה קרה ב\"תנאי הקל\" (זמן רב יותר וקול אחר)?","o":["הסיכוי לבחור במידע המטעה עלה פי שניים","לא היה הבדל בין התנאי הקל לתנאי הקשה","הנבדקים זכרו את המידע המטעה פחות, אבל בחרו בו באותה מידה","הסיכוי לבחור במידע המטעה קטן בחצי"],"a":3,"e":"כשקל יותר להבחין במקור, הטעות ירדה בחצי. זה תומך בהסבר של ניטור מקור."},{"t":"proactive","q":"באיזה הסבר תומכים ממצאי הניסוי שבדק את שני ההסברים לאפקט המידע המטעה?","o":["בהפרעה למוקדם, כי המידע המטעה חסם את המידע המקורי","בשני ההסברים במידה שווה","בטעויות בניטור מקור, ולא בהפרעה למוקדם","בהפרעה למאוחר, כי המידע המקורי הפריע למידע המטעה"],"a":2,"e":"כשניטור המקור נעשה קל יותר, האפקט קטן. לכן המסקנה היא שהמידע המטעה מפריע בגלל טעויות בניטור מקור."},{"t":"narrative","q":"כחצי מהנשאלים באנגליה אמרו שראו סרט פפראצי של התאונה של הנסיכה דיאנה, אף שסרט כזה לא קיים. לאיזה מונח זה נותן חיזוק?","o":["השערת שינון הנרטיב","היזכרות מוגברת","אפקט המידע המטעה בניסוי לופטוס","טעות בניטור מקור ומוכרות"],"a":0,"e":"התיאורים החוזרים בטלוויזיה גרמו להם לשנן את הסיפור ולהאמין שראו סרט שלא קיים. זה החיזוק להשערת שינון הנרטיב."},{"t":"narrative","q":"מה השערת שינון הנרטיב באה להסביר?","o":["למה זיכרונות הבזק מדויקים יותר מזיכרונות רגילים","למה הביטחון בזיכרונות הבזק לא יורד עם הזמן, אף שהדיוק יורד","למה בני 40 ומעלה זוכרים יותר מגיל הנעורים","למה מידע מטעה חוסם את שליפת המידע המקורי"],"a":1,"e":"ההשערה מסבירה את הפער בזיכרונות הבזק: הדיוק יורד כמו בזיכרון רגיל, אבל הביטחון נשאר, כי שיננו את הסיפור."},{"t":"narrative","q":"איזה ממצא מתאים להשערת שינון הנרטיב?","o":["אנשים זוכרים את רגע החשיפה המקורי בדיוק רב גם אחרי שנים","אנשים זוכרים יותר פרטים מזיכרון הבזק מאשר מזיכרון רגיל","אנשים נזכרים בפרטים שתואמים לסכמה של הסצנה","אנשים בטוחים ששמעו על האירוע בטלוויזיה, גם אם שמעו עליו מאדם אחר"],"a":3,"e":"לפי ההשערה זוכרים את הסיפור שחזר בתקשורת ולא את החוויה המקורית, ולכן אנשים חושבים שנחשפו בטלוויזיה."},{"t":"flashbulb","q":"מה מצאו המחקרים על זיכרונות הבזק לעומת זיכרונות רגילים?","o":["הם מדויקים יותר, אבל הביטחון בהם יורד עם הזמן","הם מכילים יותר פרטים מלכתחילה, ושומרים עליהם","הם לא מדויקים יותר ומשתנים באותו אופן, אבל הביטחון בהם לא יורד","הם פחות מדויקים מזיכרונות רגילים, והביטחון בהם נמוך"],"a":2,"e":"כמות הפרטים לא שונה ויורדת כמו בזיכרון רגיל. ההבדל היחיד הוא שהביטחון בזיכרון ההבזק נשאר יציב."},{"t":"flashbulb","q":"איזה ממצא לא מתאים לממצאים על זיכרון הבזק?","o":["הזיכרון משתנה ככל שבודקים אותו שוב לאחר זמן רב יותר","כמות הפרטים יורדת עם הזמן כמו בזיכרון רגיל","הביטחון בדיוק הזיכרון נשאר יציב לאורך הזמן","כמות הפרטים נשארת קבועה לאורך השנים"],"a":3,"e":"נמצא שכמות הפרטים בזיכרון הבזק יורדת עם הזמן, בדיוק כמו בזיכרון רגיל. רק הביטחון לא משתנה."},{"t":"flashbulb","q":"מה סברו החוקרים שטבעו את המונח זיכרון הבזק?","o":["שאירועים ציבוריים בלתי צפויים ורגשיים נשמרים כמו צילום של רגע החשיפה, ולכן מדויקים יותר","שאירועים שנשמעו שוב ושוב בתקשורת נזכרים כסיפור ולא כחוויה","שאירועים מגיל הנעורים נזכרים יותר מאירועים מתקופות אחרות","שאירועים רגשיים נשכחים מהר יותר כי הם מדחיקים אותם"],"a":0,"e":"זו התפיסה המקורית: \"צילום\" של רגע החשיפה, זיכרון עז ומדויק שפחות משתנה. המחקרים לא אישרו אותה."},{"t":"constructive","q":"מישהי מספרת על יום ההולדת שלה בגיל 10 ומוסיפה פרטים שלא קרו, כי \"ככה זה תמיד ביום הולדת\". איזה עיקרון כללי זה מדגים?","o":["הפרעה למוקדם","טבעו המבנה של הזיכרון","זיכרון הבזק","היזכרות מוגברת"],"a":1,"e":"הזיכרון נבנה גם מהידע והציפיות ולא רק מהחוויה, ולכן אפשר לדווח על דברים שלא קרו. זה טבעו המבנה של הזיכרון."},{"t":"constructive","q":"לפי טבעו המבנה של הזיכרון, ממה נבנה זיכרון של חוויה מהעבר?","o":["רק מהחוויה עצמה, אבל חלק מהפרטים נשכחים","מהחוויה עצמה ומהידע הכללי, הציפיות (זיכרון סמנטי) וחוויות אחרות","מהידע הכללי בלבד, בלי קשר לחוויה","מהחוויה עצמה ומהזיכרון לטווח קצר בזמן השליפה"],"a":1,"e":"ההגדרה מדגישה שני מקורות: החוויה עצמה, וגורמים שאינם בחוויה, כמו ידע, ציפיות וחוויות אחרות."},{"t":"constructive","q":"איזה ממצא מדגים השפעה של ידע על העולם על זיכרונות העבר?","o":["שמות לא מפורסמים זוהו כמפורסמים אחרי 24 שעות","בני 40 ומעלה זוכרים יותר מגיל הנעורים","מידע מטעה ניתן בקול אחר והאפקט קטן בחצי","נבדקים חשבו שהוצגה מילה שרק מילים קשורות אליה הוצגו"],"a":3,"e":"הממצא הרביעי בהגדרה: הצגת מילים קשורות גרמה לחשוב בטעות שגם המילה עצמה הוצגה, וגם החלפת מילה במילה צפויה יותר."},{"t":"source","q":"נבדקים קראו שמות לא מפורסמים. יום אחר כך חלק מהשמות האלה זוהו כשמות של מפורסמים. איזה מונח זה?","o":["טעות בניטור מקור","אפקט המידע המטעה","הפרעה למוקדם","סכמות ותסריטים"],"a":0,"e":"זה ניסוי להתפרסם בין לילה: המוכרות של השם יוחסה בטעות לכך שהוא מפורסם, ולא לשלב הלמידה."},{"t":"source","q":"בניסוי להתפרסם בין לילה, מתי טעו הנבדקים?","o":["כשנבחנו מיד אחרי הלמידה","גם מיד וגם אחרי 24 שעות, באותה מידה","כשנבחנו 24 שעות אחרי הלמידה","רק כשקיבלו מידע מטעה על השמות"],"a":2,"e":"מי שנבחן מיד הצליח. מי שנבחן אחרי 24 שעות זיהה חלק מהשמות כמפורסמים, כלומר טעה במקור המוכרות."},{"t":"source","q":"במחקר על ניטור מקור וסטריאוטיפים מגדריים, מתי היו יותר טעויות?","o":["כשמגדר הדובר תאם את האופי המגדרי של המשפט","כשמגדר הדובר לא תאם את האופי המגדרי של המשפט","כשהמשפט היה ניטרלי מבחינה מגדרית","כשהדובר היה מפורסם"],"a":1,"e":"כשהמגדר לא תאם את הציפייה (למשל אישה אומרת \"התחביב שלי הוא כדורסל\"), המשפט יוחס בטעות למקור שתואם לסטריאוטיפ."},{"t":"schemas","q":"נבדקים המתינו במשרד, ואחר כך \"נזכרו\" בספרים שלא היו בו. איזה מונח מתאר את זה?","o":["טעות בניטור מקור","אפקט המידע המטעה","סכמות ותסריטים","היזכרות מוגברת"],"a":2,"e":"הסכמה של משרד הוסיפה לזיכרון פריטים שלא היו בו אבל מתאימים לסכמה. זה ממצא על סכמות ותסריטים."},{"t":"schemas","q":"מה ההבדל בין סכמה לתסריט?","o":["סכמה היא אילו עצמים צפויים בסצנה, ותסריט הוא השלבים של התרחשות","סכמה נשמרת בזיכרון האפיזודי, ותסריט בזיכרון הסמנטי","סכמה היא זיכרון של אירוע אחד, ותסריט הוא זיכרון של כמה אירועים","סכמה נוצרת מתקשורת, ותסריט מחוויה אישית"],"a":0,"e":"סכמה: מה סביר למצוא במטבח, משרד או כיתה. תסריט: מה קורה בהליכה לרופא שיניים, לסרט או למסעדה. שתיהן בזיכרון הסמנטי."},{"t":"schemas","q":"מה סכמות ותסריטים מוכיחים על הזיכרון?","o":["שזיכרונות של אירועים רגשיים מדויקים יותר","שמידע חדש חוסם את שליפת מידע ישן","שזיכרון אירוע נבנה גם מהידע והציפיות שלנו, כלומר את טבעו המבנה","שהזיכרון מתקופת הנעורים חזק יותר"],"a":2,"e":"הם מוסיפים לזיכרון פרטים שלא היו אבל מתאימים לידע הכללי, ולכן מעידים על טבעו המבנה של הזיכרון."}]},{"ch":"c10","title":"פרק 10: דמיון חזותי","terms":[{"id":"imagery-debate","name":"הדיון על הדמיון","one":"ויכוח: האם הדמיון עובד עם \"תמונות\" בראש כמו בתפיסה, או עם מושגים מופשטים.","simple":"יש שתי גישות שמסבירות איך הדמיון עובד. לפי הגישה התמונתית, הדמיון משתמש בייצוגים מרחביים, כמו תמונה, ולכן הוא דומה לתפיסה. לפי הגישה הטענתית, הדמיון משתמש בייצוגים טענתיים, כלומר במושגים מופשטים, ולכן הוא שונה מתפיסה ודומה לשאר החשיבה.","why":"הגישה התמונתית הביאה ממצאים שבהם הדמיון מתנהג כמו תפיסה, למשל סריקה מנטלית. הגישה הטענתית ענתה שאפשר להסביר אותם בלי תמונה, בעזרת תיאור מושגי וידע חבוי. גם העדויות המוחיות לא הכריעו.","example":"כשמדמיינים את הסלון בבית, האם \"רואים\" אותו בראש כמו צילום, או פשוט יודעים שהספה ליד החלון והטלוויזיה מולה?","points":["ויכוח בין הגישה התמונתית לגישה הטענתית על אופן פעולת הדמיון","תמונתית: ייצוגים מרחביים/תמונתיים, ולכן הדמיון דומה לתפיסה","טענתית: ייצוגים טענתיים מופשטים (מושגים), ולכן הדמיון שונה מתפיסה ודומה לשאר תהליכי החשיבה","התמונתית הציגה עדויות לדמיון בין ביצועי דמיון לתפיסה (למשל סריקה מנטלית), והטענתית הסבירה אותן בלי ייצוג תמונתי (תיאור מושגי וידע חבוי)","גם עדויות מוחיות (פעילות מוחית ופגיעות מוחיות) לא היו חד-משמעיות"],"confuse":"ייצוג טענתי: זה רק צד אחד בוויכוח, והדיון על הדמיון הוא הוויכוח כולו בין שתי הגישות.","original":"הדיון על הדמיון הוא הוויכוח האקדמי בין שתי גישות להסבר את אופן פעולת הדמיון. על פי הגישה התמונתית, הדמיון מתבסס על ייצוגים מרחביים/תמונתיים, ובכך הוא דומה לתפיסה. על פי הגישה הטענתית הדמיון מתבסס על ייצוגים טענתיים, כלומר על מושגים חזותיים של עצמים ויחסים מרחביים ביניהם. כיון שהייצוגים הטענתיים הם מופשטים, ולא מרחביים/תמונתיים, אז לפי גישה זו הדמיון שונה מתפיסה (ודומה לשאר תהליכי החשיבה המבוססים על מושגים). במסגרת ויכוח זה הציגה הגישה התמונתית מגוון עדויות מחקריות שמנסות לתמוך בכך שביצועי הדמיון דומים לביצועי התפיסה, לדוגמא ניסויי סריקה מנטלית (*אפשר להציג דוגמה אחרת) שבהם זמן התגובה כשסורקים עצם מדומיין גדל ככל שסורקים מרחק גדול יותר, בדיוק כפי שקורה כשסורקים עצם אמיתי. בתגובה, הגישה הטענתית ניסתה להראות שאת הממצאים שהציגה הגישה התמונתית ניתן להסביר ללא שימוש בייצוג תמונתי (ולכן הם לא מהווים הוכחה חותכת שהדמיון מתבסס על ייצוג תמונתי). על פי הגישה הטענתית, כשנבדקים מדמיינים תמונה הם משתמשים בתיאור טענתי/מושגי של התמונה (ולא בתמונה), וכן עשויים לחקות תגובות תפיסתיות על סמך ידע חבוי (כלומר: כיצד היו מגיבים לו היו רואים את הגירוי). בהמשך הדיון נבדקו גם עדויות מוחיות שבדקו את המשותף בין הפעילות המוחית ופגיעות מוחיות בניסויי דמיון ובניסויי תפיסה המקבילים להם, וגם התוצאות ממחקרים מוחיים אלה לא היו חד-משמעיות."},{"id":"neglect","name":"הזנחת צד","one":"אחרי פגיעה באונה הקודקודית, האדם מתעלם מכל מה שבצד אחד, ולפעמים גם בדמיון.","simple":"זו תסמונת שנובעת מפגיעה מוחית באונה הקודקודית. האדם מזניח את העצמים בצד אחד של השדה החזותי, למשל מגלח רק חצי פנים או אוכל רק מצד אחד של הצלחת. אצל מטופל אחד ההזנחה הופיעה גם בדמיון: כשתיאר כיכר מוכרת מנקודת מבט מסוימת, הוא השמיט את מה שהיה משמאל לו.","why":"מטופל שהזניח צד גם בתפיסה וגם בדמיון, למרות שכל המידע על הכיכר היה בזיכרונו, תמך בכך שדמיון ותפיסה משתמשים במנגנונים משותפים. אבל נמצא גם מטופל עם תפיסה תקינה והזנחת צד רק בדמיון. זו דיסוציאציה שתומכת במנגנונים שונים, ולכן התמונה הכללית מעורבת.","example":"דמייני שאת מתארת לחברה את הרחוב שלך כשאת עומדת ליד הסופר, ומפרטת רק את החנויות שמימין, למרות שאת מכירה היטב גם את אלה שמשמאל.","points":["תסמונת שנובעת מפגיעה מוחית באונה הקודקודית","הזנחה/התעלמות מהעצמים בצד אחד של השדה החזותי (למשל גילוח חצי פנים, אכילה מצד אחד של הצלחת)","מטופל עם הזנחת צד שמאל בתפיסה הזניח צד שמאל גם בדמיון (הכיכר), למרות שכל המידע היה בזיכרונו, וזה תומך במנגנונים משותפים לדמיון ולתפיסה","מטופל אחר עם תפיסה תקינה והזנחת צד רק בדמיון: דיסוציאציה שתומכת במנגנונים שונים","המסקנה: הממצאים מהזנחת צד לגבי מנגנונים משותפים הם מעורבים/לא חד-משמעיים"],"original":"מדובר בסינדרום שנובע מפגיעה מוחית (באונת הקודקוד) שבו האדם מזניח/מתעלם מהעצמים בצד אחד של השדה החזותי (עד כדי כך שהוא עלול לגלח רק צד אחד של הפנים או לאכול רק מצד אחד של הצלחת). הסינדרום הוצג בפרק בהקשר של הדיון על הדמיון באופן הבא: המחקר המקורי כלל מטופל שבנוסף להזנחת צד שמאל בתפיסה החזותית, הוא לוקה בהזנחת צד דומה גם בדמיון. למשל כשהוא התבקשו לדמיין כיכר מוכרת לו כשהוא עומד בצד אחד שלה, ולתאר את הדברים שהוא רואה הוא הזניח את המבנים שהיו בדמיונו משמאל לו, בהתאם לנקודה שממנה דמיין את עצמו מתבונן בכיכר. נראה לפיכך שהקושי של המטופל להתייחס לצד של שדה הראייה, התקיים גם לגבי הדמיון שלו, וזה למרות שכל המידע אודות הכיכר על שני צדדיה היה בזכרונו. ממצא זה תמך בכך שהדמיון והתפיסה משתמשים במנגנונים משותפים (ולכן נפגעים יחדיו). מצד שני, במחקר אחר (שתואר מאוחר יותר בפרק) נמצא מטופל עם תפיסה תקינה ללא הזנחת צד, שסבל מהזנחת צד בדמיון. הפגיעה של מטופל זה מדגימה דיסוציאציה בין פגיעה בדמיון לבין העדר פגיעה בתפיסה, ולכן תומכת בכך שתפיסה ודמיון מתבססים על מנגנונים שונים. לסיכום ניתן לומר שהתוצאות, מבדיקת מטופלים עם הזנחת צד, לגבי השאלה של מנגנונים משותפים לדמיון ולתפיסה, הן מעורבות/לא חד-משמעיות."},{"id":"tacit-knowledge","name":"הסבר ידע חבוי","one":"הנבדקים לא באמת סורקים תמונה בראש, הם רק מחקים איך היו מגיבים אילו ראו אותה.","simple":"זה הסבר של תומכי הגישה הטענתית לתוצאות ניסויי הסריקה המנטלית. כשמבקשים מנבדקים לדמיין משהו, הם שואלים את עצמם איך זה היה לראות אותו. ואז הם מחקים את זמני התגובה שהיו להם אילו ראו את הגירוי באמת. הם עושים את זה בלי מודעות, ולכן הידע נקרא חבוי.","why":"ההסבר מסביר למה זמן התגובה גדל עם המרחק בסריקה מנטלית בלי להניח ייצוג תמונתי: הנבדקים יודעים שסריקה של מרחק גדול בעיניים לוקחת יותר זמן. אבל בניסוי מתוחכם יותר, שבו הנקודות הופיעו לפני החץ ולכן אי אפשר היה לשנן מרחקים, זמן התגובה עדיין גדל עם המרחק. זה החליש את ההסבר וחיזק את הגישה התמונתית.","example":"שחקנית שמתבקשת לשתות מכוס ריקה מטה את הראש ומאטה בדיוק כמו עם כוס מלאה. היא לא צריכה משקה, היא פשוט יודעת איך זה אמור להיראות.","points":["הסבר חלופי של הגישה הטענתית לתוצאות ניסויי הסריקה המנטלית (נגד ההסבר התמונתי)","הנבדקים שואלים את עצמם איך זה היה לראות את הגירוי ומחקים את דפוס זמני התגובה של ראייה","החיקוי מבוסס על ידע לא מודע (חבוי) על מה שצפוי במצב של ראיית הגירוי","בסריקה: הם יודעים שסריקה של מרחק גדול בעיניים לוקחת יותר זמן, ולכן מגיבים לאט יותר","ניסוי שבו הנקודות הופיעו לפני החץ (אי אפשר לשנן מרחקים) עדיין הראה גידול בזמן עם המרחק, וזה החליש את ההסבר"],"confuse":"סריקה מנטלית: זה הניסוי עצמו, והסבר הידע החבוי הוא הפרשנות הטענתית לתוצאות שלו.","original":"הסבר זה הוא הסבר שהוצג במקור כדי להסביר את תוצאות ניסויי הסריקה בדיון על הדמיון. זהו הסבר חלופי של תומכי הגישה הטענתית, שיצא כנגד ההסבר של הגישה התמונתית לתוצאות ניסויי הסריקה. על פי הסבר הידע החבוי, כשנבדקים מתבקשים לדמיין משהו הם שואלים את עצמם איך זה יהיה לראות אותו, ואז הם מחקים בניסוי הדמיון את דפוס זמני התגובה שהיו אמור להיות להם במצב של ראיית הגירוי. זאת הם עושים על סמך ידע שיש להם לגבי הצפוי במצב של ראיית הגירוי, ידע שבו הם משתמשים באופן לא מודע, ולכן הוא נקרא חבוי. לדוגמה הממצא המרכזי בניסויי סריקה מנטלית הוא שזמן התגובה של הנבדקים גדל ככל שהמרחק בין נקודת ההתחלה של הסריקה לבין נקודת היעד גדל. על פי הסבר הידע החבוי ניתן לטעון שהנבדקים יודעים כידע חבוי שסריקה של מרחקים גדולים יותר (בעיניים) לוקחת יותר זמן, ולכן בניסויי סריקה מנטלית, הם מנסים להגיב כאילו הם סורקים בעיניהם, וכך דפוס זמני התגובה שלהם מחקה מצב של סריקה באמצעות העיניים. בספר הוזכר ניסוי מתוחכם יותר של סריקה מנטלית שנועד להתמודד עם הסבר הידע החבוי. בניסוי זה לנבדקים לא הייתה אפשרות לשנן את המרחקים בין נקודת תחילת הסריקה - החץ שהופיע על המסך, לבין יעד הסריקה - הנקודות, כיון שהנקודות הופיעו לפני החץ, ולא יחד אתו. לכן הנבדקים לא יכלו להשתמש במרחק לסריקה ליצירת חיקוי של התגובות בניסוי תפיסה מקביל. כיון שגם בניסוי זה זמן התגובה גדל עם גודל המרחק לסריקה, זה החליש את הסבר הידע חבוי, וחיזק את ההסבר על פי הגישה התמונתית."},{"id":"propositional","name":"ייצוג טענתי","one":"הדמיון שומר \"משפטים\" מופשטים, כמו (החתול) (מתחת) (לשולחן), ולא תמונה.","simple":"ייצוג מנטלי שבו העצמים והיחסים ביניהם מיוצגים בסמלים מופשטים, כמו טענות שבנויות ממושגים. הייצוג מכיל ידע על התכונות החזותיות של העצמים, כמו צבע, גודל, מיקום ותנועה, אבל הוא לא תמונה. לפי הגישה הטענתית, גם כשמדמיינים, משתמשים בייצוג כזה.","why":"זה הבסיס של הגישה הטענתית בדיון על הדמיון. לפיה, בסריקה מנטלית יוצרים ייצוג טענתי של העצם או המפה ומבצעים את המשימה לפיו. הדמיון לתגובות של תפיסה מוסבר בידע חבוי שמאפשר לחקות אותן, בלי שום תמונה.","example":"הוראות הגעה כמו \"המכולת משמאל לבנק, מול התחנה\" מתארות מקום בלי שום ציור.","points":["ייצוג מנטלי באמצעות סמלים מופשטים (טענות שמשתמשות במושגים), למשל (החתול) (מתחת) (לשולחן)","מכיל ידע מופשט על תכונות חזותיות של העצמים והיחסים ביניהם (צבע, גודל, מיקום, תנועה), ולא תמונה מנטלית","לפי הגישה הטענתית, הדמיון מתבסס על ייצוג כזה","תוצאות כמו סריקה מנטלית מוסברות בייצוג טענתי וידע חבוי שמאפשר לחקות תגובות של תפיסה"],"confuse":"ייצוג מרחבי/תמונתי: שם חלקי הייצוג והיחסים ביניהם מקבילים לעצמים האמיתיים, וכאן יש רק סמלים מופשטים.","original":"הכוונה לייצוג מנטלי שבו העצמים והיחסים שביניהם מיוצגים באמצעות סמלים מופשטים, כגון טענות המשתמשות במושגים כמו: (החתול) (מתחת) (לשולחן). בדיון על הדמיון השאלה היא האם כאשר אנו משתמשים בדמיון אנו משתמשים בייצוגים תמונתיים/מרחביים בדומה לאלה שמשמשים אותנו כשאנו מסתכלים ממש על העצמים, כפי שטענה הגישה התמונתית, או שאנו משתמשים בייצוגים טענתיים שמכילים ידע מופשט על התכונות החזותיות של העצמים והיחסים ביניהם (מושגי צבע, גודל, מיקומים, תנועה ועוד), ולא בתמונה מנטלית שלהם. כדי להסביר את התוצאות של ניסויי דמיון, למשל ניסויי סריקה מנטלית, טענו תומכי הגישה הטענתית שאנו יוצרים ייצוג טענתי של העצם או המפה שאנו מתבקשים לסרוק בדמיוננו ועל סמך ייצוג טענתי זה, אנו מבצעים את משימת הדמיון. כחיזוק לכך הם גם הוסיפו שיכולתנו להגיב בדומה לתגובות שהיינו מגיבים אילו היינו מבצעים את אותה המטלה בתנאי תפיסתי (כלומר כשאנו רואים ממש את העצם/המפה וסורקים אותם בעינינו) מתבססת גם על הידע החבוי שיש לנו לגבי התפיסה. הידע החבוי מאפשר לנו ליצור חיקוי של התגובות שהיינו מגיבים בתנאי תפיסתי מקביל, למרות שכלל איננו משתמשים בייצוג תמונתי אלא ייצוג טענתי."},{"id":"spatial","name":"ייצוג מרחבי/ייצוגים תמונתיים","one":"תמונה בראש, שבה המיקומים והמרחקים מקבילים לאלה שבעולם האמיתי.","simple":"ייצוג מנטלי שבו העצמים ומיקומיהם מיוצגים בתמונה מנטלית. זה מערך מרחבי: החלקים של הייצוג והיחסים המרחביים ביניהם מקבילים לעצמים וליחסים האמיתיים כשמסתכלים עליהם. לפי הגישה התמונתית, הדמיון משתמש בייצוג כזה, בדיוק כמו התפיסה.","why":"כדי לתמוך בגישה התמונתית, חוקרים הראו שתגובות במשימת דמיון מקיימות את אותם דפוסים התנהגותיים ומוחיים כמו במשימת תפיסה מקבילה. דוגמאות: סריקה מנטלית, השפעה דומה של גודל הדימוי והשדה החזותי, אינטראקציות בין דמיון לתפיסה, ופעילות מוחית ופגיעות מוחיות דומות.","example":"כשמדמיינים את המטבח, אפשר לראות בראש שהמקרר רחוק מהכיור יותר מהתנור, כמו בציור מוקטן של החדר.","points":["ייצוג מנטלי באמצעות תמונה מנטלית, כלומר מערך מרחבי","חלקי הייצוג והיחסים המרחביים ביניהם מקבילים לעצמים וליחסים האמיתיים בזמן הצפייה בהם","לפי הגישה התמונתית, הדמיון מתבסס על ייצוג כזה, כמו התפיסה","תמיכה: אותם דפוסים התנהגותיים ומוחיים בדמיון ובתפיסה, למשל ניסויי סריקה מנטלית (מספיקה דוגמה אחת)"],"confuse":"ייצוג טענתי: שם יש סמלים ומושגים מופשטים בלי תמונה, וכאן הייצוג עצמו מרחבי ומקביל לעולם.","original":"הכוונה לייצוג מנטלי שבו העצמים ומיקומיהם מיוצגים באמצעות תמונה מנטלית, כלומר במערך מרחבי שבו חלקי הייצוג והיחסים המרחביים ביניהם, מקבילים לעצמים וליחסים המרחביים האמתיים המתקיימים כשאנו צופים בעצמים אלה. הדיון על הדמיון נסב לגבי השאלה האם כאשר אנו משתמשים בדמיון אנו משתמשים בייצוגים תמונתיים/מרחביים כמו בתפיסה ממש, כפי שטענה הגישה התמונתית, או שאנו משתמשים בייצוגים טענתיים שמכילים ידע מופשט על התכונות החזותיות של העצמים והיחסים ביניהם, ולא בתמונה מנטלית שלהם. כדי לתמוך בגישה התמונתית ערכו החוקרים ניסויים שבהם ביקשו להראות שהתגובות של נבדקים במשימת דמיון מקיימות את אותם דפוסים התנהגותיים ומוחיים המתקיימים במשימה תפיסתית מקבילה, ובכך לחזק את הטענה שהדמיון מתבסס על ייצוג מרחבי/תמונתי כמו התפיסה. דוגמא לניסויים כאלה היא (*מספיק להזכיר דוגמא אחת מהבאות, ללא פירוט הניסוי): 1. ניסויי הסריקה המנטלית, 2. ניסויים לגבי ההשפעה הדומה של גודל הדימויים החזותיים והשדה החזותי בדמיון ובתפיסה, 3. ניסויים המדגימים אינטראקציות בין דמיון לתפיסה, 4. מחקרים מוחיים לגבי פעילות מוחית דומה במשימות דמיון ותפיסה, וההשפעות הדומות של פגיעות מוחיות עליהם."},{"id":"mental-walk","name":"מטלת הליכה מנטלית","one":"מדמיינים שמתקרבים לחיה ומעריכים מתי היא כבר לא נכנסת בשדה. לחיה קטנה מתקרבים יותר.","simple":"זו מטלה של תומכי הגישה התמונתית. הנבדקים דמיינו שהם הולכים ומתקרבים לבעל חיים, והעריכו באיזה מרחק הוא מתחיל \"לגלוש החוצה\" מהשדה החזותי המדומיין, כלומר ממלא את כולו. ככל שהחיה הייתה קטנה יותר, המרחק שהעריכו היה קטן יותר. בדיוק כמו כשמתקרבים לחיה אמיתית.","why":"התוצאה מקבילה למה שקורה כשמתבוננים בחיה אמיתית ומתקרבים אליה. לכן היא תמכה בגישה התמונתית: הדימויים המנטליים בדמיון מרחביים, בדיוק כמו בתפיסה.","example":"כשמצלמים בטלפון, אפשר להתקרב מאוד לפרפר לפני שהוא יוצא מהמסגרת, אבל מפיל צריך להתרחק כדי שייכנס כולו.","points":["מטלה של הגישה התמונתית בדיון על הדמיון","מדמיינים שמתקרבים לעצם (בעל חיים) ומעריכים באיזה מרחק הוא מתחיל לגלוש החוצה מהשדה החזותי המדומיין (ממלא את כולו)","ככל שהחיה המדומיינת קטנה יותר, המרחק המוערך קטן יותר","זה מקביל לגלישה החוצה משדה הראייה בתפיסה אמיתית, ולכן תומך בכך שהדימויים בדמיון מרחביים כמו בתפיסה"],"confuse":"סריקה מנטלית: שם מודדים זמן תגובה לפי המרחק בין שני חלקים בתמונה, וכאן מעריכים מרחק מהחיה לפי הגודל שלה.","original":"מטלה זו היא אחת מן המטלות שבה השתמשו החוקרים התומכים בגישה התמונתית בדיון על הדמיון כדי לחזק את טענתם שהדמיון מתבסס על ייצוגים תמונתיים כמו אלה שעליהם מתבססת התפיסה. במטלה זו התבקשו הנבדקים לדמיין את עצמם מתבוננים בעצם, למשל בבעל חיים, כאשר הם הולכים ומתקרבים אליו. הנבדקים התבקשו להעריך כמה היו רחוקים מבעל החיים כשהתחילו להרגיש שהוא \"גולש החוצה\" מהשדה החזותי שבו הם מדמיינים אותו, כלומר שהוא ממלא את כולו ואם יתקרבו עוד אליו כבר לא יוכלו לראות את כולו (כי שוליו יחרגו משדה הדמיון). הממצאים בניסוי זה הראו שהנבדקים העריכו את המרחק כקטן יותר (כלומר שיגיעו קרוב יותר אל החיה שמדמיינים) ככל שהחיה שדמיינו הייתה קטנה יותר, בדיוק כפי שקורה ב\"גלישה החוצה\" משדה הראייה שמתרחשת כשמתבוננים ממש בחיה, כשמתקרבים אליה. לכן הממצאים של מטלה זו תמכו בגישה התמונתית, כלומר בכך שהדימויים המנטליים שמופעלים בדמיון הם מרחביים בדיוק כמו בתפיסה."},{"id":"mental-scan","name":"(ניסויי) סריקה מנטלית","one":"ככל שהמרחק בתמונה המדומיינת גדול יותר, לוקח יותר זמן \"להגיע\" אליו.","simple":"הנבדקים ראו קודם תמונה, למשל סירה או מפה של אי, ואז דמיינו אותה. הם התמקדו בחלק אחד ואז ענו על חלק אחר. ככל שהמרחק בתמונה המקורית בין שני החלקים היה גדול יותר, לקח להם יותר זמן לענות. זה דומה למה שקורה כשסורקים תמונה אמיתית בעיניים.","why":"הממצא תמך בגישה התמונתית: הדמיון מתבסס על ייצוג תמונתי כמו התפיסה החזותית. תומכי הגישה הטענתית ענו שאפשר להסביר אותו בייצוג טענתי ובידע חבוי שמאפשר לחקות סריקה בעיניים.","example":"מדמיינים את הבית והולכים בראש מהדלת למטבח, ואחר כך מהדלת לחדר השינה שבקצה. הדרך הארוכה לוקחת יותר זמן גם בדמיון.","points":["מטלה של הגישה התמונתית בדיון על הדמיון","מדמיינים עצם/מפה שראו קודם (למשל סירה או מפה של אי), מתמקדים בחלק אחד ואז עונים לגבי חלק אחר","ככל שהמרחק בין החלקים בתמונה המקורית גדול יותר, זמן התגובה ארוך יותר, כמו בסריקה בעיניים","הממצאים תמכו בגישה התמונתית","הגישה הטענתית: אפשר להסביר אותם בייצוג טענתי וידע חבוי שמחקה סריקה בעיניים"],"confuse":"הסבר ידע חבוי: זו לא המטלה עצמה, אלא ההסבר הטענתי החלופי לתוצאות שלה.","original":"מטלה זו היא אחת מן המטלות שבה השתמשו החוקרים התומכים בגישה התמונתית בדיון על הדמיון כדי לחזק את טענתם שהדמיון מתבסס על ייצוגים תמונתיים כמו אלה שעליהם מתבססת התפיסה החזותית. במטלת הסריקה המנטלית התבקשו הנבדקים לדמיין עצם או מפה שראו קודם (למשל: תמונת סירה או מפה של אי), להתמקד בתחילה בחלק אחד בעצם/במפה, ואז לענות לגבי חלק אחר בעצם/במפה. הממצאים במטלת דמיון זו הראו, שככל שהמרחק (בתמונה המקורית שראו) בין החלק בעצם/במפה שבו התמקדו בתחילה, אל החלק שלגביו התבקשו לענות (נקודת היעד) היה גדול יותר, כך לקח לנבדקים יותר זמן עד שהגיעו/שהשיבו לגביו. זאת בדומה למתקבל כשסורקים בעיניים ממש את העצם/המפה, ולכן ממצאים אלה תמכו בגישה התמונתית. תומכי הגישה הטענתית טענו בתגובה שניתן להסביר ממצאים אלה בכך שהנבדקים משתמשים בייצוג טענתי (ולא תמונתי) של התמונה שמדמיינים, ובידע חבוי שמאפשר להם לחקות בתגובותיהם סריקה בעיניים של תמונה."}],"drill":[{"t":"imagery-debate","q":"מה טוענת הגישה הטענתית בדיון על הדמיון?","o":["הדמיון מתבסס על ייצוגים מרחביים, ולכן הוא דומה לתפיסה","הדמיון מתבסס על מושגים מופשטים, ולכן הוא שונה מתפיסה","הדמיון והתפיסה נשענים בדיוק על אותם מנגנונים מוחיים","הדמיון מתבסס על תמונות, אבל רק כשהגירוי מוכר"],"a":1,"e":"לפי הגישה הטענתית הייצוגים בדמיון הם טענתיים ומופשטים, ולכן הדמיון שונה מתפיסה ודומה לשאר החשיבה המבוססת על מושגים."},{"t":"imagery-debate","q":"מה נכון לגבי העדויות המוחיות שנבדקו בדיון על הדמיון?","o":["הן הכריעו בבירור לטובת הגישה התמונתית","הן הכריעו בבירור לטובת הגישה הטענתית","הן בדקו רק פגיעות מוחיות ולא פעילות מוחית","התוצאות שלהן לא היו חד-משמעיות"],"a":3,"e":"בהגדרה נאמר שגם התוצאות מהמחקרים המוחיים, על פעילות ועל פגיעות, לא היו חד-משמעיות."},{"t":"imagery-debate","q":"מה חייב להופיע בהגדרה מלאה של הדיון על הדמיון?","o":["שתי הגישות, מה כל אחת טוענת, ושהטענתית מסבירה את ממצאי התמונתית בלי תמונה","רק את ניסוי הסריקה המנטלית ואת זמני התגובה שנמדדו בו","רק את תסמונת הזנחת הצד ואת הפגיעה באונה הקודקודית","שהגישה התמונתית הוכחה סופית בעזרת עדויות מוחיות"],"a":0,"e":"הדיון הוא ויכוח בין שתי גישות. צריך להציג את שתיהן, את העדויות של התמונתית ואת התשובה של הטענתית."},{"t":"neglect","q":"מטופל אחרי פגיעה באונה הקודקודית מתאר כיכר מוכרת מנקודת מבט מסוימת, ומשמיט את כל המבנים שמשמאל לו. במה מדובר?","o":["הסבר ידע חבוי","מטלת הליכה מנטלית","הזנחת צד","סריקה מנטלית"],"a":2,"e":"הזנחת צד היא התעלמות מצד אחד של השדה החזותי אחרי פגיעה קודקודית, ואצל מטופל זה היא הופיעה גם בדמיון."},{"t":"neglect","q":"מה הדגים המטופל עם תפיסה תקינה שסבל מהזנחת צד רק בדמיון?","o":["דיסוציאציה שתומכת בכך שלדמיון ולתפיסה יש מנגנונים שונים","שדמיון ותפיסה משתמשים במנגנונים משותפים ולכן נפגעים יחד","שהמידע על צד אחד של הכיכר נמחק מהזיכרון שלו","שהזנחת צד נובעת מפגיעה באונה העורפית ולא הקודקודית"],"a":0,"e":"פגיעה בדמיון בלי פגיעה בתפיסה היא דיסוציאציה, וזה תומך במנגנונים שונים לדמיון ולתפיסה."},{"t":"neglect","q":"איזה פרט חשוב בממצא של המטופל הראשון שתיאר את הכיכר?","o":["הוא הזניח את הצד הימני בדמיון ואת השמאלי בתפיסה","הוא הזניח צד רק כשהסתכל על הכיכר באמת","המידע על צד שמאל של הכיכר לא היה שמור בזיכרונו","כל המידע על שני צדי הכיכר היה בזיכרונו, ובכל זאת השמיט צד אחד"],"a":3,"e":"ההזנחה התרחשה למרות שכל המידע היה בזיכרון, ולכן היא נובעת מקושי בדמיון עצמו. זה תמך במנגנונים משותפים."},{"t":"tacit-knowledge","q":"לפי הסבר הידע החבוי, למה זמן התגובה גדל עם המרחק בסריקה מנטלית?","o":["כי התמונה המדומיינת מרחבית והסריקה בה עוברת מרחק","כי הם יודעים, בלי מודעות, שסריקה בעיניים של מרחק גדול איטית יותר","כי הנבדקים שוכחים את פרטי התמונה ככל שהמרחק גדל","כי הנבדקים מזניחים את הצד הרחוק של התמונה המדומיינת"],"a":1,"e":"לפי ההסבר, הנבדקים מחקים את זמני התגובה של ראייה אמיתית על סמך ידע לא מודע, בלי להשתמש בתמונה."},{"t":"tacit-knowledge","q":"איזה ממצא החליש את הסבר הידע החבוי?","o":["מטופל עם הזנחת צד רק בדמיון ולא בתפיסה","ניסוי שבו הנבדקים ראו את החץ והנקודות יחד על המסך","ניסוי שבו הנקודות הופיעו לפני החץ, ובכל זאת הזמן גדל עם המרחק","ניסוי שבו זמן התגובה לא השתנה עם המרחק לסריקה"],"a":2,"e":"כשהנקודות הופיעו לפני החץ אי אפשר היה לשנן מרחקים ולחקות. הזמן עדיין גדל עם המרחק, וזה חיזק את הגישה התמונתית."},{"t":"tacit-knowledge","q":"מי הציע את הסבר הידע החבוי, ולשם מה?","o":["תומכי הגישה הטענתית, כדי להסביר את ממצאי הסריקה בלי ייצוג תמונתי","תומכי הגישה התמונתית, כדי לחזק את ממצאי הסריקה המנטלית","תומכי הגישה הטענתית, כדי להסביר את הזנחת הצד בדמיון","תומכי הגישה התמונתית, כדי להסביר את מטלת ההליכה המנטלית"],"a":0,"e":"זה הסבר חלופי של הגישה הטענתית, שיצא נגד ההסבר התמונתי לתוצאות ניסויי הסריקה."},{"t":"propositional","q":"נבדקת מספרת שכשהיא מדמיינת את החדר שלה היא לא רואה תמונה, אלא פשוט יודעת: המיטה ליד הקיר, המנורה מעל השולחן. לאיזה ייצוג זה מתאים?","o":["ייצוג מרחבי/תמונתי","מטלת הליכה מנטלית","הזנחת צד","ייצוג טענתי"],"a":3,"e":"ייצוג טענתי מתאר עצמים ויחסים ביניהם בעזרת מושגים מופשטים, בלי תמונה מנטלית."},{"t":"propositional","q":"מה נכון לגבי ייצוג טענתי?","o":["חלקי הייצוג והמרחקים ביניהם מקבילים לעצמים האמיתיים","הוא מכיל ידע מופשט על צבע, גודל, מיקום ותנועה, בלי תמונה","הוא נוצר רק בזמן תפיסה ולא בזמן דמיון","לפיו הדמיון דומה לתפיסה כי שניהם מרחביים"],"a":1,"e":"הייצוג הטענתי מכיל ידע מופשט על תכונות חזותיות ויחסים, ולא תמונה. ההקבלה המרחבית שייכת לייצוג התמונתי."},{"t":"propositional","q":"איך תומכי הייצוג הטענתי מסבירים את הדמיון בין תגובות בדמיון לתגובות בתפיסה?","o":["בכך שהדמיון והתפיסה משתמשים באותה תמונה מנטלית","בכך שהנבדקים רואים את הגירוי שוב בזמן המשימה","בידע חבוי שמאפשר לחקות תגובות של תפיסה בלי תמונה","בפגיעה מוחית שמשבשת את התפיסה ואת הדמיון יחד"],"a":2,"e":"לפי ההגדרה, הידע החבוי מאפשר לחקות את התגובות של תנאי תפיסתי מקביל, למרות שהייצוג הוא טענתי."},{"t":"spatial","q":"מה ההגדרה של ייצוג מרחבי/תמונתי?","o":["תמונה מנטלית שבה החלקים והיחסים ביניהם מקבילים לעצמים וליחסים האמיתיים","רצף של סמלים מופשטים שמתארים עצמים ואת היחסים ביניהם","ידע לא מודע על איך היינו מגיבים אילו ראינו את הגירוי","תסמונת שבה אדם const STORE_KEY = "cogquiz.v1";
const LETTERS = ["א","ב","ג","ד"];
const EXAM_SIZE = 28;
const QUIZ_SIZE = 30;

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function save(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let store = load();
if(!store.scores) store.scores = {};
if(!store.mode) store.mode = "practice";

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const chapterById = Object.fromEntries(DATA.map(c=>[c.id,c]));
const shortTitle = t => t.replace(/^פרק \d+:\s*/,"");
const chNum = t => (t.match(/^פרק (\d+)/)||[])[1] || "";
function scoreClass(s){ return s>=85?"good":s>=60?"mid":"bad"; }
function pillFor(rec){
  if(!rec) return '<span class="pill none">טרם נבחנת</span>';
  const c = rec.best>=85?"good":rec.best<60?"bad":"";
  return `<span class="pill ${c} num">שיא: ${rec.best}</span>`;
}

/* ---------- home ---------- */

  const done = Object.keys(store.scores).filter(k=>chapterById[k]);
  const avg = done.length ? Math.round(done.reduce((s,k)=>s+store.scores[k].best,0)/done.length) : null;
  const total = DATA.reduce((s,c)=>s+c.questions.length,0);
  const shelf = (key, cls, label, sub) => {
    const chs = DATA.filter(c=>c.id.startsWith(key));
    return `<section class="shelf ${cls}">
      <div class="shelf-head"><span class="spine" aria-hidden="true"></span><div><h2>${label}</h2><small>${sub}</small></div></div>
      <div class="grid">${chs.map(c=>{const r=store.scores[c.id], rh=store.scores[c.id+"-hard"];return `
        <article class="ch${c.source==="book"?" from-book":""}">
          <span class="n">פרק ${chNum(c.title)}</span>
          <span class="t">${esc(shortTitle(c.title))}</span>
          ${c.source==="book"
            ?`<span class="src-tag book">מקור: הספר · אין מצגת לפרק</span><span class="book-note">לפרק הזה אין מצגת בתיקייה. השאלות נכתבו ישירות מעמודי הספר (עמ׳ 373–413).</span>`
            :`<span class="src-tag">מקור: מצגת הפרק</span>`}
          <div class="ch-actions">
            <button class="ch-btn" data-ch="${c.id}"><span class="ch-btn-l"><b>תרגול</b><span class="num">${Math.min(c.questions.length,QUIZ_SIZE)} שאלות</span></span>${pillFor(r)}</button>
            ${c.hard?`<button class="ch-btn hard" data-hard="${c.id}"><span class="ch-btn-l"><b>מאתגר</b><span class="num">${c.hard.length} שאלות חשיבה</span></span>${pillFor(rh)}</button>`:""}
          </div>
        </article>`;}).join("")}</div>
    </section>`;
  };
  $app.innerHTML = `
    <div class="brandbar">${LOGO}</div>
    <header class="top">
      <div><h1>תרגול <span class="lit">לבחינה</span></h1><p class="muted">פסיכולוגיה קוגניטיבית · ${total} שאלות אמריקאיות לפי פרקים</p></div>

let praiseI = 0;
function praiseFor(it){ const list = Q && Q.key.endsWith("-hard") ? PRAISE_HARD : PRAISE; if(it._p===undefined) it._p = list[(praiseI++ + Math.floor(Math.random()*list.length)) % list.length]; return it._p; }
function startHard(id){

function startChapter(id, onlyIdx){

function startMixed(){

function retryWrong(){
  const wrong = Q.items.filter((it,k)=>!it.opts[Q.answers[k]]?.ok);

function renderQ(){

  const items = [];
  TERMS.forEach(c=>shuffle(c.terms).slice(0,EXAM_PICK[c.ch]||1).forEach(t=>items.push({ch:c.ch,t})));
  MK = {items, chosen:new Set(), i:-1, drafts:{}, open:false, grades:{}};
  renderMock();
}
function renderMock(){
  if(MK.i===-1){
    $app.innerHTML = `
      <div class="qbar"><h2>מבחן מונחים מדומה</h2><button class="btn ghost" id="home">חזרה למונחים</button></div>
      <p class="muted" style="margin:0">אלה 6 המונחים שקיבלת. בחרי 4 מהם, כמו בבחינה.</p>
      <div class="pick">${MK.items.map((x,k)=>`<button class="agree" data-pk="${k}" role="checkbox" aria-checked="${MK.chosen.has(k)}">
        <span class="box">${TICK}</span><span class="agree-text">${esc(x.t.name)}<br><small class="muted">${esc(termCh[x.ch].title.split(":")[0])}</small></span></button>`).join("")}</div>
      <div class="nav"><span class="muted num">נבחרו ${MK.chosen.size} מתוך 4</span><button class="btn" id="go" ${MK.chosen.size===4?"":"disabled"}>להתחיל לכתוב</button></div>`;
    $app.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const k=+b.dataset.pk;
      if(MK.chosen.has(k)) MK.chosen.delete(k); else if(MK.chosen.size<4) MK.chosen.add(k); renderMock();});
    document.getElementById("go").onclick=()=>{MK.order=[...MK.chosen];MK.i=0;MK.open=false;renderMock();};
    document.getElementById("home").onclick=renderTermsHome;
    return;
  }
  if(MK.i>=MK.order.length) return renderMockResult();
  const x = MK.items[MK.order[MK.i]], t = x.t, g = MK.grades[MK.i];
  $app.innerHTML = `
    <div class="qbar"><h2>מבחן מונחים מדומה</h2><button class="btn ghost" id="home">חזרה למונחים</button></div>
    <div class="progress" aria-hidden="true"><i style="width:${Math.round(MK.i/MK.order.length*100)}%"></i></div>
    <article class="tcard">
      <div class="qnum num">מונח ${MK.i+1} מתוך ${MK.order.length} · ${esc(termCh[x.ch].title.split(":")[0])}</div>
      <h3>הגדירי: ${esc(t.name)}</h3>
      <textarea class="writebox" id="draft" placeholder="ההגדרה שלי...">${esc(MK.drafts[MK.i]||"")}</textarea>
      ${MK.open?cardBody(t)+`<p class="sec"><b>איך הלך?</b></p>
        <div class="selfgrade">
          <button class="btn ${g===2?"":"ghost"}" data-g="2">כתבתי את כל הנקודות</button>
          <button class="btn ${g===1?"":"ghost"}" data-g="1">חלק מהנקודות</button>
          <button class="btn ${g===0?"":"ghost"}" data-g="0">לא ידעתי</button></div>`
      :`<button class="btn reveal-btn" id="reveal">בדיקה מול הכרטיס</button>`}
    </article>`;
  document.getElementById("home").onclick=renderTermsHome;
  const d=document.getElementById("draft"); d.oninput=()=>{MK.drafts[MK.i]=d.value;};
  const r=document.getElementById("reveal"); if(r) r.onclick=()=>{MK.open=true;renderMock();};
  $app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{MK.grades[MK.i]=+b.dataset.g;MK.i++;MK.open=false;renderMock();window.scrollTo(0,0);});
}
function renderMockResult(){
  const pts = MK.order.reduce((s,_,i)=>s+(MK.grades[i]||0),0), max = MK.order.length*2;
  const score = Math.round(pts/max*100);
  const label = ["לא ידעתי","חלקית","מלא"];
  $app.innerHTML = `
    <div class="qbar"><h2>מבחן מונחים מדומה</h2><button class="btn ghost" id="home">חזרה למונחים</button></div>
    <section class="result">
      <div class="muted">הערכה עצמית</div>
      <div class="score num ${scoreClass(score)}">${score}</div>
      <div class="verdict">${score>=85?"מצוין! המונחים האלה בשליטה.":score>=60?"כמעט. כדאי לחזור על הנקודות שחסרו.":"כדאי לחזור לכרטיסים של המונחים האלה."}</div>
      <div class="actions"><button class="btn" id="again">מבחן מדומה חדש</button></div>
    </section>
    <section class="review">${MK.order.map((k,i)=>{const x=MK.items[k];return `<div class="ritem" style="border-inline-start-color:var(${MK.grades[i]===2?"--wy-success":MK.grades[i]===1?"--wy-warning":"--wy-danger"})">
      <div class="q">${esc(x.t.name)} · ${label[MK.grades[i]||0]}</div>
      <div class="e">${esc(x.t.one)}</div>
      <button class="link" data-goch="${x.ch}" style="align-self:flex-start">לכרטיסים של ${esc(termCh[x.ch].title.split(":")[0])}</button></div>`;}).join("")}</section>`;
  document.getElementById("home").onclick=renderTermsHome;
  document.getElementById("again").onclick=startMock;
  $app.querySelectorAll("[data-goch]").forEach(b=>b.onclick=()=>renderTermCards(b.dataset.goch));
  window.scrollTo(0,0);
}

/* ---------- splash / terms ---------- */
const CONSENT_KEY = "cogquiz.consent.v1";
const TICK = '<svg class="tick" viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><path d="M22,52 L37.76,67.76 Q42,72 46.03,67.55 L80,30" fill="none" stroke="var(--wy-success)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="86" r="6.38" fill="var(--wy-success)"/></svg>';
function hasConsent(){ try{ return localStorage.getItem(CONSENT_KEY)==="yes"; }catch(e){ return false; } }
function renderSplash(fromHome){
  const total = DATA.reduce((s,c)=>s+c.questions.length,0);
  const agreed = fromHome && hasConsent();
  $app.innerHTML = `
    <section class="splash" aria-labelledby="sp-title">
      <div class="brandbar">${LOGO}</div>
      <h1 id="sp-title">תרגול לבחינה ב<span class="lit">פסיכולוגיה קוגניטיבית</span></h1>
      <p class="lead">שאלות אמריקאיות לפי פרקים, עם ציון בסוף, הסבר לכל תשובה ומבחן מעורב בסגנון הבחינה.</p>
      <div class="facts">
        <span class="fact num">${total} שאלות</span>
        <span class="fact num">${DATA.length} פרקים</span>
        <span class="fact">הספר הלבן והספר התכלת</span>
      </div>
      <div class="terms">
        <h2>לפני שמתחילים</h2>
        <ul>
          <li>האתר הוא כלי עזר לתרגול אישי. הוא <strong>אינו רשמי</strong> ואינו קשור לאוניברסיטה הפתוחה או לצוות הקורס.</li>
          <li>השאלות נכתבו על בסיס חומרי הקורס ו<strong>לא נבדקו מול תשובון רשמי</strong>. ייתכנו בהן טעויות.</li>
          <li>האתר אינו מחליף את חומרי הקורס, את ההנחיות ואת ההודעות הרשמיות.</li>
          <li><strong>השימוש באתר על אחריות המשתמש בלבד.</strong> אין אחריות לנכונות התוכן, לשלמותו או לתוצאות בבחינה.</li>
          <li>לא נאסף מידע אישי. הציונים נשמרים רק בדפדפן שלך.</li>
        </ul>
      </div>
      <button class="agree" id="agree" role="checkbox" aria-checked="${agreed}">
        <span class="box">${TICK}</span>
        <span class="agree-text">קראתי והבנתי. ידוע לי שהאתר אינו רשמי ושהשימוש בו על אחריותי בלבד.</span>
      </button>
      <button class="btn" id="enter" ${agreed?"":"disabled"}>${fromHome?"חזרה לתרגול":"כניסה לתרגול"}</button>
    </section>`;
  const agree=document.getElementById("agree"), enter=document.getElementById("enter");
  agree.onclick=()=>{ const v=agree.getAttribute("aria-checked")!=="true"; agree.setAttribute("aria-checked",v); enter.disabled=!v; };
  enter.onclick=()=>{ try{ localStorage.setItem(CONSENT_KEY,"yes"); }catch(e){} renderHome(); };
  window.scrollTo(0,0);
}
if(hasConsent()) renderHome(); else renderSplash(false);
</script>
</body></html>
