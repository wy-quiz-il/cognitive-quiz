 שינוי תחבירי."},{"q":"מה מאפיין אפזיה על שם ברוקה?","o":["דיבור שוטף ונכון תחבירית אבל חסר משמעות","דיבור איטי, מקוטע ומאומץ, עם קושי בתחביר, כולל קושי בהבנת משפטים כמו \"הילד נדחף על ידי הילדה\"","חוסר יכולת לקרוא בלבד","פגיעה בזיכרון לטווח קצר"],"a":1,"e":"פגיעה באזור ברוקה, באונה המצחית, קשורה לתחביר."},{"q":"מדוע מטופלים עם אפזיה על שם ברוקה מבינים את \"התפוח נאכל על ידי הילדה\", אבל מתקשים ב\"הילד נדחף על ידי הילדה\"?","o":["כי המשפט הראשון קצר יותר","כי במשפט הראשון אפשר להבין את המשמעות גם בלי תחביר (תפוח אינו אוכל ילדה), ובשני המשמעות תלויה במבנה התחבירי","כי הם אינם מכירים את המילה \"דחף\"","כי הם פגועים בסמנטיקה"],"a":1,"e":"הם פגועים בעיבוד התחבירי."},{"q":"מה מאפיין אפזיה על שם ורניקה?","o":["דיבור איטי ומקוטע","דיבור שוטף ונכון תחבירית אבל חסר משמעות, וקושי נרחב בהבנת דיבור וכתיבה","קושי רק במשפטים סבילים","פגיעה בתנועת השפתיים"],"a":1,"e":"פגיעה באזור ורניקה, באונה הרקתית, קשורה לסמנטיקה."},{"q":"איזה רכיב ERP גדל כאשר מילה אינה מתאימה במשמעותה למשפט (\"החתולים לא מוכנים לאפות\")?","o":["P600","N400","P300","N170"],"a":1,"e":"N400 רגיש לסמנטיקה וקשור לאונה הרקתית. P600 רגיש לתחביר וקשור לאונה המצחית."},{"q":"איזה רכיב ERP גדל כאשר צורת המשפט אינה תקינה דקדוקית (\"החתולים לא מוכנים אוכלים\")?","o":["N400","P600","N200","שניהם באותה מידה"],"a":1,"e":"התגובות הפיזיולוגיות השונות מראות שתחביר וסמנטיקה מעובדים באופן שונה במוח."},{"q":"\"אחרי שהזמרת שרה כמה שירים חדשים הושמעו ברמקולים\". כיצד נקרא משפט כזה?","o":["משפט שביל הגן, שמדגים רב משמעות זמנית","משפט חד משמעי","משפט סמנטי שגוי","משפט ללא תחביר"],"a":0,"e":"בהתחלה המילים מתקבצות בצורה אחת, שמתבררת בהמשך כשגויה, ולכן צריך לארגן מחדש את המשפט."},{"q":"לפי עקרון \"הסגירה המאוחרת\" בגישת התחביר-תחילה (פרייז'ר) –","o":["כל מילה חדשה פותחת פסוקית חדשה","המעבד התחבירי מניח שמילה חדשה היא חלק מהצירוף הנוכחי, ומצרף אותה אליו כל עוד הדבר אפשרי","משמעות המילים קובעת את ההקבצה מההתחלה","הקורא מחכה לסוף המשפט לפני ההקבצה"],"a":1,"e":"לכן \"כמה שירים חדשים\" מצורף בטעות לפסוקית \"אחרי שהזמרת שרה\". העיקרון שימושי, כי לעיתים קרובות הוא מוביל לעיבוד נכון."},{"q":"מה ההבדל המרכזי בין גישת התחביר-תחילה לגישת האינטראקציה לעיבוד תחבירי?","o":["אין הבדל","בגישת התחביר-תחילה ההקבצה הראשונית נקבעת לפי כללים תחביריים בלבד. בגישת האינטראקציה תחביר, סמנטיקה וגורמים נוספים מובאים בחשבון בו-זמנית מההתחלה","גישת האינטראקציה מתעלמת מתחביר","גישת התחביר-תחילה מתייחסת רק לסמנטיקה"],"a":1,"e":"למשל, \"העיט ראה את האיש עם המשקפת\" מתפרש מיד בצורה אחת, בזכות הידע על עיטים."},{"q":"בניסוי פרדיגמת העולם החזותי של טננהאוס ועמיתים (1995), נאמר לנבדקים \"שימו את התפוח על המגבת בקופסה\". מה קרה כשהיו בסצנה שני תפוחים?","o":["הנבדקים הביטו קודם במגבת הריקה","הנבדקים פירשו את \"על המגבת\" כזיהוי של התפוח שיש להזיז, והביטו בתפוח שעל המגבת ואז בקופסה","הנבדקים לא הזיזו את העיניים","התוצאה הייתה זהה לסצנה של תפוח אחד"],"a":1,"e":"עם תפוח אחד הם הביטו קודם במגבת האחרת (פרשנות שגויה) ותיקנו. הסצנה קבעה את הפרשנות, וזה תומך בגישת האינטראקציה."},{"q":"בניסוי של פיין ועמיתים (2013) נבדקים קראו שוב ושוב משפטים עם רב משמעות זמנית (\"המפקדת הבטיחה לחייל שהיא סומכת עליו לבקר אותו בקרוב\"). מה נמצא?","o":["אפקט הרב משמעות גדל עם הזמן","אפקט הרב משמעות נעלם במערך השני של המשפטים, כי הנבדקים הסתגלו למבנה","הנבדקים לא הבינו את המשפטים","לא היה אפקט רב משמעות כלל"],"a":1,"e":"הניסיון עם מבנים משנה את הניבויים התחביריים, וזה תומך בגישת האינטראקציה."},{"q":"בניסוי של ברנספורד וג'ונסון (1973), קטע על ג'ון שהכה במסמר כדי לתקן שובך נזכר כ\"ג'ון השתמש בפטיש\". איזה סוג היסק זה?","o":["היסק אנאפורי","היסק על האמצעי","היסק סיבתי","אין היסק"],"a":1,"e":"היסק על האמצעי הוא היסק לגבי כלים או שיטות. דוגמה נוספת: שייקספיר כתב כנראה בעט נוצה."},{"q":"\"ריפיפי, הפודלית המפורסמת, זכתה בתצוגה. היא זכתה בשלוש התצוגות האחרונות.\" ההבנה ש\"היא\" מתייחסת לריפיפי היא –","o":["היסק סיבתי","היסק אנאפורי","היסק על האמצעי","מודל המצב"],"a":1,"e":"היסק אנאפורי מחבר אדם או עצם במשפט אחד לאדם או עצם במשפט אחר. דוגמת ג'ורג' פורמן (\"we grill them\") מראה שאנו נעזרים בידע על העולם."},{"q":"\"שרון לקחה כדור אספירין. כאב הראש שלה עבר.\" ההבנה שהאספירין גרם לכאב לעבור היא –","o":["היסק סיבתי","היסק אנאפורי","היסק על האמצעי","חוזה נתון-חדש"],"a":0,"e":"ב\"שרון התקלחה. כאב הראש שלה עבר\" הקשר הסיבתי חלש יותר, ויצירתו דורשת מהקורא יותר עבודה."},{"q":"מהו \"מודל המצב\" בהבנת טקסט?","o":["ייצוג של המשפטים והפסוקיות כפי שנכתבו","ייצוג מנטלי של הנושא שבו עוסק הטקסט, במונחי האנשים, העצמים, המקומות והאירועים, כולל סימולציה של מאפייני תפיסה ותנועה","זיכרון מילולי מדויק של הטקסט","מבנה תחבירי"],"a":1,"e":"הוא מבוסס על ג'ונסון-לירד (1983)."},{"q":"בניסוי של סטנפילד וזוואן (2001), נבדקים קראו \"הוא תקע את המסמר בקיר\" ואחר כך ראו תמונה של מסמר. מתי ענו \"כן\" מהר יותר?","o":["כשהמסמר בתמונה היה אנכי","כשכיוון המסמר בתמונה (אופקי) תאם את המצב שתואר במשפט","בלי קשר לכיוון","כשלא הוצג מסמר"],"a":1,"e":"גם בניסוי הצורה של זוואן ועמיתים (2002), עיט בשמיים לעומת עיט בקן, נמצא אותו דבר. זה תומך במודל המצב."},{"q":"בניסוי של מתוסלם ועמיתים (2012), \"הוא ראה את הלהקה יוצאת אל ___\". איזו מילה גרמה ל-N400 הגדול ביותר?","o":["\"הבמה\" (צפויה)","\"הגיטרה\" (קשורה לאירוע)","\"האסם\" (לא קשורה לאירוע)","לכולן אותו N400"],"a":2,"e":"\"גיטרה\" גרמה ל-N400 קטן יותר מ\"אסם\", כי ידע על קונצרטים מופעל תוך כדי קריאה. אלה ניבויים על סמך ידע על מצבים."},{"q":"מהו \"חוזה נתון-חדש\" (האבילנד וקלרק, 1974)?","o":["הסכם בין דוברים לא להפריע","הדובר צריך לבנות משפטים כך שיכללו גם מידע שהמאזין כבר יודע (נתון) וגם מידע חדש","כל משפט צריך לכלול רק מידע חדש","כלל תחבירי של סדר מילים"],"a":1,"e":"\"בדקנו את המצרכים לפיקניק. הבירה הייתה חמה\" הובן לאט יותר, כי הבירה לא הוזכרה במידע הנתון ונדרש היסק."},{"q":"בניסוי של אייזקס וקלארק (1987) זוגות סידרו גלויות של ניו יורק. מה קרה עם התקדמות הניסויים?","o":["מספר המילים לתמונה גדל","מספר המילים שנדרשו לזיהוי ירד (מ-37 ל-8), ושיעור ההתייחסות בשם עלה, כלומר נוצר מכנה משותף","לא היה שינוי","הנבדקים הפסיקו לדבר"],"a":1,"e":"המכנה המשותף נקבע גם לפי המומחיות (תושב או לא תושב העיר) וגם לפי חילופי הדברים בשיחה."},{"q":"בניסוי של ברניגן ועמיתים (2000) על הטרמה תחבירית, מה נמצא?","o":["הנבדקים השתמשו במבנה תחבירי הפוך לזה של השותף","ב-78% מהניסויים צורת התיאור של הנבדק תאמה את המבנה התחבירי של המשפט המטרים של השותף","לא הייתה השפעה","הנבדקים העתיקו את המילים עצמן"],"a":1,"e":"זהו תיאום תחבירי: הוא מקטין את העומס החישובי, כי קל יותר להעתיק מבנה מאשר לבנות אותו מאפס."},{"q":"בניסוי של וינאוור ועמיתים (2007), מתי הגיבו דוברי רוסית מהר יותר בהשוואת גווני כחול?","o":["כששני הריבועים היו מאותה קטגוריה ברוסית","כששני הריבועים היו מקטגוריות שונות ברוסית (גולובוי וסיניי), ואילו אצל דוברי אנגלית לא היה הבדל","אף פעם, דוברי אנגלית היו מהירים יותר","לא היה הבדל אצל אף קבוצה"],"a":1,"e":"זה תומך בהשערת ספיר-וורף: היבטים של שפת התרבות משפיעים על האופן שבו אנשים חושבים ותופסים."},{"q":"מה מצאו גילברט ועמיתים (2006) לגבי אפקט קטגוריית הצבע בשני חצאי השדה החזותי?","o":["האפקט הופיע רק בשדה החזותי השמאלי","האפקט (תגובה מהירה יותר למטרה מקטגוריה שונה) הופיע רק בשדה החזותי הימני, שנקלט בהמיספרה השמאלית האחראית על השפה","האפקט הופיע בשני השדות באותה מידה","לא היה אפקט"],"a":1,"e":"התשובה לשאלה אם שפה משפיעה על תפיסה תלויה בחלק המוח שמעורב בתהליך."}],"hard":[{"q":"מטופל אומר \"אני... הלכתי... רופא... כאב\" ומתקשה להבין את \"הכלב נרדף על ידי החתול\", אבל מבין את \"העוגה נאכלה על ידי הילד\". מה האבחנה, ואיזה רכיב ERP צפוי להיפגע אצלו?","o":["אפזיה על שם ורניקה, N400","אפזיה על שם ברוקה, P600 (שקשור לתחביר ולאונה המצחית)","אפזיה על שם ברוקה, N400","אפזיה על שם ורניקה, P600"],"a":1,"e":"דיבור מקוטע וקושי במשפטים שבהם המשמעות תלויה בתחביר מאפיינים פגיעה באזור ברוקה. P600 קשור למבנים באונה המצחית."},{"q":"קוראת נתקלת במשפט \"הסוס שנדחף ליד האורווה נפל\" ונעצרת ב\"נפל\". לפי גישת התחביר-תחילה, מה קרה?","o":["היא לא הכירה את המילה","בהתחלה היא צירפה את המילים לפסוקית אחת לפי כלל תחבירי, ורק במילה \"נפל\" התברר שצריך לבצע עיבוד תחבירי מחדש","היא השתמשה בסמנטיקה בלבד","זו דוגמה לרב משמעות לקסיקלית"],"a":1,"e":"זה משפט שביל הגן. לפי פרייז'ר, התחביר קובע את ההקבצה הראשונית, והתיקון מגיע אחר כך."},{"q":"בפרדיגמת העולם החזותי, איזו תוצאה הייתה תומכת דווקא בגישת התחביר-תחילה?","o":["תנועות עיניים שונות בסצנה של תפוח אחד ובסצנה של שני תפוחים","אותו דפוס תנועות עיניים בשתי הסצנות, כלומר פרשנות ראשונית זהה בלי קשר למה שנמצא על השולחן","תנועות עיניים מהירות","שהנבדקים לא הסתכלו על הקופסה"],"a":1,"e":"אם העיבוד הראשוני נקבע רק לפי מבנה המשפט, הסצנה לא אמורה להשפיע עליו."},{"q":"מילה עם דומיננטיות מוטה מופיעה בהקשר שמכוון למשמעות הלא דומיננטית (\"במכרה יש פח\"). למה צפוי שזמן הקריאה יהיה דומה לזה של מילה עם דומיננטיות מאוזנת ללא הקשר?","o":["כי בשני המקרים רק משמעות אחת מופעלת","כי בשני המקרים שתי משמעויות מופעלות ומתחרות: ההקשר מגביר את המשמעות הלא דומיננטית, אבל הדומיננטית מופעלת בכל זאת","כי בשני המקרים המילה נדירה","כי אין הקשר"],"a":1,"e":"זה המצב שתואר באיור 11.5ג."},{"q":"חוקר מוצא N400 גדול למילה \"מקרר\" בסוף המשפט \"הוא שתה כוס קפה עם ___\", ו-N400 קטן יותר ל\"סוכר\". מה ניבוי גישת מודל המצב לגבי המילה \"צלחת\"?","o":["N400 גדול כמו \"מקרר\"","N400 בגודל ביניים: \"צלחת\" אינה מתאימה, אבל היא קשורה לתרחיש של שתיית קפה, ולכן מופעלת חלקית","N400 קטן מ\"סוכר\"","אין N400"],"a":1,"e":"זה בדיוק דפוס הבמה, הגיטרה והאסם של מתוסלם ועמיתים."},{"q":"בניסוי של פיין ועמיתים, אפקט הרב משמעות נעלם אחרי חשיפה חוזרת. מה זה מלמד על המקור של משפטי שביל הגן?","o":["שהם נובעים מכללים תחביריים קבועים בלבד","שהניבויים התחביריים מבוססים על ניסיון ועל שכיחות המבנים, ולכן הם ניתנים לשינוי גם בטווח קצר","שהנבדקים התעייפו","שהמשפטים היו קלים מדי"],"a":1,"e":"זה תומך בגישת האינטראקציה ובהסבר מבוסס הזיכרון."},{"q":"\"דני חזר מהמכולת. החלב היה חמוץ.\" לעומת \"דני קנה חלב. החלב היה חמוץ.\" איזה משפט שני יובן לאט יותר, ומדוע?","o":["השני בזוג השני","השני בזוג הראשון, כי ה\"חלב\" אינו חלק מהמידע הנתון ודורש היסק (שדני קנה חלב במכולת)","שניהם באותה מהירות","השני בזוג השני, כי יש בו חזרה"],"a":1,"e":"זה חוזה נתון-חדש, כמו בבירה החמה של האבילנד וקלרק."},{"q":"\"השוטר עצר את הנהג. הוא נתן לו דוח.\" קוראים מבינים מיד שהשוטר נתן את הדוח. איזה סוג היסק זה, ועל מה הוא נשען?","o":["היסק סיבתי, על מבנה המשפט בלבד","היסק אנאפורי, שנשען על ידע על העולם (שוטרים נותנים דוחות לנהגים) ולא רק על התחביר","היסק על האמצעי","אין צורך בהיסק"],"a":1,"e":"תחבירית \"הוא\" יכול להתייחס לשניהם, וידע העולם מכריע. זה כמו הדגים והילדים של ג'ורג' פורמן."},{"q":"בניסוי של גילברט ועמיתים, אילו הנבדקים היו דוברי שפה שאין בה מילים נפרדות לכחול ולירוק, מה היה צפוי?","o":["אותו אפקט קטגוריה בשדה החזותי הימני","שלא יופיע אפקט קטגוריה לכחול לעומת ירוק בשדה הימני, כי אין בשפתם תוויות שמפרידות ביניהם","אפקט בשדה השמאלי בלבד","אפקט חזק יותר"],"a":1,"e":"לפי ההיגיון של ספיר-וורף והניסוי, האפקט תלוי בתוויות השפה ומתבטא דרך ההמיספרה השפתית."},{"q":"בניסוי ההטרמה התחבירית של ברניגן, הנבדקת תיארה את התמונה במבנה שבו השתמש השותף ב-78% מהמקרים. מדוע החוקרים השתמשו בשותף סמוי ולא בנבדק אמיתי נוסף?","o":["כי לא היו מספיק נבדקים","כדי לשלוט במבנה התחבירי של המשפט המטרים בכל צעד, וכך לבדוק אם המבנה הזה בדיוק משפיע על הנבדקת","כדי להסתיר את התמונה","כדי למדוד זמני תגובה"],"a":1,"e":"שליטה במשתנה הבלתי תלוי, כלומר במבנה המטרים, היא תנאי לבדיקת ההטרמה."}]},{"id":"c12","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 12: פתרון בעיות","questions":[{"q":"לפי גישת הגשטאלט, מה נדרש לפתרון בעיה?","o":["ניסוי וטעייה אקראיים","יצירת ייצוג מנטלי של הבעיה והבניה מחדש שלו, כך שהפתרון מופיע מעצמו (תובנה)","שינון של פתרונות קודמים","חיפוש במרחב הבעיה"],"a":1,"e":"למשל, בבעיית המעגל: ההבנה ש-x הוא אלכסון במלבן שאלכסונו השני הוא הרדיוס, ולכן x=r."},{"q":"בבעיית המעגל והמלבן (רדיוס r, מה אורך x?), מהי ההבניה מחדש שמביאה לפתרון?","o":["חישוב לפי משפט פיתגורס","ההבנה ש-x הוא אלכסון של מלבן שאלכסונו השני הוא רדיוס המעגל, ולכן x=r","מדידה בסרגל","חישוב היקף המעגל"],"a":1,"e":"שני האלכסונים של מלבן שווים."},{"q":"בניסוי של מטקאלף ווייב (1987), מה היה המשתנה התלוי?","o":["זמן הפתרון","דירוגי הקרבה לפתרון (\"חם-קר\") כל 15 שניות","מספר הטעויות","סוג הבעיה"],"a":1,"e":"המשתנה הבלתי תלוי היה סוג הבעיה: בעיות תובנה או בעיות ללא תובנה (אלגברה)."},{"q":"מה מצאו מטקאלף ווייב (1987) בבעיות תובנה?","o":["עלייה הדרגתית ורציפה בתחושת הקרבה לפתרון","15 שניות לפני הפתרון, הנבדקים עדיין הרגישו רחוקים ממנו, והפתרון הגיע בפתאומיות","הנבדקים לא פתרו אף בעיה","אין הבדל מבעיות ללא תובנה"],"a":1,"e":"בבעיות תובנה הפתרון פתאומי (\"אהא!\"), ובבעיות ללא תובנה ההתקרבות הדרגתית."},{"q":"מה אפיין את דירוגי הקרבה לפתרון בבעיות ללא תובנה (אלגברה)?","o":["קפיצה פתאומית","עלייה רציפה והדרגתית","ירידה לאורך הזמן","דירוג קבוע"],"a":1,"e":"פתרון ללא תובנה מתרחש בהדרגתיות."},{"q":"מהו \"קיבעון\" לפי הגשטאלט?","o":["חוסר מוטיבציה","התמקדות במאפיין מסוים של הבעיה שמונעת הגעה לפתרון","עייפות","שכחת הבעיה"],"a":1,"e":"זהו אחד המכשולים העיקריים לפתרון בעיות לפי הגשטאלט."},{"q":"קיבעון תפקודי, שמהווה מכשול לפתרון בעיות, פירושו שהנבדקים מתמקדים –","o":["בשימושים המוכרים של עצם","בתפקודים השכליים החזקים יותר שלהם","בשימושים הלא מוכרים של עצם","בתפקודים השכליים החלשים יותר שלהם"],"a":0,"e":"זו שאלה מהמבחן לדוגמה."},{"q":"מהו הפתרון לבעיית הנר של דונקר (1945)?","o":["להדביק את הנר בשעווה ישירות ללוח","לרוקן את קופסת הנעצים, לנעוץ אותה ללוח השעם ולהעמיד עליה את הנר","לתלות את הנר בחוט","להדליק את הנר על הרצפה"],"a":1,"e":"הקופסה משמשת כמדף, ולא רק ככלי קיבול."},{"q":"בניסוי בעיית הנר, באיזה תנאי אחוז הפותרים היה גבוה יותר?","o":["כשהנעצים היו בתוך הקופסה","כשהקופסה ניתנה ריקה, והנעצים לידה","לא היה הבדל","כשלא הייתה קופסה"],"a":1,"e":"בתנאי הקופסה הריקה אחוז הפותרים היה גדול פי 2."},{"q":"כיצד מסביר הגשטאלט את הקושי בתנאי \"קופסה ככלי קיבול\" בבעיית הנר?","o":["חוסר אינטליגנציה","קיבעון תפקודי: התפקיד המוכר של הקופסה ככלי קיבול הקשה לראות בה משטח להעמדת הנר","מערך מנטלי מבעיות קודמות","עומס בזיכרון העבודה"],"a":1,"e":"התפקיד המוכר של העצם הוא הבולט."},{"q":"בבעיית שני החבלים של מאייר (1931), מה היה הפתרון?","o":["להאריך את החבל","לקשור את הצבת לחבל אחד ולהפוך אותו למטוטלת, ואז לתפוס אותו כשהוא מתקרב","לעמוד על השידה","לחתוך את החבל"],"a":1,"e":"הצבת משמשת כמשקולת, ולא כשימושה המוכר."},{"q":"בבעיית שני החבלים, מה קרה אחרי שהנסיין \"בטעות\" נדנד את החבל?","o":["אף נבדק לא פתר","רוב הנבדקים שלא הצליחו קודם (23 מתוך 37) פתרו את הבעיה תוך דקה","הנבדקים התבלבלו","הנבדקים ויתרו"],"a":1,"e":"הרמז גרם ליציאה מהקיבעון התפקודי ולתובנה."},{"q":"כמה נבדקים בניסוי של מאייר לא הצליחו לפתור את בעיית שני החבלים בתוך 10 דקות, לפני הרמז?","o":["כמעט אף אחד","הרוב: 37 מתוך 60","10 מתוך 60","כולם"],"a":1,"e":"רובם פתרו מהר אחרי הרמז."},{"q":"מהו \"מערך מנטלי\" (לוצ'ינס, 1942)?","o":["קיבולת זיכרון העבודה","דרך פתרון מסוימת שהתקבעה בעקבות ניסיון קודם, וקובעת כיצד ניגש לבעיה. היא עלולה למנוע מאיתנו לראות פתרון פשוט יותר","מצב רוח","ייצוג מרחבי של הבעיה"],"a":1,"e":"בבעיות מכלי המים, הנוסחה B−A−2C הפכה למערך מנטלי."},{"q":"בבעיה הראשונה של לוצ'ינס (A=21, B=127, C=3, יעד 100 ליטר), מהי הנוסחה לפתרון?","o":["A+B+C","B−A−2C","A+C","B−C"],"a":1,"e":"127 − 21 − 3 − 3 = 100."},{"q":"מה מצא לוצ'ינס (1942) בבעיות 7–8, שיש להן גם פתרון פשוט?","o":["כולם השתמשו בפתרון הפשוט","רק 23% מקבוצת המערך המנטלי השתמשו בפתרון הפשוט, בעוד שבקבוצה ללא מערך מנטלי כולם השתמשו בו","אף אחד לא פתר","לא היה הבדל בין הקבוצות"],"a":1,"e":"המערך המנטלי מנע מהם לראות את הפתרון הפשוט."},{"q":"בניסוי של לוצ'ינס, מה היה תפעול המשתנה הבלתי תלוי?","o":["גודל המכלים","קבוצת מערך מנטלי, שפתרה קודם את בעיות 1–6, לעומת קבוצה ללא מערך מנטלי, שפתרה ישר את בעיות 7–8","זמן הפתרון","מספר המכלים"],"a":1,"e":"המשתנה התלוי: באיזה פתרון השתמשו."},{"q":"מי פיתחו את גישת עיבוד המידע לפתרון בעיות?","o":["ורתהיימר וקוהלר","ניואל וסיימון","טברסקי וכהנמן","קוסלין ופילישין"],"a":1,"e":"הם הדגימו אותה, בין היתר, באמצעות בעיית מגדלי האנוי."},{"q":"בגישת עיבוד המידע, מהם \"אופרטורים\"?","o":["המצב הסופי של הבעיה","פעולות שמעבירות את הבעיה ממצב אחד למצב אחר, ומוגבלות על ידי כללים","הכללים עצמם","מצבי הביניים"],"a":1,"e":"במגדלי האנוי, האופרטורים הם העברות של דיסקיות."},{"q":"מהו \"מרחב הבעיה\"?","o":["המקום הפיזי שבו פותרים","כל המצבים האפשריים שיכולים להתרחש במהלך פתרון הבעיה","המצב הראשוני בלבד","מצב המטרה בלבד"],"a":1,"e":"הוא כולל את המצב הראשוני, מצבי הביניים ומצב המטרה."},{"q":"מהו \"ניתוח אמצעים-יעד\"?","o":["ניסוי וטעייה","דרך לפתרון באמצעות מטרות ביניים שמקרבות בהדרגה למצב המטרה, ומאפשרות למצוא את הנתיב הקצר ביותר","ויתור על הבעיה","הבניה מחדש פתאומית"],"a":1,"e":"לעיתים צריך מטרת ביניים שנראית מרחיקה, ולכן יש להסתכל קדימה."},{"q":"במגדלי האנוי עם 3 דיסקיות, מהי מטרת הביניים הראשונה בניתוח אמצעים-יעד?","o":["להעביר את הדיסקית הקטנה למוט השלישי","לשחרר את הדיסקית הגדולה, כדי שאפשר יהיה להעביר אותה מהמוט השמאלי לימני","להעביר את כל הדיסקיות למוט האמצעי","לפנות את המוט השמאלי"],"a":1,"e":"אחר כך: לפנות את המוט השלישי, להעביר אליו את הדיסקית הגדולה, וכן הלאה."},{"q":"במגדלי האנוי, מדוע לעיתים מעבירים את הדיסקית הקטנה חזרה למוט השמאלי ולא לימני, אף שזה נראה מרחיק?","o":["בטעות","כדי לאפשר את מטרת הביניים הבאה: להעביר את הדיסקית הבינונית למוט הימני, על הגדולה","כי זה הכלל","כדי להאריך את הפתרון"],"a":1,"e":"מטרה שנראית מרחיקה מאפשרת את ההתקדמות. זו ההסתכלות קדימה."},{"q":"בדוגמת הטיסה מפיטסבורג לקופנהגן, מדוע נבחרה טיסה דרך אטלנטה ולא דרך פריז?","o":["כי אטלנטה קרובה יותר לקופנהגן","כי הטיסה דרך פריז לא עמדה בכללים (מרווח זמן ותקציב), ומטרת ביניים חדשה, אטלנטה, אפשרה לעמוד בהם","כי אין טיסות לפריז","בגלל מזג האוויר"],"a":1,"e":"זו דוגמה לניתוח אמצעים-יעד בחיי היומיום."},{"q":"מהי הביקורת על גישת עיבוד המידע של ניואל וסיימון?","o":["היא אינה מגדירה מצבים","פתרון בעיות מושפע גם מגורמים לא רציונליים, ובמיוחד מאופן הצגת הבעיה","היא מתאימה רק למחשבים","היא אינה כוללת מטרות ביניים"],"a":1,"e":"הדבר הודגם בבעיית לוח הדמקה הפגום."},{"q":"מהו העיקרון לפתרון בעיית לוח הדמקה הפגום (שתי פינות נגדיות הוסרו)?","o":["אפשר לכסות את הלוח ב-31 אבני דומינו","כל אבן דומינו מכסה שתי משבצות סמוכות בצבעים שונים, והוסרו שתי משבצות באותו צבע, ולכן אי אפשר לכסות את הלוח","צריך 32 אבנים","צריך לסובב את הלוח"],"a":1,"e":"נשארו 30 משבצות מצבע אחד ו-32 מהצבע השני."},{"q":"בניסוי של קפלן וסיימון (1990), איזו גרסה של לוח הדמקה הפגום נפתרה הכי מהר?","o":["הלוח הריק","לוח \"לחם וחמאה\", שבו המשבצות סומנו במילים לחם וחמאה לסירוגין","הלוח הצבוע","כל הגרסאות נפתרו באותו זמן"],"a":1,"e":"פי שניים מהר יותר מהלוח הריק, ועם פחות רמזים (1 לעומת 3.14 בממוצע)."},{"q":"מה ההסבר לכך שלוח \"לחם וחמאה\" הקל על הפתרון?","o":["המילים מצחיקות","הוא הדגיש את ההבדל ואת הקשר בין כל שתי משבצות סמוכות","הוא היה גדול יותר","הוא כלל את הפתרון"],"a":1,"e":"\"פרוטוקול חשיבה בקול\" חיזק את ההסבר."},{"q":"בעיית הנישואים הרוסיים (הייז, 1978): 32 רווקים ו-32 רווקות, ושני רווקים מתו. מדוע היא קלה יותר מבעיית לוח הדמקה?","o":["כי היא שונה במבנה","כי היא מציגה את אותה בעיה באופן שמבליט את העיקרון: כל זוג הוא גבר ואישה, ולכן 30 גברים ו-32 נשים אינם יכולים ליצור 31 זוגות","כי יש בה פחות אנשים","כי אין לה פתרון"],"a":1,"e":"זה מחזק את הטענה שאופן ההצגה משפיע על הקושי."},{"q":"מה המסקנה ממחקרי אופן הצגת הבעיה?","o":["פתרון בעיות תמיד רציונלי ומבוסס על מרחב הבעיה","לפחות בחלק מהמקרים, פתרון בעיות מושפע מאוד מאופן הצגת הבעיה, שמשפיע על היכולת לזהות את הדרך לפתרון","אופן ההצגה אינו משפיע","רק מומחים מושפעים מאופן ההצגה"],"a":1,"e":"זו ביקורת על הרציונליות המלאה שמניחה גישת עיבוד המידע."}],"hard":[{"q":"תלמיד פותר בעיות גאומטריה באמצעות נוסחה שלמד, ומפספס פתרון פשוט שמתגלה מיד כשמסתכלים על השרטוט אחרת. אילו שני מושגים מהפרק רלוונטיים?","o":["קיבעון תפקודי ומרחב הבעיה","מערך מנטלי (לוצ'ינס) והבניה מחדש של הייצוג (גשטאלט)","ניתוח אמצעים-יעד ואופרטורים","אפקט המסגור והטיית אישוש"],"a":1,"e":"המערך המנטלי מונע לראות את הפתרון הפשוט, וההבניה מחדש היא מה שמביא לתובנה."},{"q":"בניסוי של מטקאלף ווייב, נבדק פותר בעיית תובנה ומדווח על עלייה הדרגתית בתחושת \"חם\" לאורך כל הדרך. מה המשמעות?","o":["שזו בעיית תובנה טיפוסית","שהוא כנראה פתר אותה בדרך שאינה כרוכה בתובנה, או שהבעיה אינה בעיית תובנה עבורו","שהוא לא פתר אותה","שהשיטה לא עובדת"],"a":1,"e":"פתרון בתובנה מאופיין בתחושה פתאומית. התקרבות הדרגתית מאפיינת פתרון שאינו כרוך בתובנה."},{"q":"בגרסה של בעיית הנר, הקופסה ניתנת ריקה, אבל צבועה בצבעים בולטים ומונחת בנפרד. לפי הסבר הקיבעון התפקודי, מה צפוי?","o":["פחות פותרים מבתנאי \"קופסה ככלי קיבול\"","יותר פותרים מבתנאי \"קופסה ככלי קיבול\", כי הקופסה אינה מוצגת בתפקידה המוכר ולכן קל יותר לראות בה מדף","אין הבדל","אף אחד לא יפתור"],"a":1,"e":"מה שמכשיל הוא הבלטת התפקוד המוכר. כשהוא אינו מוצג, הקיבעון נחלש."},{"q":"במגדלי האנוי עם 3 דיסקיות, מהו מספר הצעדים המינימלי, ומה זה מלמד על ניתוח אמצעים-יעד?","o":["3 צעדים, כי יש 3 דיסקיות","7 צעדים. המסלול הקצר דורש מטרות ביניים, וחלקן נראות מרחיקות, כמו החזרת הדיסקית הקטנה לאחור","5 צעדים","9 צעדים"],"a":1,"e":"2 בחזקת 3 פחות 1 = 7. הפתרון היעיל מחייב הסתכלות קדימה."},{"q":"לפי גישת עיבוד המידע, מה ההבדל בין \"מצב ביניים\" לבין \"מטרת ביניים\"?","o":["אין הבדל","מצב ביניים הוא כל מצב אפשרי במרחב הבעיה. מטרת ביניים היא מצב שהפותר בוחר לכוון אליו כחלק מניתוח אמצעים-יעד","מטרת ביניים היא המצב הסופי","מצב ביניים הוא אופרטור"],"a":1,"e":"מרחב הבעיה כולל את כל מצבי הביניים. ניתוח אמצעים-יעד בוחר מתוכם מטרות."},{"q":"מדוע ממצאי קפלן וסיימון על לוח הדמקה הפגום מאתגרים את גישת עיבוד המידע של ניואל וסיימון?","o":["כי הבעיה לא נפתרה","כי מרחב הבעיה זהה בכל גרסאות הלוח, ובכל זאת אופן ההצגה (למשל \"לחם וחמאה\") שינה מאוד את מהירות הפתרון. כלומר לא רק מבנה הבעיה קובע","כי לא היו מטרות ביניים","כי השתמשו בדומינו"],"a":1,"e":"פתרון רציונלי שמבוסס על מרחב הבעיה לא אמור להיות תלוי בתוויות."},{"q":"איזה ניסוח של בעיית לוח הדמקה הפגום צפוי להיות הקל ביותר, ומדוע?","o":["לוח ריק, כי יש בו פחות הסחות","ניסוח כמו \"הנישואים הרוסיים\", שבו ברור מראש שכל זוג חייב לכלול שני סוגים שונים (גבר ואישה), ולכן ההבנה הנדרשת בולטת מיד","לוח צבוע בלבד","לוח עם מספרים"],"a":1,"e":"הייז (1978): ההצגה שמבליטה את העיקרון היא הקלה ביותר."},{"q":"נבדקים בבעיית שני החבלים פתרו מהר אחרי שהנסיין \"בטעות\" נדנד חבל, ורבים לא דיווחו שהרמז עזר להם. מה זה מרמז על תובנה?","o":["שהיא תמיד מודעת","שהבניה מחדש של הבעיה יכולה להיות מושפעת מרמזים בלי מודעות לכך שהם השפיעו","שהרמז לא השפיע","שהם רימו"],"a":1,"e":"הממצא תואם את התיאור של תובנה כתהליך שאינו גלוי לפותר עצמו."},{"q":"בניסוי של לוצ'ינס, מה היה קורה אילו קבוצת המערך המנטלי הייתה מקבלת את בעיות 7–8 מיד אחרי בעיה 1 ולא אחרי בעיות 2–6?","o":["אותה תוצאה בדיוק","המערך המנטלי היה צפוי להיות חלש יותר, ולכן יותר נבדקים היו מוצאים את הפתרון הפשוט, כי השימוש החוזר בנוסחה הוא שמקבע את המערך","פחות נבדקים היו פותרים","אף אחד לא היה פותר"],"a":1,"e":"החזרה על הנוסחה בבעיות 2–6 נועדה ליצור את המערך."},{"q":"איזה מהבאים הוא דוגמה לניתוח אמצעים-יעד בחיי היומיום?","o":["פתרון חידה בהברקה פתאומית","תכנון נסיעה: קובעים קודם להגיע לתחנה המרכזית (מטרת ביניים), אף שהיא בכיוון ההפוך, כי משם יש רכבת ישירה ליעד","שימוש במטבע כמברג","בחירה באקראי"],"a":1,"e":"כמו הטיסה דרך אטלנטה: מטרת ביניים שנראית מרחיקה ומאפשרת לעמוד בכללים."}]},{"id":"c13","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 13: עריכת שיפוטים וקבלת החלטות","questions":[{"q":"מהן יוריסטיקות?","o":["חוקים לוגיים מדויקים שתמיד מובילים לתשובה נכונה","קיצורי דרך מנטליים (כללי אצבע) שמאפשרים להסיק מסקנות במהירות בתנאי אי-ודאות, ולרוב מובילים לתשובה נכונה אבל אינם חסינים מטעויות","זיכרונות של אירועים","שיטות מחקר"],"a":1,"e":"טברסקי וכהנמן תיארו את יוריסטיקת הזמינות ואת יוריסטיקת היציגות."},{"q":"מהי יוריסטיקת הזמינות (טברסקי וכהנמן, 1973)?","o":["שיפוט לפי דמיון לקטגוריה","שיפוט אירועים שעולים מהר יותר בזיכרון כבעלי סיכוי גבוה יותר להתרחש","בחירה באפשרות הזמינה ביותר בחנות","הטיה לטובת המצב הקיים"],"a":1,"e":"הבעיה היא שזמינות בזיכרון אינה תמיד מייצגת את השכיחות בעולם."},{"q":"בניסוי של ליכטנשטיין ועמיתים (1978), נבדקים שפטו איזו סיבת מוות שכיחה יותר (למשל רצח לעומת דלקת תוספתן). מה הסביר את הטעויות?","o":["יוריסטיקת היציגות","יוריסטיקת הזמינות: אירועים שקל לשלוף מהזיכרון, למשל כאלה שמופיעים בתקשורת, נשפטו כשכיחים יותר","אפקט המסגור","הטיית סטטוס-קוו"],"a":1,"e":"לכן הוערכו כשכיחות יותר סיבות מוות דרמטיות שמסוקרות בתקשורת."},{"q":"מטיילת פגשה בפריז מלצר לא אדיב ונדחפה ברכבת התחתית, והסיקה שפריזאים לא מנומסים. איזו תופעה זו?","o":["הטיית אישוש","מתאם שווא שנובע מיוריסטיקת הזמינות, ועומד בבסיס סטריאוטיפים","אפקט המסגור","חוק המספרים הגדולים"],"a":1,"e":"מעט מקרים זמינים בזיכרון יוצרים מתאם מדומה בין שתי תכונות לא קשורות: \"פריזאי\" ו\"לא מנומס\"."},{"q":"מהי יוריסטיקת היציגות?","o":["שיפוט לפי מהירות השליפה מהזיכרון","הנטייה לשפוט את הסיכוי שמקרה שייך לקטגוריה לפי הדמיון בינו לבין הדימוי שיש לנו על הקטגוריה","שיפוט לפי שיעור הבסיס","שיפוט לפי ניסוח"],"a":1,"e":"היא מובילה, למשל, להתעלמות משיעור הבסיס."},{"q":"רוברט מרכיב משקפיים, מדבר בשקט וקורא הרבה. רוב האנשים שופטים שסביר יותר שהוא ספרן ולא חקלאי. מהי הטעות?","o":["אין טעות","התעלמות משיעור הבסיס: יש הרבה יותר גברים חקלאים מגברים ספרנים","הפרת כלל החיתוך","יוריסטיקת הזמינות"],"a":1,"e":"התיאור תואם את הייצוג של ספרן (יציגות), ולכן מתעלמים מהשכיחות באוכלוסייה."},{"q":"מה מצאו טברסקי וכהנמן (1974) לגבי שימוש בשיעור הבסיס?","o":["אנשים תמיד מתעלמים משיעור הבסיס","כשמוצג רק שיעור הבסיס אנשים מתבססים עליו, וכשמוצגים גם פרטים תיאוריים הם מתעלמים ממנו","אנשים תמיד משתמשים בשיעור הבסיס","שיעור הבסיס אינו רלוונטי"],"a":1,"e":"הפרטים התיאוריים מפעילים את יוריסטיקת היציגות."},{"q":"בבעיית גלית (טברסקי וכהנמן, 1983), 85% מהנבדקים בחרו ש\"גלית היא פקידת בנק פמיניסטית\" סביר יותר מ\"גלית היא פקידת בנק\". איזה כלל הופר?","o":["חוק המספרים הגדולים","כלל החיתוך: הסיכוי לצירוף של שתי תכונות קטן בהכרח (או שווה) לסיכוי לכל אחת מהן בנפרד","שיעור הבסיס","תוחלת התועלת"],"a":1,"e":"התכונה \"פמיניסטית\" מייצגת את התיאור (יציגות), ולכן הצירוף נשפט כסביר יותר."},{"q":"בעיית בתי החולים: בבית חולים גדול נולדים כ-45 תינוקות ביום ובקטן כ-15. באיזה בית חולים יתועדו יותר ימים שבהם יותר מ-60% מהנולדים זכרים?","o":["בבית החולים הגדול","בבית החולים הקטן","מספר שווה בשניהם","לא ניתן לדעת"],"a":1,"e":"לפי חוק המספרים הגדולים, מדגם קטן סוטה יותר מהאוכלוסייה. 56% מהנבדקים ענו בטעות שלא יהיה הבדל."},{"q":"מדוע רוב הנבדקים טעו בבעיית בתי החולים?","o":["הם לא הבינו את השאלה","לפי יוריסטיקת היציגות, שני בתי החולים מייצגים את האוכלוסייה באותה מידה, והם התעלמו מכך שמדגם גדול מייצג יותר טוב","הם השתמשו בשיעור הבסיס","הם הושפעו מהמסגור"],"a":1,"e":"זו הפרה של חוק המספרים הגדולים."},{"q":"בניסוי של לורד ועמיתים (1979) על עונש מוות, מה נמצא?","o":["כולם השתכנעו מאותם מחקרים","מחקרים שהראו שעונש מוות מרתיע דורגו כמשכנעים בקרב התומכים בו וכלא משכנעים בקרב המתנגדים לו, ולהפך","עמדות לא השפיעו","כולם דחו את כל המחקרים"],"a":1,"e":"זו הטיה לטובתי, שהיא מקרה של הטיית אישוש."},{"q":"מהי \"הטיית אישוש\"?","o":["הנטייה לבדוק נתונים כך שיפריכו השערות","הנטייה לבדוק נתונים כך שיאששו השערות ולא יפריכו אותן","הנטייה לשנות דעה","הנטייה להישאר במצב הקיים"],"a":1,"e":"הטיה לטובתי היא אחד המקרים שלה."},{"q":"במשימה של ווסון (1960), נבדקים קיבלו את השלשה 2, 4, 6 והתבקשו לגלות את הכלל. מה קרה?","o":["רוב הנבדקים גילו מיד את הכלל","רובם ניחשו \"מספרים עולים ב-2\" ובדקו רק שלשות שתאמו את השערתם, בעוד שהכלל היה \"מספרים בסדר עולה\"","הנבדקים לא הציעו שלשות","הכלל היה \"מספרים זוגיים\""],"a":1,"e":"זו הטיית אישוש: הם לא בדקו שלשה כמו 2, 4, 5 שהייתה מפריכה את ההשערה."},{"q":"מה היה עוזר לנבדקים במשימה של ווסון לגלות את הכלל הנכון?","o":["לבדוק עוד שלשות שעולות ב-2","לבדוק שלשות שמנוגדות להשערה שלהם (למשל 2, 4, 5), כדי לנסות להפריך אותה","לנחש מהר","לא לבדוק כלל"],"a":1,"e":"ניסיון הפרכה הוא ההפך מהטיית אישוש."},{"q":"לפי גישת התועלת לקבלת החלטות –","o":["אנשים בוחרים לפי רגשותיהם","אנשים בוחרים בחלופה שמובילה לתוחלת התועלת (התועלת הממוצעת) הגבוהה ביותר","אנשים בוחרים באקראי","אנשים בוחרים לפי ברירת המחדל"],"a":1,"e":"ממצאים רבים מראים שאנשים לא תמיד פועלים כך, למשל ממשיכים להמר במכונות מזל."},{"q":"בניסוי של דנס-ראג' ואפשטיין (1994), נבדקים בחרו בין קערה עם 1 סוכרייה אדומה מתוך 10 לבין קערה עם 7 אדומות מתוך 100. מה נמצא?","o":["כולם בחרו בקערה הקטנה","נבדקים רבים בחרו בקערה עם 100 הסוכריות, אף שהסיכוי לשלוף ממנה אדומה נמוך יותר (7% לעומת 10%)","לא הייתה העדפה","הנבדקים סירבו לבחור"],"a":1,"e":"זה ממצא שמנוגד לגישת התועלת."},{"q":"בניסוי של קרמר ועמיתים (2006) על הטלת מטבע (זכייה של 5$ או הפסד של 3$), מה נמצא?","o":["הנבדקים העריכו נכון את השפעת ההפסד","לפני ההטלה הנבדקים צפו שההפסד יוריד את האושר יותר משהזכייה תעלה אותו, אבל בפועל ההשפעה השלילית של ההפסד הייתה קטנה בהרבה ממה שחזו","ההפסד השפיע יותר ממה שחזו","הזכייה השפיעה יותר ממה שחזו"],"a":1,"e":"אנשים מנבאים באופן לא מדויק את התוצאות הרגשיות שלהם, ובמיוחד את השליליות."},{"q":"מה גורם להערכת היתר של השפעת ההפסד בניסוי של קרמר ועמיתים?","o":["אנשים אינם אוהבים כסף","בזמן הניבוי אנשים אינם לוקחים בחשבון את מנגנוני ההתמודדות, כמו רציונליזציה (\"עדיין יצאתי ברווח של 2$\")","ההפסד היה גדול מאוד","הנבדקים לא הבינו את המשימה"],"a":1,"e":"מנגנוני ההתמודדות מקטינים את הפגיעה בפועל."},{"q":"בניסוי של לרנר ועמיתים (2004), מה עשו נבדקים בתנאי העצב ובתנאי הגועל כשהתבקשו למכור מארז מרקרים?","o":["דרשו מחיר גבוה יותר","היו מוכנים למכור במחיר נמוך יותר מהקבוצה הנייטרלית","סירבו למכור","לא היה הבדל"],"a":1,"e":"גועל גורם לצורך להיפטר מדברים, ועצב גורם לצורך בשינוי."},{"q":"בניסוי של לרנר ועמיתים, מה עשתה הקבוצה העצובה בתנאי הקנייה?","o":["העדיפה כסף על המארז","העדיפה לקבל את המארז עד לסכום כסף גבוה יותר משאר הקבוצות","לא רצתה את המארז","התנהגה כמו הקבוצה הנייטרלית"],"a":1,"e":"הצורך בשינוי בא לידי ביטוי. בקבוצת הגועל לא הייתה השפעה, כי לא היה ממה להיפטר. מסקנה: רגשות מקריים משפיעים על החלטות כלכליות."},{"q":"בניסוי של שן ועמיתים (2010), רופאים החליטו על ניתוח קיסרי. מתי המליצו עליו יותר רופאים?","o":["כשהמקרה הוצג לבדו","כשהמקרה הוצג אחרי מקרים חמורים","כשהמקרה הוצג אחרי מקרים לא חמורים (72%, לעומת כ-50% בתנאים האחרים)","לא היה הבדל"],"a":2,"e":"קבלת החלטות מושפעת מההקשר, כלומר ממידע שהתקבל מיד לפני כן."},{"q":"מדוע יותר מ-99% מהצרפתים חתומים על כרטיס תורם איברים, לעומת 28% מהאמריקנים?","o":["הצרפתים אוהבים יותר לתרום","בצרפת יש הליך \"בחירה לצאת\" (ברירת המחדל היא תורם), ובארה\"ב הליך \"בחירה להיכנס\". הטיית הסטטוס-קוו גורמת לאנשים להישאר בברירת המחדל","בצרפת חובה לתרום","אין הסבר"],"a":1,"e":"לפי גישת התועלת, אופן הצגת הבחירה לא אמור להשפיע."},{"q":"מהי \"הטיית הסטטוס-קוו\"?","o":["הנטייה לשנות את המצב הקיים","הנטייה להישאר במצב הקיים ולא לבחור באפשרות שמשנה אותו","הנטייה לבחור באפשרות הזולה","הנטייה לבחור באפשרות הנפוצה"],"a":1,"e":"היא מסבירה את ההשפעה של ברירת המחדל."},{"q":"במחקר של טברסקי וכהנמן (1981) על המחלה שצפויה להרוג 600 איש, איזו תוכנית העדיפו רוב הנבדקים כשהתוצאות נוסחו במונחי הצלה (\"200 ינצלו בוודאות\" לעומת סיכוי של ⅓ ש-600 ינצלו)?","o":["את התוכנית ההסתברותית (72%)","את התוכנית הוודאית (72%)","חצי-חצי","אף אחת"],"a":1,"e":"זו שנאת סיכון במסגור של רווחים."},{"q":"במשימת הבחירה השנייה (\"400 ימותו בוודאות\" לעומת סיכוי של ⅓ שאיש לא ימות), מה העדיפו רוב הנבדקים?","o":["את התוכנית הוודאית (78%)","את התוכנית ההסתברותית (78%)","חצי-חצי","אף אחת"],"a":1,"e":"זו לקיחת סיכון במסגור של הפסדים."},{"q":"אפקט המסגור בניסוי של טברסקי וכהנמן (1981) מתבטא בכך ש –","o":["כשהבחירה מוצגת כרווחים (הצלת חיים) אנשים שונאים סיכון, וכשהיא מוצגת כהפסדים (אובדן חיים) הם לוקחים סיכון","כשהבחירה מוצגת כרווחים אנשים לוקחים סיכון, וכשהיא מוצגת כהפסדים הם שונאים סיכון","בשני הניסוחים אנשים שונאים סיכון","בשני הניסוחים אנשים לוקחים סיכון"],"a":0,"e":"זו שאלה מהמבחן לדוגמה. התוכניות זהות בתוצאותיהן, ורק הניסוח שונה."},{"q":"מדוע אפקט המסגור סותר את גישת התועלת?","o":["כי התוכניות שונות בתוחלת שלהן","כי שתי משימות הבחירה זהות לגמרי בתוצאות (א'=ג', ב'=ד'), ובכל זאת הבחירות שונות רק בגלל הניסוח","כי אנשים בחרו באקראי","הוא אינו סותר אותה"],"a":1,"e":"לפי גישת התועלת, הניסוח לא אמור להשפיע."},{"q":"מהו מתאם שווא?","o":["מתאם אמיתי בין משתנים","קשר מדומה שאנו יוצרים בין אירועים או תכונות שקל לנו להיזכר בהם יחד, אף שאינם קשורים באמת","שיעור הבסיס","תוצאה סטטיסטית מובהקת"],"a":1,"e":"מתאם שווא נובע מיוריסטיקת הזמינות, והוא מקור לסטריאוטיפים רבים."},{"q":"איזה מהבאים הוא דוגמה לממצא שמנוגד לגישת התועלת?","o":["אנשים בוחרים בחלופה בעלת התוחלת הגבוהה","אנשים ממשיכים להמר במכונות מזל למרות שתוחלת התועלת הכספית שלילית","אנשים חוסכים כסף","אנשים משווים מחירים"],"a":1,"e":"גם הניסוי של דנס-ראג' ואפשטיין, אפקט המסגור ותרומת האיברים מראים זאת."},{"q":"איזה מהבאים אינו גורם שהוצג בפרק כמשפיע על קבלת החלטות בניגוד לגישת התועלת?","o":["רגשות (מקריים או צפויים)","ההקשר הקודם","אופן הצגת הבחירה (ברירת מחדל, מסגור)","תוחלת התועלת של החלופות"],"a":3,"e":"תוחלת התועלת היא בדיוק מה שגישת התועלת מניחה שקובע את הבחירה. שאר הגורמים מראים סטייה ממנה."}],"hard":[{"q":"אחרי סדרה של כתבות על התקפות כרישים, אנשים מעריכים שמוות מכריש שכיח יותר ממוות מנפילה מסולם. איזו יוריסטיקה פועלת, ומה הטעות?","o":["יציגות, התעלמות משיעור הבסיס","זמינות: מקרים שסוקרו בתקשורת עולים בקלות לזיכרון ולכן נשפטים כשכיחים, אף שבפועל הם נדירים יותר","מסגור","הטיית אישוש"],"a":1,"e":"זה כמו בניסוי ליכטנשטיין: זמינות בזיכרון אינה שכיחות בעולם."},{"q":"\"בכיתה יש 70 סטודנטים למשפטים ו-30 למחשבים. נבחר סטודנט שאוהב משחקי מחשב ומתכנת בזמנו הפנוי.\" רוב האנשים שופטים שהוא כנראה סטודנט למחשבים. מה חסר בשיפוט שלהם?","o":["שום דבר, השיפוט נכון בוודאות","התחשבות בשיעור הבסיס: יש יותר מפי 2 סטודנטים למשפטים, ולכן גם תיאור מתאים אינו מבטל את הסיכוי הגבוה שהוא ממשפטים","התחשבות בכלל החיתוך","התחשבות במסגור"],"a":1,"e":"יציגות גורמת להתעלם משיעור הבסיס כשיש תיאור."},{"q":"איזו מהטענות הבאות סבירה פחות, לפי כלל החיתוך, על אדם שתואר כחובב טבע?","o":["הוא מורה","הוא מורה וחבר בארגון ירוק","שתיהן סבירות באותה מידה","לא ניתן לדעת"],"a":1,"e":"צירוף של שתי תכונות אינו יכול להיות סביר יותר מכל אחת מהן לבד, גם אם הוא נשמע מייצג יותר."},{"q":"מטילים מטבע 10 פעמים ומקבלים 7 עצים. מטילים 1000 פעמים. מה סביר יותר?","o":["שוב בערך 70% עצים","שאחוז העצים יהיה קרוב יותר ל-50%, כי במדגם גדול הסטייה מהאוכלוסייה קטנה (חוק המספרים הגדולים)","פחות מ-30% עצים","בדיוק 50%"],"a":1,"e":"זה ההיגיון של בעיית בתי החולים: מדגמים קטנים סוטים יותר."},{"q":"חוקר שמאמין שקפה משפר זיכרון בודק רק נבדקים ששתו קפה ומוצא שזיכרונם טוב. איזו הטיה זו, ומה היה עליו לעשות?","o":["הטיית זמינות, לשאול יותר אנשים","הטיית אישוש: הוא בדק רק מקרים שעשויים לאשש את ההשערה. היה עליו לבדוק גם קבוצה שלא שתתה קפה, כלומר לנסות להפריך","מסגור, לנסח אחרת","אין הטיה"],"a":1,"e":"כמו במשימת 2-4-6 של ווסון: צריך לבדוק גם מקרים שיכולים להפריך."},{"q":"ניתוח מוצג למטופלים כ\"90% שיעור הישרדות\" או כ\"10% שיעור תמותה\". לפי אפקט המסגור, מה צפוי?","o":["אותה החלטה בשני המקרים","יותר מטופלים יסכימו לניתוח כשהוא מוצג במונחי הישרדות (רווח), אף שהמידע זהה","יותר יסכימו במסגור של תמותה","אף אחד לא יסכים"],"a":1,"e":"ההחלטה מושפעת מהניסוח, בניגוד לגישת התועלת."},{"q":"חברה משנה את ברירת המחדל כך שכל עובד מצטרף אוטומטית לתוכנית חיסכון, וצריך לבקש כדי לצאת. אחוז החוסכים קופץ. מה ההסבר?","o":["העובדים הבינו פתאום את התועלת","הטיית הסטטוס-קוו: אנשים נוטים להישאר בברירת המחדל, ולכן הליך \"בחירה לצאת\" מגדיל את ההשתתפות","יוריסטיקת הזמינות","אפקט המסגור בלבד"],"a":1,"e":" function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const chapterById = Object.fromEntries(DATA.map(c=>[c.id,c]));

function pillFor(rec){

}

  $app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>startChapter(b.dataset.ch));

  document.getElementById("terms").onclick=()=>renderSplash(true);

const PRAISE_HARD = [
  "נכון! זו שאלת חשיבה, והצלחת ליישם את העיקרון על מצב חדש.",
  "מצוין! ניבאת את התוצאה מתוך ההיגיון של התיאוריה, וזה בדיוק המיומנות הנדרשת.",
  "כל הכבוד! הבחנת בין שני הסברים מתחרים, וזה החלק הקשה.",
  "נכון! זו חשיבה של חוקרים: מה הממצא מוכיח ומה הוא לא מוכיח.",
  "מעולה! שאלה מאתגרת, ופתרת אותה בהבנה ולא בזיכרון."
];
let praiseI = 0;
function praiseFor(it){ const list = Q && Q.key.endsWith("-hard") ? PRAISE_HARD : PRAISE; if(it._p===undefined) it._p = list[(praiseI++ + Math.floor(Math.random()*list.length)) % list.length]; return it._p; }
function startHard(id){
  const c = chapterById[id];
  Q = {key:id+"-hard", title:c.title+" · מאתגר", items:shuffle(c.hard.map(q=>prep(q,null))), i:0, answers:[], mode:store.mode};
  renderQ();
}
function startChapter(id, onlyIdx){
  const c = chapterById[id];
  let qs = c.questions.map(q=>prep(q,null));
  if(onlyIdx) qs = onlyIdx.map(i=>prep(c.questions[i],null));
  qs = shuffle(qs);
  if(!onlyIdx) qs = qs.slice(0, QUIZ_SIZE);
  Q = {key:id, title:c.title, items:qs, i:0, answers:[], mode:store.mode, retry:!!onlyIdx};
  renderQ();
}
function startMixed(){
  const pool = [];
  DATA.forEach(c=>c.questions.forEach(q=>pool.push(prep(q, c.title))));
  Q = {key:"mixed", title:"מבחן מעורב", items:shuffle(pool).slice(0,EXAM_SIZE), i:0, answers:[], mode:store.mode};
  renderQ();
}
function retryWrong(){
  const wrong = Q.items.filter((it,k)=>!it.opts[Q.answers[k]]?.ok);
  Q = {key:Q.key, title:Q.title, items:shuffle(wrong.map(it=>({...it, opts:shuffle(it.opts)}))), i:0, answers:[], mode:Q.mode, retry:true};
  renderQ();
}
function renderQ(){
  const it = Q.items[Q.i], n = Q.items.length, a = Q.answers[Q.i];
  const answered = a!==undefined, reveal = answered && Q.mode==="practice";
  const pct = Math.round((Q.answers.filter(x=>x!==undefined).length/n)*100);
  $app.innerHTML = `
    <div class="qbar">
      <h2>${esc(Q.title)}${Q.retry?" · תרגול טעויות":""}</h2>
      <button class="btn ghost" id="home">חזרה לפרקים</button>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <article class="qcard">
      <div class="qnum num">שאלה ${Q.i+1} מתוך ${n}${it.src?` · <span class="src">${esc(it.src.split(":")[0])}</span>`:""}</div>
      <div class="qtext">${esc(it.q)}</div>
      <div class="opts" role="radiogroup">
        ${it.opts.map((o,k)=>{
          let cls="";
          if(reveal){ if(o.ok) cls="right"; else if(k===a) cls="wrong"; }
          else if(answered && k===a) cls="sel";
          return `<button class="opt ${cls}" data-k="${k}" role="radio" aria-checked="${k===a}" ${reveal?"disabled":""}><span class="l">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`;
        }).join("")}
      </div>
      ${reveal?`<div class="explain${it.opts[a].ok?" good":""}"><b>${it.opts[a].ok?praiseFor(it):"לא נכון. התשובה הנכונה: "+esc(LETTERS[it.opts.findIndex(o=>o.ok)])}</b>${esc(it.e)}</div>`:""}
    </article>
    <div class="nav">
      <button class="btn ghost" id="prev" ${Q.i===0?"disabled":""}>הקודמת</button>
      <button class="btn" id="next" ${!answered?"disabled":""}>${Q.i===n-1?"סיום וציון":"הבאה"}</button>
    </div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ Q.answers[Q.i]=+b.dataset.k; renderQ(); });
  document.getElementById("home").onclick=renderHome;
  document.getElementById("prev").onclick=()=>{Q.i--;renderQ();};
  document.getElementById("next").onclick=()=>{ if(Q.i===n-1) finish(); else {Q.i++;renderQ();} };
}
function finish(){
  const n = Q.items.length;
  const correct = Q.items.filter((it,k)=>it.opts[Q.answers[k]]?.ok).length;
  const score = Math.round(correct/n*100);
  if(!Q.retry){
    const prev = store.scores[Q.key];
    store.scores[Q.key] = {best:Math.max(score, prev?prev.best:0), last:score, attempts:(prev?prev.attempts:0)+1};
    save(store);
  }
  const wrong = Q.items.map((it,k)=>({it,a:Q.answers[k]})).filter(x=>!x.it.opts[x.a]?.ok);
  const verdict = score>=85?"מצוין! הפרק הזה בשליטה.":score>=60?"עברת. כדאי לחזור על הטעויות.":"כדאי לחזור על הפרק ולנסות שוב.";
  $app.innerHTML = `
    <div class="qbar"><h2>${esc(Q.title)}${Q.retry?" · תרגול טעויות":""}</h2><button class="btn ghost" id="home">חזרה לפרקים</button></div>
    <section class="result">
      ${score>=85?TICK.replace('class="tick"','class="tick done-mark"'):""}
      <div class="muted">הציון שלך</div>
      <div class="score num ${scoreClass(score)}">${score}</div>
      <div class="verdict">${verdict}</div>
      <div class="muted num">${correct} תשובות נכונות מתוך ${n}${Q.key==="mixed"?` · ${correct*3} נקודות מתוך ${n*3} בחלק א׳`:""}</div>
      <div class="actions">
        ${wrong.length?`<button class="btn" id="rw">תרגול ${wrong.length} הטעויות</button>`:""}
        <button class="btn ghost" id="again">${Q.key==="mixed"?"מבחן מעורב חדש":Q.key.endsWith("-hard")?"שוב את השאלות המאתגרות":"שוב את כל הפרק"}</button>
      </div>
    </section>
    ${wrong.length?`<section class="review"><h3>מה לחזור עליו</h3>
      ${wrong.map(({it,a})=>`<div class="ritem">
        <div class="q">${esc(it.q)}</div>
        <div class="yours">התשובה שלך: ${esc(it.opts[a].t)}</div>
        <div class="correct">התשובה הנכונה: ${esc(it.opts.find(o=>o.ok).t)}</div>
        <div class="e">${esc(it.e)}</div>
        ${it.src?`<div class="src">${esc(it.src)}</div>`:""}
      </div>`).join("")}</section>`:`<p class="foot">כל התשובות נכונות. כל הכבוד!</p>`}`;
  document.getElementById("home").onclick=renderHome;
  const again=document.getElementById("again");
  again.onclick=()=> Q.key==="mixed"?startMixed():Q.key.endsWith("-hard")?startHard(Q.key.replace("-hard","")):startChapter(Q.key);
  const rw=document.getElementById("rw"); if(rw) rw.onclick=retryWrong;
  window.scrollTo(0,0);
}
/* ---------- splash / terms ---------- */
const CONSENT_KEY = "cogquiz.consent.v1";
const TICK = '<svg class="tick" viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><path d="M22,52 L37.76,67.76 Q42,72 46.03,67.55 L80,30" fill="none" stroke="var(--wy-success)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="86" r="6.38" fill="var(--wy-success)"/></svg>';
function hasConsent(){ try{ return localStorage.getItem(CONSENT_KEY)==="yes"; }catch(e){ return false; } }
function renderSplash(fromHome){
  const total = DATA.reduce((s,c)=>s+c.questions.length,0);
  const agreed = fromHome && hasConsent();
  $app.innerHTML = `
    <section class="splash" aria-labelledby="sp-title">
      <div class="brandbar">${LOGO}</div>
      <h1 id="sp-title">תרגול לבחינה ב<span class="lit">פסיכולוגיה קוגניטיבית</span></h1>
      <p class="lead">שאלות אמריקאיות לפי פרקים, עם ציון בסוף, הסבר לכל תשובה ומבחן מעורב בסגנון הבחינה.</p>
      <div class="facts">
        <span class="fact num">${total} שאלות</span>
        <span class="fact num">${DATA.length} פרקים</span>
        <span class="fact">הספר הלבן והספר התכלת</span>
      </div>
      <div class="terms">
        <h2>לפני שמתחילים</h2>
        <ul>
          <li>האתר הוא כלי עזר לתרגול אישי. הוא <strong>אינו רשמי</strong> ואינו קשור לאוניברסיטה הפתוחה או לצוות הקורס.</li>
          <li>השאלות נכתבו על בסיס חומרי הקורס ו<strong>לא נבדקו מול תשובון רשמי</strong>. ייתכנו בהן טעויות.</li>
          <li>האתר אינו מחליף את חומרי הקורס, את ההנחיות ואת ההודעות הרשמיות.</li>
          <li><strong>השימוש באתר על אחריות המשתמש בלבד.</strong> אין אחריות לנכונות התוכן, לשלמותו או לתוצאות בבחינה.</li>
          <li>לא נאסף מידע אישי. הציונים נשמרים רק בדפדפן שלך.</li>
        </ul>
      </div>
      <button class="agree" id="agree" role="checkbox" aria-checked="${agreed}">
        <span class="box">${TICK}</span>
        <span class="agree-text">קראתי והבנתי. ידוע לי שהאתר אינו רשמי ושהשימוש בו על אחריותי בלבד.</span>
      </button>
      <button class="btn" id="enter" ${agreed?"":"disabled"}>${fromHome?"חזרה לתרגול":"כניסה לתרגול"}</button>
    </section>`;
  const agree=document.getElementById("agree"), enter=document.getElementById("enter");
  agree.onclick=()=>{ const v=agree.getAttribute("aria-checked")!=="true"; agree.setAttribute("aria-checked",v); enter.disabled=!v; };
  enter.onclick=()=>{ try{ localStorage.setItem(CONSENT_KEY,"yes"); }catch(e){} renderHome(); };
  window.scrollTo(0,0);
}
if(hasConsent()) renderHome(); else renderSplash(false);
</script>
</body></html>
