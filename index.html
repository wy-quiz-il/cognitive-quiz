<!doctype html><html lang="he" dir="rtl"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>תרגול פסיכולוגיה קוגניטיבית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* WY | וּוִי design language, light ground (WY-068..071). One reading column; home = two book shelves; quiz = one card at a time. */
:root{
  color-scheme:light;
  --wy-bg:#F7FAFD; --wy-surface:#FFFFFF; --wy-raised:#EEF3F8; --wy-line:#0714261A;
  --wy-text:#071426; --wy-muted:#4A5D73;
  --wy-brand:#0E6FCB; --wy-action:#0E6FCB; --wy-on-action:#FFFFFF; --wy-focus:#0E6FCB;
  --wy-brand-soft:#E6F0FA;
  --wy-success:#4D7C0F; --wy-success-soft:#EEF5E3;
  --wy-warning:#A35A00; --wy-warning-soft:#FFF3E3;
  --wy-danger:#C62839;  --wy-danger-soft:#FCEBED;
  --wy-font:"Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --r-input:8px; --r-btn:12px; --r-card:16px; --r-panel:24px;
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:420ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-inout:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--wy-bg);color:var(--wy-text);font-family:var(--wy-font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(30px,2.5vw + 20px,44px);font-weight:800}
h2{font-size:clamp(21px,1vw + 16px,26px);font-weight:700}
h3{font-size:19px;font-weight:700}
.lit{color:var(--wy-brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--wy-focus);outline-offset:2px}
.muted{color:var(--wy-muted)}
.num{font-variant-numeric:tabular-nums}

/* brand bar */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lockup{height:30px;width:auto;display:block}
.from{font-size:14px;color:var(--wy-muted);font-weight:500}

/* splash */
.splash{position:relative;overflow:hidden;background:var(--wy-surface);border:1px solid var(--wy-line);border-radius:var(--r-panel);
  padding:28px 22px;display:flex;flex-direction:column;gap:18px}
.splash::before{content:"";position:absolute;inset:-40% -30% auto auto;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, #0E6FCB1F 0%, #0E6FCB00 65%);animation:drift 12s var(--ease-inout) infinite alternate;pointer-events:none}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,60px)}}
.splash > *{position:relative}
.splash .lockup{height:44px}
.lead{font-size:18px;margin:0;color:var(--wy-text)}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--wy-raised);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.terms{background:var(--wy-bg);border:1px solid var(--wy-line);border-radius:var(--r-card);padding:16px 18px}
.terms h2{font-size:19px;margin-bottom:8px}
.terms ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.terms strong{font-weight:700}
.agree{display:flex;align-items:flex-start;gap:12px;background:var(--wy-surface);border:1.5px solid var(--wy-line);border-radius:var(--r-btn);
  padding:12px 14px;text-align:right;width:100%;min-height:44px;transition:border-color var(--dur-base) var(--ease-out),background var(--dur-base)}
.agree[aria-checked="true"]{border-color:var(--wy-success);background:var(--wy-success-soft)}
.box{flex:none;width:28px;height:28px;border-radius:var(--r-input);border:2px solid var(--wy-muted);display:grid;place-items:center;background:var(--wy-surface)}
.agree[aria-checked="true"] .box{border-color:var(--wy-success)}
.tick path{stroke-dasharray:90;stroke-dashoffset:90}
.agree[aria-checked="true"] .tick path,.done-mark .tick path{animation:draw var(--dur-slow) var(--ease-out) forwards}
.tick circle{opacity:0}
.agree[aria-checked="true"] .tick circle,.done-mark .tick circle{animation:dot var(--dur-base) var(--ease-out) var(--dur-slow) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.tick circle{transform-origin:42px 86px}
.agree-text{font-weight:500;line-height:1.5}

/* buttons */
.btn{border:0;border-radius:var(--r-btn);padding:11px 20px;min-height:44px;font-weight:700;background:var(--wy-action);color:var(--wy-on-action);
  transition:transform var(--dur-fast),opacity var(--dur-base)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--wy-text);border:1px solid var(--wy-line)}
.btn.light{background:var(--wy-surface);color:var(--wy-brand)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--wy-brand);text-decoration:underline;padding:0;font-size:14px}

/* home */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0}
.summary{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-size:24px;font-weight:800}
.stat span{font-size:13px;color:var(--wy-muted)}
.mode{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--wy-line);border-radius:var(--r-btn);overflow:hidden;background:var(--wy-surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--wy-action);color:var(--wy-on-action);font-weight:700}
.exam-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--wy-brand);color:#FFFFFF;border-radius:var(--r-card);padding:18px 20px}
.exam-card h2{color:#FFFFFF}
.exam-card p{margin:2px 0 0;font-size:15px;color:#FFFFFF}
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-head{display:flex;align-items:center;gap:10px}
.spine{width:12px;height:34px;border-radius:3px;flex:none}
.shelf.white .spine{background:var(--wy-surface);border:1.5px solid var(--wy-muted)}
.shelf.blue .spine{background:var(--wy-brand)}
.shelf-head small{color:var(--wy-muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ch{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--wy-surface);border:1px solid var(--wy-line);
  border-radius:var(--r-card);padding:14px 16px 12px;min-width:0;transition:border-color var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.ch:hover{border-color:var(--wy-brand);transform:translateY(-1px)}
.ch .n{font-size:13px;color:var(--wy-muted)}
.ch .t{font-weight:700;font-size:16px;line-height:1.35}
.ch-actions{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:8px}
.ch-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;text-align:right;
  background:var(--wy-bg);border:1px solid var(--wy-line);border-radius:var(--r-btn);padding:8px 12px;transition:border-color var(--dur-base) var(--ease-out),background var(--dur-base)}
.ch-btn:hover{border-color:var(--wy-brand);background:var(--wy-brand-soft)}
.ch-btn-l{display:flex;flex-direction:column;line-height:1.25}
.ch-btn-l b{font-size:15px}
.ch-btn-l span{font-size:12px;color:var(--wy-muted)}
.ch-btn.hard{border-color:var(--wy-brand)}
.ch-btn.hard b{color:var(--wy-brand)}
.ch .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:auto;padding-top:6px}
.src-tag{align-self:flex-start;font-size:12px;font-weight:500;color:var(--wy-muted);border:1px solid var(--wy-line);border-radius:var(--r-input);padding:1px 8px}
.src-tag.book{color:var(--wy-warning);border-color:var(--wy-warning);background:var(--wy-warning-soft);font-weight:700}
.ch.from-book{border:2px solid var(--wy-warning);background:var(--wy-warning-soft)}
.book-note{font-size:13px;line-height:1.45}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--wy-brand-soft);color:var(--wy-brand)}
.pill.good{background:var(--wy-success-soft);color:var(--wy-success)}
.pill.bad{background:var(--wy-danger-soft);color:var(--wy-danger)}
.pill.none{background:transparent;color:var(--wy-muted);border:1px dashed var(--wy-line)}

/* quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--wy-raised);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--wy-brand);transition:width var(--dur-slow) var(--ease-out)}
.qcard{background:var(--wy-surface);border:1px solid var(--wy-line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px}
.qnum{font-size:13px;color:var(--wy-muted)}
.qtext{font-size:19px;font-weight:700;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:right;width:100%;background:var(--wy-bg);border:1.5px solid var(--wy-line);
  border-radius:var(--r-btn);padding:11px 12px;font-size:16px;line-height:1.45;min-height:44px;transition:border-color var(--dur-base),background var(--dur-base)}
.opt:hover:not(:disabled){border-color:var(--wy-brand)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--wy-surface);border:1px solid var(--wy-line)}
.opt.sel{border-color:var(--wy-brand);background:var(--wy-brand-soft)}
.opt.right{border-color:var(--wy-success);background:var(--wy-success-soft)}
.opt.right .l{background:var(--wy-success);color:#FFFFFF;border-color:var(--wy-success)}
.opt.wrong{border-color:var(--wy-danger);background:var(--wy-danger-soft)}
.opt.wrong .l{background:var(--wy-danger);color:#FFFFFF;border-color:var(--wy-danger)}
.opt:disabled{cursor:default}
.explain{border-inline-start:4px solid var(--wy-brand);background:var(--wy-brand-soft);padding:10px 12px;border-radius:var(--r-input);font-size:15px}
.explain b{display:block;margin-bottom:2px}
.explain.good{border-inline-start-color:var(--wy-success);background:var(--wy-success-soft)}
.explain.good b{color:var(--wy-success)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.src{font-size:13px;color:var(--wy-muted)}

/* result */
.result{background:var(--wy-surface);border:1px solid var(--wy-line);border-radius:var(--r-panel);padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.done-mark{width:64px;height:64px}
.score{font-size:72px;font-weight:800;line-height:1}
.score.good{color:var(--wy-success)} .score.mid{color:var(--wy-warning)} .score.bad{color:var(--wy-danger)}
.verdict{font-size:18px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.review{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--wy-surface);border:1px solid var(--wy-line);border-inline-start:4px solid var(--wy-danger);border-radius:var(--r-input);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ritem .q{font-weight:700;font-size:16px}
.ritem .yours{color:var(--wy-danger)}
.ritem .correct{color:var(--wy-success);font-weight:700}
.ritem .e{color:var(--wy-muted)}
.foot{font-size:13px;color:var(--wy-muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.tick path{stroke-dashoffset:0!important}.tick circle{opacity:1!important}}
@media (max-width:480px){.qcard{padding:16px}.qtext{font-size:17.5px}.score{font-size:60px}.splash{padding:22px 16px}.splash .lockup{height:36px}}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = [{"id":"p1","book":"הספר הלבן – נושאים נבחרים בחקר התפיסה","title":"פרק 1: תפיסת מרחק וגודל, אשליות וקביעויות","questions":[{"q":"מהו האתגר המרכזי של מערכת הראייה בתפיסת מרחק?","o":["לשחזר את מימד העומק מתוך שתי תמונות רשתיות דו-ממדיות","לזהות את צבע העצמים בתנאי תאורה משתנים","להבחין בין דמות לרקע בתמונה מורכבת","לחבר תכוניות לכדי עצם אחד"],"a":0,"e":"הקלט הוא שתי תמונות רשתיות דו-ממדיות, והפלט הוא ייצוג תלת-ממדי. האתגר הוא להסיק את המימד השלישי."},{"q":"מהם \"רמזי מרחק\"?","o":["תאים במוח שמגיבים רק לעצמים רחוקים","נתונים דו-ממדיים מהרשתית שמשמשים להסקת המרחק וליצירת ייצוג תלת-ממדי","מידע שמגיע מחוש המישוש על מיקום עצמים","תחושות תנועה של שרירי העין בלבד"],"a":1,"e":"רמזי מרחק הם נתונים דו-ממדיים מהרשתית שמהם המוח מסיק עומק. ככל שיש יותר רמזים, תפיסת המרחק חדה יותר."},{"q":"מה נכון לגבי ייצוג המרחק שנוצר מרמזי המרחק?","o":["הוא תמיד מדויק לחלוטין","הוא מדויק רק בראייה דו-עינית","הוא בקירוב ולא במדויק, ולעיתים יש טעויות שמובילות לאשליות","הוא מדויק רק כשיש אופק"],"a":2,"e":"ייצוג המרחק הוא בקירוב. טעויות בו מובילות לאשליות, למשל אשליות גיאומטריות של גודל."},{"q":"לפי רמז הגודל היחסי, כשמשווים בין דימויים זהי צורה –","o":["הדימוי הקטן יותר על הרשתית נתפס כקרוב יותר","הדימוי הגדול יותר על הרשתית נתפס כקרוב יותר","גודל הדימוי לא משפיע על המרחק הנתפס","הדימוי הגדול יותר נתפס כרחוק יותר"],"a":1,"e":"מבחינה אופטית, ככל שעצם רחוק יותר הדימוי שלו קטן יותר. לכן בין דימויים זהי צורה, הגדול נתפס כקרוב."},{"q":"מדוע רמז הגודל היחסי אינו תמיד מוביל למסקנה נכונה?","o":["כי הוא פועל רק בעין אחת","כי ייתכן שהדימוי גדול יותר מפני שהעצם עצמו גדול יותר, ולא מפני שהוא קרוב יותר","כי הוא פועל רק בתנועה","כי הוא תלוי בכיוון האור"],"a":1,"e":"דימוי גדול יכול לנבוע מעצם גדול ולא מעצם קרוב, ולכן צריך להצליב את הרמז עם רמזי מרחק אחרים."},{"q":"לפי רמז מוכרות הגודל, כאשר עצם מוכר אחד יוצא קטן מהצפוי ביחס לעצם מוכר שני –","o":["נמקם אותו קרוב יותר מהשני","נמקם אותו רחוק יותר מהשני","נתפוס אותו כעצם קטן יותר במציאות, באותו מרחק","לא נסיק דבר על המרחק"],"a":1,"e":"כשיחס הגדלים שונה מהיחס המוכר, העצם שיוצא קטן מהצפוי ממוקם רחוק יותר."},{"q":"על איזו הנחה מתבססת מערכת התפיסה בשימוש ברמז ההצללה כדי להסיק אם צורה בולטת או שקועה?","o":["הנחת \"האור מלמטה\"","הנחת \"האור מלמעלה\"","הנחת \"האור מהצד השמאלי\"","הנחה שאין מקור אור אחד"],"a":1,"e":"מערכת התפיסה מניחה שהאור מגיע מלמעלה, ומדפוס האור והצל מסיקה אם הצורה בולטת או שקועה."},{"q":"צורה על משטח אנכי שהצד התחתון שלה מוצל תיתפס, לפי רמז ההצללה, כ –","o":["שקע במשטח","בליטה מהמשטח","צורה שטוחה","צורה רחוקה מאוד"],"a":1,"e":"אם האור מלמעלה והצד התחתון מוצל, זו בליטה. אם הצד העליון מוצל, זה שקע."},{"q":"מדוע לאחר סיבוב תמונת ההצללה ב-180 מעלות תחושת הבליטות והשקעים חלשה יותר, לפי ההסבר שהוצע?","o":["כי לאחר הסיבוב אין עוד צל בתמונה","כי הנחת \"האור מלמעלה\" מתנגשת בהנחה נוספת שרוב הצורות בעולם בולטות ולא שקועות","כי העין אינה רגישה לצל הפוך","כי הסיבוב מבטל את הפער הדו-עיני"],"a":1,"e":"ייתכן שהמוח מפעיל גם הנחה שרוב הצורות בולטות מהמשטח, והיא מתנגשת עם הנחת האור מלמעלה."},{"q":"מה ניתן להעריך מהיחס בין עצם לבין הצל שהוא מטיל על משטח אחר?","o":["את צבע העצם","את מרחק העצם מהמשטח","את מהירות העצם","את משקל העצם"],"a":1,"e":"ממרחק הצל מהעצם שיוצר אותו ניתן להעריך את מרחק העצם מהמשטח."},{"q":"ברמז ההסתרה החלקית, כאשר קווי המתאר של דימוי א' חותכים את קווי המתאר ואת המשטח של דימוי ב', המסקנה היא ש –","o":["ב' קרוב יותר אלינו ומסתיר את א'","א' וב' באותו מרחק מאיתנו","א' קרוב יותר אלינו ומסתיר חלקית את ב'","א' גדול יותר מב'"],"a":2,"e":"א' מסתיר את ב', כלומר שניהם על אותו ציר ראייה ו-א' קרוב יותר."},{"q":"לפי רמז הפרספקטיבה הקווית, עצם ייתפס רחוק יותר מאיתנו ככל ש –","o":["נקודת המגע שלו במשטח קרובה יותר לנקודת ההתלכדות של קווי הפרספקטיבה","הוא רחוק יותר מנקודת ההתלכדות של קווי הפרספקטיבה","הוא מוצל יותר","הדימוי שלו בשתי העיניים זהה"],"a":0,"e":"ככל שהדימוי (נקודת המגע במשטח) קרוב יותר להתלכדות קווי הפרספקטיבה, העצם רחוק יותר."},{"q":"לפי רמז דחיסות המרקם, אזור בתמונה הרשתית שבו המרקם צפוף ודחוס יותר ייתפס כ –","o":["קרוב יותר","רחוק יותר","גדול יותר","בולט מהמשטח"],"a":1,"e":"ככל שהמרקם דחוס יותר, האזור נתפס רחוק יותר בעולם."},{"q":"לפי רמז הגובה היחסי, עצם ייתפס רחוק יותר מאיתנו ככל ש –","o":["הוא נמצא גבוה יותר בתמונה, בלי קשר לאופק","הוא מופיע בגובה קרוב יותר לקו האופק","הוא נמצא נמוך יותר בתמונה, בלי קשר לאופק","הוא רחוק יותר מקו האופק"],"a":1,"e":"עצם שקרוב בגובהו לקו האופק נתפס רחוק יותר. לכן עצמים על הקרקע רחוקים יותר כשהם גבוהים יותר בתמונה, ועצמים באוויר רחוקים יותר כשהם נמוכים יותר."},{"q":"בתמונה עם קו אופק, איזה ענן ייתפס הכי רחוק לפי רמז הגובה היחסי?","o":["הענן שנמצא הכי גבוה בתמונה","הענן שנמצא הכי קרוב לקו האופק, כלומר הכי נמוך מבין העננים","הענן הגדול ביותר","הענן המוצל ביותר"],"a":1,"e":"מעל האופק, עצם שקרוב יותר לאופק (נמוך יותר בתמונה) נתפס רחוק יותר."},{"q":"כיצד פועל רמז הגובה היחסי בחלל סגור ללא אופק, כמו חדר?","o":["הוא אינו פועל כלל בחלל סגור","ככל שהעצמים קרובים בגובהם לחלק האחורי של החדר (הקיר האחורי), הם נתפסים רחוקים יותר","ככל שהעצמים קרובים לתקרה, הם נתפסים קרובים יותר","הוא פועל רק על עצמים שעל הרצפה"],"a":1,"e":"גם בחלל סגור, קרבה בגובה אל החלק האחורי של החדר גורמת לעצמים להיתפס רחוקים יותר."},{"q":"מהם רמזים \"פיקטוריאליים\"?","o":["רמזים שדורשים הצלבת מידע משתי העיניים","רמזים חד-עיניים שיכולים להתקיים גם בתמונה דו-ממדית כמו ציור או צילום","רמזים שמבוססים על תנועת הצופה","רמזים שמבוססים על שמיעה"],"a":1,"e":"רמזים פיקטוריאליים הם רמזים חד-עיניים שקיימים גם בתמונה דו-ממדית: גודל יחסי, הצללה, הסתרה, פרספקטיבה, מרקם, גובה יחסי."},{"q":"איזה מבין הרמזים הבאים איננו רמז פיקטוריאלי?","o":["הסתרה חלקית","דחיסות מרקם","היסט תנועה","פרספקטיבה קווית"],"a":2,"e":"היסט תנועה דורש תנועה של נקודת הצפייה. הוא קיים בסרט ובחלק מהאנימציה, אבל לא בתמונה סטטית."},{"q":"ברמז היסט התנועה, כשהצופה נע ועיניו מתמקדות בנקודת פיקסציה, עצם שנע על הרשתית \"אחורה\" (נגד כיוון התנועה) –","o":["נתפס רחוק יותר מנקודת הפיקסציה","נתפס קרוב יותר מנקודת הפיקסציה, וככל שהוא נע מהר יותר הוא נתפס קרוב יותר","נתפס באותו מרחק כמו נקודת הפיקסציה","אינו נתפס כלל"],"a":1,"e":"מה שבורח אחורה נתפס קרוב מהמוקד, ומהירות גבוהה יותר פירושה קרבה רבה יותר. מה שנע איתנו נתפס רחוק מהמוקד."},{"q":"ברמז היסט התנועה, עצם שנע על הרשתית בכיוון התנועה של הצופה (יחד איתו) נתפס –","o":["קרוב יותר מנקודת הפיקסציה","רחוק יותר מנקודת הפיקסציה","באותו מרחק כמו נקודת הפיקסציה","כעצם נייח"],"a":1,"e":"מה שנע בכיוון התנועה שלנו נתפס רחוק יותר מהמוקד."},{"q":"מה מאפיין את רמז הפער הדו-עיני?","o":["הפער גדל ככל שהעצם רחוק יותר, והרמז רלוונטי למרחקים גדולים","הפער גדל ככל שהעצם קרוב יותר, והרמז רלוונטי בעיקר למרחקים קרובים","הפער קבוע בכל המרחקים","הרמז קיים גם בתמונה דו-ממדית רגילה"],"a":1,"e":"הפער במיקום הדימוי בין שתי הרשתיות גדל ככל שהעצם קרוב. זה הבסיס לסרטים תלת-ממדיים."},{"q":"בהדגמת שני האגודלים (אחד קרוב לאף ואחד רחוק ככל האפשר, עוצמים כל פעם עין אחרת) –","o":["מיקום האגודל הרחוק משתנה יותר","מיקום האגודל הקרוב משתנה הרבה יותר","מיקום שני האגודלים משתנה באותה מידה","מיקום האגודלים אינו משתנה"],"a":1,"e":"ההדגמה ממחישה שהפער הדו-עיני גדול יותר לעצם קרוב."},{"q":"מה קובע חוק אמרט?","o":["בבואת הגרר קטנה ככל שמקרינים אותה על משטח רחוק יותר","בבואת הגרר גדלה ככל שמקרינים אותה על משטח רחוק יותר","בבואת הגרר נשארת באותו גודל בכל מרחק","בבואת הגרר נעלמת כשמקרינים אותה על משטח קרוב"],"a":1,"e":"בבואת הגרר (שגודלה על הרשתית קבוע) נתפסת גדולה יותר על משטח רחוק, בגלל תיקון הגודל על פי המרחק."},{"q":"מהו ההסבר לחוק אמרט?","o":["הבבואה על הרשתית גדלה עם המרחק","הדימוי הרשתי של הבבואה קבוע, ותיקון הגודל על פי המרחק הנתפס מכפיל אותו במרחק גדול יותר","המשטח הרחוק מואר פחות","העין מתעייפת עם הזמן"],"a":1,"e":"גודל נתפס = גודל דימוי רשתי × מרחק נתפס. הדימוי קבוע, ולכן ככל שהמשטח רחוק יותר הבבואה נתפסת גדולה יותר."},{"q":"מהי הנוסחה של תיקון הגודל על פי המרחק?","o":["גודל נתפס = גודל דימוי רשתי ÷ מרחק נתפס","גודל נתפס = גודל דימוי רשתי × מרחק נתפס","מרחק נתפס = גודל נתפס × גודל דימוי רשתי","גודל נתפס = מרחק אמיתי − גודל דימוי רשתי"],"a":1,"e":"כדי לתפוס נכון את הגודל, מתקנים את גודל הדימוי הרשתי על פי המרחק הנתפס: גודל נתפס = דימוי רשתי × מרחק נתפס."},{"q":"מדוע גודלו הנתפס של עצם שמתקרב אלינו נשאר קבוע (קביעות הגודל)?","o":["כי הדימוי הרשתי שלו נשאר קבוע","כי המרחק הנתפס שלו קטן באותו יחס שבו גדל הדימוי הרשתי שלו","כי המרחק הנתפס שלו גדל באותו יחס שבו גדל הדימוי הרשתי","כי הדימוי הרשתי שלו קטן באותו יחס שבו קטן המרחק"],"a":1,"e":"כשהעצם מתקרב פי X, הדימוי הרשתי גדל פי X והמרחק הנתפס קטן פי X, ולכן המכפלה (הגודל הנתפס) קבועה."},{"q":"אם מערכת התפיסה מעריכה שעצם קרוב יותר ממה שהוא באמת, סביר שנתפוס אותו –","o":["גדול יותר מכפי שהיינו תופסים אותו עם הערכת מרחק נכונה","קטן יותר מכפי שהיינו תופסים אותו עם הערכת מרחק נכונה","בגודל הנכון בזכות קביעות הגודל","במיקום קבוע בזכות קביעות המיקום"],"a":1,"e":"מרחק נתפס קטן יותר, כשהדימוי הרשתי זהה, נותן גודל נתפס קטן יותר."},{"q":"מה ההסבר לאשליית פונזו (הקו העליון נתפס ארוך יותר מהתחתון למרות שהם שווים)?","o":["הקו העליון מוצל יותר","הקו העליון מוערך כרחוק יותר בגלל הפרספקטיבה הקווית, ולכן אותו דימוי רשתי מוכפל במרחק גדול יותר","הקו העליון גדול יותר על הרשתית","הקו התחתון מוסתר חלקית"],"a":1,"e":"הפרספקטיבה הקווית גורמת להערכת מרחק גדולה יותר לקו העליון, ותיקון הגודל מגדיל אותו."},{"q":"מדוע הירח באופק נתפס גדול יותר מהירח ברום השמיים?","o":["כי הוא באמת קרוב יותר לכדור הארץ באופק","כי הדימוי הרשתי שלו גדול יותר באופק","כי באופק יש יותר רמזי מרחק, ולכן הוא מוערך כרחוק יותר, ותיקון הגודל מגדיל אותו","כי האטמוספרה מגדילה אותו כמו עדשה"],"a":2,"e":"הדימויים הרשתיים שווים. באופק יש יותר רמזי מרחק, הירח מוערך כרחוק יותר, ולכן נתפס גדול יותר."},{"q":"בחדר איימס שתי דמויות שוות גודל נתפסות בגדלים שונים מאוד. מדוע?","o":["הדמויות באמת בגדלים שונים","החדר המטעה גורם לשתיהן להיתפס באותו מרחק, ולכן הן נתפסות לפי יחס הגודל שלהן על הרשתית: הרחוקה קטנה והקרובה גדולה","הדמות הקרובה מוסתרת חלקית","הפער הדו-עיני מבטל את קביעות הגודל"],"a":1,"e":"הדמות בפינה הרחוקה קטנה על הרשתית, אבל שתי הדמויות נתפסות באותו מרחק. התיקון שווה, ולכן הגודל הנתפס נקבע לפי הדימוי הרשתי."}],"hard":[{"q":"צלם מצלם שני עמודי חשמל זהים: האחד קרוב והשני רחוק. בתמונה, העמוד הרחוק נראה בגובה של חצי מהקרוב. צופה שמסתכל על התמונה תופס את שני העמודים כשווים בגובהם. איזה צירוף מסביר זאת בצורה הטובה ביותר?","o":["רמזי מרחק פיקטוריאליים בתמונה (למשל פרספקטיבה וגובה יחסי) מעלים את המרחק הנתפס של העמוד הרחוק, ותיקון הגודל על פי המרחק מפצה על הדימוי הרשתי הקטן","הפער הדו-עיני מבחין בין שני העמודים","היסט התנועה בתמונה מראה שהעמוד הרחוק זז לאט","חוק אמרט גורם לבבואת העמוד הרחוק לגדול"],"a":0,"e":"בתמונה סטטית אין פער דו-עיני משמעותי ואין היסט תנועה. רק רמזים פיקטוריאליים יכולים להגדיל את המרחק הנתפס, וכך נשמרת קביעות הגודל."},{"q":"נבדק צופה בבבואת גרר על קיר במרחק 2 מטר, ואחר כך על קיר במרחק 6 מטר. אם הבבואה נתפסה ברוחב 10 ס\"מ על הקיר הקרוב, מה צפוי לפי חוק אמרט?","o":["כ-10 ס\"מ על הקיר הרחוק","כ-30 ס\"מ על הקיר הרחוק","כ-3.3 ס\"מ על הקיר הרחוק","היא לא תיראה על הקיר הרחוק"],"a":1,"e":"הדימוי הרשתי קבוע. גודל נתפס = דימוי רשתי × מרחק נתפס, ולכן פי 3 מרחק נותן פי 3 גודל."},{"q":"בגרסה של אשליית מילר-לייר שבה הכנפיים מוחלפות בעיגולים קטנים בקצות הקווים, האשליה עדיין מתקיימת. מה הקושי שזה יוצר להסבר \"קביעות הפרספקטיבה\"?","o":["אין קושי, כי עיגולים הם רמז פרספקטיבה","עיגולים אינם רומזים על פינה בולטת או שקועה, ולכן ההסבר המבוסס על פרשנות של עומק אינו יכול להסביר את האשליה בגרסה זו","העיגולים מבטלים את תיקון הגודל","העיגולים יוצרים פער דו-עיני"],"a":1,"e":"קביעות הפרספקטיבה מניחה שהקווים מתפרשים כפינות שקועות או בולטות. וריאציות בלי רמזי עומק כאלה ממשיכות להראות אשליה, וזה מערער את ההסבר."},{"q":"בחדר איימס, אדם הולך מהפינה השמאלית לפינה הימנית. מה יחווה הצופה, ומדוע?","o":["האדם ייראה באותו גודל, בזכות קביעות הגודל","האדם ייראה כגדל, כי הוא מתקרב בפועל (הדימוי הרשתי גדל) אבל המרחק הנתפס נשאר קבוע, ולכן תיקון הגודל אינו מפצה","האדם ייראה כמתכווץ","האדם ייראה כמתרחק"],"a":1,"e":"קביעות הגודל דורשת שהמרחק הנתפס ישתנה יחד עם הדימוי הרשתי. החדר המטעה מקבע את המרחק הנתפס, ולכן הגדילה הרשתית נתפסת כגדילה אמיתית."},{"q":"אדם עם עין אחת בלבד נוהג במכונית. איזה רמז מרחק עומד לרשותו פחות מאשר לאדם עם שתי עיניים, ובאיזה מצב החיסרון יורגש במיוחד?","o":["הסתרה חלקית, בכל מרחק","פער דו-עיני, בעיקר במרחקים קרובים, למשל בחניה","פרספקטיבה קווית, בעיקר בכבישים ארוכים","היסט תנועה, בעיקר בעמידה"],"a":1,"e":"הפער הדו-עיני רלוונטי בעיקר למרחק קרוב. היסט תנועה וכל הרמזים הפיקטוריאליים זמינים גם לעין אחת."},{"q":"חוקר רוצה לבדוק אם הנחת \"האור מלמעלה\" מתייחסת לכיוון \"למעלה\" ביחס לראש הצופה או ביחס לעולם. איזה ניסוי מתאים?","o":["להציג את תמונת ההצללה לנבדקים שוכבים על הצד, ולבדוק אם הבליטות והשקעים מתהפכים לפי כיוון הראש או לפי כיוון העולם","להגדיל את התמונה","להציג את התמונה לעין אחת","לסובב את התמונה ב-90 מעלות לנבדקים עומדים"],"a":0,"e":"רק הפרדה בין כיוון הראש לכיוון העולם (נבדק שוכב) יכולה להכריע בין שתי האפשרויות."},{"q":"הערכת המרחק של עצם מוטה כך שהוא נתפס רחוק פי 2 ממיקומו האמיתי. בנוסף, הדימוי הרשתי שלו קטן פי 2 מהצפוי, כי העצם עצמו קטן בחצי ממה שחשבנו. מה יהיה הגודל הנתפס ביחס לגודל שהיינו מצפים לו לעצם הרגיל במקומו האמיתי?","o":["קטן פי 4","שווה","גדול פי 2","קטן פי 2"],"a":1,"e":"גודל נתפס = דימוי רשתי × מרחק נתפס = (½) × 2 = 1. שתי ההטיות מבטלות זו את זו."},{"q":"מדוע אשליית הירח מתחלשת כשמביטים בירח שבאופק דרך צינור קרטון?","o":["הצינור מגדיל את הדימוי הרשתי","הצינור מסתיר את רמזי המרחק של הנוף, ולכן הירח כבר אינו מוערך כרחוק יותר","הצינור מבטל את הפער הדו-עיני","הצינור מחשיך את הירח"],"a":1,"e":"לפי ההסבר בפרק, האשליה נובעת מרמזי המרחק שבאופק. כשמסתירים אותם, המרחק הנתפס של הירח באופק דומה לזה של הירח ברום השמיים."},{"q":"אילו שני רמזים, מתוך הבאים, יכולים להתקיים גם בציור שמן על בד?","o":["היסט תנועה ופער דו-עיני","דחיסות מרקם והסתרה חלקית","פער דו-עיני והסתרה חלקית","היסט תנועה ודחיסות מרקם"],"a":1,"e":"שניהם פיקטוריאליים. פער דו-עיני דורש שתי תמונות שונות לשתי העיניים, והיסט תנועה דורש תנועה."},{"q":"שני עצמים זהי צורה מופיעים בתמונה. הדימוי של עצם א' גדול מזה של ב', אבל ב' מסתיר חלקית את א'. מה צפוי לגבי המרחק הנתפס?","o":["א' ייתפס קרוב יותר, כי הוא גדול","ב' ייתפס קרוב יותר, ו-א' ייתפס כעצם גדול שנמצא מאחוריו, כי רמז ההסתרה גובר במקרה זה על הגודל היחסי","שניהם באותו מרחק","לא ייתפס עומק"],"a":1,"e":"הסתרה חלקית היא רמז חזק לסדר העומק. ההסקה שעצם א' גדול באמת מיישבת את הסתירה עם הגודל היחסי."}]},{"id":"p2","book":"הספר הלבן – נושאים נבחרים בחקר התפיסה","title":"פרק 2: זיהוי עצמים חזותיים","questions":[{"q":"מהי המורכבות של \"גודש חזותי\" בזיהוי עצמים?","o":["בכל רגע צריך לזהות הרבה עצמים בו-זמנית, ורק חלק מצורתם מופיע על הרשתית כי הם מסתירים זה את זה","יש יותר מדי צבעים בסביבה","העין אינה יכולה להתמקד ביותר מעצם אחד","הרשתית מקבלת יותר מדי אור"],"a":0,"e":"גודש חזותי פירושו ריבוי עצמים בו-זמנית שמסתירים חלקית זה את זה."},{"q":"מהי המורכבות שנובעת מ\"המגוון העצום של עצמים\"?","o":["יש מעט מאוד סוגי עצמים בעולם","את רוב העצמים שמולנו לא ראינו קודם, ובכל זאת צריך לשייך אותם לסוג או לקטגוריה","כל עצם נראה תמיד אותו דבר","אין צורך לזכור עצמים"],"a":1,"e":"יש מגוון סוגים ווריאציות בכל סוג. רוב העצמים הספציפיים חדשים לנו, ובכל זאת אנו מזהים אותם."},{"q":"מהי המורכבות של \"תלות בנקודת הצפייה\"?","o":["אי אפשר לראות עצם משתי זוויות","צריך לזהות אותו עצם ספציפי למרות המגוון האינסופי של דימויים רשתיים שלו מנקודות צפייה שונות","עצמים משנים את צורתם במציאות","נקודת הצפייה משפיעה רק על הצבע"],"a":1,"e":"כל נקודת צפייה יוצרת דימוי רשתי שונה, ועדיין צריך לזהות את אותו עצם."},{"q":"מהו \"גירוי קרוב\"?","o":["העצם כפי שהוא בעולם","הגירוי שעצם יוצר על הרשתית ברגע נתון (הדימוי הרשתי)","עצם שנמצא קרוב פיזית לצופה","ייצוג העצם בזיכרון"],"a":1,"e":"גירוי קרוב הוא הדימוי הרשתי. גירוי רחוק הוא העצם כפי שהוא בעולם."},{"q":"זיהוי עצם מוגדר בפרק כיכולת –","o":["לזהות גירוי קרוב אחד כמה גירויים רחוקים","לזהות מגוון עצום של גירויים קרובים כגירוי רחוק אחד שיצר את כולם","להבחין בין שני גירויים רחוקים זהים","לזכור את כל הגירויים הקרובים שנראו אי פעם"],"a":1,"e":"זהו יחס של אחד לרבים, והוא מחייב ייצוג בזיכרון של הגירוי הרחוק שיכיל את השונות."},{"q":"מהם שני השלבים שאליהם ניתן לחלק את משימת זיהוי העצמים?","o":["קשב וזיכרון","ארגון תפיסתי וזיהוי העצם","קידוד ושליפה","תחושה ותגובה מוטורית"],"a":1,"e":"ארגון תפיסתי מקשר את חלקי הדימוי לעצם מועמד. זיהוי העצם קושר אותו לייצוג הגירוי הרחוק."},{"q":"מה נכון לגבי היחס בין שלב הארגון התפיסתי לשלב זיהוי העצם?","o":["הם תמיד נפרדים לחלוטין בזמן","הם יכולים לעיתים לחפוף בזמן ולקיים אינטראקציה","הזיהוי תמיד קודם לארגון","אין קשר ביניהם"],"a":1,"e":"השלבים יכולים לחפוף ולהשפיע זה על זה, אבל לשם הנוחות מציגים אותם ברצף."},{"q":"כיצד מתבצעת הפקת גבולות בתמונה הרשתית?","o":["על ידי זיהוי שינויים פתאומיים ולא רציפים בבהירות או בצבע","על ידי זיהוי משמעות העצם","על ידי השוואה לזיכרון","על ידי תנועת העיניים בלבד"],"a":0,"e":"גבולות הם אזורים שבהם חלים שינויים פתאומיים ומוארכים בבהירות או בצבע."},{"q":"מהי מורכבות שצללים יוצרים בהפקת גבולות?","o":["צללים תמיד מבליטים את הגבולות האמיתיים","צללים יכולים ליצור גבולות שגויים וגם להסתיר גבולות אמיתיים של עצמים","צללים אינם משפיעים על בהירות","צללים מופיעים רק בתמונות צבעוניות"],"a":1,"e":"בדוגמת הקערה: הצל יוצר גבול שגוי ומסתיר גם את הקצה האמיתי של הקערה."},{"q":"מהי מורכבות בחיבור אזורים אחידים המוקפים בגבולות?","o":["כל האזורים בעלי אותה בהירות שייכים לאותו עצם","חלק מהאזורים שמחוברים בגלל בהירות זהה אינם שייכים לאותו עצם, וחלק מהאזורים המופרדים כן שייכים לאותו עצם","אין אזורים אחידים בתמונה","החיבור מתבסס רק על משמעות"],"a":1,"e":"החיבור לפי אחידות (בהירות, צבע, מרקם) עלול לחבר אזורים לא קשורים ולהפריד אזורים של אותו עצם."},{"q":"לפי עקרון ה\"מוקפוּת\" בארגון דמות-רקע –","o":["האזור המקיף ייתפס כדמות","אזור שמוקף לחלוטין על ידי אזור אחר ייתפס כדמות, והגבול ישויך אליו","שני האזורים ייתפסו כרקע","הגבול ישויך לאזור הגדול יותר"],"a":1,"e":"האזור המוקף הוא הדמות, והאזור המקיף הוא הרקע."},{"q":"לפי עקרון העומק בארגון דמות-רקע –","o":["האזור שנתפס כרחוק יותר ייתפס כדמות","אזור שנתפס כנמצא לפני אזור אחר ייתפס כדמות, והגבולות ישויכו אליו","העומק אינו משפיע על דמות-רקע","שני האזורים ייתפסו כדמויות"],"a":1,"e":"האזור שמלפנים הוא הדמות, והגבולות שייכים לו. האזור האחר הוא הרקע."},{"q":"לפי עקרון הקימוריות –","o":["אזורים עם גבולות קעורים ייתפסו כדמויות בסיכוי גבוה יותר","אזורים עם גבולות קמורים (בולטים החוצה) ייתפסו כדמויות בסיכוי גבוה יותר","הקימוריות אינה משפיעה","אזורים קמורים ייתפסו תמיד כרקע"],"a":1,"e":"גבולות קמורים מעלים את הסיכוי שהאזור ייתפס כדמות, לעומת גבולות קעורים."},{"q":"מדוע עקרון המשמעותיות נחשב להשפעה מלמעלה-למטה?","o":["כי הוא מבוסס רק על בהירות","כי הנטייה לתפוס כדמות את הצורה המזוהה מתרחשת למרות שבדרך כלל חלוקת דמות-רקע קודמת לזיהוי","כי הוא פועל רק בעין אחת","כי הוא מבוסס על תנועה"],"a":1,"e":"ידע (זיהוי המשמעות) משפיע על שלב מוקדם יותר, חלוקת דמות-רקע, ולכן זו השפעה מלמעלה-למטה."},{"q":"מהו עקרון הפשטות בארגון דמות-רקע?","o":["נטייה לתפוס כמה שיותר צורות","נטייה לתפוס כמה שפחות צורות, כאלה שלא היו צריכות להיות מסודרות באופן ספציפי מאוד כדי ליצור את התמונה","נטייה לתפוס רק צורות גיאומטריות","נטייה לתפוס רק צורות בצבע אחד"],"a":1,"e":"פשטות: מעט צורות, בלי הנחה של סידור מקרי וספציפי במיוחד."},{"q":"איזה מבין הבאים איננו עקרון של ארגון דמות-רקע?","o":["סימטריה","קימוריות","קירבה","מוקפות"],"a":2,"e":"קירבה היא עקרון הקבצה, לא עקרון דמות-רקע. עקרונות דמות-רקע הם עומק, מוקפות, סימטריה, משמעותיות, פשטות וקימוריות."},{"q":"איזה מבין הבאים איננו עקרון הקבצה?","o":["דמיון","גורל משותף","משמעותיות","המשכיות טובה"],"a":2,"e":"משמעותיות היא עקרון דמות-רקע. עקרונות ההקבצה הם קירבה, דמיון, תנועה משותפת, סימטריה והמשכיות טובה."},{"q":"נקודות שנעות יחד באותו כיוון ובאותה מהירות נתפסות כקבוצה אחת. זהו עקרון –","o":["הקירבה","הדמיון","התנועה המשותפת (הגורל המשותף)","הסימטריה"],"a":2,"e":"אנו נוטים לקבץ גירויים שנעים יחד."},{"q":"לפי עקרון ההמשכיות הטובה –","o":["כל גבולות קרובים מתקבצים לצורה אחת","רק גבולות של צורה שהיו נפגשים אילו היו ממשיכים ללא שינוי מאפשרים הקבצה לצורה אחת שמוסתרת חלקית","גבולות בצבע זהה מתקבצים","גבולות סימטריים בלבד מתקבצים"],"a":1,"e":"המשכיות טובה מאפשרת לחבר חלקים של צורה מוסתרת כשהגבולות שלהם ממשיכים זה את זה."},{"q":"ראייה של משולש לבן \"מדומיין\" שקווי המתאר שלו אינם קיימים בפועל היא דוגמה ל –","o":["השלמת משטחים","השלמת גבולות באמצעות קווי מתאר מדומיינים","עקרון הקירבה","היסט תנועה"],"a":1,"e":"השלמה תפיסתית של גבולות חסרים, לפי המשכיות, יוצרת דמות."},{"q":"מה ההבדל בין השלמת גבולות להשלמת משטחים?","o":["אין הבדל","השלמת גבולות יוצרת קווי מתאר מדומיינים לדמות, והשלמת משטחים משלימה חלקי משטח מוסתרים שמחברים בין אזורי דמות מופרדים","השלמת משטחים מתרחשת רק בצבע","השלמת גבולות מתרחשת רק בתנועה"],"a":1,"e":"שתיהן לפי המשכיות. האחת משלימה קווים, והשנייה משלימה חלקי משטח מוסתרים."},{"q":"מהו עיבוד \"מלמטה-למעלה\" (Bottom-Up)?","o":["ידע קודם וציפיות משפיעים על שלבי עיבוד בסיסיים","מידע מהרשתית עובר עיבודים מתקדמים, מ\"נמוכים\" ל\"גבוהים\", עד לזיהוי העצמים והסצנה","עיבוד שמתחיל במשמעות ומסתיים בבהירות","עיבוד שמתרחש רק בזיכרון"],"a":1,"e":"מלמטה-למעלה מתחיל מהקלט החושי. מלמעלה-למטה מתחיל מידע קודם וציפיות."},{"q":"מהו עיבוד \"מלמעלה-למטה\" (Top-Down)?","o":["עיבוד שמתחיל בקלט מהרשתית","תהליכים \"גבוהים\" כמו ידע קודם וציפיות משפיעים על שלבים מוקדמים ובסיסיים יותר של העיבוד","עיבוד שמתרחש רק בעין","עיבוד של צבע בלבד"],"a":1,"e":"למשל, תמצית של סצנה יוצרת ציפיות לגבי סוגי העצמים ומיקומם."},{"q":"בניסוי של בידרמן ועמיתים (1982) הנבדקים חיפשו עצם (למשל ברז כיבוי) שהופיע בסצנה במיקום אופייני או לא אופייני. מה נמצא?","o":["הדיוק היה זהה בשני התנאים","הדיוק היה נמוך יותר כשהעצם הופיע במיקום לא אופייני","הדיוק היה גבוה יותר במיקום לא אופייני","הנבדקים לא הצליחו לזהות עצמים כלל"],"a":1,"e":"הממצא תומך בעיבוד מלמעלה-למטה: ציפיות לגבי מיקום העצם משפיעות על זיהויו."},{"q":"מדוע בניסוי של בידרמן הסצנה הוצגה ל-150 אלפיות שנייה בלבד?","o":["כדי שהנבדקים לא יספיקו להזיז את מבטם, כך שהתמונה על הרשתית תהיה קבועה","כדי לעייף את הנבדקים","כדי לבדוק זיכרון לטווח ארוך","כדי לבדוק את עקרון הקירבה"],"a":0,"e":"בזק קצר מונע תנועות עיניים, וכך התמונה הרשתית קבועה."},{"q":"מה היה תפקיד הגירוי הממסך עם הנקודה בניסוי של בידרמן?","o":["להסיח את דעת הנבדקים","לסמן מיקום שבו הופיע עצם, כשהנבדקים נשאלו אם זה המקום של העצם שחיפשו","להציג את העצם שוב","למדוד את גודל האישונים"],"a":1,"e":"הנבדקים ענו אם הנקודה נמצאת במקום שבו הופיע העצם שהונחו לחפש."},{"q":"בניסוי של דבנפורט ופוטר (2004) הוצגו שחקן פוטבול או כומר על רקע מגרש פוטבול או כנסייה. מה הייתה המסקנה?","o":["רק הסצנה משפיעה על זיהוי העצם (מלמעלה-למטה בלבד)","רק העצם משפיע על זיהוי הסצנה (מלמטה-למעלה בלבד)","יש השפעה הדדית: התאמה בין העצם לסצנה שיפרה גם את זיהוי העצם וגם את זיהוי הסצנה","אין השפעה של התאמה"],"a":2,"e":"הדיוק בזיהוי העצם ובזיהוי הסצנה היה טוב יותר כשהם תאמו, כלומר שני כיווני העיבוד פועלים יחד."},{"q":"לפי גישת \"זיהוי עצם לפי רכיבים\", עצם מזוהה לפי –","o":["ייצוגים שלמים שלו מנקודות צפייה שונות","הרכיבים שלו והיחסים ביניהם, ללא תלות בנקודת הצפייה","הצבע שלו בלבד","ההקשר של הסצנה בלבד"],"a":1,"e":"העצם הוא צירוף של חלקים. אותם חלקים ויחסים מאפשרים לזהותו מכל זווית."},{"q":"מהי הביקורת על גישת הזיהוי לפי רכיבים?","o":["היא דורשת מוח גדול מדי","יש עצמים שהחלקים והיחסים שלהם זהים, ובכל זאת אנו מבחינים ביניהם","היא אינה מסבירה זיהוי מזוויות שונות","היא מתעלמת מהרשתית"],"a":1,"e":"אם החלקים והיחסים זהים, הגישה אינה מסבירה כיצד אנו מבחינים בין עצמים כאלה."},{"q":"בניסוי של טאר (Tarr, 1995) שתמך בגישת הזיהוי התלוי בנקודת צפייה נמצא ש –","o":["זמן התגובה היה זהה בכל הזוויות","זמן התגובה לזיהוי נכון גדל ככל שגדל השינוי ביחס לזווית שנלמדה","הנבדקים זיהו טוב יותר בזוויות חדשות","הנבדקים לא הצליחו ללמוד את העצמים"],"a":1,"e":"הייצוגים שנלמדו היו תלויי נקודת צפייה. הביקורת: לאחסון מספיק ייצוגים של כל עצם נדרש מוח גדול מאוד."}],"hard":[{"q":"בתמונה של כוס על שולחן שחור, הצל של הכוס על השולחן מתמזג עם גוף הכוס הכהה. באיזה שלב של הארגון התפיסתי צפוי הקושי העיקרי?","o":["בזיהוי העצם בלבד","בהפקת הגבולות ובחיבור אזורים אחידים: הצל ואזורי הכוס הכהים בעלי בהירות דומה, ולכן הגבול האמיתי מוסתר ואזורים של עצמים שונים מתחברים","בעקרון המשמעותיות","בעיבוד מלמעלה-למטה בלבד"],"a":1,"e":"זו בדיוק מורכבות הקערה מהמצגת: צללים יוצרים גבולות שגויים ומסתירים גבולות אמיתיים."},{"q":"נבדקים מזהים בתמונה דו-משמעית את הצורה בעלת המשמעות כדמות, ולא את הצורה חסרת המשמעות. מה מלמד הדבר על הסדר בין שלבי העיבוד?","o":["שזיהוי העצם מתרחש תמיד לפני כל ארגון","שלמרות שבדרך כלל חלוקת דמות-רקע קודמת לזיהוי, ידע על משמעות יכול להשפיע עליה, כלומר השלבים יכולים לחפוף ולקיים אינטראקציה","שאין שלב ארגון תפיסתי","שהעיבוד הוא מלמטה-למעלה בלבד"],"a":1,"e":"עקרון המשמעותיות הוא השפעה מלמעלה-למטה על שלב מוקדם, וזה תואם את הטענה שהשלבים יכולים לחפוף."},{"q":"חוקר מציג עצם בסצנה במיקום אופייני או לא אופייני, אבל לזמן ארוך (5 שניות), ונותן לנבדקים לסרוק בחופשיות. מדוע הניסוי הזה פחות מתאים לבדיקת השאלה של בידרמן?","o":["כי 5 שניות קצרות מדי","כי עם זמן ארוך ותנועות עיניים חופשיות, הנבדקים יכולים לחפש את העצם בכל מקום, ולכן השפעת הציפיות על הזיהוי הראשוני עלולה להיעלם","כי אין צורך בגירוי ממסך","כי מיקום אינו משפיע לעולם"],"a":1,"e":"הבזק קצר (150 א\"ש) ומיסוך מגבילים את העיבוד לזמן קצר, ושם בולטת ההשפעה של תמצית הסצנה."},{"q":"בניסוי של טאר (1995), נבדק אחד מזהה עצם בזווית 90 מעלות מהזווית שנלמדה מהר בדיוק כמו בזווית שנלמדה. איזו גישה הממצא הזה תומך בה יותר?","o":["זיהוי תלוי נקודת צפייה","זיהוי לפי רכיבים, שאינו תלוי בנקודת הצפייה","עיבוד מלמעלה-למטה","גישת הדוגמאות"],"a":1,"e":"היעדר עלות זמן לשינוי זווית הוא בדיוק הניבוי של גישת הרכיבים."},{"q":"לפי ממצאי דבנפורט ופוטר (2004), מה צפוי אם יוצג כומר על רקע מגרש פוטבול?","o":["זיהוי הכומר והמגרש יהיה מדויק יותר מאשר כשהם תואמים","זיהוי הכומר וזיהוי המגרש יהיו שניהם פחות מדויקים מאשר בתנאי התאמה","רק זיהוי המגרש ייפגע","רק זיהוי הכומר ייפגע"],"a":1,"e":"נמצאה השפעה הדדית: התאמה שיפרה את זיהוי שניהם, ולכן אי-התאמה פוגעת בשניהם."},{"q":"שלוש נקודות אדומות נעות יחד ימינה, ושלוש נקודות אדומות אחרות נעות יחד שמאלה, וכולן קרובות זו לזו. מה צפוי לפי עקרונות ההקבצה?","o":["כל שש הנקודות יתקבצו בגלל קירבה ודמיון","יתקבלו שתי קבוצות לפי כיוון התנועה, כי הגורל המשותף מבחין ביניהן בעוד שקירבה ודמיון אינם מבחינים","לא תהיה הקבצה","יתקבלו שש קבוצות"],"a":1,"e":"כשקירבה ודמיון זהים לכולן, רק עקרון התנועה המשותפת יוצר הבחנה."},{"q":"מבקרי הגישה התלויה בנקודת צפייה טענו שנדרש מוח גדול מאוד. מה מניחה הביקורת?","o":["שכל עצם נשמר כרכיבים","שכדי לזהות כל עצם מכל זווית צריך לאחסן מספר עצום של ייצוגים שלמים, לכל עצם ולכל נקודת צפייה","שאין זיכרון לעצמים","שזיהוי תלוי רק בהקשר"],"a":1,"e":"התשובה של תומכי הגישה: מספיקים כמה ייצוגים מנקודות צפייה שונות-משמעותית."},{"q":"איזה מבין המצבים הבאים מדגים השלמת משטחים, ולא השלמת גבולות?","o":["ראיית משולש לבן שקווי המתאר שלו אינם מצוירים","ראיית מקל אחד רציף שחלקו האמצעי מוסתר מאחורי עמוד","תפיסת שתי צורות סימטריות כדמות","קיבוץ נקודות קרובות"],"a":1,"e":"בהשלמת משטחים מחברים בין חלקי דמות מופרדים דרך חלק מוסתר. השלמת גבולות יוצרת קווי מתאר מדומיינים."},{"q":"מדוע הגירוי הקרוב לבדו אינו מספיק לזיהוי עצם?","o":["כי הוא תמיד מטושטש","כי לאותו גירוי רחוק יש אינסוף גירויים קרובים שונים (בגלל נקודת צפייה, הסתרה וגודש), ולכן נדרש ייצוג בזיכרון שמכיל את השונות הזו","כי אין לו צבע","כי הוא תמיד דו-משמעי"],"a":1,"e":"זיהוי הוא יחס של אחד לרבים: גירוי רחוק אחד לגירויים קרובים רבים."},{"q":"צורה שגבולותיה קעורים מוקפת לחלוטין בצורה שגבולותיה קמורים. מה ניתן לנבא?","o":["הצורה הקעורה תיתפס כדמות בוודאות","יש התנגשות בין עקרון המוקפות (שמנבא שהמוקפת תהיה דמות) לבין עקרון הקימוריות (שמנבא שהקמורה תהיה דמות), ולכן התפיסה עלולה להיות פחות יציבה","הקמורה תיתפס כרקע בוודאות","לא תהיה דמות"],"a":1,"e":"עקרונות הארגון הם הסתברותיים, וכשהם מתנגשים הדו-משמעות גדלה."}]},{"id":"p3","book":"הספר הלבן – נושאים נבחרים בחקר התפיסה","title":"פרק 3: פסיכופיזיקה קלאסית","questions":[{"q":"מהי מטרת הפסיכופיזיקה הקלאסית?","o":["למדוד את מבנה העין","למצוא את הקשר המתמטי בין עוצמת הגירוי הפיזיקלי לעוצמת התחושה שלו","להשוות ישירות בין עוצמת גירוי לעוצמת התחושה באותן יחידות","לחקור זיכרון לטווח ארוך"],"a":1,"e":"אין טעם להשוות ישירות בין גירוי לתחושה, כי הן ביחידות שונות. מחפשים את הקשר המתמטי ביניהן."},{"q":"מהו המרכיב הבעייתי למדידה בפסיכופיזיקה?","o":["הגירוי הפיזיקלי","הגירוי הנתפס (תחושת הגירוי)","שניהם קלים למדידה","זמן התגובה"],"a":1,"e":"את הגירוי הפיזיקלי קל למדוד. את התחושה הסובייקטיבית קשה למדוד."},{"q":"מהו JND (סף ההבדל)?","o":["העוצמה המינימלית של גירוי שניתן לחוש בו בכלל","ההפרש המינימלי בעוצמה הפיזיקלית בין שני גירויים באותו ממד חושי, שנדרש כדי לתפוס אותם כשונים","ההבדל המרבי שניתן לחוש","קבוע שזהה בכל הממדים החושיים"],"a":1,"e":"JND = Just Noticeable Difference, ההבדל הקטן ביותר שמורגש."},{"q":"מדוע הדלקת גפרור מורגשת בחדר חשוך ואינה מורגשת בחדר מואר?","o":["כי בחדר מואר העין עצומה","כי סף ההבדל עבור גירוי בעוצמה גדולה גדול יותר מסף ההבדל עבור גירוי בעוצמה קטנה","כי הגפרור חלש יותר בחדר מואר","כי בחדר חשוך אין JND"],"a":1,"e":"ה-JND גדל עם עוצמת הגירוי, ולכן אותה תוספת קטנה אינה מורגשת כשהעוצמה ההתחלתית גבוהה."},{"q":"מדוע מודדים את סף ההבדל בכל פעם עבור עוצמת גירוי מסוימת?","o":["כי סף ההבדל משתנה עם עוצמת הגירוי","כי סף ההבדל קבוע תמיד","כי אין דרך אחרת למדוד גירוי","כי כך קבע פכנר"],"a":0,"e":"ה-JND שונה בעוצמות שונות, ולכן הוא מוגדר ביחס לעוצמה נתונה (I)."},{"q":"מה מצא ובר במדידות סף ההבדל במשקל?","o":["ה-JND קבוע בכל עוצמה","היחס בין JND לבין עוצמת הגירוי (I) קבוע ואינו משתנה עם עוצמת הגירוי","ה-JND קטן כשהעוצמה גדלה","אין קשר בין JND לעוצמה"],"a":1,"e":"JND/I = K, כלומר ה-JND הוא אחוז קבוע מהגירוי."},{"q":"מהי הנוסחה של חוק ובר?","o":["S = A·log(I/I₀)","JND = K·I","S = A·I^b","JND = K + I"],"a":1,"e":"סף ההבדל (עבור I) = קבוע ובר (K) × עוצמת הגירוי (I)."},{"q":"נתונים שני גירויים, 500 ו-550, ו-K=0.2. האם נחוש בהבדל ביניהם?","o":["כן, כי ההבדל (50) גדול מה-JND","לא, כי ההבדל (50) קטן מה-JND (100)","כן, כי K קטן מ-1","לא ניתן לדעת"],"a":1,"e":"JND = 0.2 × 500 = 100. ההפרש 50 קטן מ-100, ולכן לא נרגיש בהבדל."},{"q":"נתונים שני גירויים, 1000 ו-1250, ו-K=0.2. האם נחוש בהבדל ביניהם?","o":["לא, כי ההבדל קטן מה-JND","כן, כי ההבדל (250) גדול מה-JND (200)","לא, כי K קטן","לא ניתן לדעת"],"a":1,"e":"JND = 0.2 × 1000 = 200. ההפרש 250 גדול מ-200."},{"q":"קבוע ובר של ממד א' גדול מקבוע ובר של ממד ב'. באיזה ממד אנו רגישים יותר לשינוי מזערי?","o":["בממד א'","בממד ב'","באותה מידה בשניהם","לא ניתן לדעת"],"a":1,"e":"ככל ש-K קטן יותר, אנו רגישים יותר לשינוי יחסי, כלומר מבחינים בשינוי באחוז נמוך יותר."},{"q":"מה נשאר קבוע בעוצמות גירוי שונות לפי חוק ובר?","o":["גודל ה-JND המוחלט","היחס (האחוז) בין ה-JND לבין עוצמת הגירוי","עוצמת התחושה","הסף המוחלט"],"a":1,"e":"ה-JND גדל ביחס ישר לעוצמה, ולכן היחס ביניהם (K) קבוע."},{"q":"האם חוק ובר הוא חוק פסיכופיזי?","o":["כן, כי הוא מקשר בין גירוי לתחושה","לא, כי אף אחד ממרכיביו (JND, K, I) אינו מבטא עוצמת תחושה","כן, כי הוא כולל את קבוע ובר","לא, כי הוא עוסק רק בשמיעה"],"a":1,"e":"חוק פסיכופיזי מקשר בין עוצמת גירוי לעוצמת תחושה. חוק ובר אינו כולל מרכיב של תחושה."},{"q":"מה ההנחה (האקסיומה) שפכנר הוסיף לחוק ובר?","o":["ה-JND קבוע בכל העוצמות","השינוי בתחושה שמתלווה לכל JND תמיד באותו גודל","התחושה גדלה בקצב הולך ומתגבר","תחושת ההבדל המזערי יחסית לתחושה הקודמת"],"a":1,"e":"למרות שה-JND-ים גדלים עם I, השינוי בתחושה בכל אחד מהם זהה. פכנר הגדיר אותו כיחידה 1."},{"q":"מהי הנוסחה של חוק פכנר?","o":["JND = K·I","S = A·log(I/I₀)","S = A·I^b","S = K·I"],"a":1,"e":"S היא התחושה, I היא עוצמת הגירוי, I₀ הוא הסף המוחלט, ו-A הוא קבוע פכנר (שמחושב מקבוע ובר)."},{"q":"לפי חוק פכנר, ככל שעוצמת הגירוי גדלה, עוצמת התחושה –","o":["גדלה בקצב קבוע","גדלה בקצב שהולך ומתמתן","גדלה בקצב שהולך ומתגבר","קטנה"],"a":1,"e":"מסקנה 1 של פכנר: אנו נעשים פחות רגישים לשינוי כשהגירוי מתחזק."},{"q":"לפי חוק פכנר, עוצמת התחושה גדלה –","o":["בקצב קבוע ללא תלות בעוצמת הגירוי","פי יחס קבוע כאשר עוצמת הגירוי גדלה בהפרש קבוע","בהפרש קבוע כאשר עוצמת הגירוי גדלה פי יחס קבוע","בקצב שהולך וגדל ככל שעוצמת הגירוי גדלה"],"a":2,"e":"מסקנה 2: כש-I גדל פי יחס קבוע, S גדלה בהפרש קבוע. התחושה רגישה ליחס העוצמות."},{"q":"האצנו מ-20 ל-30 קמ\"ש ואחר כך מ-50 ל-60 קמ\"ש. לפי חוק פכנר –","o":["נרגיש את שני השינויים כשווים","נרגיש את השינוי מ-50 ל-60 כקטן יותר","נרגיש את השינוי מ-50 ל-60 כגדול יותר","לא נרגיש אף שינוי"],"a":1,"e":"ההבדל הפיזיקלי זהה, אבל התחושה גדלה בקצב מתמתן, ולכן בעוצמות הגבוהות התחושה תגדל פחות."},{"q":"בשני זוגות קווים, ארוכים וקצרים, מרגישים אותו הבדל באורך. לפי חוק פכנר –","o":["ההבדל הפיזיקלי זהה בשני הזוגות","ההבדל הפיזיקלי בזוג הקווים הארוכים גדול יותר","ההבדל הפיזיקלי בזוג הקווים הקצרים גדול יותר","לא ניתן לדעת"],"a":1,"e":"כדי לייצר אותה תחושת הבדל בעוצמות גבוהות נדרש הבדל פיזיקלי גדול יותר."},{"q":"האצנו מ-20 ל-30 קמ\"ש. לפי חוק פכנר, לאיזו מהירות צריך להאיץ מ-80 קמ\"ש כדי לחוש אותו שינוי?","o":["90 קמ\"ש","100 קמ\"ש","120 קמ\"ש","160 קמ\"ש"],"a":2,"e":"צריך אותו יחס: 30/20 = 1.5, ו-80 × 1.5 = 120."},{"q":"לפי חוק פכנר, באיזה מבין זוגות המשקלים הבאים תחושת ההבדל הגדולה ביותר?","o":["20 ו-40","3 ו-9","100 ו-150","4 ו-6"],"a":1,"e":"תחושת ההבדל נקבעת ביחס העוצמות: 3→9 פי 3, 20→40 פי 2, 100→150 ו-4→6 פי 1.5."},{"q":"מהו אחד הקשיים בחוק פכנר?","o":["הוא אינו מתייחס לסף המוחלט","הוא נוקשה מדי, כי הוא מייחס לכל התחושות התקהות כשהגירוי מתחזק, אבל בכאב נראה שהרגישות דווקא גדלה","הוא מתאים רק לראייה","הוא אינו משתמש בקבוע ובר"],"a":1,"e":"בכאב אנו רגישים יותר לעלייה ככל שהכאב גדל. גם ההנחה שכל JND שווה בתחושה נראתה לחלק מהחוקרים לא סבירה."},{"q":"על איזו הנחה (של אקמן) התבסס סטיבנס, בנוסף לחוק ובר?","o":["תחושת ההבדל המזערי קבועה תמיד וגודלה 1","גם בתחושות, תחושת ההבדל המינימלי היא יחסית לעוצמת התחושה שלפני השינוי","אין סף מוחלט","התחושה אינה תלויה בגירוי"],"a":1,"e":"פכנר הניח הבדל תחושתי קבוע. אקמן הניח הבדל תחושתי יחסי, ומשני החוקים פיתח סטיבנס את חוקו."},{"q":"מהי הנוסחה של חוק סטיבנס?","o":["S = A·log(I/I₀)","JND = K·I","S = A·I^b","S = A + b·I"],"a":2,"e":"חוק חזקה: כשהגירוי גדל פי X, התחושה גדלה פי X בחזקת b."},{"q":"לפי חוק סטיבנס, ממד שבו b>1 נקרא –","o":["ממד דוחס","ממד מנפח","ממד פרופורציונלי","ממד לוגריתמי"],"a":1,"e":"b>1 הוא ממד מנפח, b=1 הוא פרופורציונלי ו-b<1 הוא דוחס."},{"q":"בממד שבו b=2, עוצמת הגירוי גדלה פי 3. פי כמה תגדל עוצמת התחושה?","o":["פי 3","פי 6","פי 9","פי 1.5"],"a":2,"e":"3 בחזקת 2 = 9. בממד מנפח השינוי היחסי בתחושה גדול מהשינוי היחסי בגירוי."},{"q":"בממד שבו b=½, עוצמת הגירוי גדלה פי 16. פי כמה תגדל עוצמת התחושה?","o":["פי 4","פי 8","פי 16","פי 32"],"a":0,"e":"16 בחזקת ½ = 4. בממד דוחס השינוי היחסי בתחושה קטן מזה של הגירוי."},{"q":"לתחושת מליחות b=1.4. השוו בין הגדלת המלח מ-30 ל-40 לבין הגדלתו מ-200 ל-210:","o":["התוספת ל-30 תורגש כגדולה יותר","התוספת ל-30 תורגש כקטנה יותר","שתי התוספות יורגשו כשוות","לא ניתן לדעת"],"a":1,"e":"בממד מנפח התחושה גדלה בקצב הולך ומתגבר, ולכן אותה תוספת מורגשת יותר בעוצמה גבוהה."},{"q":"לעוצמת קול b=0.67. השוו בין הגדלת העוצמה מ-30 ל-40 לבין הגדלתה מ-200 ל-210:","o":["התוספת ל-30 תורגש כגדולה יותר","התוספת ל-30 תורגש כקטנה יותר","שתי התוספות יורגשו כשוות","לא ניתן לדעת"],"a":0,"e":"בממד דוחס קצב עליית התחושה מתמתן, ולכן התוספת מורגשת יותר בעוצמה נמוכה."},{"q":"נמצא שתפיסת אורך קווים היא ממד מנפח. ההבדל בין קווים באורך 100 ו-110 ס\"מ ייתפס כ_____ ההבדל בין קווים באורך 10 ו-20 ס\"מ. מהי ההשלמה הנכונה?","o":["שווה ל-","גדול מ-","קטן מ-","לא ניתן לדעת מהנתונים"],"a":3,"e":"ההפרש זהה (10 ס\"מ), אבל יחס העוצמות שונה מאוד (1.1 לעומת 2). בלי ערך b אי אפשר לקבוע. זו שאלה מהמבחן לדוגמה."},{"q":"באיזה סוג ממד, לפי חוק סטיבנס, הרגישות להבדל הולכת וגדלה ככל שהגירוי גדל?","o":["ממד דוחס","ממד פרופורציונלי","ממד מנפח","בכל הממדים"],"a":2,"e":"בממד מנפח קצב עליית התחושה גדל. בממד דוחס הוא קטן, ובממד פרופורציונלי הוא קבוע. בכל הממדים התחושה עצמה תמיד עולה."}],"hard":[{"q":"קבוע ובר למשקל הוא 0.02. אדם מחזיק 2 ק\"ג ומוסיפים לו 30 גרם. אחר כך הוא מחזיק 500 גרם ומוסיפים לו 15 גרם. באיזה מקרה ירגיש בתוספת?","o":["בשני המקרים","רק במקרה של 500 גרם","רק במקרה של 2 ק\"ג","באף אחד מהם"],"a":1,"e":"JND ל-2000 גרם = 40 גרם, ו-30 גרם קטן ממנו. JND ל-500 גרם = 10 גרם, ו-15 גרם גדול ממנו."},{"q":"לפי חוק פכנר, איזה זוג גירויים ייצור את אותה תחושת הבדל כמו הזוג 40 ו-60?","o":["100 ו-120","100 ו-150","100 ו-160","60 ו-80"],"a":1,"e":"נדרש אותו יחס: 60/40 = 1.5, ולכן 100 ו-150."},{"q":"בממד שבו b=0.5, הגירוי גדל מ-25 ל-100. פי כמה תגדל התחושה, ואיזה סוג ממד זה?","o":["פי 4, ממד פרופורציונלי","פי 2, ממד דוחס","פי 16, ממד מנפח","פי 2, ממד מנפח"],"a":1,"e":"יחס הגירוי הוא 4, ו-4 בחזקת 0.5 = 2. b<1 הוא ממד דוחס."},{"q":"מה ההבדל המהותי בין ההנחה של פכנר להנחה של אקמן, שעליה התבסס סטיבנס?","o":["פכנר הניח שה-JND יחסי לגירוי, ואקמן לא","פכנר הניח שתחושת ההבדל המזערי קבועה (יחידה 1), ואקמן הניח שגם היא יחסית לעוצמת התחושה הקודמת","שניהם הניחו אותו דבר","אקמן דחה את חוק ובר"],"a":1,"e":"שניהם קיבלו את חוק ובר. ההבדל הוא בהנחה על צד התחושה, ולכן התקבלו חוק לוגריתמי (פכנר) וחוק חזקה (סטיבנס)."},{"q":"איזה ממד של סטיבנס מתאר את הקושי של חוק פכנר לגבי כאב?","o":["ממד דוחס","ממד מנפח, שבו הרגישות לשינוי גדלה ככל שהגירוי גדל","ממד פרופורציונלי","אף ממד"],"a":1,"e":"בכאב נראה שהרגישות גדלה עם העוצמה. פכנר מנבא תמיד התקהות, כמו ממד דוחס."},{"q":"נבדק מבחין בהבדל של 5 יחידות כשהגירוי הוא 100, ובהבדל של 5 יחידות גם כשהגירוי הוא 400. מה אפשר להסיק?","o":["חוק ובר מתקיים במלואו","הממצא סותר את חוק ובר, שלפיו ה-JND היה צריך לגדול פי 4 בגירוי 400","קבוע ובר גדל","הממצא תומך בחוק פכנר"],"a":1,"e":"לפי ובר, JND = K·I, ולכן בגירוי גדול פי 4 ה-JND אמור להיות גדול פי 4."},{"q":"לפי חוק סטיבנס, בממד פרופורציונלי (b=1), איך תורגש תוספת של 10 לגירוי 30, לעומת תוספת של 10 לגירוי 200?","o":["התוספת ל-30 תורגש כגדולה יותר","התוספת ל-200 תורגש כגדולה יותר","שתיהן יורגשו כשוות, כי התחושה גדלה בקצב קבוע","לא ניתן לדעת"],"a":2,"e":"זה ההבדל המעניין מפכנר: בממד פרופורציונלי, הפרש פיזיקלי שווה נותן הפרש תחושתי שווה."},{"q":"מדוע אי אפשר להשתמש בחוק ובר לבדו כדי לנבא כמה \"חזק\" יורגש גירוי?","o":["כי חוק ובר עוסק רק בשמיעה","כי חוק ובר מתאר רק את גודל ההבדל המינימלי (JND) ביחס לעוצמת הגירוי, ואינו כולל שום מרכיב של עוצמת התחושה","כי קבוע ובר משתנה","כי חוק ובר לוגריתמי"],"a":1,"e":"לכן הוא אינו חוק פסיכופיזי. פכנר וסטיבנס הוסיפו הנחות על צד התחושה."},{"q":"בשני ממדים חושיים הגירוי הוכפל. בממד א' התחושה גדלה פי 1.4, ובממד ב' פי 2.8. מה ניתן לומר על b בכל ממד?","o":["בא' b>1 ובב' b<1","בא' b<1 (דוחס) ובב' b>1 (מנפח)","בשניהם b=1","לא ניתן לדעת"],"a":1,"e":"2 בחזקת b = 1.4 נותן b≈0.5. 2 בחזקת b = 2.8 נותן b≈1.5."},{"q":"חוקר מוצא שבממד מסוים, זוגות גירויים עם אותו יחס עוצמות (10 ו-20, 100 ו-200) מורגשים כבעלי אותה תחושת הבדל. באיזה חוק הממצא תומך?","o":["בחוק פכנר, שלפיו יחס קבוע בגירוי נותן הפרש קבוע בתחושה","בממד מנפח של סטיבנס","בחוק ובר בלבד","באף חוק"],"a":0,"e":"זו בדיוק מסקנה 2 של פכנר: התחושה רגישה ליחס העוצמות ולא להפרש."}]},{"id":"p4","book":"הספר הלבן – נושאים נבחרים בחקר התפיסה","title":"פרק 4: תורת גילוי אותות (פסיכופיזיקה מודרנית)","questions":[{"q":"מה הייתה הבעיה שהובילה לפיתוח תורת גילוי אותות?","o":["אי אפשר למדוד גירויים פיזיקליים","גורמים חוץ-תפיסתיים (כמו פרס או שמרנות) משפיעים על מדידת הסף המוחלט וסף ההבדל","הנבדקים לא הבינו את ההוראות","חוק ובר לא היה מדויק"],"a":1,"e":"למשל, פרס על גילוי מוריד את הסף שנמדד, ולנבדקים שמרנים יש סף גבוה יותר מאשר לליברליים."},{"q":"כיצד התייחסה תורת גילוי אותות להשפעת הגורמים החוץ-תפיסתיים, בשונה מהפסיכופיזיקה הקלאסית?","o":["ניסתה לבטל אותה בשיטות מדידה","טענה שהשפעה זו היא חלק מובנה מתהליך הגילוי, ושיש להפריד בינה לבין השפעת הגורמים התפיסתיים","התעלמה ממנה לחלוטין","טענה שאין השפעה כזו"],"a":1,"e":"הפסיכופיזיקה הקלאסית ניסתה לסלק את ההשפעה. תורת גילוי אותות מכמתת אותה בנפרד."},{"q":"לפי תורת גילוי אותות, גילוי גירוי חלש הוא –","o":["תהליך אוטומטי שאין בו החלטה","תהליך החלטה (לא מודע) שבו האדם מחליט אם התחושה שהוא חש היא של הגירוי","תהליך מודע לחלוטין","תהליך שתלוי רק בעוצמת הגירוי"],"a":1,"e":"התחושה שקלט גירוי היא תוצר של החלטה, וההחלטה מושפעת מגורמים תפיסתיים וחוץ-תפיסתיים."},{"q":"הוצג גירוי והנבדק ענה \"כן\". זוהי –","o":["פגיעה (hit)","אזעקת שווא (false alarm)","החטאה (miss)","דחייה נכונה (correct rejection)"],"a":0,"e":"היה גירוי, והנבדק גילה אותו: פגיעה."},{"q":"לא הוצג גירוי והנבדק ענה \"כן\". זוהי –","o":["פגיעה","אזעקת שווא","החטאה","דחייה נכונה"],"a":1,"e":"אין גירוי, אבל הנבדק אמר שיש: אזעקת שווא."},{"q":"הוצג גירוי והנבדק ענה \"לא\". זוהי –","o":["פגיעה","אזעקת שווא","החטאה","דחייה נכונה"],"a":2,"e":"היה גירוי, והנבדק לא גילה אותו: החטאה."},{"q":"איזה צירוף אחוזים תמיד מסתכם ל-100%?","o":["פגיעות + אזעקות שווא","פגיעות + החטאות","החטאות + דחיות נכונות","פגיעות + דחיות נכונות"],"a":1,"e":"כשיש גירוי, התגובות הן פגיעה או החטאה (שורה אחת). כשאין גירוי: אזעקת שווא + דחייה נכונה = 100%."},{"q":"מהן שתי ההתפלגויות שמניחה תורת גילוי אותות?","o":["התפלגות הפגיעות והתפלגות ההחטאות","התפלגות עוצמות התחושה ברעש בלבד, והתפלגות עוצמות התחושה בגירוי + רעש","התפלגות זמני התגובה והתפלגות הדיוק","התפלגות הגירויים החזקים והחלשים"],"a":1,"e":"שתי התפלגויות הסתברות של עוצמות תחושה שחופפות זו לזו, ולכן יש אי-ודאות בהחלטה."},{"q":"במשל המגבעת (חלק מהאנשים חובשים מגבעת של 20 ס\"מ), מהי ההחלטה המיטבית לפי הגובה הכולל?","o":["לנחש באופן מקרי","לקבוע קריטריון גובה: מעליו נחליט שיש מגבעת, ומתחתיו שאין","להחליט תמיד שיש מגבעת","להחליט תמיד שאין מגבעת"],"a":1,"e":"ככל שהגובה גדול יותר, סביר יותר שיש מגבעת. קריטריון הוא מעין ניחוש מושכל, ועדיין יש טעויות בגלל החפיפה."},{"q":"מהו קריטריון ההחלטה בתורת גילוי אותות?","o":["עוצמת הגירוי הפיזיקלית","עוצמת התחושה שכל עוצמה מעליה תתפרש כגירוי","מספר הניסיונות בניסוי","המרחק בין ממוצעי ההתפלגויות"],"a":1,"e":"הקריטריון הוא סף פנימי (לא מודע) של עוצמת תחושה. מעליו התגובה היא \"כן\"."},{"q":"קריטריון נמוך (מקל) מבטא –","o":["הטיית תגובה ל\"לא\"","הטיית תגובה ל\"כן\"","רגישות גבוהה","רגישות נמוכה"],"a":1,"e":"קריטריון נמוך פירושו נטייה מראש לגלות גירוי. קריטריון גבוה פירושו נטייה לא לגלות."},{"q":"כשהקריטריון עולה (ללא שינוי ברגישות) –","o":["פגיעות ואזעקות שווא עולות","פגיעות ואזעקות שווא יורדות, והחטאות ודחיות נכונות עולות","רק הפגיעות עולות","רק אזעקות השווא עולות"],"a":1,"e":"קריטריון גבוה מוביל ליותר תשובות \"לא\" ולפחות תשובות \"כן\"."},{"q":"נבדק בניסוי גילוי אותות רוצה להרשים ביכולתו לאתר אותות בכל פעם שהם מופיעים, אפילו במחיר של טעויות. למה ניתן לצפות?","o":["שהקריטריון שלו יהיה נמוך","שהרגישות שלו תהיה גבוהה","שהקריטריון שלו יהיה גבוה","שהרגישות שלו תהיה נמוכה"],"a":0,"e":"מוטיבציה היא גורם חוץ-תפיסתי שמשפיע על הקריטריון, לא על הרגישות. כדי למקסם פגיעות הוא יוריד את הקריטריון."},{"q":"באיזה מקרה כדאי לנבדק לאמץ קריטריון נמוך יותר?","o":["כשיש עונש כבד על אזעקות שווא","כשיש עונש כבד על החטאות","כשהנבדק יודע שהסיכוי שיופיע אות נמוך","כשאחוז הפגיעות שלו עד כה היה 100%"],"a":1,"e":"כשהנזק מהחטאה גדול יותר, עדיף קריטריון נמוך, במחיר של יותר אזעקות שווא."},{"q":"מתי עדיף קריטריון גבוה?","o":["כשמצפים שיופיע גירוי","כשחוששים מעונש על החטאות","כשלא מצפים שיופיע גירוי, או כשחוששים מעונש על אזעקות שווא","כשהרגישות גבוהה"],"a":2,"e":"קריטריון גבוה מצמצם אזעקות שווא, במחיר של יותר החטאות."},{"q":"איזה גורמים קובעים את גובה הקריטריון?","o":["עוצמת הגירוי ועוצמת הרעש","גורמים חוץ-תפיסתיים: ידע, ציפיות ומוטיבציה","חדות מערכת התפיסה","גודל האישון"],"a":1,"e":"הקריטריון (β) מושפע מגורמים לא תפיסתיים. הרגישות (d') מושפעת מגורמים תפיסתיים."},{"q":"מה מייצגת הרגישות התפיסתית בגרף ההתפלגויות?","o":["את גובה הקריטריון","את המרחק בין התפלגות הרעש להתפלגות הגירוי + רעש, כלומר את מידת ההבחנה ביניהן","את אחוז הפגיעות בלבד","את שטח ההחטאות"],"a":1,"e":"ככל שהמרחק גדול יותר והחפיפה קטנה יותר, הרגישות גבוהה יותר."},{"q":"איזה גורמים משפיעים על גובה הרגישות?","o":["ציפיות ומוטיבציה","תגמולים ועונשים","עוצמת הגירוי, עוצמת הרעש וחדות מערכת התפיסה של הנבדק","הוראות הנסיין"],"a":2,"e":"אלה גורמים תפיסתיים."},{"q":"מה קורה כשהרגישות עולה (ללא שינוי בקריטריון)?","o":["יותר תשובות \"כן\" מכל הסוגים","אחוזי התשובות הנכונות עולים ואחוזי השגיאות יורדים, ולכן ההפרש בין פגיעות לאזעקות שווא גדל","רק אזעקות השווא עולות","אין שינוי בתשובות"],"a":1,"e":"שני \"זנבות\" הטעות (החטאות ואזעקות שווא) קטנים."},{"q":"נבדק עם רגישות מושלמת יקבל –","o":["50% פגיעות ו-50% אזעקות שווא","100% פגיעות ו-0% אזעקות שווא","0% פגיעות ו-100% דחיות נכונות","100% פגיעות ו-100% אזעקות שווא"],"a":1,"e":"כשההתפלגויות נפרדות לגמרי, ההפרש בין פגיעות לאזעקות שווא מקסימלי: 100%."},{"q":"מה מאפיין התפלגות תגובות כשהרגישות לגירוי היא 0?","o":["אחוז הפגיעות שווה לאחוז אזעקות השווא","אחוז הפגיעות הוא 100%","אין אזעקות שווא","אחוז ההחטאות הוא 0%"],"a":0,"e":"בהעדר רגישות ההתפלגויות חופפות, ולכן התגובות זהות כשיש גירוי וכשאין (למשל 87% פגיעות ו-87% אזעקות שווא)."},{"q":"כיצד מחושב מדד β?","o":["המרחק בין ממוצעי ההתפלגויות ביחידות סטיית תקן","גובה התפלגות הגירוי + רעש חלקי גובה התפלגות הרעש, בנקודה שבה ממוקם הקריטריון","אחוז הפגיעות פחות אחוז אזעקות השווא","אחוז ההחטאות חלקי אחוז הפגיעות"],"a":1,"e":"β הוא יחס ההסתברויות של עוצמת התחושה שבקריטריון: כשיש גירוי לעומת כשאין."},{"q":"מה מיוחד בקריטריון שבו β=1?","o":["הוא ממקסם את אחוז אזעקות השווא","הוא ממוקם בנקודת החיתוך של ההתפלגויות, הוא מאוזן, והוא ממקסם את סך אחוזי התגובות הנכונות","הוא ממקסם את אחוז הפגיעות","הוא מבטל את הרגישות"],"a":1,"e":"ב-β=1: % פגיעות = % דחיות נכונות, ו-% אזעקות שווא = % החטאות."},{"q":"הודיעו לנבדק שברוב צעדי הניסוי יופיע גירוי. מה סביר לגבי ה-β שלו?","o":["β=1","β>1","β<1","β אינו מושפע"],"a":2,"e":"ציפייה לגירוי מטה את התגובה ל\"כן\", ולכן הקריטריון יורד (β<1) ואחוז הפגיעות עולה."},{"q":"מהו d'?","o":["מדד הקריטריון","המרחק בין ממוצעי שתי ההתפלגויות ביחידות של סטיות תקן","אחוז הפגיעות","היחס בין פגיעות להחטאות"],"a":1,"e":"d' הוא מדד הרגישות התפיסתית (בהנחה שסטיית התקן זהה בשתי ההתפלגויות)."},{"q":"אחותו של בארט מגבירה את הטלוויזיה. מה יקרה ליכולתו לגלות את צלצול הטלפון?","o":["הקריטריון שלו ירד","הרגישות שלו תקטן, כי עוצמת הרעש היא גורם תפיסתי","הקריטריון שלו יעלה","הרגישות שלו תגדל"],"a":1,"e":"רעש הוא גורם תפיסתי שמקטין את d', ולכן יהיה פחות הבדל בין פגיעות לאזעקות שווא."},{"q":"בארט ממתין לנציג הלוטו שיביא לו צ'ק זכייה. מה יקרה ליכולתו לגלות דפיקה בדלת?","o":["הרגישות שלו תגדל","הקריטריון שלו לגילוי ירד, ויהיו יותר פגיעות ויותר אזעקות שווא","הקריטריון שלו יעלה","הרגישות שלו תקטן"],"a":1,"e":"ציפייה היא גורם חוץ-תפיסתי שמוריד את הקריטריון."},{"q":"יוסי, מפעיל רדאר, הזניק מטוסים לשווא כמה פעמים והוענש בחומרה. מה יקרה לתגובותיו?","o":["הקריטריון שלו ירד","הרגישות שלו תעלה","הקריטריון שלו יעלה: פחות פגיעות ואזעקות שווא, ויותר החטאות ודחיות נכונות","לא ישתנה דבר"],"a":2,"e":"חשש מאזעקות שווא מעלה את הקריטריון."},{"q":"האם נבדק יכול להקטין בו-זמנית את אחוזי שני סוגי הטעויות (החטאות ואזעקות שווא) על ידי שינוי הקריטריון בלבד?","o":["כן, בהורדת הקריטריון","כן, בהעלאת הקריטריון","לא. שינוי קריטריון מקטין טעות אחת על חשבון השנייה, ורק עלייה ברגישות מקטינה את שתיהן","כן, בקביעת β=1"],"a":2,"e":"הורדת הקריטריון מקטינה החטאות ומגדילה אזעקות שווא, והעלאתו עושה את ההפך. רק d' גבוה יותר מקטין את שתי הטעויות."},{"q":"מהי התרומה הכללית של תורת גילוי אותות?","o":["היא הוכיחה שאין גורמים חוץ-תפיסתיים","ההבחנה בין גורמי רגישות לגורמי קריטריון רלוונטית לתהליכים פסיכולוגיים רבים, ומאפשרת לבחון מה משתנה בין מצבים ובין אנשים","היא החליפה את חוק ובר","היא מתאימה רק לשמיעה"],"a":1,"e":"ניתן לשאול בכל תהליך אם השתנתה הרגישות או קריטריון התגובה."}],"hard":[{"q":"שני רדיולוגים מתבקשים לזהות גידול בצילומים. לשניהם אותו אחוז פגיעות (80%), אבל לרדיולוג א' 10% אזעקות שווא ולב' 40%. מה ניתן להסיק?","o":["לשניהם אותה רגישות","לרדיולוג א' רגישות (d') גבוהה יותר, כי ההפרש בין פגיעות לאזעקות שווא גדול יותר אצלו","לרדיולוג ב' רגישות גבוהה יותר","ההבדל הוא רק בקריטריון"],"a":1,"e":"באותו אחוז פגיעות, פחות אזעקות שווא מעיד על הפרדה טובה יותר בין ההתפלגויות."},{"q":"נבדק עבר מ-60% פגיעות ו-20% אזעקות שווא ל-80% פגיעות ו-40% אזעקות שווא. מה הסבר סביר?","o":["הרגישות שלו עלתה","הקריטריון שלו ירד, והרגישות כנראה לא השתנתה","הרגישות שלו ירדה","הקריטריון שלו עלה"],"a":1,"e":"שני סוגי תשובות ה\"כן\" עלו בכ-20%, וההפרש ביניהם נשאר כ-40%. זה דפוס של הורדת קריטריון."},{"q":"איזה שינוי יעלה את d' ולא ישנה את β?","o":["הבטחת פרס על כל פגיעה","הגברת עוצמת הגירוי, כשההוראות והתגמולים נשארים זהים","הודעה שהגירוי יופיע ברוב הצעדים","עונש על אזעקות שווא"],"a":1,"e":"עוצמת גירוי היא גורם תפיסתי. כל השאר הם גורמים חוץ-תפיסתיים שמשנים את הקריטריון."},{"q":"מערכת אזעקה ביתית מצלצלת לעיתים קרובות בלי פריצה. החברה מעלה את סף ההפעלה. מה צפוי?","o":["פחות אזעקות שווא ופחות החטאות","פחות אזעקות שווא, אבל יותר החטאות (פריצות שלא יזוהו)","יותר פגיעות","הרגישות תעלה"],"a":1,"e":"העלאת קריטריון מזיזה תשובות מ\"כן\" ל\"לא\", ומקטינה טעות אחת על חשבון השנייה."},{"q":"נבדק בעל רגישות 0 מגיב \"כן\" ב-30% מהצעדים שבהם הוצג גירוי. כמה אזעקות שווא יהיו לו, בערך?","o":["0%","30%","70%","100%"],"a":1,"e":"בהעדר רגישות, אחוז ה\"כן\" זהה כשיש גירוי וכשאין."},{"q":"בניסוי, 90% מהצעדים כוללים גירוי. מה יעשה נבדק אופטימלי כדי למקסם את מספר התגובות הנכונות?","o":["יקבע β=1","יקבע β<1 (קריטריון נמוך), כי רוב הצעדים כוללים גירוי","יקבע β>1","יענה \"לא\" תמיד"],"a":1,"e":"β=1 ממקסם את אחוזי התגובות הנכונות, אבל כשהגירוי שכיח, הורדת הקריטריון מגדילה את כמות התגובות הנכונות בסך הכול."},{"q":"חוקרת טוענת שתרופה משפרת את היכולת לשמוע צלילים חלשים. היא מראה שאחוז הפגיעות עלה מ-60% ל-85%. מה חסר כדי לבסס את הטענה?","o":["כלום, זה מספיק","נתוני אזעקות השווא: אם גם הם עלו באותה מידה, ייתכן שהתרופה רק הורידה את הקריטריון","מספר הנבדקים בלבד","זמני התגובה"],"a":1,"e":"עלייה בפגיעות לבדה יכולה לנבוע משינוי קריטריון. רק השוואה לאזעקות שווא מבחינה בין רגישות לקריטריון."},{"q":"מה ההבדל בין שינוי ב-d' לבין שינוי ב-β, מבחינת מה שקורה לגרף ההתפלגויות?","o":["שינוי d' מזיז את קו הקריטריון, ושינוי β מזיז את ההתפלגויות","שינוי d' משנה את המרחק בין שתי ההתפלגויות, ושינוי β מזיז את קו הקריטריון לאורך ציר עוצמות התחושה","שניהם משנים את רוחב ההתפלגויות","אין הבדל"],"a":1,"e":"הרגישות קשורה למיקום ההתפלגויות, והקריטריון למיקום הקו שחותך אותן."},{"q":"נבדק תשוש מאוד מבצע מטלת גילוי. אחוז הפגיעות שלו ירד ואחוז אזעקות השווא שלו עלה. מה הפרשנות הסבירה?","o":["שינוי בקריטריון בלבד","ירידה ברגישות: ההתפלגויות התקרבו, ולכן שני סוגי הטעויות גדלו","עלייה ברגישות","אין שינוי"],"a":1,"e":"כשפגיעות יורדות ואזעקות שווא עולות, ההפרש קטן. זה דפוס של ירידה ברגישות, ולא של הזזת קריטריון."},{"q":"במשל המגבעת, אם מוסיפים לכל אדם עם מגבעת עוד 20 ס\"מ (מגבעת של 40 ס\"מ), מה ישתנה?","o":["הקריטריון בלבד","הרגישות תעלה, כי ההתפלגויות יתרחקו זו מזו ויחפפו פחות","הרגישות תרד","שום דבר"],"a":1,"e":"עוצמת \"האות\" גדלה, וזה גורם תפיסתי שמגדיל את d'."}]},{"id":"c4","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 4: קשב","questions":[{"q":"במטלת האזנה דיכוטית הנבדקים מתבקשים \"להצליל\". מה פירוש הדבר?","o":["לחזור בקול על כל מילה שמושמעת באוזן הקשובה, תוך התעלמות מהאוזן השנייה","לזכור את שני המסרים","לכתוב את המסר מהאוזן הלא קשובה","להשוות בין קולות הדוברים"],"a":0,"e":"הצללה היא חזרה בקול על המסר באוזן הקשובה."},{"q":"מה מצא צ'רי (1953) לגבי המסר באוזן הלא קשובה?","o":["הנבדקים דיווחו על כל המילים","הנבדקים הצליחו לדווח על מאפיינים פיזיקליים, כמו אם הדובר גבר או אישה, אבל לא על המילים והתוכן","הנבדקים לא דיווחו על שום מאפיין","הנבדקים דיווחו רק על משמעות המסר"],"a":1,"e":"המאפיינים הפיזיקליים נקלטו, התוכן לא נקלט."},{"q":"מהו \"אפקט מסיבת הקוקטייל\"?","o":["היכולת לשמוע שני דוברים בבת אחת באותה רמה","היכולת להתמקד בדובר אחד ולסנן אחרים, כשלעיתים נקלט בכל זאת מידע מהערוצים הלא קשובים, כמו השם שלנו","חוסר היכולת לשמוע ברעש","עיוורון לשינויים בזמן שיחה"],"a":1,"e":"סלקטיביות קשבית, שמלווה ביכולת קליטה מסוימת מהערוצים הלא קשובים."},{"q":"לפי מודל הפילטר של ברודבנט (1958), לפי מה מסנן הפילטר?","o":["לפי משמעות המסר","לפי מאפיינים פיזיקליים","לפי חשיבות המילים","לפי שכיחות המילים"],"a":1,"e":"זהו מודל של סלקציה מוקדמת. רק המסר הקשוב מגיע לגלאי שמעבד משמעות."},{"q":"איזה ממצא עמד בניגוד למודל הסלקציה המוקדמת של ברודבנט?","o":["הנבדקים זיהו את מין הדובר באוזן הלא קשובה","כשליש מהנבדקים זיהו את שמם במסר הלא קשוב (מוריי, 1959)","הנבדקים הצליחו להצליל","הנבדקים לא זכרו את המסר הלא קשוב"],"a":1,"e":"לפי ברודבנט המסר הלא קשוב מסונן לפני עיבוד המשמעות, ולכן היה צפוי שלא יזהו את שמם."},{"q":"במה שונה מודל המחלש של טריזמן (1964) ממודל הפילטר של ברודבנט?","o":["המסר הלא קשוב נחסם לגמרי","המסר הלא קשוב מוחלש ולא נחסם, ומילים חשובות או שכיחות עם סף הפעלה נמוך עשויות להיות מזוהות","אין סלקציה כלל","הסלקציה מתרחשת אחרי המודעות"],"a":1,"e":"ליחידת המילון יש ספי הפעלה. מילים חשובות ושכיחות בעלות סף נמוך עוברות אותו גם כשהן מוחלשות."},{"q":"לפי מודל המחלש, מדוע אדם עשוי לשמוע את שמו מהערוץ הלא קשוב?","o":["כי השם אינו מוחלש","כי לשם יש סף הפעלה נמוך ביחידת המילון, ולכן הוא מזוהה גם כשהוא מוחלש","כי השם מעובד לפני המחלש","כי הפילטר עובד לפי משמעות"],"a":1,"e":"מילים חשובות לאדם הן בעלות סף זיהוי נמוך."},{"q":"בניסוי של מקיי (1973), מילה באוזן הלא קשובה (\"מחשב\") השפיעה על הבנת מילה דו-משמעית (\"עכבר\") באוזן הקשובה. מה הייתה המשמעות?","o":["המילה הלא קשובה לא עובדה כלל","משמעות המילה הלא קשובה עובדה והטתה את ההבנה, אף שלא הייתה חשובה או שכיחה והנבדקים לא היו מודעים לה","הנבדקים זכרו את המילה הלא קשובה","הנבדקים בחרו באקראי"],"a":1,"e":"הממצא תומך בסלקציה מאוחרת: עיבוד סמנטי מתרחש גם בלי קשב ובלי מודעות."},{"q":"לפי מודלי הסלקציה המאוחרת (דויטש ודויטש, 1963; נורמן, 1968) –","o":["עיבוד המשמעות מתבצע רק למסר הקשוב","עיבוד המשמעות הוא קדם-קשבי ונעשה לכל המסרים, והסלקציה שאחריו קובעת מה יגיע למודעות, לזיכרון ולתגובה","אין עיבוד סמנטי כלל","הסלקציה מתבצעת לפי מאפיינים פיזיקליים"],"a":1,"e":"הסלקציה מגיעה לאחר העיבוד הסמנטי, ובוררת את המילים הקשובות ואת המילים הלא קשובות שרלוונטיות לנו."},{"q":"לפי תיאוריית העומס התפיסתי של לביא, מהי \"קיבולת עיבוד\"?","o":["כמות המידע שניתן לעבד בו-זמנית ברגע נתון","כמות המידע בזיכרון לטווח ארוך","מהירות התגובה","מספר המסיחים בתצוגה"],"a":0,"e":"קיבולת עיבוד היא כמות המשאבים שעומדת לרשותנו לעיבוד בו-זמני."},{"q":"בניסוי של פורסטר ולביא (2008), מה היה המשתנה הבלתי תלוי בחלק א'?","o":["זמן התגובה","מידת העומס התפיסתי (נמוך או גבוה)","קיום דמות מצוירת מסיחה","צבע האותיות"],"a":1,"e":"המשתנה התלוי היה זמן התגובה לזיהוי X או N במעגל האותיות."},{"q":"בחלק ב' של ניסוי פורסטר ולביא נוספה דמות מצוירת מסיחה. מה נמצא?","o":["הדמות האריכה את זמן התגובה יותר בתנאי העומס הגבוה","הדמות האריכה את זמן התגובה יותר בתנאי העומס הנמוך","לדמות לא הייתה השפעה","הדמות קיצרה את זמן התגובה"],"a":1,"e":"בעומס נמוך נשארת קיבולת פנויה, ולכן הגירוי הלא רלוונטי מעובד ומסיח."},{"q":"לפי תיאוריית העומס התפיסתי, מתי גירויים לא רלוונטיים לא יסיחו אותנו?","o":["במטלות עם עומס תפיסתי נמוך","במטלות עם עומס תפיסתי גבוה, שמנצלות את כל קיבולת העיבוד","תמיד","כשהגירויים חשובים"],"a":1,"e":"בעומס גבוה לא נשארת קיבולת פנויה לעיבוד הגירויים הלא קשובים."},{"q":"מהי ההגדרה של אפקט סטרופ?","o":["זמן התגובה לקריאת מילה ארוך יותר בתנאי התואם","זמן התגובה לשיום הצבע שבו כתובה המילה קצר יותר בתנאי התואם מאשר בתנאי הלא תואם","הנבדקים אינם מסוגלים לשיים צבעים","זמן התגובה זהה בשני התנאים"],"a":1,"e":"בתנאי הלא תואם (המילה \"אדום\" בצבע ירוק) קריאת המילה מתנגשת עם שיום הצבע."},{"q":"מה ניתן ללמוד מאפקט סטרופ?","o":["שהקשב מסנן היטב את משמעות המילה","שמשמעות המילה, שאינה רלוונטית למשימה, מעובדת ומשפיעה, כלומר הקשב אינו חוסם אותה","שצבעים מעובדים לאט","שקריאה אינה אוטומטית"],"a":1,"e":"גירוי לא רלוונטי (משמעות המילה) מעובד ומאריך את זמן התגובה בתנאי הלא תואם."},{"q":"מה ההבדל בין קשב גלוי לקשב סמוי?","o":["קשב גלוי הוא שמיעתי וקשב סמוי הוא חזותי","קשב גלוי כולל הפניית מבט, וקשב סמוי הוא הפניית קשב ללא הפניית מבט","קשב סמוי מודע וקשב גלוי לא מודע","אין הבדל"],"a":1,"e":"בקשב סמוי רק הקשב החזותי עצמו משפיע על התפיסה."},{"q":"בניסוי של פוזנר (1978) בשיטת הרמז המקדים, מה מאפיין רק את התנאי התקף?","o":["הרמז מצביע לצד מסוים וגורם לנבדק להפנות לשם את הזרקור הקשבי","הרמז מצביע לצד מסוים, וגירוי המטרה מופיע בצד זה","הרמז מצביע לצד מסוים, וגירוי המטרה מופיע בצד ההפוך","הרמז אינו מופיע"],"a":1,"e":"הפניית הקשב לצד הרמז מתרחשת בשני התנאים. רק בתנאי התקף המטרה מופיעה בצד שהרמז מצביע עליו (80% מהצעדים)."},{"q":"כיצד וידאו בניסוי של פוזנר שהנבדקים אינם מזיזים את עיניהם?","o":["קשרו את ראשם","קיבעו את מבטם בסימן פיקסציה, והרמז וגירוי המטרה הוצגו מהר מכדי שיספיקו להזיז את העיניים","ביקשו מהם לעצום עין אחת","הציגו את הגירויים במרכז בלבד"],"a":1,"e":"כך רק הקשב הסמוי יכול לזוז ולהשפיע."},{"q":"מה הייתה המסקנה מניסוי פוזנר?","o":["הקשב מופנה לעצמים ולא למיקומים","עיבוד הגירויים יעיל יותר באזור שאליו מופנה הקשב (\"הקשב כזרקור\")","לרמז אין השפעה","הנבדקים מגיבים מהר יותר בתנאי הלא תקף"],"a":1,"e":"זמן התגובה היה קצר יותר בתנאי התקף."},{"q":"בניסוי של אגלי ועמיתים (1994), מה הייתה שאלת המחקר התיאורטית?","o":["האם הקשב מופנה למיקום או לעצם","האם הקשב שמיעתי או חזותי","האם יש זיכרון איקוני","האם קיים אפקט סטרופ"],"a":0,"e":"גישה תלוית-מיקום (פוזנר) לעומת גישה תלוית-עצם (אגלי)."},{"q":"בניסוי של אגלי ועמיתים, מה היה \"יתרון אותו עצם\" מבחינת זמני התגובה?","o":["התגובה מהירה יותר כשהריבוע מופיע בקצה השני של המלבן שהוטרם, מאשר כשהוא מופיע במלבן שלא הוטרם באותו מרחק מהרמז","התגובה איטית יותר באותו מלבן","התגובה מהירה יותר במלבן שלא הוטרם","אין הבדל בין התנאים הלא תקפים"],"a":0,"e":"בתנאים הלא תקפים, B (באותו עצם) היה מהיר יותר מ-C (בעצם אחר), אף שהמרחק מהרמז שווה."},{"q":"מה המסקנה מ\"יתרון אותו עצם\"?","o":["הקשב מופנה רק למיקום מדויק","כשמפנים קשב למיקום בעצם, הקשב מתפשט לכל העצם","עצמים מסיחים את הקשב","הקשב מופנה רק לעצמים גדולים"],"a":1,"e":"הממצא תומך בגישה תלוית-עצם."},{"q":"בסרט של סיימונס ושאבריס (1999) נבדקים שספרו מסירות לא הבחינו בגורילה שחצתה את המגרש. איך נקראת התופעה?","o":["עיוורון לשינויים","עיוורון קשבי (Inattentional blindness)","חיבור אשלייתי","אפקט סטרופ"],"a":1,"e":"עיוורון קשבי הוא חוסר יכולת לתפוס גירוי בהעדר קשב."},{"q":"מה מצאו מחקרי העיוורון לשינויים (רנסינק ועמיתים, 1997)?","o":["נבדקים מזהים בקלות כל שינוי","ללא הפניית קשב לאזור השינוי, נבדקים מתקשים לזהות אותו, ועם הפניית קשב הם מבחינים בו הרבה יותר טוב","שינויים בצבע מזוהים תמיד","הקשב אינו משפיע על גילוי שינויים"],"a":1,"e":"תפיסת שינוי דורשת קשב לאזור השינוי."},{"q":"לפי תיאוריית אינטגרציית התכוניות של טריזמן, מה תפקיד הקשב החזותי?","o":["לחבר תכוניות","לסנן את התכוניות החשובות","לזהות תכוניות","לעבד את משמעות התכוניות"],"a":0,"e":"בשלב הקדם-קשבי התכוניות מנותחות בנפרד, ובשלב הקשב הממוקד הן מחוברות לעצם אחד."},{"q":"מהי \"בעיית האגידה\"?","o":["כיצד אנו זוכרים רשימות ארוכות","כיצד אנו מחברים את כל התכוניות של אותו עצם, למרות שכל סוג תכונית מעובד בנפרד במוח","כיצד אנו מסננים רעש","כיצד אנו מזיזים את העיניים"],"a":1,"e":"תיאוריית אינטגרציית התכוניות מציעה שהקשב הוא שפותר את בעיית האגידה."},{"q":"בניסוי החיבורים האשלייתיים של טריזמן ושמידט (1982), מה היו הטעויות העיקריות בדיווח הצורות?","o":["דיווח על תכוניות שלא הופיעו בתצוגה","חיבורים שגויים של תכוניות שהופיעו בתצוגה בצורות שונות, למשל משולש צהוב כשהיו משולש כחול ועיגול צהוב","טעויות בדיווח הספרות","לא היו טעויות כלל"],"a":1,"e":"ב-18% מהצעדים היו חיבורים אשלייתיים. דיווח על תכוניות שלא הופיעו כלל היה זניח."},{"q":"כיצד מסבירה תיאוריית אינטגרציית התכוניות את החיבורים האשלייתיים?","o":["התכוניות לא נקלטו כלל","בשלב הקדם-קשבי התכוניות נקלטות בנפרד ו\"מרחפות חופשי\", ובהעדר קשב מספיק הן מחוברות באופן שגוי","הזיכרון דועך מהר","הספרות הסיחו את הראייה"],"a":1,"e":"הקשב הופנה בעיקר לספרות, ולכן לא היה די קשב לחיבור נכון של התכוניות."},{"q":"בניסוי החיפוש החזותי של טריזמן, מה נמצא בחיפוש תכוניתי לעומת חיפוש חיבורי?","o":["בשניהם זמן התגובה גדל עם מספר הגירויים","בחיפוש תכוניתי זמן התגובה לא הושפע ממספר הגירויים, ובחיפוש חיבורי הוא גדל עם מספר הגירויים","בחיפוש חיבורי זמן התגובה לא הושפע ממספר הגירויים","בשניהם אין השפעה"],"a":1,"e":"חיפוש תכוניתי הוא קדם-קשבי ומקבילי. חיפוש חיבורי הוא קשבי וסדרתי, מיקום אחר מיקום."},{"q":"מה מאפיין את R.M., מטופל עם תסמונת בלינט (רובינסון ועמיתים, 1997)?","o":["הוא לא הצליח בחיפוש תכוניתי אבל הצליח בחיפוש חיבורי","הוא דיווח על חיבורים אשלייתיים ב-23% מהצעדים גם כשהביט בעצמים זמן רב, והצליח בחיפוש תכוניתי אבל לא בחיפוש חיבורי","הוא לא הראה שום קושי","היה לו קושי רק בשמיעה"],"a":1,"e":"פגיעה דו-צדדית באונה הקודקודית פוגעת ביכולת למקד קשב בעצמים, ולכן גם בחיבור התכוניות."}],"hard":[{"q":"באוזן הלא קשובה מושמעת המילה \"כסף\" בדיוק כשבאוזן הקשובה נשמע \"הם הלכו אל הגדה\" (גדה כגדת נהר או כבנק, בדומה ל-bank). אחר כך הנבדקים בוחרים \"הם הלכו אל הבנק\". לאיזה מודל הממצא מתאים, ואיזה מודל הוא סותר?","o":["תואם את ברודבנט וסותר את מודלי הסלקציה המאוחרת","תואם את מודלי הסלקציה המאוחרת (עיבוד סמנטי של מסר לא קשוב), וסותר את מודל הפילטר של ברודבנט","תואם את כל המודלים","סותר את כל המודלים"],"a":1,"e":"זהו מבנה הניסוי של מקיי. המשמעות עובדה בלי קשב ובלי מודעות, ובלי שהמילה הייתה חשובה או שכיחה."},{"q":"לפי מודל המחלש של טריזמן, איזו מילה במסר הלא קשוב הכי סביר שתגיע למודעות?","o":["מילה נדירה ולא קשורה","מילה שכיחה מאוד, או מילה רלוונטית לאדם באותו רגע, כמו \"אש\"","מילה ארוכה","כל המילים באותה מידה"],"a":1,"e":"לפי המודל, למילים שכיחות או חשובות יש סף הפעלה נמוך ביחידת המילון."},{"q":"נהגת נוהגת בכביש ריק ושקט (מטלה קלה). לפי תיאוריית העומס של לביא, מה צפוי לגבי שלט פרסום צבעוני בצד הדרך?","o":["השלט לא יעובד","השלט צפוי לעבור עיבוד ולהסיח, כי בעומס נמוך נשארת קיבולת פנויה","השלט ישפר את הנהיגה","אין קשר לעומס"],"a":1,"e":"בעומס נמוך הקיבולת העודפת \"נשפכת\" לגירויים לא רלוונטיים."},{"q":"בגרסה של מטלת סטרופ, הנבדקים מתבקשים לקרוא את המילה ולא לשיים את הצבע. כמעט אין הפרעה מהצבע. מה ההסבר הסביר?","o":["הקשב חוסם את הצבע תמיד","קריאה היא תהליך אוטומטי וחזק יותר משיום צבע, ולכן הצבע מפריע פחות לקריאה מאשר המילה מפריעה לשיום","הצבע אינו מעובד כלל","אין הבדל בין המטלות"],"a":1,"e":"ההפרעה אינה סימטרית. עיבוד המשמעות של המילה אינו נחסם, והוא מתנגש עם התגובה האיטית יותר."},{"q":"בניסוי פוזנר, נניח שהרמז תקף רק ב-50% מהצעדים. מה צפוי?","o":["אותו יתרון לתנאי התקף כמו כשהרמז תקף ב-80%","יתרון התנאי התקף יקטן או ייעלם, כי לנבדקים אין סיבה להפנות קשב לפי הרמז","התגובה בתנאי הלא תקף תהיה מהירה יותר","הנבדקים יזיזו את העיניים"],"a":1,"e":"הנבדקים נעזרים ברמז כי הוא תקף ברוב המקרים. כשאין לו ערך ניבוי, אין סיבה להפנות אליו קשב."},{"q":"בניסוי אגלי, מה היה קורה אילו התגובה במלבן השני (C) הייתה מהירה בדיוק כמו בקצה השני של המלבן שהוטרם (B)?","o":["זה היה תומך בגישה תלוית-העצם","זה היה תומך בגישה תלוית-המיקום בלבד, כי ההבדל היחיד הוא המרחק מהרמז, והמרחק שווה","זה היה מוכיח שאין קשב","זה היה תומך בסלקציה מאוחרת"],"a":1,"e":"\"יתרון אותו עצם\" הוא ההבדל בין B ל-C. בלעדיו, רק המרחק מהרמז משנה."},{"q":"בחיפוש חזותי, נבדקת מחפשת עיגול אדום בין עיגולים כחולים וריבועים אדומים. מה צפוי לגבי זמן התגובה, לפי טריזמן?","o":["זמן התגובה לא יושפע ממספר הפריטים","זמן התגובה יגדל עם מספר הפריטים, כי המטרה מוגדרת רק על ידי צירוף של צבע וצורה (חיפוש חיבורי)","זמן התגובה יקטן עם מספר הפריטים","הנבדקת לא תמצא את המטרה"],"a":1,"e":"אף תכונה לבדה (אדום או עיגול) אינה ייחודית למטרה, ולכן נדרש חיבור, שהוא קשבי וסדרתי."},{"q":"מטופל עם תסמונת בלינט רואה כוס כחולה ותפוח אדום, ומדווח \"כוס אדומה\". מה ההסבר לפי תיאוריית אינטגרציית התכוניות?","o":["פגיעה בזיהוי צבעים","פגיעה ביכולת למקד קשב בעצמים, ולכן התכוניות שנקלטו בנפרד מחוברות באופן שגוי (חיבור אשלייתי)","פגיעה בזיכרון","פגיעה בשמיעה"],"a":1,"e":"הוא קולט את הצבעים ואת הצורות, אבל אינו מצליח לאגוד אותם נכון. זה דומה לניסוי של רובינסון עם R.M."},{"q":"נבדקים צפו בסרט וספרו מסירות, וחלקם לא ראו את הגורילה. מה ההבדל המהותי בין התופעה הזו לבין עיוורון לשינויים?","o":["אין הבדל","בעיוורון קשבי לא תופסים גירוי שמופיע כשהקשב מופנה למקום אחר. בעיוורון לשינויים לא מבחינים שמשהו השתנה בין שתי תצוגות","עיוורון לשינויים מתרחש רק בשמיעה","עיוורון קשבי מתרחש רק אצל פגועי מוח"],"a":1,"e":"שתיהן מראות שבלי קשב אין תפיסה מודעת, אבל אחת עוסקת בגירוי חדש והשנייה בשינוי."},{"q":"בניסוי החיבורים האשלייתיים, מדוע היה חשוב שהנבדקים לא יטעו כמעט בדיווח הספרות?","o":["כי זה הוכיח שהם לא ראו את הצורות","כי זה הראה שהקשב אכן הופנה לספרות, ולכן הצורות עובדו בתנאים של קשב מועט, וזה התנאי שבו התיאוריה מנבאת חיבורים שגויים","כי הספרות היו המטרה העיקרית של המחקר","כי הספרות היו קלות מדי"],"a":1,"e":"ההצלחה במשימה הראשית היא אינדיקציה לכך שהקשב הופנה אליה."}]},{"id":"c5","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 5: זיכרון חושי, זיכרון לטווח קצר וזיכרון עבודה","questions":[{"q":"לפי המודל המודאלי של אטקינסון ושיפרין (1968), מה הסדר שבו עובר המידע?","o":["זיכרון לטווח ארוך ← זיכרון חושי ← זיכרון לטווח קצר","זיכרון חושי ← זיכרון לטווח קצר ← זיכרון לטווח ארוך","זיכרון לטווח קצר ← זיכרון חושי ← זיכרון לטווח ארוך","זיכרון עבודה ← זיכרון חושי ← זיכרון לטווח ארוך"],"a":1,"e":"קלט מהעולם נכנס לזיכרון החושי, דרך הקשב עובר לזט\"ק, ובקידוד ובשינון עובר לזט\"א."},{"q":"מהי \"תופעת ההתמשכות\"?","o":["שכחה הדרגתית של מידע מהזיכרון לטווח ארוך","המשך התפיסה של גירוי חושי לזמן קצרצר לאחר שהוא נעלם","היכולת לשנן מידע לאורך זמן","קליטה של מידע לא קשוב"],"a":1,"e":"למשל, צפייה בסרט שבו אנו חווים רצף למרות שהתמונות מתחלפות."},{"q":"בניסוי של ספרלינג (1960) הובזקה מטריצה של 12 אותיות ל-50 אלפיות השנייה. מדוע משך התצוגה היה קצר כל כך?","o":["כדי למנוע מהמידע לעבור עיבוד ושינון מעבר לזיכרון האיקוני","כדי לעייף את הנבדקים","כדי לבדוק זיכרון לטווח ארוך","כדי שהאותיות לא ייראו"],"a":0,"e":"בזק קצר מבטיח שהביצוע ישקף את הזיכרון האיקוני."},{"q":"בשיטת הדיווח המלא של ספרלינג, על כמה אותיות דיווחו הנבדקים בממוצע?","o":["כל 12 האותיות","כ-4–5 אותיות (כ-37%)","אות אחת","כ-9 אותיות"],"a":1,"e":"הממצא יכול להיות מוסבר בקיבולת מוגבלת, או בדעיכה מהירה במהלך הדיווח."},{"q":"מה היה ההסבר החלופי (לקיבולת מוגבלת) לתוצאות הדיווח המלא?","o":["הנבדקים לא הבינו את ההוראות","כל האותיות נכנסו לזיכרון האיקוני, אך דעכו מהר מדי, ולכן הנבדקים לא הספיקו לדווח על יותר מ-4–5","הנבדקים לא ראו את האותיות","האותיות היו קטנות מדי"],"a":1,"e":"חלק מהנבדקים אמרו שקלטו יותר ממה שהצליחו לדווח."},{"q":"בשיטת הדיווח החלקי של ספרלינג, מה סימן לנבדקים על איזו שורה לדווח?","o":["חץ על המסך","צליל (גבוה, בינוני או נמוך) שהושמע מיד אחרי היעלמות המטריצה","צבע השורה","הוראה מילולית לפני התצוגה"],"a":1,"e":"הצליל הגבוה סימן את השורה העליונה, הבינוני את האמצעית והנמוך את התחתונה."},{"q":"מה היו תוצאות שיטת הדיווח החלקי?","o":["כאות אחת מתוך 4","כ-3.3 אותיות מתוך 4 (82%), ללא הבדל בין השורות","כל 4 האותיות תמיד","רק השורה העליונה דווחה היטב"],"a":1,"e":"מכך הסיקו שרוב אותיות המטריצה היו בזיכרון האיקוני, ושהן דועכות במהלך הדיווח."},{"q":"מה איפשר לספרלינג להסיק, מדיווח על שורה אחת, שרוב אותיות המטריצה כולה היו בזיכרון האיקוני?","o":["הנבדקים ידעו מראש איזו שורה תסומן","הסימון ניתן אחרי המטריצה ובאופן מקרי, ולא היה הבדל בדיווח בין השורות","הנבדקים ראו את המטריצה פעמיים","השורות היו זהות"],"a":1,"e":"הנבדקים לא יכלו להתכונן לשורה מסוימת, ולכן כל השורות היו זמינות באותה מידה."},{"q":"המשתנה שתפעל ספרלינג כדי למדוד את הזמן שלוקח לזיכרון האיקוני לדעוך הוא –","o":["כמות האותיות במטריצה","שיטת הדיווח: חלקי או מלא","מיקום השורה שעליה התבקשו לדווח","משך ההשהיה של הצליל שציין איזו שורה לדווח"],"a":3,"e":"בדיווח החלקי המושהה, ככל שההשהיה גדלה דווחו פחות אותיות. אחרי שנייה דווחו כ-1.5 מתוך 4."},{"q":"מהי המסקנה הכללית מניסויי ספרלינג?","o":["הזיכרון החושי קולט מעט מאוד מידע","הזיכרון החושי קולט את כל המידע מהקולטנים החושיים או את מרביתו, והמידע דועך תוך זמן קצרצר","הזיכרון האיקוני נמשך דקות","אין זיכרון חושי"],"a":1,"e":"קיבולת רבה ודעיכה מהירה (פחות משנייה)."},{"q":"בניסוי של בראון ופטרסון ופטרסון (1959), מה הייתה מטרת הספירה לאחור בשלשות?","o":["לבדוק יכולת חשבון","למנוע שינון של שלשת העיצורים","לשפר את הזכירה","להאריך את זמן הניסוי"],"a":1,"e":"ההסחה מונעת שינון, וכך ניתן לבחון דעיכה של המידע עם הזמן."},{"q":"מה נמצא בניסוי של פטרסון ופטרסון?","o":["הזכירה לא השתנתה עם משך ההסחה","הזכירה ירדה ככל שמשך ההסחה התארך","הזכירה השתפרה עם הזמן","הנבדקים לא זכרו אף שלשה"],"a":1,"e":"ההסבר שלהם: דעיכה הדרגתית מהזט\"ק תוך מספר שניות כשאין שינון."},{"q":"מה מצאו קפל ואנדרווד (1962) בניתוח השלשה הראשונה בניסוי פטרסון?","o":["השלשה הראשונה נשכחה מהר יותר","בשלשה הראשונה כמעט לא הייתה ירידה בזכירה, גם אחרי 18 שניות הסחה","הזכירה בשלשה הראשונה הייתה 0%","לא היה הבדל בין השלשות"],"a":1,"e":"זה סותר את הסבר הדעיכה ותומך בהסבר של הפרעה למאוחר."},{"q":"מהי \"הפרעה למאוחר\"?"
