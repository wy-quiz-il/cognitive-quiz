מודגם במטלת החלטה לקסיקלית ובמדידת תנועות עיניים."},{"q":"בניסוי של ריינר ועמיתים (2003), נבדקים קראו משפט עם pretty (שכיחה) או demure (נדירה). מה נמצא?","o":["זמן הפיקסציה על המילה הנדירה היה ארוך בכ-40 אלפיות השנייה","זמן הפיקסציה על המילה השכיחה היה ארוך יותר","לא היה הבדל","הנבדקים דילגו על המילה הנדירה"],"a":0,"e":"כנראה נדרש יותר זמן לשלוף מהזיכרון משמעות של מילה נדירה."},{"q":"מהי \"רב משמעות לקסיקלית\"?","o":["משפט שיש לו שתי פרשנויות תחביריות","קיום של כמה משמעויות למילה אחת, כמו bank (גדה או בנק) או \"עכבר\"","מילה שאין לה משמעות","שימוש בכמה שפות"],"a":1,"e":"\"דומיננטיות של משמעות\" היא העובדה שחלק מהמשמעויות שכיחות יותר מאחרות."},{"q":"מה ההבדל בין \"דומיננטיות מוטה\" ל\"דומיננטיות מאוזנת\"?","o":["אין הבדל","במוטה משמעות אחת שכיחה הרבה יותר (כמו פח של אשפה), ובמאוזנת למשמעויות יש שכיחות דומה (כמו עכבר: חיה או אביזר מחשב)","במוטה יש משמעות אחת בלבד","במאוזנת אין הקשר"],"a":1,"e":"ההבדל משפיע על מהירות הקריאה."},{"q":"בקריאת המשפט \"העכבר היה בצבע אדום מבריק\" (ללא הקשר קודם), מדוע הקוראים מתעכבים על המילה \"עכבר\" יותר מאשר על מילת ביקורת כמו \"פרח\"?","o":["כי \"עכבר\" מילה נדירה","כי לעכבר יש דומיננטיות מאוזנת, ולכן שתי המשמעויות מופעלות","כי \"עכבר\" ארוכה יותר","כי חסר הקשר תחבירי"],"a":1,"e":"כשלמילה עם דומיננטיות מוטה אין הקשר קודם (\"הפח היה ריק\"), מופעלת רק המשמעות הדומיננטית והקריאה מהירה."},{"q":"במשפט \"במכרה החדש יש כמויות גדולות של פח\", מדוע הקריאה של \"פח\" איטית?","o":["כי ההקשר מורה על המשמעות הפחות שכיחה (מתכת), ובכל זאת גם המשמעות הדומיננטית (אשפה) מופעלת","כי \"פח\" מילה נדירה","כי אין הקשר","כי ההקשר מורה על המשמעות הדומיננטית"],"a":0,"e":"כשההקשר מורה על המשמעות הדומיננטית (\"זרקו את שאריות האוכל לפח\"), רק היא מופעלת והקריאה מהירה."},{"q":"מה ההבדל בין סמנטיקה לתחביר?","o":["סמנטיקה היא צורת המשפט, ותחביר הוא תוכנו","סמנטיקה היא משמעות המילים והמשפטים (התוכן), ותחביר הוא הכללים לשילוב מילים במשפטים (הצורה)","אין הבדל","תחביר עוסק רק בצלילים"],"a":1,"e":"\"החתולים לא מוכנים לאפות\" הוא שינוי סמנטי. \"החתולים לא מוכנים אוכלים\" הוא שינוי תחבירי."},{"q":"מה מאפיין אפזיה על שם ברוקה?","o":["דיבור שוטף ונכון תחבירית אבל חסר משמעות","דיבור איטי, מקוטע ומאומץ, עם קושי בתחביר, כולל קושי בהבנת משפטים כמו \"הילד נדחף על ידי הילדה\"","חוסר יכולת לקרוא בלבד","פגיעה בזיכרון לטווח קצר"],"a":1,"e":"פגיעה באזור ברוקה, באונה המצחית, קשורה לתחביר."},{"q":"מדוע מטופלים עם אפזיה על שם ברוקה מבינים את \"התפוח נאכל על ידי הילדה\", אבל מתקשים ב\"הילד נדחף על ידי הילדה\"?","o":["כי המשפט הראשון קצר יותר","כי במשפט הראשון אפשר להבין את המשמעות גם בלי תחביר (תפוח אינו אוכל ילדה), ובשני המשמעות תלויה במבנה התחבירי","כי הם אינם מכירים את המילה \"דחף\"","כי הם פגועים בסמנטיקה"],"a":1,"e":"הם פגועים בעיבוד התחבירי."},{"q":"מה מאפיין אפזיה על שם ורניקה?","o":["דיבור איטי ומקוטע","דיבור שוטף ונכון תחבירית אבל חסר משמעות, וקושי נרחב בהבנת דיבור וכתיבה","קושי רק במשפטים סבילים","פגיעה בתנועת השפתיים"],"a":1,"e":"פגיעה באזור ורניקה, באונה הרקתית, קשורה לסמנטיקה."},{"q":"איזה רכיב ERP גדל כאשר מילה אינה מתאימה במשמעותה למשפט (\"החתולים לא מוכנים לאפות\")?","o":["P600","N400","P300","N170"],"a":1,"e":"N400 רגיש לסמנטיקה וקשור לאונה הרקתית. P600 רגיש לתחביר וקשור לאונה המצחית."},{"q":"איזה רכיב ERP גדל כאשר צורת המשפט אינה תקינה דקדוקית (\"החתולים לא מוכנים אוכלים\")?","o":["N400","P600","N200","שניהם באותה מידה"],"a":1,"e":"התגובות הפיזיולוגיות השונות מראות שתחביר וסמנטיקה מעובדים באופן שונה במוח."},{"q":"\"אחרי שהזמרת שרה כמה שירים חדשים הושמעו ברמקולים\". כיצד נקרא משפט כזה?","o":["משפט שביל הגן, שמדגים רב משמעות זמנית","משפט חד משמעי","משפט סמנטי שגוי","משפט ללא תחביר"],"a":0,"e":"בהתחלה המילים מתקבצות בצורה אחת, שמתבררת בהמשך כשגויה, ולכן צריך לארגן מחדש את המשפט."},{"q":"לפי עקרון \"הסגירה המאוחרת\" בגישת התחביר-תחילה (פרייז'ר) –","o":["כל מילה חדשה פותחת פסוקית חדשה","המעבד התחבירי מניח שמילה חדשה היא חלק מהצירוף הנוכחי, ומצרף אותה אליו כל עוד הדבר אפשרי","משמעות המילים קובעת את ההקבצה מההתחלה","הקורא מחכה לסוף המשפט לפני ההקבצה"],"a":1,"e":"לכן \"כמה שירים חדשים\" מצורף בטעות לפסוקית \"אחרי שהזמרת שרה\". העיקרון שימושי, כי לעיתים קרובות הוא מוביל לעיבוד נכון."},{"q":"מה ההבדל המרכזי בין גישת התחביר-תחילה לגישת האינטראקציה לעיבוד תחבירי?","o":["אין הבדל","בגישת התחביר-תחילה ההקבצה הראשונית נקבעת לפי כללים תחביריים בלבד. בגישת האינטראקציה תחביר, סמנטיקה וגורמים נוספים מובאים בחשבון בו-זמנית מההתחלה","גישת האינטראקציה מתעלמת מתחביר","גישת התחביר-תחילה מתייחסת רק לסמנטיקה"],"a":1,"e":"למשל, \"העיט ראה את האיש עם המשקפת\" מתפרש מיד בצורה אחת, בזכות הידע על עיטים."},{"q":"בניסוי פרדיגמת העולם החזותי של טננהאוס ועמיתים (1995), נאמר לנבדקים \"שימו את התפוח על המגבת בקופסה\". מה קרה כשהיו בסצנה שני תפוחים?","o":["הנבדקים הביטו קודם במגבת הריקה","הנבדקים פירשו את \"על המגבת\" כזיהוי של התפוח שיש להזיז, והביטו בתפוח שעל המגבת ואז בקופסה","הנבדקים לא הזיזו את העיניים","התוצאה הייתה זהה לסצנה של תפוח אחד"],"a":1,"e":"עם תפוח אחד הם הביטו קודם במגבת האחרת (פרשנות שגויה) ותיקנו. הסצנה קבעה את הפרשנות, וזה תומך בגישת האינטראקציה."},{"q":"בניסוי של פיין ועמיתים (2013) נבדקים קראו שוב ושוב משפטים עם רב משמעות זמנית (\"המפקדת הבטיחה לחייל שהיא סומכת עליו לבקר אותו בקרוב\"). מה נמצא?","o":["אפקט הרב משמעות גדל עם הזמן","אפקט הרב משמעות נעלם במערך השני של המשפטים, כי הנבדקים הסתגלו למבנה","הנבדקים לא הבינו את המשפטים","לא היה אפקט רב משמעות כלל"],"a":1,"e":"הניסיון עם מבנים משנה את הניבויים התחביריים, וזה תומך בגישת האינטראקציה."},{"q":"בניסוי של ברנספורד וג'ונסון (1973), קטע על ג'ון שהכה במסמר כדי לתקן שובך נזכר כ\"ג'ון השתמש בפטיש\". איזה סוג היסק זה?","o":["היסק אנאפורי","היסק על האמצעי","היסק סיבתי","אין היסק"],"a":1,"e":"היסק על האמצעי הוא היסק לגבי כלים או שיטות. דוגמה נוספת: שייקספיר כתב כנראה בעט נוצה."},{"q":"\"ריפיפי, הפודלית המפורסמת, זכתה בתצוגה. היא זכתה בשלוש התצוגות האחרונות.\" ההבנה ש\"היא\" מתייחסת לריפיפי היא –","o":["היסק סיבתי","היסק אנאפורי","היסק על האמצעי","מודל המצב"],"a":1,"e":"היסק אנאפורי מחבר אדם או עצם במשפט אחד לאדם או עצם במשפט אחר. דוגמת ג'ורג' פורמן (\"we grill them\") מראה שאנו נעזרים בידע על העולם."},{"q":"\"שרון לקחה כדור אספירין. כאב הראש שלה עבר.\" ההבנה שהאספירין גרם לכאב לעבור היא –","o":["היסק סיבתי","היסק אנאפורי","היסק על האמצעי","חוזה נתון-חדש"],"a":0,"e":"ב\"שרון התקלחה. כאב הראש שלה עבר\" הקשר הסיבתי חלש יותר, ויצירתו דורשת מהקורא יותר עבודה."},{"q":"מהו \"מודל המצב\" בהבנת טקסט?","o":["ייצוג של המשפטים והפסוקיות כפי שנכתבו","ייצוג מנטלי של הנושא שבו עוסק הטקסט, במונחי האנשים, העצמים, המקומות והאירועים, כולל סימולציה של מאפייני תפיסה ותנועה","זיכרון מילולי מדויק של הטקסט","מבנה תחבירי"],"a":1,"e":"הוא מבוסס על ג'ונסון-לירד (1983)."},{"q":"בניסוי של סטנפילד וזוואן (2001), נבדקים קראו \"הוא תקע את המסמר בקיר\" ואחר כך ראו תמונה של מסמר. מתי ענו \"כן\" מהר יותר?","o":["כשהמסמר בתמונה היה אנכי","כשכיוון המסמר בתמונה (אופקי) תאם את המצב שתואר במשפט","בלי קשר לכיוון","כשלא הוצג מסמר"],"a":1,"e":"גם בניסוי הצורה של זוואן ועמיתים (2002), עיט בשמיים לעומת עיט בקן, נמצא אותו דבר. זה תומך במודל המצב."},{"q":"בניסוי של מתוסלם ועמיתים (2012), \"הוא ראה את הלהקה יוצאת אל ___\". איזו מילה גרמה ל-N400 הגדול ביותר?","o":["\"הבמה\" (צפויה)","\"הגיטרה\" (קשורה לאירוע)","\"האסם\" (לא קשורה לאירוע)","לכולן אותו N400"],"a":2,"e":"\"גיטרה\" גרמה ל-N400 קטן יותר מ\"אסם\", כי ידע על קונצרטים מופעל תוך כדי קריאה. אלה ניבויים על סמך ידע על מצבים."},{"q":"מהו \"חוזה נתון-חדש\" (האבילנד וקלרק, 1974)?","o":["הסכם בין דוברים לא להפריע","הדובר צריך לבנות משפטים כך שיכללו גם מידע שהמאזין כבר יודע (נתון) וגם מידע חדש","כל משפט צריך לכלול רק מידע חדש","כלל תחבירי של סדר מילים"],"a":1,"e":"\"בדקנו את המצרכים לפיקניק. הבירה הייתה חמה\" הובן לאט יותר, כי הבירה לא הוזכרה במידע הנתון ונדרש היסק."},{"q":"בניסוי של אייזקס וקלארק (1987) זוגות סידרו גלויות של ניו יורק. מה קרה עם התקדמות הניסויים?","o":["מספר המילים לתמונה גדל","מספר המילים שנדרשו לזיהוי ירד (מ-37 ל-8), ושיעור ההתייחסות בשם עלה, כלומר נוצר מכנה משותף","לא היה שינוי","הנבדקים הפסיקו לדבר"],"a":1,"e":"המכנה המשותף נקבע גם לפי המומחיות (תושב או לא תושב העיר) וגם לפי חילופי הדברים בשיחה."},{"q":"בניסוי של ברניגן ועמיתים (2000) על הטרמה תחבירית, מה נמצא?","o":["הנבדקים השתמשו במבנה תחבירי הפוך לזה של השותף","ב-78% מהניסויים צורת התיאור של הנבדק תאמה את המבנה התחבירי של המשפט המטרים של השותף","לא הייתה השפעה","הנבדקים העתיקו את המילים עצמן"],"a":1,"e":"זהו תיאום תחבירי: הוא מקטין את העומס החישובי, כי קל יותר להעתיק מבנה מאשר לבנות אותו מאפס."},{"q":"בניסוי של וינאוור ועמיתים (2007), מתי הגיבו דוברי רוסית מהר יותר בהשוואת גווני כחול?","o":["כששני הריבועים היו מאותה קטגוריה ברוסית","כששני הריבועים היו מקטגוריות שונות ברוסית (גולובוי וסיניי), ואילו אצל דוברי אנגלית לא היה הבדל","אף פעם, דוברי אנגלית היו מהירים יותר","לא היה הבדל אצל אף קבוצה"],"a":1,"e":"זה תומך בהשערת ספיר-וורף: היבטים של שפת התרבות משפיעים על האופן שבו אנשים חושבים ותופסים."},{"q":"מה מצאו גילברט ועמיתים (2006) לגבי אפקט קטגוריית הצבע בשני חצאי השדה החזותי?","o":["האפקט הופיע רק בשדה החזותי השמאלי","האפקט (תגובה מהירה יותר למטרה מקטגוריה שונה) הופיע רק בשדה החזותי הימני, שנקלט בהמיספרה השמאלית האחראית על השפה","האפקט הופיע בשני השדות באותה מידה","לא היה אפקט"],"a":1,"e":"התשובה לשאלה אם שפה משפיעה על תפיסה תלויה בחלק המוח שמעורב בתהליך."}],"hard":[{"q":"מטופל אומר \"אני... הלכתי... רופא... כאב\" ומתקשה להבין את \"הכלב נרדף על ידי החתול\", אבל מבין את \"העוגה נאכלה על ידי הילד\". מה האבחנה, ואיזה רכיב ERP צפוי להיפגע אצלו?","o":["אפזיה על שם ורניקה, N400","אפזיה על שם ברוקה, P600 (שקשור לתחביר ולאונה המצחית)","אפזיה על שם ברוקה, N400","אפזיה על שם ורניקה, P600"],"a":1,"e":"דיבור מקוטע וקושי במשפטים שבהם המשמעות תלויה בתחביר מאפיינים פגיעה באזור ברוקה. P600 קשור למבנים באונה המצחית."},{"q":"קוראת נתקלת במשפט \"הסוס שנדחף ליד האורווה נפל\" ונעצרת ב\"נפל\". לפי גישת התחביר-תחילה, מה קרה?","o":["היא לא הכירה את המילה","בהתחלה היא צירפה את המילים לפסוקית אחת לפי כלל תחבירי, ורק במילה \"נפל\" התברר שצריך לבצע עיבוד תחבירי מחדש","היא השתמשה בסמנטיקה בלבד","זו דוגמה לרב משמעות לקסיקלית"],"a":1,"e":"זה משפט שביל הגן. לפי פרייז'ר, התחביר קובע את ההקבצה הראשונית, והתיקון מגיע אחר כך."},{"q":"בפרדיגמת העולם החזותי, איזו תוצאה הייתה תומכת דווקא בגישת התחביר-תחילה?","o":["תנועות עיניים שונות בסצנה של תפוח אחד ובסצנה של שני תפוחים","אותו דפוס תנועות עיניים בשתי הסצנות, כלומר פרשנות ראשונית זהה בלי קשר למה שנמצא על השולחן","תנועות עיניים מהירות","שהנבדקים לא הסתכלו על הקופסה"],"a":1,"e":"אם העיבוד הראשוני נקבע רק לפי מבנה המשפט, הסצנה לא אמורה להשפיע עליו."},{"q":"מילה עם דומיננטיות מוטה מופיעה בהקשר שמכוון למשמעות הלא דומיננטית (\"במכרה יש פח\"). למה צפוי שזמן הקריאה יהיה דומה לזה של מילה עם דומיננטיות מאוזנת ללא הקשר?","o":["כי בשני המקרים רק משמעות אחת מופעלת","כי בשני המקרים שתי משמעויות מופעלות ומתחרות: ההקשר מגביר את המשמעות הלא דומיננטית, אבל הדומיננטית מופעלת בכל זאת","כי בשני המקרים המילה נדירה","כי אין הקשר"],"a":1,"e":"זה המצב שתואר באיור 11.5ג."},{"q":"חוקר מוצא N400 גדול למילה \"מקרר\" בסוף המשפט \"הוא שתה כוס קפה עם ___\", ו-N400 קטן יותר ל\"סוכר\". מה ניבוי גישת מודל המצב לגבי המילה \"צלחת\"?","o":["N400 גדול כמו \"מקרר\"","N400 בגודל ביניים: \"צלחת\" אינה מתאימה, אבל היא קשורה לתרחיש של שתיית קפה, ולכן מופעלת חלקית","N400 קטן מ\"סוכר\"","אין N400"],"a":1,"e":"זה בדיוק דפוס הבמה, הגיטרה והאסם של מתוסלם ועמיתים."},{"q":"בניסוי של פיין ועמיתים, אפקט הרב משמעות נעלם אחרי חשיפה חוזרת. מה זה מלמד על המקור של משפטי שביל הגן?","o":["שהם נובעים מכללים תחביריים קבועים בלבד","שהניבויים התחביריים מבוססים על ניסיון ועל שכיחות המבנים, ולכן הם ניתנים לשינוי גם בטווח קצר","שהנבדקים התעייפו","שהמשפטים היו קלים מדי"],"a":1,"e":"זה תומך בגישת האינטראקציה ובהסבר מבוסס הזיכרון."},{"q":"\"דני חזר מהמכולת. החלב היה חמוץ.\" לעומת \"דני קנה חלב. החלב היה חמוץ.\" איזה משפט שני יובן לאט יותר, ומדוע?","o":["השני בזוג השני","השני בזוג הראשון, כי ה\"חלב\" אינו חלק מהמידע הנתון ודורש היסק (שדני קנה חלב במכולת)","שניהם באותה מהירות","השני בזוג השני, כי יש בו חזרה"],"a":1,"e":"זה חוזה נתון-חדש, כמו בבירה החמה של האבילנד וקלרק."},{"q":"\"השוטר עצר את הנהג. הוא נתן לו דוח.\" קוראים מבינים מיד שהשוטר נתן את הדוח. איזה סוג היסק זה, ועל מה הוא נשען?","o":["היסק סיבתי, על מבנה המשפט בלבד","היסק אנאפורי, שנשען על ידע על העולם (שוטרים נותנים דוחות לנהגים) ולא רק על התחביר","היסק על האמצעי","אין צורך בהיסק"],"a":1,"e":"תחבירית \"הוא\" יכול להתייחס לשניהם, וידע העולם מכריע. זה כמו הדגים והילדים של ג'ורג' פורמן."},{"q":"בניסוי של גילברט ועמיתים, אילו הנבדקים היו דוברי שפה שאין בה מילים נפרדות לכחול ולירוק, מה היה צפוי?","o":["אותו אפקט קטגוריה בשדה החזותי הימני","שלא יופיע אפקט קטגוריה לכחול לעומת ירוק בשדה הימני, כי אין בשפתם תוויות שמפרידות ביניהם","אפקט בשדה השמאלי בלבד","אפקט חזק יותר"],"a":1,"e":"לפי ההיגיון של ספיר-וורף והניסוי, האפקט תלוי בתוויות השפה ומתבטא דרך ההמיספרה השפתית."},{"q":"בניסוי ההטרמה התחבירית של ברניגן, הנבדקת תיארה את התמונה במבנה שבו השתמש השותף ב-78% מהמקרים. מדוע החוקרים השתמשו בשותף סמוי ולא בנבדק אמיתי נוסף?","o":["כי לא היו מספיק נבדקים","כדי לשלוט במבנה התחבירי של המשפט המטרים בכל צעד, וכך לבדוק אם המבנה הזה בדיוק משפיע על הנבדקת","כדי להסתיר את התמונה","כדי למדוד זמני תגובה"],"a":1,"e":"שליטה במשתנה הבלתי תלוי, כלומר במבנה המטרים, היא תנאי לבדיקת ההטרמה."}]},{"id":"c12","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 12: פתרון בעיות","questions":[{"q":"לפי גישת הגשטאלט, מה נדרש לפתרון בעיה?","o":["ניסוי וטעייה אקראיים","יצירת ייצוג מנטלי של הבעיה והבניה מחדש שלו, כך שהפתרון מופיע מעצמו (תובנה)","שינון של פתרונות קודמים","חיפוש במרחב הבעיה"],"a":1,"e":"למשל, בבעיית המעגל: ההבנה ש-x הוא אלכסון במלבן שאלכסונו השני הוא הרדיוס, ולכן x=r."},{"q":"בבעיית המעגל והמלבן (רדיוס r, מה אורך x?), מהי ההבניה מחדש שמביאה לפתרון?","o":["חישוב לפי משפט פיתגורס","ההבנה ש-x הוא אלכסון של מלבן שאלכסונו השני הוא רדיוס המעגל, ולכן x=r","מדידה בסרגל","חישוב היקף המעגל"],"a":1,"e":"שני האלכסונים של מלבן שווים."},{"q":"בניסוי של מטקאלף ווייב (1987), מה היה המשתנה התלוי?","o":["זמן הפתרון","דירוגי הקרבה לפתרון (\"חם-קר\") כל 15 שניות","מספר הטעויות","סוג הבעיה"],"a":1,"e":"המשתנה הבלתי תלוי היה סוג הבעיה: בעיות תובנה או בעיות ללא תובנה (אלגברה)."},{"q":"מה מצאו מטקאלף ווייב (1987) בבעיות תובנה?","o":["עלייה הדרגתית ורציפה בתחושת הקרבה לפתרון","15 שניות לפני הפתרון, הנבדקים עדיין הרגישו רחוקים ממנו, והפתרון הגיע בפתאומיות","הנבדקים לא פתרו אף בעיה","אין הבדל מבעיות ללא תובנה"],"a":1,"e":"בבעיות תובנה הפתרון פתאומי (\"אהא!\"), ובבעיות ללא תובנה ההתקרבות הדרגתית."},{"q":"מה אפיין את דירוגי הקרבה לפתרון בבעיות ללא תובנה (אלגברה)?","o":["קפיצה פתאומית","עלייה רציפה והדרגתית","ירידה לאורך הזמן","דירוג קבוע"],"a":1,"e":"פתרון ללא תובנה מתרחש בהדרגתיות."},{"q":"מהו \"קיבעון\" לפי הגשטאלט?","o":["חוסר מוטיבציה","התמקדות במאפיין מסוים של הבעיה שמונעת הגעה לפתרון","עייפות","שכחת הבעיה"],"a":1,"e":"זהו אחד המכשולים העיקריים לפתרון בעיות לפי הגשטאלט."},{"q":"קיבעון תפקודי, שמהווה מכשול לפתרון בעיות, פירושו שהנבדקים מתמקדים –","o":["בשימושים המוכרים של עצם","בתפקודים השכליים החזקים יותר שלהם","בשימושים הלא מוכרים של עצם","בתפקודים השכליים החלשים יותר שלהם"],"a":0,"e":"זו שאלה מהמבחן לדוגמה."},{"q":"מהו הפתרון לבעיית הנר של דונקר (1945)?","o":["להדביק את הנר בשעווה ישירות ללוח","לרוקן את קופסת הנעצים, לנעוץ אותה ללוח השעם ולהעמיד עליה את הנר","לתלות את הנר בחוט","להדליק את הנר על הרצפה"],"a":1,"e":"הקופסה משמשת כמדף, ולא רק ככלי קיבול."},{"q":"בניסוי בעיית הנר, באיזה תנאי אחוז הפותרים היה גבוה יותר?","o":["כשהנעצים היו בתוך הקופסה","כשהקופסה ניתנה ריקה, והנעצים לידה","לא היה הבדל","כשלא הייתה קופסה"],"a":1,"e":"בתנאי הקופסה הריקה אחוז הפותרים היה גדול פי 2."},{"q":"כיצד מסביר הגשטאלט את הקושי בתנאי \"קופסה ככלי קיבול\" בבעיית הנר?","o":["חוסר אינטליגנציה","קיבעון תפקודי: התפקיד המוכר של הקופסה ככלי קיבול הקשה לראות בה משטח להעמדת הנר","מערך מנטלי מבעיות קודמות","עומס בזיכרון העבודה"],"a":1,"e":"התפקיד המוכר של העצם הוא הבולט."},{"q":"בבעיית שני החבלים של מאייר (1931), מה היה הפתרון?","o":["להאריך את החבל","לקשור את הצבת לחבל אחד ולהפוך אותו למטוטלת, ואז לתפוס אותו כשהוא מתקרב","לעמוד על השידה","לחתוך את החבל"],"a":1,"e":"הצבת משמשת כמשקולת, ולא כשימושה המוכר."},{"q":"בבעיית שני החבלים, מה קרה אחרי שהנסיין \"בטעות\" נדנד את החבל?","o":["אף נבדק לא פתר","רוב הנבדקים שלא הצליחו קודם (23 מתוך 37) פתרו את הבעיה תוך דקה","הנבדקים התבלבלו","הנבדקים ויתרו"],"a":1,"e":"הרמז גרם ליציאה מהקיבעון התפקודי ולתובנה."},{"q":"כמה נבדקים בניסוי של מאייר לא הצליחו לפתור את בעיית שני החבלים בתוך 10 דקות, לפני הרמז?","o":["כמעט אף אחד","הרוב: 37 מתוך 60","10 מתוך 60","כולם"],"a":1,"e":"רובם פתרו מהר אחרי הרמז."},{"q":"מהו \"מערך מנטלי\" (לוצ'ינס, 1942)?","o":["קיבולת זיכרון העבודה","דרך פתרון מסוימת שהתקבעה בעקבות ניסיון קודם, וקובעת כיצד ניגש לבעיה. היא עלולה למנוע מאיתנו לראות פתרון פשוט יותר","מצב רוח","ייצוג מרחבי של הבעיה"],"a":1,"e":"בבעיות מכלי המים, הנוסחה B−A−2C הפכה למערך מנטלי."},{"q":"בבעיה הראשונה של לוצ'ינס (A=21, B=127, C=3, יעד 100 ליטר), מהי הנוסחה לפתרון?","o":["A+B+C","B−A−2C","A+C","B−C"],"a":1,"e":"127 − 21 − 3 − 3 = 100."},{"q":"מה מצא לוצ'ינס (1942) בבעיות 7–8, שיש להן גם פתרון פשוט?","o":["כולם השתמשו בפתרון הפשוט","רק 23% מקבוצת המערך המנטלי השתמשו בפתרון הפשוט, בעוד שבקבוצה ללא מערך מנטלי כולם השתמשו בו","אף אחד לא פתר","לא היה הבדל בין הקבוצות"],"a":1,"e":"המערך המנטלי מנע מהם לראות את הפתרון הפשוט."},{"q":"בניסוי של לוצ'ינס, מה היה תפעול המשתנה הבלתי תלוי?","o":["גודל המכלים","קבוצת מערך מנטלי, שפתרה קודם את בעיות 1–6, לעומת קבוצה ללא מערך מנטלי, שפתרה ישר את בעיות 7–8","זמן הפתרון","מספר המכלים"],"a":1,"e":"המשתנה התלוי: באיזה פתרון השתמשו."},{"q":"מי פיתחו את גישת עיבוד המידע לפתרון בעיות?","o":["ורתהיימר וקוהלר","ניואל וסיימון","טברסקי וכהנמן","קוסלין ופילישין"],"a":1,"e":"הם הדגימו אותה, בין היתר, באמצעות בעיית מגדלי האנוי."},{"q":"בגישת עיבוד המידע, מהם \"אופרטורים\"?","o":["המצב הסופי של הבעיה","פעולות שמעבירות את הבעיה ממצב אחד למצב אחר, ומוגבלות על ידי כללים","הכללים עצמם","מצבי הביניים"],"a":1,"e":"במגדלי האנוי, האופרטורים הם העברות של דיסקיות."},{"q":"מהו \"מרחב הבעיה\"?","o":["המקום הפיזי שבו פותרים","כל המצבים האפשריים שיכולים להתרחש במהלך פתרון הבעיה","המצב הראשוני בלבד","מצב המטרה בלבד"],"a":1,"e":"הוא כולל את המצב הראשוני, מצבי הביניים ומצב המטרה."},{"q":"מהו \"ניתוח אמצעים-יעד\"?","o":["ניסוי וטעייה","דרך לפתרון באמצעות מטרות ביניים שמקרבות בהדרגה למצב המטרה, ומאפשרות למצוא את הנתיב הקצר ביותר","ויתור על הבעיה","הבניה מחדש פתאומית"],"a":1,"e":"לעיתים צריך מטרת ביניים שנראית מרחיקה, ולכן יש להסתכל קדימה."},{"q":"במגדלי האנוי עם 3 דיסקיות, מהי מטרת הביניים הראשונה בניתוח אמצעים-יעד?","o":["להעביר את הדיסקית הקטנה למוט השלישי","לשחרר את הדיסקית הגדולה, כדי שאפשר יהיה להעביר אותה מהמוט השמאלי לימני","להעביר את כל הדיסקיות למוט האמצעי","לפנות את המוט השמאלי"],"a":1,"e":"אחר כך: לפנות את המוט השלישי, להעביר אליו את הדיסקית הגדולה, וכן הלאה."},{"q":"במגדלי האנוי, מדוע לעיתים מעבירים את הדיסקית הקטנה חזרה למוט השמאלי ולא לימני, אף שזה נראה מרחיק?","o":["בטעות","כדי לאפשר את מטרת הביניים הבאה: להעביר את הדיסקית הבינונית למוט הימני, על הגדולה","כי זה הכלל","כדי להאריך את הפתרון"],"a":1,"e":"מטרה שנראית מרחיקה מאפשרת את ההתקדמות. זו ההסתכלות קדימה."},{"q":"בדוגמת הטיסה מפיטסבורג לקופנהגן, מדוע נבחרה טיסה דרך אטלנטה ולא דרך פריז?","o":["כי אטלנטה קרובה יותר לקופנהגן","כי הטיסה דרך פריז לא עמדה בכללים (מרווח זמן ותקציב), ומטרת ביניים חדשה, אטלנטה, אפשרה לעמוד בהם","כי אין טיסות לפריז","בגלל מזג האוויר"],"a":1,"e":"זו דוגמה לניתוח אמצעים-יעד בחיי היומיום."},{"q":"מהי הביקורת על גישת עיבוד המידע של ניואל וסיימון?","o":["היא אינה מגדירה מצבים","פתרון בעיות מושפע גם מגורמים לא רציונליים, ובמיוחד מאופן הצגת הבעיה","היא מתאימה רק למחשבים","היא אינה כוללת מטרות ביניים"],"a":1,"e":"הדבר הודגם בבעיית לוח הדמקה הפגום."},{"q":"מהו העיקרון לפתרון בעיית לוח הדמקה הפגום (שתי פינות נגדיות הוסרו)?","o":["אפשר לכסות את הלוח ב-31 אבני דומינו","כל אבן דומינו מכסה שתי משבצות סמוכות בצבעים שונים, והוסרו שתי משבצות באותו צבע, ולכן אי אפשר לכסות את הלוח","צריך 32 אבנים","צריך לסובב את הלוח"],"a":1,"e":"נשארו 30 משבצות מצבע אחד ו-32 מהצבע השני."},{"q":"בניסוי של קפלן וסיימון (1990), איזו גרסה של לוח הדמקה הפגום נפתרה הכי מהר?","o":["הלוח הריק","לוח \"לחם וחמאה\", שבו המשבצות סומנו במילים לחם וחמאה לסירוגין","הלוח הצבוע","כל הגרסאות נפתרו באותו זמן"],"a":1,"e":"פי שניים מהר יותר מהלוח הריק, ועם פחות רמזים (1 לעומת 3.14 בממוצע)."},{"q":"מה ההסבר לכך שלוח \"לחם וחמאה\" הקל על הפתרון?","o":["המילים מצחיקות","הוא הדגיש את ההבדל ואת הקשר בין כל שתי משבצות סמוכות","הוא היה גדול יותר","הוא כלל את הפתרון"],"a":1,"e":"\"פרוטוקול חשיבה בקול\" חיזק את ההסבר."},{"q":"בעיית הנישואים הרוסיים (הייז, 1978): 32 רווקים ו-32 רווקות, ושני רווקים מתו. מדוע היא קלה יותר מבעיית לוח הדמקה?","o":["כי היא שונה במבנה","כי היא מציגה את אותה בעיה באופן שמבליט את העיקרון: כל זוג הוא גבר ואישה, ולכן 30 גברים ו-32 נשים אינם יכולים ליצור 31 זוגות","כי יש בה פחות אנשים","כי אין לה פתרון"],"a":1,"e":"זה מחזק את הטענה שאופן ההצגה משפיע על הקושי."},{"q":"מה המסקנה ממחקרי אופן הצגת הבעיה?","o":["פתרון בעיות תמיד רציונלי ומבוסס על מרחב הבעיה","לפחות בחלק מהמקרים, פתרון בעיות מושפע מאוד מאופן הצגת הבעיה, שמשפיע על היכולת לזהות את הדרך לפתרון","אופן ההצגה אינו משפיע","רק מומחים מושפעים מאופן ההצגה"],"a":1,"e":"זו ביקורת על הרציונליות המלאה שמניחה גישת עיבוד המידע."}],"hard":[{"q":"תלמיד פותר בעיות גאומטריה באמצעות נוסחה שלמד, ומפספס פתרון פשוט שמתגלה מיד כשמסתכלים על השרטוט אחרת. אילו שני מושגים מהפרק רלוונטיים?","o":["קיבעון תפקודי ומרחב הבעיה","מערך מנטלי (לוצ'ינס) והבניה מחדש של הייצוג (גשטאלט)","ניתוח אמצעים-יעד ואופרטורים","אפקט המסגור והטיית אישוש"],"a":1,"e":"המערך המנטלי מונע לראות את הפתרון הפשוט, וההבניה מחדש היא מה שמביא לתובנה."},{"q":"בניסוי של מטקאלף ווייב, נבדק פותר בעיית תובנה ומדווח על עלייה הדרגתית בתחושת \"חם\" לאורך כל הדרך. מה המשמעות?","o":["שזו בעיית תובנה טיפוסית","שהוא כנראה פתר אותה בדרך שאינה כרוכה בתובנה, או שהבעיה אינה בעיית תובנה עבורו","שהוא לא פתר אותה","שהשיטה לא עובדת"],"a":1,"e":"פתרון בתובנה מאופיין בתחושה פתאומית. התקרבות הדרגתית מאפיינת פתרון שאינו כרוך בתובנה."},{"q":"בגרסה של בעיית הנר, הקופסה ניתנת ריקה, אבל צבועה בצבעים בולטים ומונחת בנפרד. לפי הסבר הקיבעון התפקודי, מה צפוי?","o":["פחות פותרים מבתנאי \"קופסה ככלי קיבול\"","יותר פותרים מבתנאי \"קופסה ככלי קיבול\", כי הקופסה אינה מוצגת בתפקידה המוכר ולכן קל יותר לראות בה מדף","אין הבדל","אף אחד לא יפתור"],"a":1,"e":"מה שמכשיל הוא הבלטת התפקוד המוכר. כשהוא אינו מוצג, הקיבעון נחלש."},{"q":"במגדלי האנוי עם 3 דיסקיות, מהו מספר הצעדים המינימלי, ומה זה מלמד על ניתוח אמצעים-יעד?","o":["3 צעדים, כי יש 3 דיסקיות","7 צעדים. המסלול הקצר דורש מטרות ביניים, וחלקן נראות מרחיקות, כמו החזרת הדיסקית הקטנה לאחור","5 צעדים","9 צעדים"],"a":1,"e":"2 בחזקת 3 פחות 1 = 7. הפתרון היעיל מחייב הסתכלות קדימה."},{"q":"לפי גישת עיבוד המידע, מה ההבדל בין \"מצב ביניים\" לבין \"מטרת ביניים\"?","o":["אין הבדל","מצב ביניים הוא כל מצב אפשרי במרחב הבעיה. מטרת ביניים היא מצב שהפותר בוחר לכוון אליו כחלק מניתוח אמצעים-יעד","מטרת ביניים היא המצב הסופי","מצב ביניים הוא אופרטור"],"a":1,"e":"מרחב הבעיה כולל את כל מצבי הביניים. ניתוח אמצעים-יעד בוחר מתוכם מטרות."},{"q":"מדוע ממצאי קפלן וסיימון על לוח הדמקה הפגום מאתגרים את גישת עיבוד המידע של ניואל וסיימון?","o":["כי הבעיה לא נפתרה","כי מרחב הבעיה זהה בכל גרסאות הלוח, ובכל זאת אופן ההצגה (למשל \"לחם וחמאה\") שינה מאוד את מהירות הפתרון. כלומר לא רק מבנה הבעיה קובע","כי לא היו מטרות ביניים","כי השתמשו בדומינו"],"a":1,"e":"פתרון רציונלי שמבוסס על מרחב הבעיה לא אמור להיות תלוי בתוויות."},{"q":"איזה ניסוח של בעיית לוח הדמקה הפגום צפוי להיות הקל ביותר, ומדוע?","o":["לוח ריק, כי יש בו פחות הסחות","ניסוח כמו \"הנישואים הרוסיים\", שבו ברור מראש שכל זוג חייב לכלול שני סוגים שונים (גבר ואישה), ולכן ההבנה הנדרשת בולטת מיד","לוח צבוע בלבד","לוח עם מספרים"],"a":1,"e":"הייז (1978): ההצגה שמבליטה את העיקרון היא הקלה ביותר."},{"q":"נבדקים בבעיית שני החבלים פתרו מהר אחרי שהנסיין \"בטעות\" נדנד חבל, ורבים לא דיווחו שהרמז עזר להם. מה זה מרמז על תובנה?","o":["שהיא תמיד מודעת","שהבניה מחדש של הבעיה יכולה להיות מושפעת מרמזים בלי מודעות לכך שהם השפיעו","שהרמז לא השפיע","שהם רימו"],"a":1,"e":"הממצא תואם את התיאור של תובנה כתהליך שאינו גלוי לפותר עצמו."},{"q":"בניסוי של לוצ'ינס, מה היה קורה אילו קבוצת המערך המנטלי הייתה מקבלת את בעיות 7–8 מיד אחרי בעיה 1 ולא אחרי בעיות 2–6?","o":["אותה תוצאה בדיוק","המערך המנטלי היה צפוי להיות חלש יותר, ולכן יותר נבדקים היו מוצאים את הפתרון הפשוט, כי השימוש החוזר בנוסחה הוא שמקבע את המערך","פחות נבדקים היו פותרים","אף אחד לא היה פותר"],"a":1,"e":"החזרה על הנוסחה בבעיות 2–6 נועדה ליצור את המערך."},{"q":"איזה מהבאים הוא דוגמה לניתוח אמצעים-יעד בחיי היומיום?","o":["פתרון חידה בהברקה פתאומית","תכנון נסיעה: קובעים קודם להגיע לתחנה המרכזית (מטרת ביניים), אף שהיא בכיוון ההפוך, כי משם יש רכבת ישירה ליעד","שימוש במטבע כמברג","בחירה באקראי"],"a":1,"e":"כמו הטיסה דרך אטלנטה: מטרת ביניים שנראית מרחיקה ומאפשרת לעמוד בכללים."}]},{"id":"c13","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 13: עריכת שיפוטים וקבלת החלטות","questions":[{"q":"מהן יוריסטיקות?","o":["חוקים לוגיים מדויקים שתמיד מובילים לתשובה נכונה","קיצורי דרך מנטליים (כללי אצבע) שמאפשרים להסיק מסקנות במהירות בתנאי אי-ודאות, ולרוב מובילים לתשובה נכונה אבל אינם חסינים מטעויות","זיכרונות של אירועים","שיטות מחקר"],"a":1,"e":"טברסקי וכהנמן תיארו את יוריסטיקת הזמינות ואת יוריסטיקת היציגות."},{"q":"מהי יוריסטיקת הזמינות (טברסקי וכהנמן, 1973)?","o":["שיפוט לפי דמיון לקטגוריה","שיפוט אירועים שעולים מהר יותר בזיכרון כבעלי סיכוי גבוה יותר להתרחש","בחירה באפשרות הזמינה ביותר בחנות","הטיה לטובת המצב הקיים"],"a":1,"e":"הבעיה היא שזמינות בזיכרון אינה תמיד מייצגת את השכיחות בעולם."},{"q":"בניסוי של ליכטנשטיין ועמיתים (1978), נבדקים שפטו איזו סיבת מוות שכיחה יותר (למשל רצח לעומת דלקת תוספתן). מה הסביר את הטעויות?","o":["יוריסטיקת היציגות","יוריסטיקת הזמינות: אירועים שקל לשלוף מהזיכרון, למשל כאלה שמופיעים בתקשורת, נשפטו כשכיחים יותר","אפקט המסגור","הטיית סטטוס-קוו"],"a":1,"e":"לכן הוערכו כשכיחות יותר סיבות מוות דרמטיות שמסוקרות בתקשורת."},{"q":"מטיילת פגשה בפריז מלצר לא אדיב ונדחפה ברכבת התחתית, והסיקה שפריזאים לא מנומסים. איזו תופעה זו?","o":["הטיית אישוש","מתאם שווא שנובע מיוריסטיקת הזמינות, ועומד בבסיס סטריאוטיפים","אפקט המסגור","חוק המספרים הגדולים"],"a":1,"e":"מעט מקרים זמינים בזיכרון יוצרים מתאם מדומה בין שתי תכונות לא קשורות: \"פריזאי\" ו\"לא מנומס\"."},{"q":"מהי יוריסטיקת היציגות?","o":["שיפוט לפי מהירות השליפה מהזיכרון","הנטייה לשפוט את הסיכוי שמקרה שייך לקטגוריה לפי הדמיון בינו לבין הדימוי שיש לנו על הקטגוריה","שיפוט לפי שיעור הבסיס","שיפוט לפי ניסוח"],"a":1,"e":"היא מובילה, למשל, להתעלמות משיעור הבסיס."},{"q":"רוברט מרכיב משקפיים, מדבר בשקט וקורא הרבה. רוב האנשים שופטים שסביר יותר שהוא ספרן ולא חקלאי. מהי הטעות?","o":["אין טעות","התעלמות משיעור הבסיס: יש הרבה יותר גברים חקלאים מגברים ספרנים","הפרת כלל החיתוך","יוריסטיקת הזמינות"],"a":1,"e":"התיאור תואם את הייצוג של ספרן (יציגות), ולכן מתעלמים מהשכיחות באוכלוסייה."},{"q":"מה מצאו טברסקי וכהנמן (1974) לגבי שימוש בשיעור הבסיס?","o":["אנשים תמיד מתעלמים משיעור הבסיס","כשמוצג רק שיעור הבסיס אנשים מתבססים עליו, וכשמוצגים גם פרטים תיאוריים הם מתעלמים ממנו","אנשים תמיד משתמשים בשיעור הבסיס","שיעור הבסיס אינו רלוונטי"],"a":1,"e":"הפרטים התיאוריים מפעילים את יוריסטיקת היציגות."},{"q":"בבעיית גלית (טברסקי וכהנמן, 1983), 85% מהנבדקים בחרו ש\"גלית היא פקידת בנק פמיניסטית\" סביר יותר מ\"גלית היא פקידת בנק\". איזה כלל הופר?","o":["חוק המספרים הגדולים","כלל החיתוך: הסיכוי לצירוף של שתי תכונות קטן בהכרח (או שווה) לסיכוי לכל אחת מהן בנפרד","שיעור הבסיס","תוחלת התועלת"],"a":1,"e":"התכונה \"פמיניסטית\" מייצגת את התיאור (יציגות), ולכן הצירוף נשפט כסביר יותר."},{"q":"בעיית בתי החולים: בבית חולים גדול נולדים כ-45 תינוקות ביום ובקטן כ-15. באיזה בית חולים יתועדו יותר ימים שבהם יותר מ-60% מהנולדים זכרים?","o":["בבית החולים הגדול","בבית החולים הקטן","מספר שווה בשניהם","לא ניתן לדעת"],"a":1,"e":"לפי חוק המספרים הגדולים, מדגם קטן סוטה יותר מהאוכלוסייה. 56% מהנבדקים ענו בטעות שלא יהיה הבדל."},{"q":"מדוע רוב הנבדקים טעו בבעיית בתי החולים?","o":["הם לא הבינו את השאלה","לפי יוריסטיקת היציגות, שני בתי החולים מייצגים את האוכלוסייה באותה מידה, והם התעלמו מכך שמדגם גדול מייצג יותר טוב","הם השתמשו בשיעור הבסיס","הם הושפעו מהמסגור"],"a":1,"e":"זו הפרה של חוק המספרים הגדולים."},{"q":"בניסוי של לורד ועמיתים (1979) על עונש מוות, מה נמצא?","o":["כולם השתכנעו מאותם מחקרים","מחקרים שהראו שעונש מוות מרתיע דורגו כמשכנעים בקרב התומכים בו וכלא משכנעים בקרב המתנגדים לו, ולהפך","עמדות לא השפיעו","כולם דחו את כל המחקרים"],"a":1,"e":"זו הטיה לטובתי, שהיא מקרה של הטיית אישוש."},{"q":"מהי \"הטיית אישוש\"?","o":["הנטייה לבדוק נתונים כך שיפריכו השערות","הנטייה לבדוק נתונים כך שיאששו השערות ולא יפריכו אותן","הנטייה לשנות דעה","הנטייה להישאר במצב הקיים"],"a":1,"e":"הטיה לטובתי היא אחד המקרים שלה."},{"q":"במשימה של ווסון (1960), נבדקים קיבלו את השלשה 2, 4, 6 והתבקשו לגלות את הכלל. מה קרה?","o":["רוב הנבדקים גילו מיד את הכלל","רובם ניחשו \"מספרים עולים ב-2\" ובדקו רק שלשות שתאמו את השערתם, בעוד שהכלל היה \"מספרים בסדר עולה\"","הנבדקים לא הציעו שלשות","הכלל היה \"מספרים זוגיים\""],"a":1,"e":"זו הטיית אישוש: הם לא בדקו שלשה כמו 2, 4, 5 שהייתה מפריכה את ההשערה."},{"q":"מה היה עוזר לנבדקים במשימה של ווסון לגלות את הכלל הנכון?","o":["לבדוק עוד שלשות שעולות ב-2","לבדוק שלשות שמנוגדות להשערה שלהם (למשל 2, 4, 5), כדי לנסות להפריך אותה","לנחש מהר","לא לבדוק כלל"],"a":1,"e":"ניסיון הפרכה הוא ההפך מהטיית אישוש."},{"q":"לפי גישת התועלת לקבלת החלטות –","o":["אנשים בוחרים לפי רגשותיהם","אנשים בוחרים בחלופה שמובילה לתוחלת התועלת (התועלת הממוצעת) הגבוהה ביותר","אנשים בוחרים באקראי","אנשים בוחרים לפי ברירת המחדל"],"a":1,"e":"ממצאים רבים מראים שאנשים לא תמיד פועלים כך, למשל ממשיכים להמר במכונות מזל."},{"q":"בניסוי של דנס-ראג' ואפשטיין (1994), נבדקים בחרו בין קערה עם 1 סוכרייה אדומה מתוך 10 לבין קערה עם 7 אדומות מתוך 100. מה נמצא?","o":["כולם בחרו בקערה הקטנה","נבדקים רבים בחרו בקערה עם 100 הסוכריות, אף שהסיכוי לשלוף ממנה אדומה נמוך יותר (7% לעומת 10%)","לא הייתה העדפה","הנבדקים סירבו לבחור"],"a":1,"e":"זה ממצא שמנוגד לגישת התועלת."},{"q":"בניסוי של קרמר ועמיתים (2006) על הטלת מטבע (זכייה של 5$ או הפסד של 3$), מה נמצא?","o":["הנבדקים העריכו נכון את השפעת ההפסד","לפני ההטלה הנבדקים צפו שההפסד יוריד את האושר יותר משהזכייה תעלה אותו, אבל בפועל ההשפעה השלילית של ההפסד הייתה קטנה בהרבה ממה שחזו","ההפסד השפיע יותר ממה שחזו","הזכייה השפיעה יותר ממה שחזו"],"a":1,"e":"אנשים מנבאים באופן לא מדויק את התוצאות הרגשיות שלהם, ובמיוחד את השליליות."},{"q":"מה גורם להערכת היתר של השפעת ההפסד בניסוי של קרמר ועמיתים?","o":["אנשים אינם אוהבים כסף","בזמן הניבוי אנשים אינם לוקחים בחשבון את מנגנוני ההתמודדות, כמו רציונליזציה (\"עדיין יצאתי ברווח של 2$\")","ההפסד היה גדול מאוד","הנבדקים לא הבינו את המשימה"],"a":1,"e":"מנגנוני ההתמודדות מקטינים את הפגיעה בפועל."},{"q":"בניסוי של לרנר ועמיתים (2004), מה עשו נבדקים בתנאי העצב ובתנאי הגועל כשהתבקשו למכור מארז מרקרים?","o":["דרשו מחיר גבוה יותר","היו מוכנים למכור במחיר נמוך יותר מהקבוצה הנייטרלית","סירבו למכור","לא היה הבדל"],"a":1,"e":"גועל גורם לצורך להיפטר מדברים, ועצב גורם לצורך בשינוי."},{"q":"בניסוי של לרנר ועמיתים, מה עשתה הקבוצה העצובה בתנאי הקנייה?","o":["העדיפה כסף על המארז","העדיפה לקבל את המארז עד לסכום כסף גבוה יותר משאר הקבוצות","לא רצתה את המארז","התנהגה כמו הקבוצה הנייטרלית"],"a":1,"e":"הצורך בשינוי בא לידי ביטוי. בקבוצת הגועל לא הייתה השפעה, כי לא היה ממה להיפטר. מסקנה: רגשות מקריים משפיעים על החלטות כלכליות."},{"q":"בניסוי של שן ועמיתים (2010), רופאים החליטו על ניתוח קיסרי. מתי המליצו עליו יותר רופאים?","o":["כשהמקרה הוצג לבדו","כשהמקרה הוצג אחרי מקרים חמורים","כשהמקרה הוצג אחרי מקרים לא חמורים (72%, לעומת כ-50% בתנאים האחרים)","לא היה הבדל"],"a":2,"e":"קבלת החלטות מושפעת מההקשר, כלומר ממידע שהתקבל מיד לפני כן."},{"q":"מדוע יותר מ-99% מהצרפתים חתומים על כרטיס תורם איברים, לעומת 28% מהאמריקנים?","o":["הצרפתים אוהבים יותר לתרום","בצרפת יש הליך \"בחירה לצאת\" (ברירת המחדל היא תורם), ובארה\"ב הליך \"בחירה להיכנס\". הטיית הסטטוס-קוו גורמת לאנשים להישאר בברירת המחדל","בצרפת חובה לתרום","אין הסבר"],"a":1,"e":"לפי גישת התועלת, אופן הצגת הבחירה לא אמור להשפיע."},{"q":"מהי \"הטיית הסטטוס-קוו\"?","o":["הנטייה לשנות את המצב הקיים","הנטייה להישאר במצב הקיים ולא לבחור באפשרות שמשנה אותו","הנטייה לבחור באפשרות הזולה","הנטייה לבחור באפשרות הנפוצה"],"a":1,"e":"היא מסבירה את ההשפעה של ברירת המחדל."},{"q":"במחקר של טברסקי וכהנמן (1981) על המחלה שצפויה להרוג 600 איש, איזו תוכנית העדיפו רוב הנבדקים כשהתוצאות נוסחו במונחי הצלה (\"200 ינצלו בוודאות\" לעומת סיכוי של ⅓ ש-600 ינצלו)?","o":["את התוכנית ההסתברותית (72%)","את התוכנית הוודאית (72%)","חצי-חצי","אף אחת"],"a":1,"e":"זו שנאת סיכון במסגור של רווחים."},{"q":"במשימת הבחירה השנייה (\"400 ימותו בוודאות\" לעומת סיכוי של ⅓ שאיש לא ימות), מה העדיפו רוב הנבדקים?","o":["את התוכנית הוודאית (78%)","את התוכנית ההסתברותית (78%)","חצי-חצי","אף אחת"],"a":1,"e":"זו לקיחת סיכון במסגור של הפסדים."},{"q":"אפקט המסגור בניסוי של טברסקי וכהנמן (1981) מתבטא בכך ש –","o":["כשהבחירה מוצגת כרווחים (הצלת חיים) אנשים שונאים סיכון, וכשהיא מוצגת כהפסדים (אובדן חיים) הם לוקחים סיכון","כשהבחירה מוצגת כרווחים אנשים לוקחים סיכון, וכשהיא מוצגת כהפסדים הם שונאים סיכון","בשני הניסוחים אנשים שונאים סיכון","בשני הניסוחים אנשים לוקחים סיכון"],"a":0,"e":"זו שאלה מהמבחן לדוגמה. התוכניות זהות בתוצאותיהן, ורק הניסוח שונה."},{"q":"מדוע אפקט המסגור סותר את גישת התועלת?","o":["כי התוכניות שונות בתוחלת שלהן","כי שתי משימות הבחירה זהות לגמרי בתוצאות (א'=ג', ב'=ד'), ובכל זאת הבחירות שונות רק בגלל הניסוח","כי אנשים בחרו באקראי","הוא אינו סותר אותה"],"a":1,"e":"לפי גישת התועלת, הניסוח לא אמור להשפיע."},{"q":"מהו מתאם שווא?","o":["מתאם אמיתי בין משתנים","קשר מדומה שאנו יוצרים בין אירועים או תכונות שקל לנו להיזכר בהם יחד, אף שאינם קשורים באמת","שיעור הבסיס","תוצאה סטטיסטית מובהקת"],"a":1,"e":"מתאם שווא נובע מיוריסטיקת הזמינות, והוא מקור לסטריאוטיפים רבים."},{"q":"איזה מהבאים הוא דוגמה לממצא שמנוגד לגישת התועלת?","o":["אנשים בוחרים בחלופה בעלת התוחלת הגבוהה","אנשים ממשיכים להמר במכונות מזל למרות שתוחלת התועלת הכספית שלילית","אנשים חוסכים כסף","אנשים משווים מחירים"],"a":1,"e":"גם הניסוי של דנס-ראג' ואפשטיין, אפקט המסגור ותרומת האיברים מראים זאת."},{"q":"איזה מהבאים אינו גורם שהוצג בפרק כמשפיע על קבלת החלטות בניגוד לגישת התועלת?","o":["רגשות (מקריים או צפויים)","ההקשר הקודם","אופן הצגת הבחירה (ברירת מחדל, מסגור)","תוחלת התועלת של החלופות"],"a":3,"e":"תוחלת התועלת היא בדיוק מה שגישת התועלת מניחה שקובע את הבחירה. שאר הגורמים מראים סטייה ממנה."}],"hard":[{"q":"אחרי סדרה של כתבות על התקפות כרישים, אנשים מעריכים שמוות מכריש שכיח יותר ממוות מנפילה מסולם. איזו יוריסטיקה פועלת, ומה הטעות?","o":["יציגות, התעלמות משיעור הבסיס","זמינות: מקרים שסוקרו בתקשורת עולים בקלות לזיכרון ולכן נשפטים כשכיחים, אף שבפועל הם נדירים יותר","מסגור","הטיית אישוש"],"a":1,"e":"זה כמו בניסוי ליכטנשטיין: זמינות בזיכרון אינה שכיחות בעולם."},{"q":"\"בכיתה יש 70 סטודנטים למשפטים ו-30 למחשבים. נבחר סטודנט שאוהב משחקי מחשב ומתכנת בזמנו הפנוי.\" רוב האנשים שופטים שהוא כנראה סטודנט למחשבים. מה חסר בשיפוט שלהם?","o":["שום דבר, השיפוט נכון בוודאות","התחשבות בשיעור הבסיס: יש יותר מפי 2 סטודנטים למשפטים, ולכן גם תיאור מתאים אינו מבטל את הסיכוי הגבוה שהוא ממשפטים","התחשבות בכלל החיתוך","התחשבות במסגור"],"a":1,"e":"יציגות גורמת להתעלם משיעור הבסיס כשיש תיאור."},{"q":"איזו מהטענות הבאות סבירה פחות, לפי כלל החיתוך, על אדם שתואר כחובב טבע?","o":["הוא מורה","הוא מורה וחבר בארגון ירוק","שתיהן סבירות באותה מידה","לא ניתן לדעת"],"a":1,"e":"צירוף של שתי תכונות אינו יכול להיות סביר יותר מכל אחת מהן לבד, גם אם הוא נשמע מייצג יותר."},{"q":"מטילים מטבע 10 פעמים ומקבלים 7 עצים. מטילים 1000 פעמים. מה סביר יותר?","o":["שוב בערך 70% עצים","שאחוז העצים יהיה קרוב יותר ל-50%, כי במדגם גדול הסטייה מהאוכלוסייה קטנה (חוק המספרים הגדולים)","פחות מ-30% עצים","בדיוק 50%"],"a":1,"e":"זה ההיגיון של בעיית בתי החולים: מדגמים קטנים סוטים יותר."},{"q":"חוקר שמאמין שקפה משפר זיכרון בודק רק נבדקים ששתו קפה ומוצא שזיכרונם טוב. איזו הטיה זו, ומה היה עליו לעשות?","o":["הטיית זמינות, לשאול יותר אנשים","הטיית אישוש: הוא בדק רק מקרים שעשויים לאשש את ההשערה. היה עליו לבדוק גם קבוצה שלא שתתה קפה, כלומר לנסות להפריך","מסגור, לנסח אחרת","אין הטיה"],"a":1,"e":"כמו במשימת 2-4-6 של ווסון: צריך לבדוק גם מקרים שיכולים להפריך."},{"q":"ניתוח מוצג למטופלים כ\"90% שיעור הישרדות\" או כ\"10% שיעור תמותה\". לפי אפקט המסגור, מה צפוי?","o":["אותה החלטה בשני המקרים","יותר מטופלים יסכימו לניתוח כשהוא מוצג במונחי הישרדות (רווח), אף שהמידע זהה","יותר יסכימו במסגור של תמותה","אף אחד לא יסכים"],"a":1,"e":"ההחלטה מושפעת מהניסוח, בניגוד לגישת התועלת."},{"q":"חברה משנה את ברירת המחדל כך שכל עובד מצטרף אוטומטית לתוכנית חיסכון, וצריך לבקש כדי לצאת. אחוז החוסכים קופץ. מה ההסבר?","o":["העובדים הבינו פתאום את התועלת","הטיית הסטטוס-קוו: אנשים נוטים להישאר בברירת המחדל, ולכן הליך \"בחירה לצאת\" מגדיל את ההשתתפות","יוריסטיקת הזמינות","אפקט המסגור בלבד"],"a":1,"e":"זה כמו בתרומת איברים בצרפת לעומת ארה\"ב."},{"q":"לפני משחק, אוהד מעריך שהפסד יגרום לו לעצב עמוק שיימשך שבוע. בפועל, אחרי יום הוא כמעט בסדר. איזה ממצא זה מדגים, ומה ההסבר?","o":["אפקט המסגור","ניבוי לא מדויק של תוצאות רגשיות (קרמר ועמיתים): בזמן הניבוי אנשים אינם מביאים בחשבון את מנגנוני ההתמודדות שיפעילו","הטיית אישוש","יוריסטיקת היציגות"],"a":1,"e":"ההשפעה השלילית של הפסד מוערכת יותר מדי."},{"q":"לפי ממצאי לרנר ועמיתים, מתי אדם צפוי למכור פריט שבבעלותו במחיר נמוך במיוחד?","o":["כשהוא במצב רוח נייטרלי","כשהוא חש גועל או עצב, גם אם הרגש נוצר מסיבה שאינה קשורה כלל לפריט","כשהוא שמח","כשהוא רעב"],"a":1,"e":"רגשות מקריים משפיעים על החלטות כלכליות: גועל מעורר צורך להיפטר, ועצב צורך בשינוי."},{"q":"רופאים המליצו יותר על ניתוח קיסרי כשהמקרה הוצג אחרי מקרים לא חמורים (72%) מאשר כשהוצג לבד (כ-50%). מה ההסבר הסביר?","o":["המקרה היה חמור יותר","לאחר מקרים שגרתיים, המקרה הנוכחי נראה חמור יותר בהשוואה, כלומר ההחלטה מושפעת מההקשר הקודם ולא רק מנתוני המקרה","הרופאים התעייפו","אין הסבר"],"a":1,"e":"שן ועמיתים (2010): קבלת החלטות מושפעת ממה שחווינו מיד קודם."}]}];
const TERMS = [{"ch":"c4","title":"פרק 4: קשב","terms":[{"id":"cocktail","name":"אפקט מסיבת הקוקטייל","one":"במסיבה רועשת שומעים רק את מי שמדבר איתך, ומתעלמים מכל השאר.","simple":"זו היכולת להתמקד במסר אחד, המסר הקשוב, ולסנן את כל המסרים האחרים שמגיעים לאוזן באותו זמן. כל הדיבורים בחדר נקלטים באוזן, אבל מעבדים רק את מה שאומר מי שמקשיבים לו. את השאר מצליחים להתעלם.","why":"האפקט ממחיש שהקשב פועל כמו פילטר שחוסם מסרים שלא רוצים לשמוע. יחד עם ממצאים נוספים הוא הוביל למודל הפילטר של ברודבנט, מודל של סלקציה מוקדמת. גישות חלופיות טענו שבכל זאת מושפעים ממשמעות המסר הלא-קשוב, למשל כשמזכירים את השם שלנו.","example":"בחתונה רועשת את מדברת עם חברה ושומעת רק אותה, למרות שמסביב עשרות אנשים מדברים.","points":["היכולת להתמקד במסר אחד (הקשוב) ולסנן את המסרים הלא-קשובים שמגיעים לאוזן בו-זמנית","במסיבה מעבדים את מה שאומר מי שמקשיבים לו ומתעלמים משאר הדיבורים בחדר","ממחיש את הקשב כפילטר שחוסם מסרים, למרות שגם הם נקלטים באוזן","הוביל (יחד עם ממצאים נוספים) למודל הפילטר של ברודבנט, מודל סלקציה מוקדמת: חסימה אחרי העיבוד הפיזיקלי ולפני העיבוד הסמנטי","גישות חלופיות: מושפעים בכל זאת ממשמעות המסר הלא-קשוב (למשל השם שלנו), ולכן הסלקציה המוקדמת שגויה"],"confuse":"אפקט סטרופ: במסיבת הקוקטייל הקשב מצליח לסנן את הגירוי הלא רלוונטי, ובסטרופ הוא לא מצליח.","original":"זוהי היכולת להתמקד בגירוי אחד, המסר הקשוב, ולסנן החוצה את כל הגירויים האחרים, המסרים הלא-קשובים, שמגיעים לאוזננו בו-זמנית. יכולת זו מתבטאת במסיבת קוקטייל, כשהאדם מקשיב ומעבד את הנאמר לו על ידי מי שהוא מקשיב לו, ומצליח להתעלם מכל הדיבורים האחרים בחדר סביבו. אפקט זה ממחיש את פעולת הקשב כפילטר (מסנן) שחוסם את המסרים שאיננו רוצים להקשיב להם למרות שגם הם נקלטים באוזננו. אפקט זה יחד עם ממצאים מחקריים נוספים הובילו למודל הפילטר/צוואר-הבקבוק של ברודבנט, שהוא מודל של סלקציה מוקדמת שמדגיש את פעולתו של הקשב כמסנן שחוסם את עיבוד המסרים הלא-קשובים מוקדם בתהליך העיבוד שלהם, מיד אחרי העיבוד הפיזיקלי, וכך מונע מהם להגיע לעיבוד סמנטי (לזיהוי של המילים בהם). גישות חלופיות טענו שגם במצבי מיקוד קשב כמו במסיבת קוקטייל או בניסויי האזנה דיכוטית, אנחנו כן מושפעים ממשמעות המסרים הלא-קשובים (למשל כשמזכירים את שמנו) ולכן גישת הסלקציה המוקדמת היא שגויה."},{"id":"stroop","name":"אפקט סטרופ","one":"כשהמילה \"אדום\" כתובה בצבע כחול, לוקח יותר זמן להגיד \"כחול\".","simple":"מבקשים מהנבדק להגיד רק באיזה צבע כתובה המילה. כשהמשמעות של המילה מתאימה לצבע שלה, למשל \"כחול\" כתוב בכחול, התשובה מהירה. כשהיא לא מתאימה, למשל \"אדום\" כתוב בכחול, התשובה איטית יותר.","why":"קריאה היא פעולה אוטומטית. משמעות המילה היא גירוי לא רלוונטי, אבל הוא חזק, ולכן הקשב לא מצליח לסנן אותו. הוא משפיע על התגובה גם כשמנסים להתעלם ממנו.","example":"כתוב על השלט \"ימינה\", אבל החץ מצביע שמאלה. לוקח רגע להבין לאן ללכת.","points":["משימה: לשיים את הצבע שבו כתובה מילת צבע","כשיש התאמה בין הצבע למשמעות מגיבים מהר, וכשאין התאמה מגיבים לאט","הנבדק מושפע ממשמעות המילה למרות שהתבקש להגיב רק לצבע","גירוי לא רלוונטי חזק ואוטומטי (קריאה) לא ניתן לסינון, והוא משפיע על התגובה"],"confuse":"אפקט מסיבת הקוקטייל: שם הקשב מצליח לסנן, ובסטרופ הוא לא מצליח.","original":"משמעו שהזמן שלוקח כדי לשיים את הצבע (לומר את השם של הצבע) שבו כתובה מילת צבע (מילה שהיא שם של צבע) הוא קצר יותר כאשר צבעה תואם למשמעותה (למשל להגיד \"כחול\" כאשר המילה הכתובה בכחול היא: \"כחול\") מאשר כאשר צבעה איננו תואם למשמעותה (למשל להגיד \"כחול\" כאשר המילה הכתובה בכחול היא: \"אדום\"). ממצא זה מעיד שלמרות שהנבדקים מתבקשים להגיב רק לצבע שבו כתובה המילה, הם בכל זאת מושפעים מהמשמעות שלה, כלומר מכך שהמשמעות שלה תואמת או מנוגדת לצבע שבו היא כתובה. האפקט מעיד על כך שכאשר הגירויים הבלתי רלוונטיים (משמעות המילים) הם חזקים ומעוררים תגובות אוטומטיות כמו תגובת הקריאה של המילה וזיהוי משמעותה, לא ניתן להתעלם מהם, כלומר הקשב אינו מצליח לסנן אותם החוצה, והם בכל זאת משפיעים על התגובה."},{"id":"binding","name":"בעיית האיגוד","one":"הצבע והצורה של כדור מעובדים במקומות שונים במוח. איך בכל זאת רואים \"כדור אדום\" אחד?","simple":"תכונות שונות של גירוי, כמו צבע, צורה, גודל, כיווניות ותנועה, מעובדות באזורים שונים במוח. השאלה היא איך המוח מחבר נכון את כל התכונות של אותו עצם. זו בעיית האיגוד.","why":"פתרון אחד שהוצע הוא תיאוריית אינטגרציית התכוניות של טריזמן. לפיה התכוניות מזוהות בשלב הקדם-קשבי באזורים שונים, ובשלב הקשב הממוקד הקשב מחבר אותן. כך נהיים מודעים לעצם עם כל תכונותיו יחד.","example":"עובר לידך אוטו צהוב שנוסע מהר. הצבע, הצורה והתנועה מעובדים בנפרד, אבל את רואה אוטו אחד, צהוב ומהיר.","points":["ממצאי מחקר המוח: תכונות שונות (צבע, צורה, גודל, כיווניות, תנועה) מעובדות באזורים שונים במוח","הבעיה: איך קושרים נכון בין התכונות של כל עצם, למרות שכל תכונה עובדה באזור אחר","פתרון מוצע: תיאוריית אינטגרציית התכוניות של טריזמן","לפיה: זיהוי תכוניות בשלב הקדם-קשבי, והקשב הממוקד מאגד את התכוניות של העצם","חיזוק לתיאוריה: ניסוי החיבורים האשלייתיים וניסוי החיפוש החזותי"],"confuse":"תאוריית האינטגרציה של תכוניות: בעיית האיגוד היא השאלה, והתיאוריה היא אחת התשובות לה.","original":"על פי ממצאים ממחקר המוח, תכונות שונות של גירויים, למשל צבע, צורה, גודל, כיווניות, תנועה וכו', מעובדות באזורים שונים במוח. עובדה יוצרת את בעיית האיגוד: כיצד אנו מצליחים לקשור נכון בין התכונות השונות של כל עצם, למרות שכל תכונה עובדה באזור מוחי אחר? אחד מהפתרונות שהוצעו לבעיה זו היא תיאוריית אינטגרציית התכוניות של טריזמן שעל פיה העיבוד והזיהוי של תכוניות מתבצע בשלב הקדם קשבי באזורים מוחיים שונים, ואילו בשלב הקשב הממוקד, הקשב הוא זה שמחבר את התכוניות השונות של הגירויים באזור שאליו הוא מופנה. כלומר הקשב הוא זה שמאגד וקושר את התכוניות השונות של עצם כך שאנו נהיים מודעים לעצם עם כל תכונותיו יחדיו. חיזוק לתיאוריה זו התקבל משני ניסויים שהוצגו בפרק: ניסוי החיבורים האשלייתיים, וניסוי החיפוש החזותי."},{"id":"dichotic","name":"האזנה דיכוטית","one":"באוזן אחת רשימת מילים אחת, באוזן השנייה רשימה אחרת, וחוזרים בקול רק על מה שבאוזן הקשובה.","simple":"זה ניסוי שבו משמיעים לנבדק שני מסרים שונים בו-זמנית, אחד לכל אוזן. הנבדק מתבקש להתמקד רק באוזן אחת, האוזן הקשובה. לרוב עושים זאת בהצללה: הוא חוזר בקול על כל מילה שהוא שומע באוזן הזו מיד אחרי ששמע אותה.","why":"הניסויים בדקו איזה עיבוד מקבל המסר הלא-קשוב. בהתחלה נמצא שמילים לא-קשובות לא מזוהות כלל, וזה הוביל לסלקציה מוקדמת. ממצאים סותרים הובילו למודל המחלש (מילים שכיחות או חשובות כן נקלטות) ולמודל הסלקציה המאוחרת (מילים לא-קשובות משפיעות על משמעות מילה דו-משמעית).","example":"שמים אוזנייה אחת עם פודקאסט ובאוזן השנייה שומעים את השיחה בחדר, ומנסים לחזור בקול על מה שאומרים בפודקאסט.","points":["ניסוי: שני מסרים שונים בו-זמנית, אחד לכל אוזן","הנבדק ממקד קשב באוזן אחת (הקשובה), למשל על ידי הצללה: חזרה בקול על כל מילה מיד אחרי ששמע אותה","מטרה: לבדוק איזה עיבוד מקבל המסר הלא-קשוב","בהתחלה: מילים לא-קשובות לא זוהו גם אחרי חזרות רבות, מה שהוביל לסלקציה מוקדמת","בהמשך: מילים שכיחות או חשובות נקלטו (מודל המחלש), ומילים לא-קשובות השפיעו על משמעות מילה דו-משמעית (סלקציה מאוחרת)"],"confuse":"אפקט מסיבת הקוקטייל: הוא תופעה מחיי היום-יום, והאזנה דיכוטית היא שיטת הניסוי שבודקת אותה במעבדה.","original":"ניסוי שבו משמיעים לנבדק שני מסרים שונים (למשל שתי רשימות מילים שונות) בו-זמנית אחד לכל אוזן. הנבדק מתבקש למקד את הקשב שלו רק באחת מהאוזניים וכך היא הופכת להיות האוזן הקשובה, למשל על ידי כך שמבקשים ממנו לבצע הצללה של המסר באוזן זו - כלומר לחזור בקול על המילים שהוא שומע באוזן זו מיד לאחר שמיעת כל מילה. ניסויים בהאזנה דיכוטית שימשו כדי לבדוק איזה עיבוד מקבל המסר הלא-קשוב (המילים שמושמעות באוזן הלא-קשובה), כחלק מהדיון לגבי פעולתו של הקשב. בתחילה התקבלו תוצאות שמראות שהמילים הלא-קשובות לא מזוהות כלל גם אם הן חוזרות מספר רב של פעמים, מה שהוביל למודל הסלקציה המוקדמת שעל פיו המסר הלא-קשוב לא מקבל עיבוד סמנטי. בהמשך התקבלו תוצאות סותרות שהובילו למודלים חלופיים: הממצא שמילים שהן שכיחות בסביבתנו או חשובות לנו - כן נקלטות לעיתים מהאוזן הלא-קשובה, מה שהוביל למודל המחלש, והממצא שהמילים מהאוזן הלא-קשובה, שכלל איננו מודעים ששמענו אותן, יכולות להשפיע על המשמעות שאנו נותנים למילים דו-משמעיות שאנו שומעים באוזן הקשובה, מה שהוביל למודל הסלקציה המאוחרת."},{"id":"illusory","name":"חיבורים אשלייתיים","one":"ראית משולש כחול ועיגול צהוב, ודיווחת שראית משולש צהוב.","simple":"נבדקים מחברים לא נכון תכוניות של גירויים שונים שהוצגו להם. למשל מדווחים על גירוי עם הצבע של גירוי אחד והצורה של גירוי אחר. זה קורה כשאין מספיק קשב לגירויים.","why":"הממצא תומך בתיאוריית אינטגרציית התכוניות של טריזמן. הוא מראה שבלי קשב התכוניות עצמן כן מעובדות, אבל החיבור הנכון שלהן נפגע. כלומר הקשב נדרש לחיבור תכוניות.","example":"ראית במבט חטוף אישה עם מעיל אדום ואיש עם כובע שחור, ואחר כך את זוכרת אישה עם כובע שחור.","points":["נבדקים תופסים חיבורים של תכוניות שהופיעו בגירויים שהוצגו, אבל לא באותו גירוי (למשל צבע של אחד וצורה של אחר)","הניסוי: הבזקה קצרה של 4 גירויים שונים בצורה, צבע, מילוי וגודל, ומשני הצדדים שתי ספרות","אחרי ההעלמות חץ מסמן מיקום של גירוי, ומבקשים לדווח קודם על הספרות ואחר כך על תכונות הגירוי שסומן","נמצאו לא מעט חיבורים אשלייתיים (משולש צהוב כשהוצגו משולש כחול ועיגול צהוב)","תמיכה באינטגרציית התכוניות: בלי מספיק קשב נפגע החיבור הנכון של התכוניות ולא העיבוד שלהן עצמן"],"confuse":"חיפוש חיבורי: שניהם תומכים בטריזמן, אבל בחיבורים אשלייתיים מודדים טעויות בדיווח, ובחיפוש חיבורי מודדים זמן תגובה.","original":"ממצא שנותן תמיכה לתיאוריית אינטגרציית התכוניות של טריזמן. הממצא הוא שנבדקים תופסים חיבורים של תכוניות שהופיעו בגירויים שהוצגו להם אך לא באותו גירוי, כלומר מחברים לא נכון את התכוניות של הגירויים השונים שהוצגו להם, לדוגמא מדווחים על גירוי שמורכב מצבע של גירוי אחד וצורה של גירוי אחר. במחקר שבו נתקבלו חיבורים אשלייתיים הובזקו לנבדקים 4 גירויים בעלי צורות, צבעים, מילויים וגדלים שונים, כשמצידן הופיעו שתי ספרות. מיד לאחר העלמות תצוגת הגירויים הופיע חץ שמצביע על מיקום אחד מהגירויים, והנבדקים התבקשו קודם לציין מה היו הספרות ואחר כך מה היו התכונות שהופיעו בגירוי שמיקומו סומן להם. נמצא שהנבדקים דיווחו לא מעט חיבורים אשלייתיים, למשל דיווחו על משולש צהוב, כאשר בפועל הוצג להם משולש כחול ועיגול צהוב. ממצא זה תומך בתיאורייה של אינטגרציית התכוניות בכך שהוא מראה שכאשר אין מספיק קשב לגירויים (הגירויים הוצגו לזמן קצרצר והקשב של הנבדקים הופנה בעיקר לספרות בצדדים), מה שנפגע מהחוסר בקשב הוא לא העיבוד של התכוניות עצמן אלא החיבור הנכון שלהן, כלומר שהקשב נדרש לחיבור תכוניות."},{"id":"conjunction","name":"חיפוש חיבורי","one":"מחפשים קו ירוק ואופקי בין קווים ירוקים אנכיים וקווים אדומים אופקיים, וככל שיש יותר מסיחים זה לוקח יותר זמן.","simple":"זה אחד משני התנאים בניסוי החיפוש החזותי של טריזמן. גירוי המטרה שונה מהמסיחים רק בשילוב של שתי תכוניות. לכן לא מספיק לחפש צבע או כיוון לבד, צריך גירוי שיש בו את שניהם. נמצא שזמן התגובה עולה ככל שיש יותר מסיחים.","why":"התוצאה תומכת בתיאוריית אינטגרציית התכוניות, שלפיה הקשב נדרש לחיבור תכוניות. בחיפוש חיבורי מפנים קשב לגירויים אחד אחרי השני כדי לחבר את התכוניות בכל אחד. ככל שיש יותר גירויים, צריך בממוצע יותר הפניות קשב, ולכן זמן התגובה עולה.","example":"מחפשים בחניון מכונית לבנה מסוג מסוים, כשיש הרבה מכוניות לבנות מסוגים אחרים והרבה מכוניות מאותו סוג בצבעים אחרים.","points":["אחד משני התנאים בניסוי החיפוש החזותי של טריזמן (תמיכה באינטגרציית התכוניות)","משימה: להגיב מהר אם גירוי המטרה נמצא בתצוגה עם מספר משתנה של גירויים","גירוי המטרה שונה מהמסיחים רק בשילוב של שתי תכוניות (קו ירוק אופקי בין ירוקים אנכיים ואדומים אופקיים)","ממצא: זמן התגובה עולה עם כמות המסיחים","הסבר: נדרשות הפניות קשב לכל גירוי כדי לחבר תכוניות, ולכן יותר גירויים דורשים יותר הפניות קשב"],"confuse":"חיפוש תכוניתי: שם המטרה שונה בתכונית אחת, לא נדרש קשב, וזמן התגובה קבוע.","original":"זהו אחד משני התנאים בניסוי החיפוש החזותי של טריזמן שנועד לתמוך בתיאורית אינטגרציית התכוניות. בניסוי הבזיקו לנבדקים תצוגה שכוללת מספר משתנה של גירויים, והנבדקים התבקשו להגיב מהר ככל האפשר אם בין הגירויים נכלל הגירוי שהוגדר להם כגירוי מטרה שאותו עליהם לחפש, או שאיננו נכלל בתצוגה. בתנאי הניסוי שנקרא \"חיפוש חיבורי\" גירוי המטרה היה שונה מהמסיחים רק בשילוב של שתי תכוניות, למשל גירוי המטרה הוא קו אופקי ירוק והמסיחים הם קווים אנכיים ירוקים, וקווים אופקיים אדומים (לכן כדי לקבוע אם גירוי המטרה מופיע לא מספיק לחפש קו ירוק או קו אופקי, אלא רק קו שהוא גם ירוק וגם אופקי). הממצא של החיפוש החיבורי היה שזמן התגובה עלה עם כמות המסיחים. תוצאה זו תומכת בתיאוריית אינטגרציית התכוניות שטוענת שהקשב נדרש לחיבור תכוניות, ולכן נובע ממנה שהחיפוש החיבורי מתבסס על הפניות קשב לגירויים לצורך חיבור התכוניות בכל גירוי. באופן זה ניתן להסביר מדוע זמן התגובה עולה עם גדילת מספר המסיחים, כיון שככל שיש יותר גירויים לבדוק נדרשות בממוצע יותר הפניות קשב. בתנאי האחר של הניסוי, חיפוש המטרה לא הצריך לחבר תכוניות אלא התבסס על תכונית בודדת (חיפוש תכוניתי), לכן שם לא נדרש הקשב, ובהתאם נמצא שבחיפוש התכוניתי זמן התגובה הוא קבוע ולא תלוי במספר המסיחים."},{"id":"feature","name":"חיפוש תכוניתי","one":"קו אופקי אחד בין הרבה קווים אנכיים \"קופץ\" לעין, לא משנה כמה קווים יש.","simple":"זה התנאי השני בניסוי החיפוש החזותי של טריזמן. גירוי המטרה שונה מכל המסיחים בתכונית אחת בלבד, למשל קו אופקי בין קווים אנכיים. מספיק לזהות את התכונית הזו כדי למצוא אותו. נמצא שזמן התגובה לא מושפע מכמות המסיחים.","why":"התוצאה תומכת בתיאוריית אינטגרציית התכוניות. לפיה זיהוי תכוניות בנפרד קורה בשלב הקדם-קשבי, לא דורש הפניות קשב ויכול לקרות במקביל על כל הגירויים. לכן יותר מסיחים לא מאריכים את זמן התגובה.","example":"מחפשים בלון אדום אחד בין עשרות בלונים כחולים. רואים אותו מיד, גם אם יש עוד הרבה בלונים.","points":["אחד משני התנאים בניסוי החיפוש החזותי של טריזמן (תמיכה באינטגרציית התכוניות)","גירוי המטרה שונה מכל המסיחים בתכונית אחת (קו אופקי בין קווים אנכיים)","מציאת המטרה מבוססת רק על זיהוי תכוניות בנפרד","ממצא: זמן התגובה לא הושפע מכמות המסיחים","הסבר: זיהוי תכוניות בנפרד הוא קדם-קשבי, לא דורש קשב ומתבצע במקביל על כל הגירויים"],"confuse":"חיפוש חיבורי: שם צריך לחבר שתי תכוניות, נדרש קשב, וזמן התגובה עולה עם מספר המסיחים.","original":"זהו אחד משני התנאים בניסוי החיפוש החזותי של טריזמן שנועד לתמוך בתיאורית אינטגרציית התכוניות. בניסוי הבזיקו לנבדקים תצוגה שכוללת מספר משתנה של גירויים, והנבדקים התבקשו להגיב מהר ככל האפשר אם בין הגירויים נכלל הגירוי שהוגדר להם כגירוי מטרה שאותו עליהם לחפש, או שאיננו נכלל בתצוגה. בתנאי שנקרא \"חיפוש תכוניתי\", גירוי המטרה שונה מכל המסיחים בתכונית אחת, למשל קו אופקי כאשר כל המסיחים הם קווים אנכיים, ולכן מציאת המטרה מתבססת רק על זיהוי תכוניות בנפרד (במקרה זה: זיהוי האוריינטציה: קו אופקי). הממצא של החיפוש התכוניתי היה שזמן התגובה לא הושפע מכמות המסיחים. תוצאה זו תומכת בתיאוריית אינטגרציית התכוניות שטוענת שזיהוי תכוניות בנפרד מתרחש בשלב הקדם-קשבי, ולכן איננו דורש הפניות של קשב ויכול להתבצע במקביל על כל הגירויים, ולכן גדילת מספר המסיחים איננה מאריכה את זמן התגובה בחיפוש התכוניתי. בתנאי האחר של הניסוי, חיפוש המטרה הצריך לחבר תכוניות (חיפוש חיבורי), לכן שם נדרשות הפניות של הקשב כדי לחבר את התכוניות בכל גירוי, ובהתאם נמצא שם שזמן התגובה גדל עם גדילת מספר המסיחים."},{"id":"sameobject","name":"יתרון אותו-עצם","one":"רמז בקצה אחד של מלבן מזרז תגובה גם בקצה השני של אותו מלבן, יותר מאשר במלבן השכן באותו מרחק.","simple":"מופיע רמז מטרים באזור אחד של עצם. אחר כך מופיע גירוי מטרה. כשהמטרה מופיעה באותו עצם, מגיבים מהר יותר מאשר כשהיא מופיעה בעצם אחר. וזה גם כשהמרחק מהרמז זהה בשני המקרים.","why":"הממצא מראה שהפניית קשב למקום אחד בעצם משפרת את התגובה לכל העצם, כולל אזורים אחרים שלו. כלומר הקשב משפר את העיבוד של העצם כולו, ולא רק של המיקום שאליו הוא מופנה.","example":"שמת לב לכתם בפינה של שולחן ארוך. אם משהו זז בפינה השנייה של אותו שולחן, תבחיני בו מהר יותר מאשר אם זה קורה על כיסא סמוך באותו מרחק.","points":["זמן תגובה קצר יותר למטרה שמופיעה באותו עצם שבאזור אחר שלו הופיע רמז מטרים, לעומת מטרה בעצם אחר","המרחק בין המטרה לרמז זהה בשני המצבים","הניסוי: שני מלבנים מאונכים, עיניים מקובעות על + במרכז (קשב סמוי בלי הפניית מבט), רמז מדגיש קצה של מלבן, ואז ריבוע כהה שיש ללחוץ כשמבחינים בו","תגובה מהירה יותר כשהריבוע הופיע בצד השני של אותו מלבן מאשר במלבן שלא הוטרם","מסקנה: הקשב משפר את העיבוד של העצם כולו ולא רק את המיקום שאליו הופנה"],"confuse":"שיטת הרמז המטרים של פוזנר: שם הקשב מתואר כזרקור למיקום, וביתרון אותו-עצם הוא מתפשט על כל העצם.","original":"זהו הממצא של זמן התגובה הקצר יותר עבור גירוי מטרה שמופיע באותו עצם שבאזור אחר שלו הופיע מיד קודם לכן רמז מטרים, מאשר עבור גירוי מטרה שמופיע בעצם אחר. זמן התגובה בתוך אותו עצם הוא קטן יותר אפילו שהמרחק של גירוי המטרה מן הרמז המטרים בשני המצבים (באותו עצם או בעצם אחר) הוא זהה. יתרון אותו עצם תומך בכך שהפנייה של קשב למיקום כלשהו בעצם משפרת התגובה לכל העצם כולל לאזורים אחרים שלו, יותר מאשר לאזורים קרובים אחרים שאינם כלולים בעצם, כלומר הקשב משפר את העיבוד של העצם כולו ולא רק את המיקום שאליו הוא מופנה. בניסוי שבו התקבל הממצא של יתרון אותו-עצם הוצגו לנבדקים שני מלבנים מאונכים אחד בכל צד של המסך כאשר הנבדק מקבע את עיניו על סימן הפיקסציה (סימן +) במרכז המסך לאורך הניסוי (זאת כדי לבדוק קשב סמוי, שאיננו מערב את ההשפעה של הפניית מבט). באחד משני הקצוות של אחד המלבנים הופיע הרמז המטרים (הדגשה של קו הגבול של אחד משני קצוות המלבן) ומיד אחר כך הופיע בקצה של אחד משני המלבנים ריבוע כהה, והנבדקים התבקשו ללחוץ על מקש ברגע שהבחינו בהופעת הריבוע הכהה. נמצא שכאשר הריבוע הכהה הופיע בצד השני של אותו מלבן (שבו הופיע קודם לכן הרמז המטרים) התגובה של הנבדקים הייתה מהירה יותר מאשר בתנאי שבו הריבוע הכהה הופיע במלבן שלא הוטרם אפילו שהוא היה באותו מרחק מהרמז המטרים כמו בתנאי אותו-עצם."},{"id":"broadbent","name":"מודל הפילטר של ברודבנט/מודל של סלקציה מוקדמת","one":"רק מה שעבר את הפילטר מזוהה. כל השאר נשאר צלילים בלי משמעות.","simple":"זה מודל של קשב שמיעתי. לפיו הפילטר הקשבי נמצא מוקדם בעיבוד: אחרי העיבוד הפיזיקלי ולפני הזיהוי הסמנטי. הפילטר בוחר את המסר הקשוב לפי מאפיין פיזיקלי, כמו קול הדובר או האוזן. רק המסר הזה מגיע לגלאי ומזוהה, והמילים הלא-קשובות נשארות צלילים בלבד.","why":"המודל נתמך בניסוי האזנה דיכוטית שהראה שלא זוכרים בכלל מילים מהאוזן הלא-קשובה, גם אם חזרו הרבה פעמים. ממצאים סותרים הובילו למודל המחלש (מילים שכיחות או חשובות כן נקלטות) ולמודל הסלקציה המאוחרת (מילים לא-קשובות משפיעות על משמעות מילה דו-משמעית).","example":"בטלפון בתחנה רועשת את מתמקדת בקול של מי שמדבר איתך. לפי ברודבנט, הקריאות ברמקול מגיעות אלייך רק כרעש, בלי שתביני אף מילה.","points":["מודל של קשב שמיעתי, מודל של סלקציה מוקדמת","הפילטר ממוקם מוקדם: אחרי העיבוד הפיזיקלי ולפני העיבוד/הזיהוי הסמנטי","הפילטר בוחר את המסר הקשוב לפי מאפיין פיזיקלי (קול הדובר, האוזן)","רק המסר הקשוב מגיע לגלאי ומזוהה, והמילים הלא-קשובות נשארות צלילים שלא זוהו","תמיכה: בהאזנה דיכוטית לא זכרו מילים מהאוזן הלא-קשובה גם אחרי חזרות רבות. ממצאים סותרים הובילו למודל המחלש ולסלקציה מאוחרת"],"confuse":"מודל המחלש: גם הוא לפני העיבוד הסמנטי, אבל רק מחליש את המסר הלא-קשוב ולא חוסם אותו לגמרי.","original":"המודל של ברודבנט הוא אחד מהמודלים של קשב שמיעתי. מודל זה הוא מודל של סלקציה מוקדמת בכך שהוא טוען שהסלקציה/הסינון שעורך הקשב מתרחשת בפילטר הקשבי שממוקם בשלב מוקדם בתהליך העיבוד התפיסתי, אחרי העיבוד הפיזיקלי ולפני העיבוד/הזיהוי הסמנטי. לכן, רק המילים שיעברו את הפילטר יזוהו ע\"י הגלאי בהמשך העיבוד, ושאר המילים, כלומר המילים הלא-קשובות, יישארו כצלילים בלבד שקיבלו רק עיבוד פיזיקלי ולא זוהו. על פי מודל זה הפילטר הקשבי בורר את המסר הקשוב על סמך מאפיין פיזיקלי, למשל מאפייני קולו של הדובר שאנחנו רוצים להקשיב לו או האוזן שאנחנו רוצים להקשיב לה, ורק המסר הקשוב יגיע לגלאי ויזוהה. הממצא מניסויי האזנה דיכוטית שתמך במודל זה הוא הניסוי שהראה שאיננו זוכרים כלל מילים שהופיעו באוזן הלא-קשובה, אפילו אם הופיעו בה מספר רב של פעמים. בהמשך התקבלו תוצאות סותרות שהובילו למודלים חלופיים: הממצא שמילים שהן שכיחות בסביבתנו או חשובות לנו - כן נקלטות לעיתים מהאוזן הלא-קשובה, מה שהוביל למודל המחלש, והממצא שהמילים מהאוזן הלא-קשובה, שכלל איננו מודעים ששמענו אותן, יכולות להשפיע על המשמעות שאנו נותנים למילים דו-משמעיות שאנו שומעים באוזן הקשובה, מה שהוביל למודל הסלקציה המאוחרת."},{"id":"attenuation","name":"מודל המחלש של הקשב","one":"המסר הלא-קשוב לא נחסם אלא מוחלש, ולכן השם שלך עדיין יכול \"לדלוף\" פנימה.","simple":"זה מודל של קשב שמיעתי של טריזמן. גם כאן הקשב פועל לפני העיבוד הסמנטי, אבל הוא מחלש ולא פילטר. הוא מחליש את המילים מהמסר הלא-קשוב, ואז כל המילים מגיעות ליחידת המילון שמזהה אותן. רוב המילים המוחלשות לא מזוהות, אבל מילים שכיחות או חשובות, כמו השם שלנו, מזוהות לפעמים.","why":"המילים השכיחות והחשובות מזוהות כי יש להן סף הפעלה נמוך יותר ביחידת המילון. החסימה לא מלאה כמו אצל ברודבנט, ולכן המודל נקרא \"הפילטר הדולף\". המודל מסביר את הממצא שמילים חשובות כן נקלטות מהאוזן הלא-קשובה.","example":"את מרוכזת בשיחה, ומישהו בצד השני של החדר אומר את השם שלך. פתאום את שומעת אותו, למרות שלא הקשבת לו בכלל.","points":["מודל של קשב שמיעתי (טריזמן). הקשב פועל לפני העיבוד הסמנטי, כמו במודל הפילטר","הקשב הוא מחלש ולא פילטר: מחליש את המילים מהמסר הלא-קשוב","המסרים הקשובים והמוחלשים מגיעים ליחידת המילון שמזהה מילים. רוב המילים המוחלשות לא מזוהות","מילים שכיחות או חשובות (כמו השם שלנו) מזוהות לעיתים, כי סף ההפעלה שלהן ביחידת המילון נמוך יותר","החסימה לא מלאה, ולכן כינוי המודל: \"הפילטר הדולף\""],"confuse":"מודל של סלקציה מאוחרת: שם כל המילים מזוהות לפני הסלקציה, ובמחלש רוב המילים הלא-קשובות לא מזוהות.","original":"מודל המחלש של טריזמן הוא אחד מהמודלים של קשב שמיעתי. במודל זה הקשב פועל לפני העיבוד הסמנטי, בדומה למודל הפילטר, אך בשונה ממנו הקשב מוצג כמחלש (ולא כפילטר) שמחליש את העיבוד של המילים שמקורן במסר הלא-קשוב (זה שאנו איננו מעוניינים להקשיב לו), כך שהן יוצאות מהמחלש חלשות יותר מאשר המילים מהמסר הקשוב, שלא הוחלשו. בשלב הבא המסרים הלא-קשובים שהוחלשו והמסרים הקשובים מגיעים ליחידת המילון שתפקידה לזהות את המילים. המילים מהמסר הקשוב מזוהות ביחידת המילון כיוון שלא הוחלשו. המסר הלא-קשוב מגיע מוחלש ולכן רוב המילים בו לא יזוהו. אולם אותן המילים הלא קשובות שהן שכיחות או חשובות (כגון השם של האדם) בכל זאת יזוהו לעיתים (למרות שהוחלשו על ידי המחלש), כיון שיש להן סף ההפעלה נמוך יותר ביחידת המילון, ולכן יש סיכוי שהן עדיין יצליחו להפעיל את יחידות הזיהוי שלהן ביחידת המילון, וכך נזהה אותן. לסיכום, על פי מודל זה רוב המילים הלא-קשובות לא יזוהו אך המילים החשובות והשכיחות שביניהן כן לעיתים יזוהו. כיון שחסימת הזיהוי של המילים הלא-קשובות היא לא מלאה כמו במודל הפילטר של ברודבנט, הוא זכה לכינוי מודל \"הפילטר הדולף\". בנוסף לשני המודלים החלופיים שהוזכרו: מודל המחלש ומודל הוצג גם מודל חלופי נוסף: מודל הסלקציה המאוחרת, שעל פיו כל המילים עוברות עיבוד סמנטי ומזוהות באופן קדם-קשבי, כולל המילים מהמסר הלא-קשוב, והסלקציה הקשבית מתרחשת מאוחר יותר."},{"id":"late","name":"מודל של סלקציה מאוחרת","one":"כל המילים מזוהות, גם אלה שלא הקשבת להן. הקשב רק בוחר מה יגיע למודעות.","simple":"זה סוג של מודל של קשב שמיעתי. לפיו הסלקציה של הקשב קורית מאוחר בעיבוד. כל המילים, גם מהמסר הקשוב וגם מהלא-קשוב, מקבלות עיבוד סמנטי ומזוהות לפני הסלקציה, כלומר באופן קדם-קשבי. תפקיד הקשב הוא לבחור מתוכן את המידע הרלוונטי שימשיך למודעות ולזיכרון.","why":"המודל נתמך בניסוי האזנה דיכוטית עם מילה דו-משמעית (bank) באוזן הקשובה. מילה באוזן הלא-קשובה שינתה את המשמעות שהנבדקים נתנו לה, למרות שלא היו מודעים ששמעו אותה. זה מראה שגם מילים לא-קשובות עוברות עיבוד סמנטי, רק לא מגיעות למודעות.","example":"את קוראת ספר וברקע ברדיו מדברים על הים. כשמופיעה בספר המילה \"גל\", את חושבת על גל בים ולא על גל חום, בלי לשים לב שבכלל שמעת את הרדיו.","points":["מודל של קשב שמיעתי: הסלקציה מתרחשת בשלב מאוחר בעיבוד התפיסתי","כל המילים, מהמסר הקשוב ומהלא-קשוב, מזוהות (עיבוד סמנטי) לפני הסלקציה, באופן קדם-קשבי","תפקיד הסלקציה: לבחור את המידע הרלוונטי שימשיך למודעות ולזיכרון","תמיכה: מילה דו-משמעית (bank) באוזן הקשובה, ומילה קשורה לאחת המשמעויות באוזן הלא-קשובה","המשמעות שיוחסה למילה הדו-משמעית השתנתה לפי המילה הלא-קשובה, למרות שהנבדקים לא היו מודעים ששמעו אותה"],"confuse":"מודל המחלש: שם רק מילים חשובות או שכיחות מזוהות מהמסר הלא-קשוב, ובסלקציה מאוחרת כולן מזוהות.","original":"מודל של סלקציה מאוחרת הוא אחד מהסוגים של מודלים של קשב שמיעתי. מודל זה טוען שהסלקציה שעורך הקשב מתרחשת בשלב מאוחר בתהליך העיבוד התפיסתי, כך שכל המילים, הן מהמסר הקשוב (זה שאנו מעוניינים להקשיב לו) והן מהמסר הלא-קשוב, מזוהות (כלומר מקבלות עיבוד סמנטי) עוד לפני הסלקציה הקשבית, כלומר באופן קדם-קשבי. תפקיד הסלקציה הקשבית הוא לבחור את המידע הרלוונטי לנו מתוך כל המילים שזוהו, שימשיך אל המודעות והזיכרון שלנו. לתמיכה במודל זה הוצג בפרק מחקר האזנה דיכוטית שבו הציגו לנבדקים באוזן הקשובה משפט שכולל מילה דו-משמעית (למשל: bank) שיש לה שתי משמעויות: בנק כספים, או גדת נהר. באותו זמן שהושמעה המילה הדו-משמעית באוזן הקשובה, השמיעו לנבדקים באוזן הלא-קשובה מילה שקשורה במשמעותה לאחת מן המשמעויות של המילה הקשובה הדו-משמעית. נמצא שהמשמעות שהנבדקים ייחסו למילה הקשובה הדו-משמעית השתנתה בהתאם למשמעות המילה הלא-קשובה, על אף שהנבדקים כלל לא היו מודעים לכך ששמעו את המילים הלא-קשובות. ממצא זה תומך כך שגם המילים הלא-קשובות מקבלות עיבוד סמנטי שהוא קדם-קשבי, וכיון שבניסוי מילים אלה לא עברו את הסלקציה הקשבית הן לא הגיעו למודעות של הנבדקים, על אף שהשפיעו על הבנת המילים הדו-משמעיות הקשובות. שני המודלים החלופיים של קשב שמיעתי היו מודל הפילטר/סלקציה מוקדמת שעל פיו רק המסר הקשוב עובר את הפילטר ולכן מזוהה ומגיע למודעות, ומודל המחלש שעל פיו המסר הלא-קשוב מגיע מוחלש לעיבוד הסמנטי ולכן רק מילים חשובות או שכיחות יזוהו מתוכו ויגיעו למודעות."},{"id":"changeblind","name":"עיוורון לשינוי","one":"מראים שתי תמונות כמעט זהות אחת אחרי השנייה, ולא שמים לב מה השתנה.","simple":"אנחנו מפספסים שינויים חזותיים בין תמונות או סצנות עוקבות. בניסויים הבזיקו שתי תמונות של אותה סצנה עם הבדלים ביניהן, ושאלו מה השתנה. פעמים רבות הנבדקים לא ראו את השינוי. כשהפנו מראש את הקשב שלהם לאזור השינוי, הם הצליחו הרבה יותר.","why":"התופעה מראה שבאזורים שלא קשובים אליהם יכולים לקרות שינויים מול העיניים בלי שנרגיש. זה מעיד על ההשפעה החזקה של הקשב החזותי על התפיסה החזותית.","example":"חברה חוזרת מהמספרה עם תספורת קצת אחרת, ואת שמה לב רק כשהיא שואלת אותך מה חדש.","points":["מדגים את ההשפעה הרבה של הקשב החזותי על התפיסה החזותית","מפספסים שינויים חזותיים בין סצנות/תמונות עוקבות","הניסוי: הבזקה של שתי תמונות של אותה סצנה עם הבדלים, ושאלה מה השתנה. לעיתים קרובות לא ראו","כשהקשב הופנה מראש לאזור השינוי, השינוי אותר הרבה יותר","דומה לעיוורון קשבי, שבו לא רואים גירוי בולט כשהקשב ממוקד בגירויים אחרים"],"confuse":"עיוורון קשבי: שם לא רואים גירוי שמופיע (הגורילה), ובעיוורון לשינוי לא רואים מה השתנה בין תמונות עוקבות.","original":"תופעה זו מדגימה את ההשפעה הרבה שיש לקשב החזותי אל התפיסה החזותית. עיוורון לשינוי מתייחס לכך שאנו מפספסים שינויים חזותיים שחלים בין סצנות/תמונות עוקבות שראינו. תופעה זו הודגמה בניסויים שבהם הובזקו על המסך שתי תמונות של אותה סצנה זו אחר זו, שהיו ביניהן הבדלים, והנבדקים נשאלו אלו שינויים חלו בין שתי התמונות. נמצא שפעמים רבות הנבדקים לא ראו שחלו שינויים. לעומת זאת אם הפנו מראש את הקשב של הנבדקים לאזור שבו יחול השינוי בין התמונות הם הצליחו הרבה יותר לאתר את השינוי. תופעה זו מעידה שבאזורים בשדה החזותי שאיננו קשובים אליהם יכולים לחול שינויים ואנו כלל לא נרגיש בהם למרות שחלו מול עינינו, וזה מעיד על עוצמת ההשפעה של הקשב החזותי על התפיסה החזותית. תופעה דומה לכך היא עיוורון קשבי שבה אנו לא רואים גירויים שמופיעים בשדה הראייה שלנו, אפילו כשהם בולטים ובמרכז, כאשר אנו ממקדים את הקשב שלנו בגירויים אחרים שנמצאים באותו אזור בשדה הראייה שלנו."},{"id":"inattentional","name":"עיוורון קשבי","one":"סופרים מסירות כדורסל, וגורילה שעוברת באמצע המסך פשוט לא נראית.","simple":"לא רואים גירוי מסוים, גם כשהוא בולט ובמרכז שדה הראייה. זה קורה כי הקשב מופנה לגירויים אחרים, אפילו באותו אזור. בניסוי הגורילה הנבדקים ספרו מסירות בין שחקנים בחולצות לבנות, ורובם לא ראו גורילה שנכנסה, עמדה במרכז ויצאה.","why":"התופעה מדגימה את ההשפעה הרבה של הקשב החזותי על התפיסה החזותית. גם גירוי בולט ומרכזי לא נתפס כשהקשב עסוק במשהו אחר.","example":"את מחפשת בטלפון כתובת בזמן הליכה ולא רואה חבר שעומד מולך ומנופף לך.","points":["מדגים את ההשפעה הרבה של הקשב החזותי על התפיסה החזותית","לא רואים גירוי מסוים, גם בולט ובמרכז שדה הראייה, כי הקשב הופנה לגירויים אחרים (אפילו באותו אזור)","ניסוי הגורילה: ספירת מסירות בין שחקנים בחולצות לבנות בסרטון כדורסל","גורילה נכנסה, עצרה במרכז המסך לכמה שניות ויצאה, ורוב הנבדקים לא ראו אותה","דומה לעיוורון לשינוי, שבו מפספסים שינויים בין תמונות עוקבות כשהקשב לא מופנה מראש למקום השינוי"],"confuse":"עיוורון לשינוי: שם מפספסים שינוי בין תמונות עוקבות, ובעיוורון קשבי מפספסים גירוי שנמצא מול העיניים.","original":"תופעה זו מדגימה את ההשפעה הרבה שיש לקשב החזותי אל התפיסה החזותית. עיוורון קשבי מתייחס לכך שאנו לא רואים גירוי מסוים, אפילו אם הופיע בולט ובמרכז שדה הראייה שלנו, וזאת בגלל שהקשב שלנו הופנה לגירויים אחרים, אפילו אם הם מופיעים באותו אזור. דוגמא לכך היא ניסוי הגורילה שבו נדרשו הנבדקים שצפו בסרטון של מסירות כדורסל לספור את מספר מסירות הכדור בין השחקנים עם החולצות הלבנות. בזמן הסרטון נכנסה גורילה, צעדה למרכז המסך ועצרה בו לזמן קצר ואז יצאה החוצה מהפריים. רוב הנבדקים בניסוי זה לא ראו את הגורילה למרות שהופיעה במרכז המסך ושהתה על המסך למשך מספר שניות. תופעה זו דומה לתופעת העיוורון לשינוי שבה אנו מפספסים שינויים חזותיים שחלים בין סצנות/תמונות עוקבות שראינו, כאשר הקשב שלנו איננו מופנה מראש למיקום שבו חלים השינויים."},{"id":"posner","name":"שיטת הרמז המטרים של פוזנר","one":"חץ במרכז מכוון את הקשב לצד אחד, ומגיבים מהר יותר כשהמטרה באמת מופיעה שם, בלי להזיז את העיניים.","simple":"פוזנר פיתח את השיטה כדי למדוד קשב סמוי, כלומר הפניית קשב בלי הפניית מבט. מבזיקים רמז במרכז המסך, למשל חץ ימינה או שמאלה, ומיד אחריו מופיע גירוי מטרה. ברוב הצעדים הרמז תקף והמטרה בצד שהחץ הצביע עליו, ובמיעוט הצעדים היא בצד ההפוך. הזמן קצר מדי כדי להזיז את העיניים.","why":"בצעדים התקפים זמן התגובה היה קצר יותר מאשר בצעדים הלא-תקפים. מכיוון שלא הייתה אפשרות להזיז את המבט, פוזנר הסיק שהקשב הופנה באופן סמוי. הקשב פעל כזרקור ששיפר וזירז את העיבוד באזור שאליו הופנה.","example":"את מסתכלת ישר על הכביש, אבל מישהו אומר לך \"שימי לב לצד ימין\". אם אופנוע מגיע מימין, תבחיני בו מהר יותר, בלי שהזזת את העיניים.","points":["שיטה של פוזנר למדידת קשב סמוי: הפניית קשב בלי הפניית מבט, תוך ניטרול תזוזת העיניים","רמז במרכז המסך (חץ ימינה או שמאלה), ומיד אחריו גירוי מטרה שיש ללחוץ על מקש כשמופיע","ברוב הצעדים הרמז תקף (המטרה בצד שהחץ מצביע עליו), ובמיעוטם לא-תקף (בצד ההפוך)","הזמן מהחץ ועד היעלמות המטרה קצר מאוד, כך שאי אפשר להזיז את העיניים","ממצא: תגובה מהירה יותר בצעדים התקפים. מסקנה: קשב סמוי פועל כזרקור שמשפר ומזרז את העיבוד באזור שאליו הופנה"],"confuse":"יתרון אותו-עצם: גם שם יש רמז מטרים, אבל הממצא הוא שהקשב מתפשט על כל העצם ולא רק על המיקום.","original":"שיטה זו פותחה על ידי פוזנר כדי למדוד את פעולת הקשב הסמוי, כלומר הפניית קשב ללא הפניית המבט. השיטה מאפשרת לבדוק את השפעת הקשב החזותי תוך ניטרול ההשפעה של תזוזת המבט. בשיטה זו מבזיקים לנבדקים רמז במרכז המסך (למשל חץ שפונה ימינה או שמאלה) שמכוון אותם לאיזה צד של המסך להפנות את הקשב ואז בתוך זמן קצרצר מופיע גירוי המטרה, והנבדקים מתבקשים ללחוץ על מקש מהר ככל האפשר ברגע שקלטו שגירוי המטרה הופיע. ברוב צעדי הניסוי הרמז הוא תקף, כלומר גירוי המטרה שמופיע מיד אחריו מופיע בצד של המסך שאליו הפנה חץ הרמז. במיעוט צעדי הניסוי הרמז הוא לא-תקף, כלומר גירוי המטרה שמופיע אחריו מופיע בצד ההפוך מזה שעליו הצביע חץ הרמז. הזמן שלוקח מהצגת החץ ועד היעלמות גירוי המטרה שאחריו הוא קצר מאוד וכך מונע מהנבדקים להספיק להניע את עיניהם בכיוון החץ. הממצא שמצא פוזנר בשיטה זו הוא שבצעדי הניסוי התקפים זמן התגובה שלקח לנבדקים להגיב להופעת גירוי המטרה היה קצר יותר מאשר בצעדים הלא-תקפים. מאחר שלא הייתה לנבדקים אפשרות להזיז את המבט, הסיק פוזנר שהנבדקים הפנו קשב באופן סמוי, שפעל כזרקור ששיפר וזירז את עיבוד הגירויים באזור שאליו הוא הופנה."},{"id":"fit","name":"תאוריית האינטגרציה של תכוניות","one":"קודם מזהים צבע וצורה בנפרד, ורק הקשב מדביק אותם ל\"עצם\" אחד.","simple":"זו תיאוריה של קשב חזותי. לפיה תפקיד הקשב הוא לחבר את התכוניות של כל גירוי, למשל צבע וצורה. בשלב הקדם-קשבי התכוניות מזוהות באזורים שונים במוח, ועוד לא מודעים לעצמים. בשלב הקשב הממוקד הקשב מחבר את התכוניות של אותו עצם, וכך נוצרת תפיסת העצם שאליה נהיים מודעים.","why":"התיאוריה עוזרת לפתור את בעיית האיגוד. היא נתמכת בחיבורים אשלייתיים (בלי קשב מחברים תכוניות לא נכון), בחיפוש החזותי (חיפוש חיבורי מתארך עם מסיחים, תכוניתי לא), ובמטופלים עם תסמונת בלינט (נכשלים בחיפוש חיבורי ומצליחים בתכוניתי).","example":"בהצצה מהירה על מדף את קולטת \"משהו אדום\" ו\"משהו עגול\", אבל רק כשאת מתמקדת את יודעת שזה תפוח אדום.","points":["תיאוריה של קשב חזותי: תפקיד הקשב הוא לחבר את התכוניות של כל גירוי (צבע, צורה), וכך מסייע לפתרון בעיית האיגוד","שלב קדם-קשבי: התכוניות מזוהות באזורים שונים במוח, ועדיין לא מודעים לעצמים","שלב הקשב הממוקד: הקשב מחבר את תכוניות העצם, ונוצרת תפיסת העצם המודעת","ממצא תומך (אחד לבחירה): חיבורים אשלייתיים, או חיפוש חזותי (חיבורי גדל עם מסיחים, תכוניתי לא)","או: מטופלי תסמונת בלינט (פגיעה במיקוד קשב) נכשלים בחיפוש חיבורי ומצליחים בחיפוש תכוניתי"],"confuse":"בעיית האיגוד: היא השאלה איך מחברים תכונות, והתיאוריה היא התשובה שהקשב עושה את זה.","original":"זוהי תיאוריה של קשב חזותי שטוענת שתפקיד הקשב החזותי הוא לחבר את התכוניות השונות של כל גירוי זו לזו, למשל את הצבע והצורה שלו, ובכך מסייע הקשב לפתרון בעיית האיגוד, כלומר מסביר כיצד מוחנו מצליח לחבר את התכוניות השונות של כל גירוי שמזוהות באזורים נפרדים של המוח (צבעים מזוהים באזור מוחי אחד, צורות מזוהות באזור מוחי אחר וכך הלאה). על פי התיאוריה בשלב הקדם-קשבי מזוהות התכוניות השונות באזורים השונים של המוח, ועדיין איננו מודעים לעצמים (כלומר לשילובים של תכוניות באותו גירוי). כדי לתפוס עצמים אנו נדרשים לשלב השני שהוא שלב הקשב הממוקד שבו הקשב מחבר את התכוניות השונות של אותו עצם זו לזו וכך מתקבלת תפיסת העצם שאליה אנו נהיים מודעים. דוגמה לממצא שתמך בתיאוריה הוא (יש לבחור אחד מבין שלושת הממצאים הבאים ולתאר אותו באופן מקוצר אך מלא כפי שמופיע להלן): 1. ניסוי חיבורים אשלייתיים שהראה שבהעדר קשב אנו עלולים לטעות בחיבור הנכון של התכוניות, וכך לתפוס חיבורים אשלייתיים (לחבר תכוניות משני גירויים שונים כאילו התקיימו ביחד באותו גירוי). 2. ניסוי החיפוש החזותי שהראה שהזמן שנדרש למציאת גירוי מטרה בחיפוש חיבורי גדל עם כמות המסיחים (בגלל שהוא נשען על הפניות קשב זו אחר זו לצורך חיבור התכוניות), בניגוד לזמן הנדרש לחיפוש תכוניתי שאיננו מושפע מכמות המסיחים, כיוון שאיננו דורש קשב. 3. ממצאים ממטופלים בעלי תסמונת בלינט שפוגעת ביכולת למקד קשב, שאינם מצליחים לזהות אם מופיע גירוי המטרה כשנדרש חיפוש חיבורי, אך כן מצליחים בכך כשנדרש חיפוש תכוניתי."},{"id":"load","name":"תאוריית העומס של הקשב","one":"משימה קשה לא משאירה מקום להסחות. משימה קלה משאירה מקום, וההסחה מאטה אותך.","simple":"לפי התיאוריה, כמה עיבוד מקבלים גירויים לא קשובים תלוי בעומס התפיסתי של המשימה. במשימה בעומס גבוה רוב קיבולת העיבוד מנוצלת, ולכן גירויים לא רלוונטיים לא מעובדים ולא משפיעים על זמן התגובה. במשימה בעומס נמוך נשארים משאבים פנויים, הם עוברים לגירויים הלא רלוונטיים, והתגובה מאטה.","why":"התיאוריה מראה שהעיבוד של גירויים לא קשובים לא קבוע. היא הודגמה בחיפוש אות מטרה במעגל אותיות: דמות אנימציה מתחת למעגל האטה את התגובה דווקא בעומס הנמוך, כמו שהתיאוריה מנבאת.","example":"כשאת פותרת תרגיל קשה, את לא שומעת את הטלוויזיה. כשאת רק מקפלת כביסה, כל פרסומת מושכת אותך ואת מתעכבת.","points":["העיבוד של גירויים לא קשובים לא קבוע, אלא תלוי בעומס התפיסתי של המטלה","עומס גבוה: רוב קיבולת העיבוד מנוצלת, גירויים לא רלוונטיים לא מעובדים ולא משפיעים על זמן התגובה","עומס נמוך: נשארים משאבים פנויים שמופנים לגירויים הלא רלוונטיים, והתגובה מאטה","המחקר: חיפוש אות מטרה במעגל אותיות. עומס נמוך: מסיחים זהים. עומס גבוה: מסיחים שונים זה מזה","דמות אנימציה מתחת למעגל האריכה את זמן התגובה דווקא בעומס הנמוך"],"confuse":"אפקט סטרופ: שם גירוי לא רלוונטי מפריע כי הוא חזק ואוטומטי, ובתיאוריית העומס הוא מפריע כשנשארים משאבים פנויים.","original":"לפי תיאוריה זו, העיבוד שלו זוכים גירויים לא קשובים איננו קבוע אלא תלוי בעומס התפיסתי של המטלה שהם נדרשים לבצע. במטלות עומס-גבוה המטלה מנצלת את רוב קיבולת העיבוד, ולכן גירויים לא-רלוונטיים לא יזכו לעיבוד ולא ישפיעו על זמן התגובה. לעומת זאת במטלות עומס-נמוך נותרים משאבי עיבוד פנויים, ולכן הם מופנים לגירויים הלא-רלוונטיים, שיגרמו לכן להאטה בתגובה למטלה. טענות אלה הודגמו במחקר שבו הוצגה מטלה של חיפוש אות מטרה בתוך מעגל אותיות. בתנאי העומס תפיסתי הנמוך כל האותיות המסיחות היו זהות, ובתנאי העומס התפיסתי הגבוה האותיות המסיחות היו שונות זו מזו. במחקר נמצא שהוספת גירוי לא רלוונטי: דמות אנימציה שהופיעה מתחת למעגל האותיות, האריכה יותר את זמן התגובה דווקא במטלת העומס הנמוך, בדיוק כפי שמנובא שיקרה במטלה זו שבה יש משאבים פנויים ולכן מתקיים עיבוד של הגירוי הלא רלוונטי שמוביל להאטת התגובה."}],"drill":[{"t":"cocktail","q":"את בבית קפה הומה ומצליחה לשמוע רק את החברה שיושבת מולך, למרות שכל הקולות מסביב מגיעים לאוזניים. באיזה מושג מדובר?","o":["אפקט סטרופ","אפקט מסיבת הקוקטייל","עיוורון קשבי","תאוריית העומס של הקשב"],"a":1,"e":"אפקט מסיבת הקוקטייל הוא היכולת להתמקד במסר אחד ולסנן את שאר המסרים שמגיעים לאוזן בו-זמנית."},{"t":"cocktail","q":"איזה מודל צמח מתוך אפקט מסיבת הקוקטייל יחד עם ממצאים נוספים?","o":["מודל המחלש של טריזמן","מודל הסלקציה המאוחרת","מודל הפילטר של ברודבנט, מודל של סלקציה מוקדמת","תאוריית האינטגרציה של תכוניות"],"a":2,"e":"לפי ההגדרה, האפקט יחד עם ממצאים נוספים הוביל למודל הפילטר/צוואר-הבקבוק של ברודבנט, מודל סלקציה מוקדמת."},{"t":"cocktail","q":"מה טענו הגישות החלופיות לגבי מסיבת הקוקטייל?","o":["שהמסר הלא-קשוב בכלל לא נקלט באוזן","שאנחנו כן מושפעים ממשמעות המסר הלא-קשוב, למשל כשמזכירים את שמנו","שהסינון מתרחש לפני העיבוד הפיזיקלי","שהקשב לא מצליח לסנן מילים אוטומטיות"],"a":1,"e":"הגישות החלופיות טענו שגם כשמתמקדים מושפעים ממשמעות המסרים הלא-קשובים (למשל השם שלנו), ולכן הסלקציה המוקדמת שגויה."},{"t":"stroop","q":"נבדקת צריכה לומר את צבע הדיו של המילה \"ירוק\" שכתובה באדום, והיא מגיבה לאט. באיזה מושג מדובר?","o":["חיבורים אשלייתיים","תאוריית העומס של הקשב","אפקט מסיבת הקוקטייל","אפקט סטרופ"],"a":3,"e":"בסטרופ משיימים את צבע הכתב, וכשמשמעות המילה לא תואמת לצבע התגובה איטית יותר."},{"t":"stroop","q":"איזה משפט נכון לגבי אפקט סטרופ?","o":["משמעות המילה היא גירוי חזק ואוטומטי, ולכן הקשב לא מצליח לסנן אותה","הקשב מצליח לסנן את משמעות המילה, ולכן אין השפעה על התגובה","התגובה איטית יותר כשהצבע תואם למשמעות המילה","הנבדקים מתבקשים לקרוא את המילה ולהתעלם מהצבע"],"a":0,"e":"האפקט מעיד שכשגירוי לא רלוונטי חזק ומעורר תגובה אוטומטית (קריאה), אי אפשר להתעלם ממנו והוא משפיע על התגובה."},{"t":"stroop","q":"מה חייב להופיע בהגדרה מלאה של אפקט סטרופ?","o":["שזמן התגובה עולה עם מספר המסיחים בתצוגה","ששיום צבע מהיר יותר כשהצבע תואם למשמעות המילה מאשר כשאינו תואם","שמילים חשובות נקלטות מהאוזן הלא-קשובה","שהקשב משפר את העיבוד של כל העצם"],"a":1,"e":"הליבה של ההגדרה: זמן שיום הצבע קצר יותר בהתאמה בין הצבע למשמעות, ארוך יותר באי-התאמה."},{"t":"binding","q":"איזו שאלה מנסחת את בעיית האיגוד?","o":["למה אנחנו לא שומעים את המסר באוזן הלא-קשובה?","איך קשב סמוי מזרז תגובה בלי הזזת עיניים?","איך קושרים נכון בין התכונות של עצם, למרות שכל תכונה מעובדת באזור מוחי אחר?","למה גירוי לא רלוונטי מאט את התגובה במשימה קלה?"],"a":2,"e":"בעיית האיגוד נובעת מכך שתכונות כמו צבע, צורה ותנועה מעובדות באזורים שונים במוח, והשאלה היא איך מחברים אותן נכון."},{"t":"binding","q":"לפי הפתרון של טריזמן לבעיית האיגוד, מי מחבר את התכוניות של העצם?","o":["הקשב, בשלב הקשב הממוקד","יחידת המילון, לפי סף ההפעלה","הפילטר, אחרי העיבוד הפיזיקלי","השלב הקדם-קשבי, באופן אוטומטי"],"a":0,"e":"לפי תיאוריית אינטגרציית התכוניות, התכוניות מזוהות בשלב הקדם-קשבי, והקשב בשלב הממוקד מאגד אותן."},{"t":"binding","q":"אילו שני ניסויים נתנו חיזוק לפתרון של טריזמן לבעיית האיגוד, לפי ההגדרה?","o":["ניסוי הגורילה וניסוי התמונות העוקבות","ניסוי האזנה דיכוטית וניסוי bank","ניסוי המלבנים וניסוי החץ של פוזנר","ניסוי החיבורים האשלייתיים וניסוי החיפוש החזותי"],"a":3,"e":"ההגדרה מציינת שהחיזוק התקבל מניסוי החיבורים האשלייתיים ומניסוי החיפוש החזותי."},{"t":"dichotic","q":"נבדק שומע רשימת מילים אחת באוזן ימין ורשימה אחרת באוזן שמאל, וחוזר בקול על המילים מאוזן ימין. מה שם הניסוי?","o":["שיטת הרמז המטרים של פוזנר","האזנה דיכוטית","חיפוש חיבורי","אפקט סטרופ"],"a":1,"e":"בהאזנה דיכוטית משמיעים שני מסרים שונים, אחד לכל אוזן, והנבדק ממקד קשב באוזן אחת, למשל בהצללה."},{"t":"dichotic","q":"מה פירוש \"הצללה\" בהאזנה דיכוטית?","o":["לחזור בקול על כל מילה באוזן הקשובה מיד אחרי ששומעים אותה","לכתוב את המילים מהאוזן הלא-קשובה בסוף הניסוי","להחליש את המסר באוזן הלא-קשובה","להחליף אוזן קשובה באמצע הניסוי"],"a":0,"e":"הצללה היא חזרה בקול על המילים שנשמעות באוזן הקשובה מיד לאחר שמיעת כל מילה, וכך האוזן הזו הופכת לקשובה."},{"t":"dichotic","q":"איזה ממצא מהאזנה דיכוטית הוביל למודל הסלקציה המאוחרת?","o":["מילים לא-קשובות לא זוהו גם אחרי חזרות רבות","מילים שכיחות או חשובות נקלטו לפעמים מהאוזן הלא-קשובה","זמן התגובה עלה עם מספר המילים","מילים לא-קשובות שלא היו מודעים להן השפיעו על משמעות מילה דו-משמעית באוזן הקשובה"],"a":3,"e":"ההשפעה של מילים לא-קשובות על פירוש מילה דו-משמעית הובילה לסלקציה מאוחרת. מילים חשובות שנקלטו הובילו למודל המחלש."},{"t":"illusory","q":"נבדקת ראתה בהבזקה קצרה ריבוע אדום ועיגול ירוק, ודיווחה שראתה ריבוע ירוק. באיזה מושג מדובר?","o":["עיוורון לשינוי","חיפוש תכוניתי","חיבורים אשלייתיים","יתרון אותו-עצם"],"a":2,"e":"חיבורים אשלייתיים הם תפיסת חיבור של תכוניות שהופיעו בגירויים שונים, כאילו הן באותו גירוי."},{"t":"illusory","q":"לפי ניסוי החיבורים האשלייתיים, מה נפגע כשאין מספיק קשב?","o":["העיבוד של התכוניות עצמן, כמו הצבע והצורה","החיבור הנכון בין התכוניות","הזיהוי הסמנטי של הספרות בצדדים","היכולת להזיז את המבט לגירוי"],"a":1,"e":"הממצא מראה שהתכוניות עצמן עובדו, אבל החיבור הנכון שלהן נפגע, כלומר הקשב נדרש לחיבור תכוניות."},{"t":"illusory","q":"למה בניסוי החיבורים האשלייתיים ביקשו מהנבדקים לדווח קודם על הספרות שבצדדים?","o":["כדי לבדוק את הזיכרון לטווח ארוך","כדי לבדוק קשב שמיעתי","כדי לגרום להם להזיז את העיניים למרכז","כדי שהקשב יופנה בעיקר לספרות ולא לגירויים, יחד עם הצגה קצרצרה"],"a":3,"e":"הגירויים הוצגו לזמן קצרצר והקשב הופנה בעיקר לספרות, כך שלא היה מספיק קשב לגירויים עצמם."},{"t":"conjunction","q":"מחפשים קו ירוק אופקי בין קווים ירוקים אנכיים וקווים אדומים אופקיים. ככל שיש יותר קווים, החיפוש איטי יותר. איך נקרא התנאי?","o":["חיפוש חיבורי","חיפוש תכוניתי","חיבורים אשלייתיים","עיוורון קשבי"],"a":0,"e":"בחיפוש חיבורי המטרה שונה מהמסיחים רק בשילוב של שתי תכוניות, וזמן התגובה עולה עם מספר המסיחים."},{"t":"conjunction","q":"למה בחיפוש חיבורי זמן התגובה עולה עם מספר המסיחים?","o":["כי זיהוי תכוניות בנפרד נעשה במקביל על כל הגירויים","כי ככל שיש יותר גירויים צריך יותר הפניות קשב כדי לחבר תכוניות בכל גירוי","כי גירוי לא רלוונטי חזק לא ניתן לסינון","כי העומס הנמוך משאיר משאבים פנויים"],"a":1,"e":"לפי אינטגרציית התכוניות, חיפוש חיבורי נשען על הפניות קשב לגירויים לחיבור תכוניות, ויותר גירויים דורשים יותר הפניות."},{"t":"conjunction","q":"איזה ממצא לא היה מתאים לחיפוש חיבורי לפי ההגדרה?","o":["זמן התגובה עלה עם כמות המסיחים","המטרה נבדלה מהמסיחים רק בשילוב של שתי תכוניות","זמן התגובה נשאר קבוע ככל שנוספו מסיחים","כדי למצוא את המטרה צריך קו שהוא גם ירוק וגם אופקי"],"a":2,"e":"זמן תגובה קבוע מאפיין חיפוש תכוניתי. בחיפוש חיבורי זמן התגובה עולה עם המסיחים."},{"t":"feature","q":"מחפשים קו אופקי אחד בין קווים אנכיים, וזמן החיפוש זהה אם יש 5 קווים או 30. איך נקרא התנאי?","o":["חיפוש חיבורי","חיפוש תכוניתי","שיטת הרמז המטרים של פוזנר","יתרון אותו-עצם"],"a":1,"e":"בחיפוש תכוניתי המטרה שונה בתכונית אחת, וזמן התגובה לא מושפע מכמות המסיחים."},{"t":"feature","q":"איך תיאוריית אינטגרציית התכוניות מסבירה את ממצא החיפוש התכוניתי?","o":["זיהוי תכוניות בנפרד הוא קדם-קשבי ונעשה במקביל על כל הגירויים, בלי הפניות קשב","הקשב סורק כל גירוי בתורו ומחבר את התכוניות שלו","הקשב מחליש את המסיחים ולכן הם לא מזוהים","הקשב מתפשט על כל העצם ולא רק על המיקום"],"a":0,"e":"לפי התיאוריה זיהוי תכוניות בנפרד קורה בשלב הקדם-קשבי ובמקביל, ולכן יותר מסיחים לא מאריכים את זמן התגובה."},{"t":"feature","q":"מה ההבדל המרכזי בין חיפוש תכוניתי לחיפוש חיבורי?","o":["בתכוניתי זמן התגובה עולה עם המסיחים, ובחיבורי הוא קבוע","בתכוניתי נדרש קשב, ובחיבורי לא","בתכוניתי מודדים טעויות, ובחיבורי מודדים זמן תגובה","בתכוניתי המטרה שונה בתכונית אחת ולא נדרש קשב, ובחיבורי צריך לחבר שתי תכוניות ונדרש קשב"],"a":3,"e":"חיפוש תכוניתי
