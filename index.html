q":"מה היו תוצאות שיטת הדיווח החלקי?","o":["כאות אחת מתוך 4","כ-3.3 אותיות מתוך 4 (82%), ללא הבדל בין השורות","כל 4 האותיות תמיד","רק השורה העליונה דווחה היטב"],"a":1,"e":"מכך הסיקו שרוב אותיות המטריצה היו בזיכרון האיקוני, ושהן דועכות במהלך הדיווח."},{"q":"מה איפשר לספרלינג להסיק, מדיווח על שורה אחת, שרוב אותיות המטריצה כולה היו בזיכרון האיקוני?","o":["הנבדקים ידעו מראש איזו שורה תסומן","הסימון ניתן אחרי המטריצה ובאופן מקרי, ולא היה הבדל בדיווח בין השורות","הנבדקים ראו את המטריצה פעמיים","השורות היו זהות"],"a":1,"e":"הנבדקים לא יכלו להתכונן לשורה מסוימת, ולכן כל השורות היו זמינות באותה מידה."},{"q":"המשתנה שתפעל ספרלינג כדי למדוד את הזמן שלוקח לזיכרון האיקוני לדעוך הוא –","o":["כמות האותיות במטריצה","שיטת הדיווח: חלקי או מלא","מיקום השורה שעליה התבקשו לדווח","משך ההשהיה של הצליל שציין איזו שורה לדווח"],"a":3,"e":"בדיווח החלקי המושהה, ככל שההשהיה גדלה דווחו פחות אותיות. אחרי שנייה דווחו כ-1.5 מתוך 4."},{"q":"מהי המסקנה הכללית מניסויי ספרלינג?","o":["הזיכרון החושי קולט מעט מאוד מידע","הזיכרון החושי קולט את כל המידע מהקולטנים החושיים או את מרביתו, והמידע דועך תוך זמן קצרצר","הזיכרון האיקוני נמשך דקות","אין זיכרון חושי"],"a":1,"e":"קיבולת רבה ודעיכה מהירה (פחות משנייה)."},{"q":"בניסוי של בראון ופטרסון ופטרסון (1959), מה הייתה מטרת הספירה לאחור בשלשות?","o":["לבדוק יכולת חשבון","למנוע שינון של שלשת העיצורים","לשפר את הזכירה","להאריך את זמן הניסוי"],"a":1,"e":"ההסחה מונעת שינון, וכך ניתן לבחון דעיכה של המידע עם הזמן."},{"q":"מה נמצא בניסוי של פטרסון ופטרסון?","o":["הזכירה לא השתנתה עם משך ההסחה","הזכירה ירדה ככל שמשך ההסחה התארך","הזכירה השתפרה עם הזמן","הנבדקים לא זכרו אף שלשה"],"a":1,"e":"ההסבר שלהם: דעיכה הדרגתית מהזט\"ק תוך מספר שניות כשאין שינון."},{"q":"מה מצאו קפל ואנדרווד (1962) בניתוח השלשה הראשונה בניסוי פטרסון?","o":["השלשה הראשונה נשכחה מהר יותר","בשלשה הראשונה כמעט לא הייתה ירידה בזכירה, גם אחרי 18 שניות הסחה","הזכירה בשלשה הראשונה הייתה 0%","לא היה הבדל בין השלשות"],"a":1,"e":"זה סותר את הסבר הדעיכה ותומך בהסבר של הפרעה למאוחר."},{"q":"מהי \"הפרעה למאוחר\"?","o":["מידע חדש מפריע לזכירת מידע ישן","מידע שנלמד קודם מפריע לזכירת מידע חדש מאותו סוג","מידע לא רלוונטי מפריע לקשב","שכחה בגלל דעיכה"],"a":1,"e":"למשל, צרפתית שנלמדה קודם מפריעה לזכירת ספרדית שנלמדה מאוחר יותר."},{"q":"למדת צרפתית ואחר כך ספרדית. במבחן בצרפתית אתה מתבלבל עם מילים בספרדית. זו –","o":["הפרעה למאוחר","הפרעה למוקדם","דעיכה","יצירת גושים"],"a":1,"e":"מידע שנלמד מאוחר (ספרדית) מפריע לזכירת מידע שנלמד מוקדם (צרפתית)."},{"q":"לפי מילר (1956), מהי קיבולת הזיכרון לטווח קצר בהיזכרות בספרות?","o":["2±1","7±2","4±1","12±2"],"a":1,"e":"המגבלה ידועה כ\"המספר המופלא 7±2\"."},{"q":"בניסוי גילוי השינויים החזותיים של לאק ווגל (1997), מה הייתה המסקנה לגבי קיבולת הזט\"ק החזותי?","o":["כ-7 פריטים","כ-4 פריטים","כ-12 פריטים","פריט אחד"],"a":1,"e":"כשהיו יותר מ-4 ריבועים, הדיוק ירד משמעותית."},{"q":"מהי \"יצירת גושים\" (chunking)?","o":["שכחת פריטים בקבוצות","צירוף פריטים ליחידות בעלות משמעות, כמו ראשי תיבות או מילים, וכך הגדלת קיבולת ההיזכרות","חלוקת מילים לאותיות","חזרה בקול על צליל לא רלוונטי"],"a":1,"e":"למשל ק,ג,ב,ד,ו,ח,ב,ע,מ הופכות לשלושה גושים: ק.ג.ב, דו\"ח, בע\"מ."},{"q":"אלוורז וקוואנו (2004) רצו לבדוק את קיבולת הזט\"ק במונחים של כמות מידע ולא מספר פריטים. לכן, בשונה מניסויים קודמים, הם תפעלו גם את –","o":["מורכבות הגירויים לזכירה","כמות הגירויים לזכירה","צבע הגירויים לזכירה","משמעות הגירויים לזכירה"],"a":0,"e":"ככל שהפריטים מכילים יותר מידע, נכנסים פחות מהם. הקיבולת המקסימלית, כ-4 פריטים, מתקבלת בגירויים פשוטים כמו צבעים."},{"q":"במה שונה תפיסת \"זיכרון העבודה\" של באדלי מתפיסת הזט\"ק במודל המודאלי?","o":["זיכרון העבודה אינו מוגבל בקיבולתו","זיכרון העבודה מיועד בעיקר לביצוע פעולות על המידע שמוחזק בו (מניפולציה, קישור, הסקה), ולא רק להחזקה פעילה","זיכרון העבודה הוא חלק מהזט\"א","אין הבדל"],"a":1,"e":"זו מערכת בעלת קיבולת מוגבלת לאחסון זמני ולמניפולציה של מידע במטלות כמו הבנה, למידה והסקה."},{"q":"מהם שלושת הרכיבים המקוריים של מודל זיכרון העבודה (באדלי והיץ', 1974)?","o":["זיכרון חושי, זט\"ק, זט\"א","לולאה פונולוגית, לוח חזותי-מרחבי ומנהל מרכזי","מאגר אפיזודי, זיכרון סמנטי, זיכרון פרוצדורלי","פילטר, מחלש, גלאי"],"a":1,"e":"המאגר האפיזודי נוסף מאוחר יותר (2000)."},{"q":"מהם שני הרכיבים של הלולאה הפונולוגית?","o":["מסך פנימי ועין פנימית","מאגר פונולוגי (\"אוזן פנימית\") ותהליך שינון הגייתי (\"דיבור פנימי\")","מנהל מרכזי ומאגר אפיזודי","זיכרון איקוני ואקואי"],"a":1,"e":"המאגר מחזיק צלילים לשניות ספורות. השינון מרענן את הפריטים וממיר מידע חזותי לקוד פונולוגי."},{"q":"מהו אפקט הדמיון הפונולוגי (קונרד, 1964)?","o":["קל יותר לזכור מילים דומות בצליל","עיקר טעויות ההיזכרות המיידית הן החלפת פריט בפריט שדומה לו בצליל, גם כשהפריטים מוצגים חזותית","נבדקים מחליפים אותיות דומות במראה","מילים ארוכות נזכרות פחות"],"a":1,"e":"למשל P במקום B. זה תומך בקידוד פונולוגי בזט\"ק."},{"q":"כיצד מוסבר אפקט הדמיון הפונולוגי?","o":["על ידי מחיקה מלאה של המילים מהמאגר","הקוד הפונולוגי דועך בהדרגה ונעשה פחות מובחן, ולכן מתבלבלים עם מילים בעלות צליל דומה","על ידי קידוד חזותי","על ידי הפרעה למוקדם"],"a":1,"e":"בדומה לשמיעת מילה על רקע רעש."},{"q":"מהו אפקט אורך המילה (באדלי ועמיתים, 1984)?","o":["מילים ארוכות נזכרות טוב יותר","בהיזכרות מיידית נזכרים בפחות מילים מרשימת מילים ארוכות מאשר מרשימת מילים קצרות","אין הבדל בין מילים קצרות לארוכות","מילים קצרות נשכחות מהר יותר"],"a":1,"e":"77% מהמילים הקצרות לעומת 60% מהארוכות. ההסבר: מילים ארוכות זוכות לפחות שינון הגייתי."},{"q":"מהי השפעת הדיכוי ההגייתי (חזרה בקול על \"זה, זה...\") על אפקט אורך המילה?","o":["הוא מגביר את האפקט","הוא מבטל את האפקט, גם בהצגה חזותית וגם בהצגה שמיעתית, כי הוא מדכא את השינון ההגייתי","הוא אינו משפיע","הוא הופך את האפקט"],"a":1,"e":"הדיכוי ההגייתי גם פוגע בהיזכרות המיידית באופן כללי."},{"q":"בניסוי הרוטציה המנטלית של שפרד ומצלר (1971) נמצא ש –","o":["זמן התגובה קבוע בכל הזוויות","זמן התגובה לעצמים זהים עלה ככל שגדל ההבדל בזווית בין שני העצמים","הנבדקים לא הצליחו להשוות","זמן התגובה ירד עם הזווית"],"a":1,"e":"הנבדקים מסובבים תמונה מנטלית על הלוח החזותי-מרחבי."},{"q":"בניסוי של דלה סלה ועמיתים (1999) על היזכרות בתבניות חזותיות, הנבדקים הצליחו להיזכר בעד 9 ריבועים מושחרים. מדוע הממצא תומך בלוח החזותי-מרחבי?","o":["כי הנבדקים קראו בשם לכל ריבוע","כי הנבדקים הצליחו להחזיק תבניות חזותיות מקריות שאי אפשר לשמור כמילים","כי הריבועים היו צבעוניים","כי הנבדקים השתמשו בלולאה הפונולוגית"],"a":1,"e":"זו תמיכה על דרך האלימינציה. היכולת להחזיק יותר מ-4 פריטים מוסברת בחיבור ריבועים לתבניות, בדומה ליצירת גושים."},{"q":"בניסוי של ברוקס (1968) נבדקים דמיינו את האות F ושפטו את פינותיה. היה להם קשה יותר להצביע על התשובה בטבלה מאשר לומר אותה בקול. מדוע?","o":["שני התהליכים (הסריקה בדמיון וההצבעה) מתבצעים בלולאה הפונולוגית","שני התהליכים (הסריקה בדמיון וההצבעה) מתבצעים בלוח החזותי-מרחבי","הסריקה בדמיון בלולאה הפונולוגית וההצבעה בלוח החזותי-מרחבי","הסריקה בדמיון בלוח החזותי-מרחבי וההצבעה בלולאה הפונולוגית"],"a":1,"e":"שתי המשימות משתמשות באותו מנגנון חזותי ולכן מתנגשות. אמירה בקול אינה משתמשת בלוח ולכן אינה מתנגשת."},{"q":"בניסוי של פוגל ועמיתים (2005), מה נמצא כשנוספו מלבנים כחולים מסיחים?","o":["ה-ERP עלה באותה מידה בשתי הקבוצות","ה-ERP עלה הרבה יותר אצל בעלי קיבולת נמוכה, כאילו החזיקו גם את המסיחים","ה-ERP ירד אצל בעלי קיבולת נמוכה","לא היה ERP"],"a":1,"e":"לבעלי קיבולת גבוהה יש מנהל מרכזי יעיל יותר שחוסם גירויים לא רלוונטיים. פגיעה באונת המצח, מקום המנהל המרכזי, גורמת לפרסברציה."}],"hard":[{"q":"אילו ספרלינג היה מוצא שבדיווח החלקי הנבדקים מדווחים בממוצע כ-1.5 אותיות מתוך 4 גם בלי השהיה, מה היה מוסק?","o":["שהזיכרון האיקוני מכיל כמעט את כל המטריצה","שהקיבולת של הזיכרון האיקוני מוגבלת לכ-4–5 אותיות מתוך 12, ולא שהמידע דועך","שהזיכרון האיקוני נמשך דקות","שאין זיכרון איקוני"],"a":1,"e":"1.5 מתוך 4 זה כ-37%, אותו אחוז כמו בדיווח המלא. כלומר המגבלה בכניסה ולא בדעיכה."},{"q":"בניסוי בסגנון פטרסון, נבדקים לומדים שלשות של מספרים ואחריהן שלשה של אותיות. לפי הסבר ההפרעה למאוחר, מה צפוי בשלשת האותיות?","o":["זכירה גרועה, כמו בשלשה רביעית של מספרים","זכירה משופרת, כי שלשת האותיות שונה בסוגה מהקודמות, ולכן ההפרעה למאוחר קטנה","אין שינוי","זכירה אפסית"],"a":1,"e":"ההפרעה גדולה במידע מאותו סוג. שינוי סוג משחרר מההפרעה למאוחר."},{"q":"נבדקת זוכרת בהיזכרות מיידית את הרצף FBI-CIA-NBA-IBM (12 אותיות). מדוע זה לא סותר את מגבלת הקיבולת?","o":["כי האותיות קצרות","כי היא יוצרת גושים: 4 ראשי תיבות מוכרים הם 4 יחידות בזיכרון, ולא 12","כי היא משתמשת בלוח החזותי בלבד","כי זה זיכרון לטווח ארוך בלבד"],"a":1,"e":"קיבולת הזט\"ק נמדדת ביחידות משמעות. גושים הם הדרך להגדיל את ההיזכרות."},{"q":"נבדקים לומדים רשימת מילים קצרות וארוכות שמוצגות חזותית, ובמקביל חוזרים בקול \"בה-בה-בה\". מה צפוי לגבי אפקט אורך המילה ולגבי אפקט הדמיון הפונולוגי?","o":["שני האפקטים יישארו","אפקט אורך המילה ייעלם, כי השינון ההגייתי מדוכא. גם הדמיון הפונולוגי צפוי להיחלש, כי מילים שמוצגות חזותית אינן מומרות לקוד פונולוגי בלי השינון","שני האפקטים יתחזקו","רק הדמיון הפונולוגי ייעלם"],"a":1,"e":"השינון ההגייתי גם מרענן את הפריטים וגם ממיר מידע חזותי לקוד פונולוגי. דיכוי שלו פוגע בשני התפקידים."},{"q":"נבדק מתבקש לדמיין את מפת דירתו ולספור חלונות, ובמקביל לחזור בקול על שירים. במשימה אחרת הוא סופר חלונות ובמקביל עוקב באצבע אחרי נקודה נעה על מסך. באיזה מקרה הפגיעה צפויה להיות גדולה יותר, ומדוע?","o":["בחזרה על שירים, כי היא משתמשת בלולאה הפונולוגית","במעקב אחרי הנקודה, כי גם הוא וגם דמיון המפה משתמשים בלוח החזותי-מרחבי ולכן מתנגשים","אין הבדל","אף אחד מהם לא יפגע"],"a":1,"e":"זה ההיגיון של ניסוי ברוקס: התנגשות מתרחשת בין משימות שמשתמשות באותו רכיב."},{"q":"בניסוי של שפרד ומצלר, מה היה מחליש את ההסבר של רוטציה מנטלית?","o":["זמן תגובה שגדל ליניארית עם הזווית","זמן תגובה קבוע בכל הזוויות","טעויות רבות בזוויות גדולות","תגובות מהירות לזוגות זהים"],"a":1,"e":"אם לא לוקח יותר זמן לסובב יותר, אין עדות לסיבוב הדרגתי של תמונה מנטלית."},{"q":"לפי ממצאי פוגל ועמיתים (2005), אצל מי צפוי קושי גדול יותר לזכור מספר טלפון בזמן שמישהו מדבר ליד, ומדוע?","o":["אצל בעלי קיבולת גבוהה, כי הם מחזיקים יותר מידע","אצל בעלי קיבולת נמוכה, כי המנהל המרכזי שלהם פחות יעיל בחסימת מידע לא רלוונטי","אין הבדל","אצל אף אחד"],"a":1,"e":"בעלי קיבולת נמוכה \"מכניסים\" גם את המסיחים לזיכרון העבודה, כמו בתנאי המלבנים הכחולים."},{"q":"בניסוי לאק ווגל, אילו הגירויים היו ריבועים בשני צבעים כל אחד (חצי אדום וחצי ירוק), מה היה צפוי לפי אלוורז וקוואנו?","o":["אותה קיבולת של 4 פריטים בדיוק","קיבולת זהה או נמוכה מעט, תלוי במורכבות. אלוורז וקוואנו מראים שככל שפריט מכיל יותר מידע, נכנסים פחות פריטים","קיבולת של 8 פריטים","קיבולת אפסית"],"a":1,"e":"הקיבולת תלויה בכמות המידע. 4 פריטים היא הקיבולת המרבית עבור גירויים פשוטים."},{"q":"מטופל עם פגיעה באונה המצחית ממיין כרטיסים לפי צבע, וממשיך למיין לפי צבע גם אחרי שנאמר לו שהכלל השתנה לצורה. לאיזה רכיב של זיכרון העבודה הפגיעה מתייחסת?","o":["הלולאה הפונולוגית","הלוח החזותי-מרחבי","המנהל המרכזי, שאחראי על שליטה בקשב ועל שינוי דפוסי תגובה","הזיכרון האיקוני"],"a":2,"e":"זוהי פרסברציה, לקות אופיינית לפגיעה במנהל המרכזי."},{"q":"מה ההבדל המרכזי בין מבחן ההיזכרות בספרות של מילר לבין מבחן גילוי השינויים של לאק ווגל, מבחינת מה שהם מודדים?","o":["אין הבדל","היזכרות בספרות עלולה להיעזר בשינון ובגושים, ולכן היא מגיעה לכ-7. גילוי שינויים חזותי מצמצם את האפשרויות האלה ולכן מראה קיבולת נמוכה יותר, כ-4","שניהם מודדים זיכרון לטווח ארוך","מבחן הספרות חזותי בלבד"],"a":1,"e":"שאלת השקף: האם היזכרות בספרות משקפת רק את הזט\"ק? כנראה שלא."}]},{"id":"c6","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 6: מבנה הזיכרון לטווח ארוך","questions":[{"q":"במטלת המיקום הסדרתי (מרדוק, 1962), מהו המשתנה הבלתי תלוי?","o":["אורך הרשימה","המיקום הסדרתי של המילה ברשימה","שיעור ההיזכרות","קצב הצגת המילים"],"a":1,"e":"המשתנה התלוי הוא שיעור ההיזכרות כפונקציה של המיקום הסדרתי."},{"q":"בעקומת המיקום הסדרתי קיימים –","o":["רק אפקט ראשונות","רק אפקט אחרונות","אפקט ראשונות (זכירה גבוהה של הפריטים הראשונים) ואפקט אחרונות (זכירה גבוהה של הפריטים האחרונים)","זכירה אחידה לאורך הרשימה"],"a":2,"e":"יש שתי מגמות: ירידה בפריטים הלא-אחרונים ועלייה בפריטים האחרונים."},{"q":"מהו ההסבר המקובל לאפקט הראשונות?","o":["הפריטים הראשונים נמצאים עדיין בזט\"ק","הפריטים הראשונים זוכים ליותר שינון ולכן עוברים לזט\"א, ונשלפים ממנו","הפריטים הראשונים מעניינים יותר","הפריטים הראשונים קצרים יותר"],"a":1,"e":"זהו הסבר השינון: ככל שמילה מופיעה מאוחר יותר, יש פחות זמן לשנן אותה."},{"q":"איזה ממצא של רונדוס (1971) תמך בהסבר השינון לאפקט הראשונות?","o":["שיעור הזכירה יורד ככל שהמילה מופיעה קרוב לסוף הרשימה","שיעור הזכירה עולה ככל שהמילה מופיעה קרוב לסוף הרשימה","עקומת כמות החזרות בקול על כל מילה תאמה את החצי הראשון של עקומת המיקום הסדרתי","כמות החזרות בקול תאמה את החצי השני של עקומת המיקום הסדרתי"],"a":2,"e":"בפריטים הראשונים נמצאה חפיפה מלאה בין ירידת כמות השינון לירידת שיעור ההיזכרות."},{"q":"מהו ההסבר המקובל לאפקט האחרונות?","o":["הפריטים האחרונים שוננו יותר","הפריטים האחרונים עדיין נמצאים בזט\"ק, ונשלפים ממנו","הפריטים האחרונים עברו לזט\"א","הפריטים האחרונים מוכרים יותר"],"a":1,"e":"הסבר הדעיכה בזט\"ק: המילים האחרונות הוצגו זה עתה."},{"q":"בניסוי של גלנצר וקוניץ (1966) הנבדקים ספרו לאחור 30 שניות לפני הדיווח. מה קרה?","o":["אפקט הראשונות נעלם","אפקט האחרונות נעלם","שני האפקטים התחזקו","לא היה שינוי"],"a":1,"e":"הפריטים האחרונים דעכו מהזט\"ק בזמן ההסחה, וזה תומך בהסבר שאפקט האחרונות נובע מהזט\"ק."},{"q":"מה מאפיין את H.M. (הנרי מולייסון) לאחר כריתת ההיפוקמפוס בשני צדי המוח?","o":["פגיעה בזיכרון לטווח קצר וזט\"א תקין","זיכרון לטווח קצר תקין, ופגיעה ביכולת לרכוש זיכרונות חדשים לטווח ארוך","פגיעה ביכולת לזכור מיומנויות","פגיעה בזיכרון הסמנטי בלבד"],"a":1,"e":"זו אמנזיה אנתרוגרדית. קיבולת ההיזכרות בספרות שלו הייתה תקינה."},{"q":"מהו ההבדל בין אמנזיה אנתרוגרדית לאמנזיה רטרוגרדית?","o":["אנתרוגרדית פוגעת ביכולת ליצור זיכרונות חדשים, ורטרוגרדית פוגעת בזיכרונות מלפני הפגיעה","אנתרוגרדית פוגעת בזיכרונות מהעבר, ורטרוגרדית בזיכרונות חדשים","שתיהן פוגעות בזט\"ק","אין הבדל"],"a":0,"e":"לקלייב וורינג היו שתיהן: הוא לא רכש זיכרונות חדשים וכמעט לא זכר אירועים מלפני הפגיעה."},{"q":"מה מאפיין את K.F., שנפגע באונה הקודקודית?","o":["זט\"א פגוע וזט\"ק תקין","זט\"ק פגוע (קיבולת של 2 ספרות, אפקט אחרונות מופחת) וזט\"א תקין","שני סוגי הזיכרון פגועים","שני סוגי הזיכרון תקינים"],"a":1,"e":"זהו סינדרום הזיכרון לטווח קצר."},{"q":"מה מראה השילוב בין המקרים של H.M. ו-K.F.?","o":["דיסוציאציה בודדת","דיסוציאציה כפולה, שתומכת בכך שזט\"ק וזט\"א נשענים על מנגנונים שונים","שזט\"ק וזט\"א הם אותו מנגנון","שההיפוקמפוס אחראי על הזט\"ק בלבד"],"a":1,"e":"H.M.: זט\"ק תקין וזט\"א פגוע. K.F.: זט\"ק פגוע וזט\"א תקין."},{"q":"מדוע מקרה של H.M. לבדו אינו מספיק כדי להסיק שזט\"ק וזט\"א הם מנגנונים שונים?","o":["כי הוא מראה רק דיסוציאציה בודדת","כי הוא לא עבר ניתוח","כי הזט\"ק שלו היה פגוע","כי הוא זכר הכל"],"a":0,"e":"דיסוציאציה בודדת יכולה לנבוע, למשל, מכך שמטלה אחת קשה יותר. דיסוציאציה כפולה חזקה יותר."},{"q":"מה מצאו רנגנת' ודספוזיטו (2001) במחקר fMRI במטלת היכר מושהה של פרצופים?","o":["ההיפוקמפוס אינו פעיל בזכירה לטווח קצר","ההיפוקמפוס מעורב גם בהחזקה לזמן קצר של מידע חדש","רק אונת המצח פעילה","רק האונה הקודקודית פעילה"],"a":1,"e":"זהו ממצא נגד הפרדה מוחית מלאה בין זט\"ק לזט\"א, במיוחד בגירויים חדשים."},{"q":"מה ההבדל בין זיכרון אפיזודי לזיכרון סמנטי?","o":["אפיזודי הוא ידע על העולם, וסמנטי הוא זיכרון של חוויות","אפיזודי הוא זיכרון של חוויות מחיינו, וסמנטי הוא ידע על העולם (מושגים, עובדות, מילים)","אפיזודי הוא מיומנויות, וסמנטי הוא הטרמה","אין הבדל"],"a":1,"e":"שני סוגי הזיכרון הגלוי."},{"q":"מה מאפיין את חוויית השליפה בזיכרון אפיזודי?","o":["חוויה של ידיעה ללא הקשר (\"אני יודע\")","מסע מנטלי בזמן הסובייקטיבי ושחזור של לפחות חלק מההקשר (\"אני זוכר\")","שליפה לא מודעת","אין חוויה"],"a":1,"e":"בזיכרון סמנטי יש ידיעה, בלי מסע לרגע בעבר."},{"q":"מה מאפיין את K.C. (קנט קוקריין) לאחר פגיעה בהיפוקמפוס?","o":["זיכרון אפיזודי תקין וזיכרון סמנטי פגוע","זיכרון אפיזודי פגוע וזיכרון סמנטי תקין","שניהם פגועים","שניהם תקינים"],"a":1,"e":"הוא ידע עובדות, למשל שאחיו נפטר, אבל לא יכול היה להיזכר בחוויות."},{"q":"מה מאפיין את המטופלת האיטלקייה (דה-רנצי ועמיתים, 1987) לאחר דלקת קרום המוח שפגעה באונה הרקתית השמאלית?","o":["זיכרון סמנטי פגוע וזיכרון אפיזודי תקין","זיכרון סמנטי תקין וזיכרון אפיזודי פגוע","זט\"ק פגוע","זיכרון פרוצדורלי פגוע"],"a":0,"e":"היא לא זכרה משמעויות של מילים או עובדות, אבל זכרה מה עשתה בימים הקודמים."},{"q":"הדיסוציאציה הכפולה בין המטופל K.C. לבין המטופלת האיטלקייה תומכת בהפרדה בין –","o":["הזיכרון האפיזודי והזיכרון הסמנטי","ההטרמה והזיכרון הפרוצדורלי","הזיכרון האפיזודי והזיכרון הפרוצדורלי","הזיכרון לטווח קצר והזיכרון לטווח ארוך"],"a":0,"e":"זו שאלה מהמבחן לדוגמה."},{"q":"מה מצאו לוין ועמיתים (2004) כשהשמיעו לנבדקים הקלטות של יומן אישי בזמן סריקת fMRI?","o":["אותם אזורים הופעלו לזיכרונות אפיזודיים וסמנטיים","אזורים מוחיים שונים הופעלו בשמיעת זיכרונות אפיזודיים ובשמיעת זיכרונות סמנטיים","לא הייתה הפעלה מוחית","רק ההיפוקמפוס הופעל"],"a":1,"e":"זו עדות מהדמיה מוחית להפרדה בין המנגנונים."},{"q":"מה מצאו וסטמקוט ומוסקוביץ' (2003)?","o":["ידע סמנטי על אנשים שיש לנו איתם חוויות אישיות נשלף מהר יותר","זיכרון אפיזודי פוגע בידע סמנטי","אין קשר בין אפיזודי לסמנטי","שמות לא מפורסמים נשלפו מהר יותר"],"a":0,"e":"תגובות לשמות מפורסמים בעלי משמעות אוטוביוגרפית היו מהירות יותר. זו השפעה של אפיזודי על סמנטי."},{"q":"מהו \"זיכרון אוטוביוגרפי\"?","o":["זיכרון סמנטי בלבד","תיאור העבר שלנו, שמכיל רכיבים אפיזודיים וסמנטיים שמשמשים יחד ללא הפרדה","זיכרון פרוצדורלי","זיכרון חושי"],"a":1,"e":"זו דוגמה לאינטראקציה בין אפיזודי לסמנטי."},{"q":"מהי \"סמנטיזציה\" של זיכרונות?","o":["הפיכת ידע סמנטי לזיכרון אפיזודי","ככל שחולף הזמן, הפרטים האפיזודיים של אירוע אובדים והוא הופך לידע עובדתי (סמנטי)","שכחה מלאה של אירועים","שיפור הזיכרון עם הזמן"],"a":1,"e":"פטריקן ועמיתים (2010) מצאו פחות תגובות \"זוכר\" ויותר תגובות \"יודע\" לאירועים מהעבר הרחוק."},{"q":"בהליך \"זוכר/יודע\", מתי הנבדק עונה \"יודע\"?","o":["כשהוא נזכר בחוויה ספציפית שבה פגש את הגירוי","כשהגירוי נראה מוכר אבל הוא אינו זוכר חוויה שבה פגש אותו","כשהוא אינו זוכר את הגירוי כלל","כשהגירוי חדש"],"a":1,"e":"\"זוכר\" קשור לזיכרון אפיזודי, ו\"יודע\" (מוכרות) קשור לזיכרון סמנטי."},{"q":"מה מצאו אדיס ועמיתים (2007) במחקר fMRI על דמיון העתיד?","o":["דמיון העתיד וזכירת העבר מפעילים אזורים שונים לגמרי","יש הפעלה מוחית דומה בזכירת אירועים מהעבר ובדמיון אירועים בעתיד","דמיון העתיד אינו מפעיל את המוח","רק הזיכרון הסמנטי מעורב"],"a":1,"e":"השערת הסימולציה האפיזודית הקונסטרוקטיבית: שולפים זיכרונות אפיזודיים ומשלבים אותם מחדש."},{"q":"מהו זיכרון חבוי (אימפליציטי)?","o":["זיכרון שנשלף באופן מודע","זיכרון שאינו נשלף במודע אבל מתבטא בתגובות: בלמידת מיומנויות, בהתניות ובעיבוד מהיר יותר של גירויים שהוטרמו","זיכרון של עובדות","זיכרון של חוויות"],"a":1,"e":"זיכרון גלוי (מוצהר) הוא ידע שניתן לשלוף ולהצהיר עליו במודע."},{"q":"מהו זיכרון פרוצדורלי?","o":["זיכרון לעובדות","זיכרון למיומנויות, ידע של \"איך ל-\", כמו רכיבה על אופניים, ביצוע חישובים או קריאה","זיכרון לחוויות","זיכרון חושי"],"a":1,"e":"זהו חלק מהזיכרון החבוי, וכולל מיומנויות מוטוריות, קוגניטיביות ותפיסתיות."},{"q":"איזו מהבאות היא דוגמה למטלה הבודקת זיכרון פרוצדורלי?","o":["מבחן השלמת מילים","מבחן רב-ברירה","ציור מבעד למראה","היזכרות מיידית"],"a":2,"e":"אמנזים כמו H.M. למדו כתיבה וציור מבעד למראה באופן תקין, אף שלא זכרו שלמדו."},{"q":"מהו אפקט ההטרמה על ידי חזרה?","o":["שיפור בהיזכרות מודעת","יתרון בביצוע מטלה כלפי גירוי שהוצג קודם (הוטרם), לעומת אותו גירוי כשלא הוטרם, ללא בקשה לשלוף","הפרעה של גירוי קודם","שכחה של גירויים חוזרים"],"a":1,"e":"בהטרמה על ידי חזרה, הגירוי המטרים וגירוי המבחן זהים."},{"q":"מה מגדיר מטלת זיכרון חבוי, בשונה ממטלת זיכרון גלוי?","o":["המבחן דורש היזכרות בגירויי הלמידה","בשלב המבחן הנבדקים אינם מתבקשים לשלוף גירויים משלב הלמידה ואינם צריכים לעשות זאת, והמבחן אינו מוצג כמבחן זיכרון","המבחן מתבצע מיד אחרי הלמידה","המבחן כולל רק מילים"],"a":1,"e":"לרוב גם הלמידה מקרית, כמו דירוג גובה בעלי חיים, והמבחן דורש תגובה מהירה."},{"q":"בניסוי של גראף ועמיתים (1985) עם אמנזים עם תסמונת קורסקוף, מה נמצא?","o":["האמנזים פגועים בהטרמה ותקינים בהיזכרות","אפקט ההטרמה (בהשלמת מילים) היה זהה בכל הקבוצות, אבל האמנזים היו פגועים בהיזכרות","כל הקבוצות היו פגועות","לא היה אפקט הטרמה"],"a":1,"e":"הזיכרון החבוי תקין והזיכרון הגלוי פגוע. זו דיסוציאציה, באותו כיוון כמו בזיכרון הפרוצדורלי."},{"q":"כיצד חושב אפקט ההטרמה על ידי חזרה בניסוי של גראף ועמיתים?","o":["אחוז ההיזכרות פחות אחוז ההשלמה","אחוז ההשלמה למילה כשהוטרמה, פחות אחוז ההשלמה לאותה מילה כשלא הוטרמה","מספר המילים שנזכרו","זמן התגובה לקריאת המילה"],"a":1,"e":"חצי מהנבדקים ראו רשימה א' וחצי רשימה ב', וכך כל מילה שימשה גם כמוטרמת וגם כלא מוטרמת."}],"hard":[{"q":"נבדקים לומדים רשימה של 15 מילים ומתבקשים להיזכר בהן אחרי 30 שניות של ספירה לאחור. מה צפוי בעקומת המיקום הסדרתי?","o":["שני האפקטים יישארו","אפקט הראשונות יישאר ואפקט האחרונות ייעלם, כי המילים האחרונות דעכו מהזט\"ק בזמן ההסחה","שני האפקטים ייעלמו","רק אפקט האחרונות יישאר"],"a":1,"e":"זה ממצא גלנצר וקוניץ. המילים הראשונות כבר קודדו לזט\"א."},{"q":"נבדקים לומדים רשימה בקצב איטי מאוד (מילה כל 10 שניות). איזה אפקט צפוי להתחזק, ומדוע?","o":["אפקט האחרונות","אפקט הראשונות, ויותר מכך הזכירה של כל המילים שאינן אחרונות, כי יש יותר זמן לשנן ולקודד לזט\"א","שום אפקט","שני האפקטים ייעלמו"],"a":1,"e":"לפי הסבר השינון, יותר זמן שינון מגביר את המעבר לזט\"א."},{"q":"מטופל מצליח לזכור 7 ספרות מיד, אבל אינו זוכר שפגש את הרופא לפני 10 דקות. איזה דפוס זה, ולמי הוא דומה?","o":["סינדרום זט\"ק, כמו K.F.","אמנזיה אנתרוגרדית עם זט\"ק תקין, כמו H.M.","פגיעה סמנטית, כמו המטופלת האיטלקייה","פגיעה פרוצדורלית"],"a":1,"e":"זיכרון לטווח קצר תקין, ויכולת לרכוש זיכרונות חדשים לטווח ארוך פגועה."},{"q":"מטופל K.F. מראה אפקט אחרונות מופחת. מה זה מוסיף לטענה שזט\"ק וזט\"א הם מנגנונים נפרדים?","o":["זה מראה שהזט\"א שלו פגוע","זה תואם את ההסבר שאפקט האחרונות נשען על הזט\"ק, וכך הממצא המוחי והממצא ההתנהגותי (עקומת המיקום הסדרתי) מתלכדים","זה סותר את ההפרדה","אין לזה משמעות"],"a":1,"e":"זט\"ק פגוע מנבא פגיעה באפקט האחרונות, וזה מה שנמצא."},{"q":"אדם יודע ש\"אחותו התחתנה בשנת 2015\", אבל אינו יכול להיזכר בשום רגע מהחתונה. במה הממצא דומה למקרה של K.C., ומה הוא מדגים?","o":["פגיעה בזיכרון הסמנטי","זיכרון סמנטי תקין לצד פגיעה בזיכרון האפיזודי","פגיעה פרוצדורלית","זט\"ק פגוע"],"a":1,"e":"K.C. ידע שאחיו נפטר, אבל לא יכול היה להיזכר בכך כחוויה."},{"q":"מדוע הממצא של וסטמקוט ומוסקוביץ' (שמות עם משמעות אוטוביוגרפית נשלפים מהר יותר) מעניין דווקא לאור הדיסוציאציה הכפולה בין K.C. למטופלת האיטלקייה?","o":["כי הוא סותר את הדיסוציאציה","כי הוא מראה שגם אם המנגנונים נפרדים, יש ביניהם אינטראקציה: זיכרון אפיזודי משפר את זמינות הידע הסמנטי","כי הוא מוכיח שהם אותו מנגנון","כי הוא עוסק בזט\"ק"],"a":1,"e":"נפרדות ואינטראקציה אינן סותרות זו את זו."},{"q":"במבחן השלמת מילים, נבדק אמנזי משלים \"סר__\" ל\"סרגל\" (מילה שהוצגה לו) בסבירות גבוהה, אבל אומר שהוא לא זוכר שראה רשימה. מה זה מראה?","o":["שהוא מעמיד פנים","זיכרון חבוי (הטרמה) תקין לצד זיכרון גלוי פגוע","שהזט\"ק שלו פגוע","שאין לו זיכרון סמנטי"],"a":1,"e":"זה הממצא של גראף ועמיתים."},{"q":"חוקר רוצה לוודא שמבחן השלמת מילים בודק זיכרון חבוי ולא גלוי אצל נבדקים בריאים. מה החשש, ואיך מתמודדים איתו?","o":["אין חשש","נבדקים עלולים להיזכר במודע במילים ולהשתמש בהן. לכן משתמשים בלמידה מקרית, לא מציגים את המבחן כמבחן זיכרון, ומבקשים תגובה מהירה","החשש הוא שהם ישכחו הכול","החשש הוא שהמילים קצרות מדי"],"a":1,"e":"כל אלה נועדו להפריד את ההטרמה מהשליפה המודעת."},{"q":"לפי ממצא הסמנטיזציה (פטריקן ועמיתים), מה צפוי אם תשאלו אדם בן 70 על אירוע מפורסם מילדותו לעומת אירוע מלפני שנה?","o":["יותר תגובות \"זוכר\" לאירוע מהילדות","יותר תגובות \"יודע\" לאירוע מהילדות, ויותר \"זוכר\" לאירוע מלפני שנה","אין הבדל","הוא לא יכיר אף אחד מהם"],"a":1,"e":"עם הזמן הפרטים האפיזודיים אובדים, והזיכרון הופך לידע עובדתי."},{"q":"ממצא ה-fMRI של רנגנת' ודספוזיטו מצא מעורבות של ההיפוקמפוס בהחזקה קצרת טווח של פרצופים חדשים. איך אפשר ליישב זאת עם המקרה של H.M., שהזט\"ק שלו נראה תקין?","o":["אי אפשר ליישב","H.M. נבדק בעיקר בזכירת ספרות, מידע מוכר. ההיפוקמפוס עשוי להיות מעורב בעיקר בהחזקה קצרה של מידע חדש","H.M. לא עבר ניתוח","ההיפוקמפוס אינו קשור לזיכרון"],"a":1,"e":"העדויות מעורבות: אזורים משותפים מעורבים במיוחד במטלות עם גירויים חדשים."}]},{"id":"c7","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 7: תהליכי קידוד ושליפה","questions":[{"q":"מהו \"קידוד\" בזיכרון?","o":["העברת מידע מהזט\"א לזיכרון העבודה","הכנסת מידע לזיכרון לטווח ארוך","שכחת מידע","החזקת מידע בזיכרון החושי"],"a":1,"e":"שליפה היא הוצאת מידע מהזט\"א לזיכרון העבודה."},{"q":"מה ההבדל בין שינון אחזקה לשינון מעמיק?","o":["שינון אחזקה מתייחס למשמעות, ושינון מעמיק לא","שינון אחזקה הוא חזרה ללא התייחסות למשמעות ומתאים לזט\"ק, ושינון מעמיק מתייחס למשמעות ולקישור לידע קיים ומוביל לזכירה טובה לטווח ארוך","אין הבדל","שינון מעמיק מתאים רק לזט\"ק"],"a":1,"e":"אלה שני סוגי הקידוד במודל המודאלי."},{"q":"לפי תיאוריית רמות העיבוד (קרייק ולוקהרט, 1972), איזו שאלה מובילה לעיבוד העמוק ביותר?","o":["האם המילה כתובה באותיות דפוס?","האם המילה מתחרזת עם \"חתול\"?","האם המילה מתאימה למשפט \"הוא ראה ___ ברחוב\"?","כמה אותיות יש במילה?"],"a":2,"e":"עיבוד משמעות הוא עמוק, עיבוד פונולוגי הוא ביניים ועיבוד פיזיקלי הוא שטחי."},{"q":"מה נמצא בניסוי של קרייק וטולווינג (1975)?","o":["עיבוד שטחי הוביל לזכירה הטובה ביותר","עיבוד עמוק הוביל לזכירה טובה יותר מעיבוד ביניים, ועיבוד ביניים לזכירה טובה יותר מעיבוד שטחי","אין השפעה לרמת העיבוד","רק עיבוד פונולוגי שיפר את הזכירה"],"a":1,"e":"זהו אפקט רמות העיבוד."},{"q":"מהי הביקורת המרכזית על תיאוריית רמות העיבוד?","o":["היא אינה מתאימה לזיכרון חזותי","היא מעגלית (טאוטולוגית): זכרו כי עיבדו לעומק, ויודעים שעיבדו לעומק כי זכרו","היא אינה מסבירה שכחה","היא מתאימה רק לבעלי חיים"],"a":1,"e":"אין מדד בלתי תלוי לעומק העיבוד."},{"q":"בניסוי של באואר ווינזנץ (1970) על למידת צמדי מילים, מה נמצא?","o":["קבוצת השינון זכרה יותר","קבוצת הדימוי החזותי זכרה יותר מפי שניים מילים מקבוצת השינון","לא היה הבדל","שתי הקבוצות לא זכרו כלום"],"a":1,"e":"יצירת דימוי שמקשר בין שני הגירויים משפרת את הזכירה."},{"q":"מהו \"אפקט הייחוס לעצמי\" (רוג'רס ועמיתים, 1977)?","o":["שיעור הזכירה הנמוך ביותר היה כשהמילים יוחסו לעצמי","שיעור הזכירה הגבוה ביותר היה בתנאי \"האם המילה מתארת אותך?\"","הנבדקים זכרו רק מילים שליליות","אין השפעה לייחוס לעצמי"],"a":1,"e":"ההסבר האפשרי: העצמי מוכר לעומק ומספק הקשרים רבים לקידוד."},{"q":"בניסוי של גראף וסלמקה (1978), נבדקים בתנאי היצירה השלימו מילים (מלך־כת___) ונבדקים בתנאי הקריאה קראו צמדים (מלך־כתר). מה נמצא?","o":["תנאי הקריאה הוביל לזכירה טובה יותר","תנאי היצירה הוביל לזכירה טובה יותר, בפער של כ-28%","לא היה הבדל","שני התנאים הובילו לשכחה"],"a":1,"e":"זהו אפקט היצירה: יצירה עצמית של החומר טובה מקבלה פסיבית שלו."},{"q":"בניסוי של ג'נקינס וראסל (1952), נבדקים שלמדו מילים מקטגוריות שונות במעורבב שלפו אותן באופן מאורגן לפי קטגוריות. מה ההסבר?","o":["הנבדקים קיבלו רמזים מהנסיין","בלמידה השתמשו בקטגוריות הארגון שבזיכרון, ובשליפה מילה מקטגוריה שימשה רמז שליפה למילים אחרות מאותה קטגוריה","המילים הוצגו מאורגנות","זה מקרי"],"a":1,"e":"למשל, \"תפוח\" שימש רמז לשליפת \"שזיף\" ו\"ענב\"."},{"q":"בניסוי של באואר ועמיתים (1969) מילים אורגנו בדיאגרמות \"עצים\" לפי קטגוריות מוכרות, או באופן מקרי. מה נמצא?","o":["קבוצת הארגון זכרה כ-73 מילים, וקבוצת הביקורת כ-21","שתי הקבוצות זכרו אותו מספר","קבוצת הביקורת זכרה יותר","אף קבוצה לא זכרה"],"a":0,"e":"ארגון בלמידה שתואם קטגוריות מוכרות משפר מאוד את ההיזכרות."},{"q":"בניסוי של ברנספורד וג'ונסון (1972) על טקסט הבלונים, איזו קבוצה זכרה הכי טוב?","o":["הקבוצה ללא תמונה","הקבוצה שראתה את התמונה לפני הטקסט","הקבוצה שראתה את התמונה אחרי הטקסט","כל הקבוצות זכרו אותו דבר"],"a":1,"e":"התמונה שהוצגה לפני הטקסט סיפקה מסגרת מנטלית לארגון המידע בשלב הלמידה. כך זכרו פי 2."},{"q":"מדוע התמונה שהוצגה אחרי הטקסט, בניסוי של ברנספורד וג'ונסון, לא שיפרה את הזכירה?","o":["כי התמונה הייתה לא ברורה","כי הארגון צריך להתרחש בשלב הקידוד, והתמונה הגיעה אחרי שהטקסט כבר קודד בלי מסגרת","כי הנבדקים לא ראו את התמונה","כי התמונה הסיחה את הדעת"],"a":1,"e":"התמונה מועילה כמסגרת בזמן הקידוד."},{"q":"מה מצאו נרן ועמיתים (2007, 2008) לגבי ייחוס ערך הישרדותי למילים?","o":["ספירת הברות הובילה לזכירה טובה יותר","דירוג הרלוונטיות להישרדות הוביל לזכירה גבוהה יותר מספירת הברות, ואף מכל השיטות האחרות שנבדקו","לא היה הבדל","ערך הישרדותי פוגע בזכירה"],"a":1,"e":"הזכירה הייתה טובה יותר מאשר בדימוי חזותי, בייחוס לעצמי וביצירה."},{"q":"מה מצאו רדיגר וקרפיקה (2006) לגבי היבחנות לעומת קריאה חוזרת?","o":["קריאה חוזרת טובה יותר תמיד","אחרי 5 דקות קריאה חוזרת הייתה מעט טובה יותר, אבל ככל שחלף זמן רב יותר מהלמידה היבחנות הובילה לזכירה טובה יותר","היבחנות טובה יותר רק מיד אחרי הלמידה","אין הבדל"],"a":1,"e":"זהו אפקט ההיבחנות: תרגול שליפה משפר זכירה לאורך זמן."},{"q":"בניסוי של טולווינג ופרלסטון (1966), מה היה שיעור הזכירה בהיזכרות חופשית לעומת היזכרות עם רמז (שמות קטגוריות)?","o":["75% לעומת 40%","40% לעומת 75%","שווה בשתיהן","10% לעומת 90%"],"a":1,"e":"רמזים שניתנים בשלב השליפה מסייעים להצלחתה."},{"q":"בניסוי של מנטילה (1986), שהשווה בין סוגים של רמזי שליפה, השליפה הטובה ביותר התקבלה כשהנבדק נעזר ברמזים –","o":["שהוא עצמו הפיק אותם","שנבדק אחר הפיק אותם","שהופקו גם על ידי הנבדק וגם על ידי אחרים","שהופקו על ידי אנשים שלא השתתפו בניסוי"],"a":0,"e":"91% עם רמזים בהפקה עצמית, לעומת 55% עם רמזים של אדם אחר. ניחוש בלבד הביא ל-17%."},{"q":"בניסוי של מנטילה, מה הייתה מטרת קבוצת הביקורת שלא עברה את שלב הלמידה?","o":["למדוד את ההצלחה שנובעת מניחוש בלבד על בסיס הרמזים","לבדוק רמזים בהפקה עצמית","לבדוק זיכרון לטווח קצר","לבדוק אפקט יצירה"],"a":0,"e":"היא הראתה שהרמזים מסייעים מעבר לניחוש בלבד (17%)."},{"q":"מהו עקרון ייחודיות הקידוד?","o":["מידע מקודד בלי קשר להקשר","מידע מקודד יחד עם ההקשר שבו נרכש, והשליפה מצליחה יותר כשההקשר בשליפה דומה להקשר בקידוד","כל מידע מקודד באופן ייחודי לאדם","קידוד עמוק תמיד עדיף"],"a":1,"e":"שלוש השפעות של התאמה בין קידוד לשליפה: ייחודיות הקידוד, למידה תלוית מצב והתאמת עיבוד."},{"q":"בניסוי של גודן ובאדלי (1975), צוללנים למדו מילים במים או ביבשה ונבחנו במים או ביבשה. מה נמצא?","o":["למידה ביבשה הייתה טובה יותר תמיד","ההיזכרות הייתה טובה יותר כשתנאי הלמידה ותנאי המבחן היו זהים","ההיזכרות הייתה טובה יותר במים תמיד","לא היה הבדל"],"a":1,"e":"זו תמיכה בעקרון ייחודיות הקידוד."},{"q":"בניסוי של גרנט ועמיתים (1998) נבדקים קראו מאמר בשקט או עם רעשי קפיטריה, ונבחנו בשקט או ברעש. מה נמצא?","o":["למידה בשקט טובה יותר תמיד","ההיזכרות הייתה טובה יותר כשתנאי הלמידה ותנאי המבחן היו זהים","הרעש שיפר את הזכירה תמיד","לא היה הבדל"],"a":1,"e":"גם זה מדגים את עקרון ייחודיות הקידוד, ויש לו השלכה ללמידה למבחן."},{"q":"מהי \"למידה תלוית מצב\"?","o":["למידה שתלויה ברמת האינטליגנציה","השליפה מצליחה יותר כשהמצב הגופני והנפשי בזמן השליפה דומה למצב בזמן הקידוד","למידה שמתרחשת רק במצב רוח טוב","למידה שתלויה במקום"],"a":1,"e":"איך ומטקאלף (1989) בדקו זאת באמצעות מצב רוח עצוב או שמח."},{"q":"בניסוי של איך ומטקאלף (1989) על מצב רוח, מה נמצא?","o":["מצב רוח שמח בלמידה הוביל תמיד לזכירה הטובה ביותר","ההיזכרות הייתה טובה יותר כשמצב הרוח במבחן היה זהה למצב הרוח בזמן הלמידה","מצב רוח עצוב שיפר את הזכירה תמיד","לא היה הבדל"],"a":1,"e":"25 לעומת 16, ו-32 לעומת 16, לטובת התאמת מצב הרוח."},{"q":"בניסוי של מוריס ועמיתים (1977), מה היו שני תנאי הקידוד?","o":["תמונה וטקסט","משמעות (האם המילה משלימה משפט בעל משמעות) וחריזה (האם המילה מתחרזת)","שקט ורעש","שמח ועצוב"],"a":1,"e":"שלב השליפה היה מבחן זיהוי חריזה."},{"q":"איזו תוצאה בניסוי של מוריס ועמיתים תומכת בהשפעה של התאמת עיבוד ומנוגדת לתיאוריית רמות העיבוד?","o":["בהיזכרות חופשית, נבדקים שלמדו בתנאי משמעות זכרו יותר","בהיזכרות חופשית, נבדקים שלמדו בתנאי חריזה זכרו יותר","במבחן החריזה הצליחו יותר הנבדקים שלמדו בתנאי משמעות","במבחן החריזה הצליחו יותר הנבדקים שלמדו בתנאי חריזה"],"a":3,"e":"לפי רמות העיבוד, תנאי המשמעות (העמוק) היה צריך להצליח יותר. בפועל הצליח מי שעיבודו תאם את המבחן."},{"q":"מה הניבוי של תיאוריית רמות העיבוד לגבי מבחן זיהוי החריזה בניסוי של מוריס ועמיתים?","o":["שתנאי החריזה יצליח יותר","שתנאי המשמעות יצליח יותר, כי המילים עברו עיבוד עמוק יותר","ששני התנאים יצליחו באותה מידה","ששני התנאים ייכשלו"],"a":1,"e":"הניבוי לא התקיים."},{"q":"מה המסקנה מניסוי מוריס ועמיתים לגבי עיבוד עמוק?","o":["עיבוד עמוק תמיד מביא לשליפה טובה יותר","עיבוד עמוק מביא לשליפה טובה יותר רק אם גם המבחן דורש עיבוד עמוק","עיבוד עמוק פוגע בשליפה","עיבוד שטחי תמיד עדיף"],"a":1,"e":"מידת ההתאמה בסוג העיבוד בין הקידוד לשליפה היא שקובעת."},{"q":"קשה לנו להיזכר אם נעלנו את הדלת. איזה עיקרון מסביר זאת?","o":["ייחודיות הקידוד","רמות העיבוד: לא הקדשנו תשומת לב למשמעות הפעולה ולכן עיבדנו אותה באופן שטחי","למידה תלוית מצב","אפקט ההיבחנות"],"a":1,"e":"הפניית תשומת לב למשמעות הפעולה מגדילה את הסיכוי להיזכר בה."},{"q":"סטודנטית לומדת למבחן. לפי הממצאים בפרק, מה יהיה היעיל ביותר לזכירה לאורך זמן?","o":["לקרוא שוב ושוב את הסיכומים","לבחון את עצמה בשאלות, כלומר לתרגל שליפה","להדגיש בטוש","לשנן בקול בלי לחשוב על המשמעות"],"a":1,"e":"אפקט ההיבחנות: תרגול שליפה מוביל לזכירה טובה יותר לאורך זמן מקריאה חוזרת."},{"q":"מהו המשתנה התלוי בניסוי של קרייק וטולווינג (1975)?","o":["סוג השאלה שהוצגה לפני כל מילה","שיעור הזכירה במבחן היזכרות דחוי","זמן הצגת המילה","מספר המילים"],"a":1,"e":"המשתנה הבלתי תלוי היה רמת העיבוד (שטחי, ביניים, עמוק), שתופעלה באמצעות סוג השאלה."},{"q":"איזה מהבאים אינו אחת משלוש ההשפעות של התאמה בין שלב הקידוד לשלב השליפה?","o":["ייחודיות הקידוד","למידה תלוית מצב","התאמת עיבוד","אפקט היצירה"],"a":3,"e":"אפקט היצירה הוא השפעה של תהליך הקידוד עצמו, ולא של ההתאמה בין קידוד לשליפה."}],"hard":[{"q":"סטודנט שואל את עצמו על כל מונח: \"איך זה קשור למשהו שקרה לי?\". אילו שני אפקטים מהפרק הוא מנצל?","o":["רמות עיבוד ואפקט הייחוס לעצמי","ייחודיות הקידוד ולמידה תלוית מצב","דעיכה והפרעה","יצירה ושינון אחזקה"],"a":0,"e":"קישור לעצמי הוא עיבוד עמוק במיוחד, וממצא רוג'רס מראה שזה התנאי עם הזכירה הגבוהה ביותר."},{"q":"בעקבות ממצאי מוריס ועמיתים, איזו דרך לימוד מתאימה ביותר למבחן שבו השאלות בודקות הבנה של ניסויים (מה תומך במה)?","o":["שינון ניסוח המונחים מילה במילה","עיבוד לפי משמעות: לשאול את עצמך מה כל ממצא מראה ונגד מה הוא טוען, כי זה סוג העיבוד שהמבחן ידרוש","חזרה על המילים בקול","לימוד באותו חדר שבו תיערך הבחינה"],"a":1,"e":"התאמת עיבוד: השליפה טובה יותר כשהעיבוד בלמידה תואם את העיבוד שהמבחן דורש."},{"q":"מדוע הממצא של מוריס ועמיתים נחשב לבעייתי במיוחד עבור תיאוריית רמות העיבוד?","o":["כי לא נמצא אפקט כלל","כי באותו ניסוי, עיבוד שטחי (חריזה) הוביל לביצוע טוב יותר מעיבוד עמוק (משמעות) כשהמבחן היה מבחן חריזה, ולכן \"עומק\" לבדו אינו מנבא זכירה","כי השתמשו בצוללנים","כי השתמשו במילים קצרות"],"a":1,"e":"מה שקובע הוא ההתאמה בין הקידוד לשליפה, ולא העומק לבדו."},{"q":"לפי ניסוי ברנספורד וג'ונסון, מה הכי יעזור לסטודנטית לזכור פרק קשה?","o":["לקרוא את הפרק ואחר כך את הסיכום","לקרוא קודם סיכום או מבנה של הפרק (כותרות, מפה), כדי שתהיה לה מסגרת לארגון בזמן הקריאה","לקרוא את הפרק פעמיים","לקרוא את הפרק בקול"],"a":1,"e":"התמונה עזרה רק כשהוצגה לפני הטקסט, כי היא סיפקה מסגרת בזמן הקידוד."},{"q":"צוללנים למדו ביבשה ונבחנו ביבשה, וזכרו 13.5 מילים. צוללנים שלמדו ביבשה ונבחנו במים זכרו 8.5. מה הממצא החסר כדי להוכיח שזה לא פשוט \"מים מפריעים לזכירה\"?","o":["אין צורך בממצא נוסף","שמי שלמדו במים ונבחנו במים זכרו יותר ממי שלמדו במים ונבחנו ביבשה","שכולם זכרו אותו דבר","שהמים היו קרים"],"a":1,"e":"רק אינטראקציה, כלומר יתרון לאותו הקשר בשני הכיוונים, מראה ייחודיות קידוד."},{"q":"נבדקים במצב רוח שמח לומדים מילים ונבחנים במצב רוח עצוב. לפי איך ומטקאלף, מה יעזור להם להיזכר יותר?","o":["להישאר עצובים","להחזיר את מצב הרוח השמח לפני הבחינה, כדי שהמצב בשליפה יתאים למצב בקידוד","ללמוד שוב בעצב","שום דבר לא יעזור"],"a":1,"e":"למידה תלוית מצב: ההתאמה בין המצבים היא שמשפרת את השליפה."},{"q":"מדוע ייתכן שרמזי שליפה בהפקה עצמית (מנטילה) יעילים יותר מרמזים של אדם אחר?","o":["כי הם ארוכים יותר","כי הם נבנו מתוך הקשרים האישיים שהנבדק עצמו יצר בזמן הקידוד, ולכן הם תואמים יותר את מה שקודד (ייחודיות הקידוד)","כי הם קלים יותר","כי הנבדק סומך על עצמו"],"a":1,"e":"התאמה בין הקידוד לרמז השליפה היא המפתח."},{"q":"בניסוי רדיגר וקרפיקה, אחרי 5 דקות קבוצת הקריאה החוזרת הייתה טובה מעט יותר. מה הסכנה בכך לסטודנטים?","o":["אין סכנה","קריאה חוזרת יוצרת תחושה שהחומר ידוע, כי בטווח הקצר היא אכן עובדת, ולכן סטודנטים עלולים להעדיף אותה למרות שלטווח ארוך היבחנות עדיפה","קריאה חוזרת גורמת לשכחה מיידית","היבחנות מזיקה בטווח הקצר בלבד"],"a":1,"e":"היתרון של היבחנות מופיע בעיקר בהשהיות ארוכות, וזה המצב של מבחן אמיתי."},{"q":"לפי ממצאי נרן ועמיתים, איזו משימת לימוד צפויה להוביל לזכירה הטובה ביותר של רשימת מילים?","o":["לספור את ההברות בכל מילה","לדרג עד כמה כל מילה רלוונטית להישרדות בארץ זרה","לחזור על כל מילה שלוש פעמים","לכתוב כל מילה באותיות דפוס"],"a":1,"e":"עיבוד הישרדותי הוביל לזכירה טובה אפילו יותר מדימוי חזותי, מייחוס לעצמי ומיצירה."},{"q":"מה המשותף לאפקט היצירה, לאפקט הייחוס לעצמי ולאפקט הדימוי החזותי?","o":["כולם מבוססים על שינון אחזקה","כולם דורשים מהלומד עיבוד פעיל שמקשר את המידע לידע קיים או לתוכן נוסף, ולא קבלה פסיבית","כולם תלויים בהקשר הפיזי","כולם מתרחשים בשלב השליפה"],"a":1,"e":"אלה השפעות של תהליכי קידוד שמעשירים את הייצוג."}]},{"id":"c8","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 8: זיכרונות אפיזודיים – היזכרות מוגברת, זיכרונות הבזק, הבניה וסוגסטיה","questions":[{"q":"מהי \"תופעת ההיזכרות המוגברת\"?","o":["אנשים זוכרים הכי הרבה מהשנה האחרונה","אנשים בני 40 ומעלה זוכרים הכי הרבה זיכרונות מגיל ההתבגרות ומהבגרות הצעירה","אנשים זוכרים הכי הרבה מגיל הגן","אין הבדל בין תקופות החיים"],"a":1,"e":"אלה ממצאי קונווי (1996) ורובין ועמיתים (1998)."},{"q":"איזה ממצא תומך בהשערת הדימוי העצמי להיזכרות המוגברת (רת'בון, 2008)?","o":["מהגרים בגיל 30 הראו היזכרות מוגברת מאוחרת","הגיל הממוצע שבו נבדקים התחילו להשתמש במשפטים שמגדירים את עצמם (כמו \"אני אימא\") היה 25, ורוב האירועים הקשורים בהם היו בתקופת ההיזכרות המוגברת","נבדקים ציינו גילאים של אירועים חשובים בתרבות","זיכרונות ההבזק השתנו עם הזמן"],"a":1,"e":"בתקופה זו מתגבשים הדימוי העצמי והזהות הבוגרת."},{"q":"לפי ההשערה הקוגניטיבית להיזכרות המוגברת –","o":["תקופה של שינויים מהירים ואחריה תקופת יציבות מובילות לקידוד חזק יותר של זיכרונות","זוכרים אירועים שהם חלק מתסריט החיים בתרבות","זוכרים אירועים שקשורים לדימוי העצמי","זוכרים רק אירועים רגשיים"],"a":0,"e":"שראוף ורובין (1998): אצל מי שהיגרו באמצע שנות ה-30 ההיזכרות המוגברת הייתה בגילאים מאוחרים יותר, בהתאם לגיל ההגירה."},{"q":"בניסוי של ברנטסן ורובין (2004) נבדקים ציינו גילאים שבהם בדרך כלל מתרחשים אירועים חשובים בחיי אדם. מה תמך בהשערת תסריט החיים התלוי בתרבות?","o":["רוב הגילאים שצוינו היו בילדות המוקדמת","רוב הגילאים שצוינו היו בתוך תקופת ההיזכרות המוגברת","הגילאים היו מפוזרים באופן אחיד","הנבדקים לא ידעו לענות"],"a":1,"e":"קל לזכור אירועים שהם נקודות ציון בתסריט החיים של התרבות."},{"q":"מהם \"זיכרונות הבזק\" לפי בראון וקוליק (1977)?","o":["זיכרונות של חלומות","זיכרונות של נסיבות ההיחשפות לאירועים דרמטיים וטעונים רגשית, שלטענתם מדויקים ועשירים בפרטים כמו צילום","זיכרונות לטווח קצר מאוד","זיכרונות מילדות"],"a":1,"e":"למשל, היכן הייתי כששמעתי על רצח רבין. המחקרים בדקו אם הם באמת מדויקים."},{"q":"מה מצאו נייסר והארש (1992) בניסוי על התפוצצות המעבורת צ'לנג'ר?","o":["הזיכרונות נשארו זהים לאחר שנתיים וחצי","הזיכרונות השתנו: יום אחרי האירוע 21% דיווחו ששמעו עליו בטלוויזיה, ואחרי שנתיים וחצי 45%","הנבדקים לא זכרו כלום","הזיכרונות השתפרו עם הזמן"],"a":1,"e":"זיכרונות הבזק משתנים עם הזמן."},{"q":"באיזו שיטה השתמשו נייסר והארש?","o":["הליך זוכר/יודע","היזכרות חוזרת: השוואה בין היזכרויות באותו אירוע לאורך זמן","מבחן השלמת מילים","מסדר זיהוי"],"a":1,"e":"שאלון יום אחרי האסון, ושוב אחרי כשנתיים וחצי."},{"q":"מה מצאו טלריקו ורובין (2003) לגבי זיכרונות הבזק מפיגוע התאומים, לעומת זיכרונות יומיומיים?","o":["זיכרונות ההבזק מדויקים יותר","הדיוק ירד באותה מידה בשני הסוגים, אבל הביטחון בזיכרונות ההבזק לא ירד, בניגוד לזיכרונות היומיומיים","הביטחון ירד יותר בזיכרונות ההבזק","לא היה שינוי בשניהם"],"a":1,"e":"זיכרונות הבזק דועכים כמו זיכרונות אחרים, אבל הביטחון בהם נשאר גבוה, ולכן הוא ביטחון שגוי."},{"q":"מה מצאו רימלה ועמיתים (2011) לגבי תמונות שליליות לעומת נייטרליות?","o":["תמונות שליליות נזכרו בפרטים טובים יותר, כולל צבע המסגרת","תמונות שליליות קיבלו יותר תגובות \"זוכר\" וביטחון גבוה יותר, אבל צבע המסגרת שלהן נזכר פחות","לא היה הבדל","תמונות נייטרליות קיבלו יותר תגובות \"זוכר\""],"a":1,"e":"רגשות יוצרים תחושה של היזכרות, אבל אינם משפרים (ולעיתים מחלישים) את זיכרון הפרטים."},{"q":"מהי \"השערת שינון הנרטיב\"?","o":["זיכרונות הבזק מדויקים כי הם רגשיים","הביטחון בזיכרון ההבזק לא יורד כי שיננו שוב ושוב את הסיפור (הנרטיב) של האירוע, למשל בעקבות הופעתו בתקשורת, ומה שאנו זוכרים הוא הנרטיב ולא החוויה המקורית","זיכרונות הבזק נשכחים מהר","לא מספרים על אירועים דרמטיים"],"a":1,"e":"הסיקור התקשורתי והשיחות החוזרות משנים את הזיכרון."},{"q":"בניסוי של אוסט ועמיתים (2002) נבדקים נשאלו אם ראו את סרט הפפראצי של תאונת הנסיכה דיאנה (סרט שמעולם לא הוצג). מה נמצא?","o":["אף נבדק לא טען שראה","כ-44% טענו שראו את הסרט","כל הנבדקים טענו שראו","הנבדקים לא שמעו על התאונה"],"a":1,"e":"הסיקור התקשורתי הנרחב גרם לאנשים לזכור משהו שלא ראו."},{"q":"מהו \"ניטור מקור\"?","o":["מעקב אחר מקורות מידע בתקשורת","התהליך של קביעת המקור של הזיכרונות, הידע והאמונות שלנו","זיכרון של מקומות","שליפה של זיכרון סמנטי"],"a":1,"e":"טעות בניטור מקור היא ייחוס מקור שגוי, למשל קריפטומנזיה (פלגיאט לא מודע)."},{"q":"בניסוי \"להתפרסם בין לילה\" (ג'קובי ועמיתים, 1989), מה קרה לשמות לא מפורסמים מהלמידה במבחן המושהה (אחרי 24 שעות)?","o":["הם זוהו נכון כלא מפורסמים","חלק מהם זוהו בטעות כמפורסמים","הם נשכחו לגמרי","הם זוהו כמפורסמים רק במבחן המיידי"],"a":1,"e":"הנבדקים פירשו בטעות את המוכרות של השמות כמפורסמות. זו טעות בניטור מקור."},{"q":"בניסוי של מארש ועמיתים (2006), ניתנו משפטים סטריאוטיפיים-מגדרית בשמות \"חן\" ו\"יובל\", ואחר כך נאמר שחן גבר ויובל אישה. באילו משפטים היו יותר טעויות בניטור מקור?","o":["משפטים נשיים שאמר חן, ומשפטים גבריים שאמרה יובל","משפטים נשיים שאמרה יובל, ומשפטים גבריים שאמר חן","כל המשפטים שאמרה יובל","כל המשפטים שאמר חן"],"a":0,"e":"כשלא זוכרים מי אמר, קובעים את המקור לפי הסטריאוטיפ, ולכן טועים כשאין התאמה בין התוכן לבין מגדר הדובר."},{"q":"מהי \"הסקה פרגמטית\"?","o":["הסקה לוגית מדויקת","השלמת תכנים, למשל של מה שנאמר לנו, על ידי מרכיבים שלא היו במקור, על סמך ציפיות וידע קודם","שכחת פרטים","זיכרון של עובדות"],"a":1,"e":"למשל, \"נמוג\" נזכר כ\"נמס\", \"ריסק\" כ\"שבר\", ו\"נשאר ער\" כ\"בכה\". הטעויות היו בכשליש מהמשפטים."},{"q":"מהי \"סכמה\"?","o":["רצף פעולות שעושים בסיטואציה מסוימת","הידע שיש לאדם על היבט מסוים של העולם, למשל איך נראה משרד ומה יש בו","זיכרון של אירוע אחד","שיטת לימוד"],"a":1,"e":"תסריט הוא סכמה של רצף פעולות, למשל ביקור אצל רופא שיניים."},{"q":"בניסוי של ברואר וטרייאנס (1981), נבדקים שהמתינו 35 שניות במשרד התבקשו אחר כך להיזכר במה שראו בו. מה נמצא?","o":["הם זכרו רק עצמים יוצאי דופן","הם נזכרו גם בעצמים שלא היו במשרד, כמו ספרים, בהשפעת \"סכמת משרד\"","הם לא זכרו דבר","הם זכרו הכל במדויק"],"a":1,"e":"סכמות מהזיכרון הסמנטי משפיעות על זיכרון האירוע."},{"q":"בניסוי של באואר ועמיתים (1979) נבדקים קראו סיפור על ביקור אצל רופא שיניים. מה הוסיפו בשחזור?","o":["פרטים מסיפורים אחרים","פרטים מתסריט הביקור אצל רופא שיניים שלא הופיעו בסיפור, כמו פקידת קבלה","רק את הכותרת","שום דבר"],"a":1,"e":"תסריטים מהזיכרון הסמנטי משפיעים על זכירת אירועים."},{"q":"בניסוי של דיז (1959) ורדיגר ומקדרמוט (1995) הוצגה רשימת מילים קשורות (מיטה, מנוחה, עייף, חלום...). מה נמצא?","o":["הנבדקים זכרו רק את המילה הראשונה","הנבדקים נזכרו במילה \"שינה\" או הכירו אותה, אף שלא הופיעה ברשימה","הנבדקים לא זכרו אף מילה","הנבדקים זכרו את כל המילים במדויק"],"a":1,"e":"זו היזכרות והיכר שגויים שנובעים מקשר סמנטי."},{"q":"על סמך ההסבר של הממצאים בפרק, איזה מהבאים אינו נובע מהבניה של הזיכרון על סמך ידע קודם (שהתקיים לפני האירוע לזכירה)?","o":["החלפת מילים במשפט ששמענו במילים אחרות שמתאימות לו (הסקה פרגמטית)","דיווח על פריטים שלא ראינו בגלל סכמות ותסריטים","סימון שגוי של מילים כמוכרות כי הן קשורות למילים שהוצגו","דיווח שגוי שמקורו במידע מטעה שנמסר לנו אחרי האירוע (אפקט המידע המטעה)"],"a":3,"e":"אפקט המידע המטעה נובע ממידע שהתקבל אחרי האירוע ולא מידע קודם. זו שאלה מהמבחן לדוגמה."},{"q":"מהו היתרון של הטבע המבנה (הקונסטרוקטיבי) של הזיכרון?","o":["הוא מונע טעויות","הוא מאפשר לזיכרון האפיזודי להתמקד בפרטים הייחודיים, ולהשלים מידע חסר על סמך ידע כללי","הוא מאפשר זיכרון מושלם","אין לו יתרון"],"a":1,"e":"החיסרון הוא עיוותי זיכרון. מקרים של זיכרון \"מושלם\" (S., A.J.) מראים שהבניה ושכחה הן כנראה הישרדותיות."},{"q":"בניסוי של לופטוס ועמיתים (1978) נבדקים ראו מכונית ליד תמרור \"עצור\", ואחר כך נשאלו שאלה שהזכירה תמרור \"תן זכות קדימה\". מה נמצא?","o":["הם זכרו נכון את תמרור העצור","קבוצת המידע המטעה נטתה יותר לבחור בתמונה השגויה (תן זכות קדימה)","לא היה הבדל בין הקבוצות","קבוצת הביקורת טעתה יותר"],"a":1,"e":"זהו אפקט המידע המטעה: מידע מטעה שנקלט אחרי האירוע משנה את זיכרון האירוע."},{"q":"בניסוי של לופטוס ופאלמר (1974), נבדקים שנשאלו על מכוניות ש\"התנגשו בעוצמה\" –","o":["העריכו מהירות נמוכה יותר","העריכו מהירות גבוהה יותר (66 קמ\"ש לעומת 50), ויותר מהם דיווחו שראו שברי זכוכית","לא הושפעו מניסוח השאלה","דיווחו פחות פרטים"],"a":1,"e":"32% דיווחו על זכוכית שבורה, לעומת 14% בתנאי \"פגעו\". תיאור אחרי האירוע משפיע על הערכתו."},{"q":"מהם שני ההסברים האפשריים לאפקט המידע המטעה?","o":["דעיכה וקיבולת","הפרעה למוקדם שגורם המידע המטעה, או ניטור מקור שגוי לגבי המידע המטעה","קשב וזיכרון עבודה","סכמה ותסריט"],"a":1,"e":"לינדזי (1990) מצאה תמיכה בהסבר של ניטור מקור שגוי."},{"q":"מדוע ממצאי לינדזי (1990) תומכים בהסבר ניטור המקור השגוי לאפקט המידע המטעה?","o":["כי לא נמצאו טעויות","כי בתנאי הקשה (לזכור מה היה המקור) הנבדקים טעו פי 2, אף שנאמר להם להתעלם מהמידע המטעה, ואילו הפרעה למוקדם הייתה אמורה להתרחש בשני התנאים באותה מידה","כי הנבדקים זכרו טוב יותר את המידע המטעה","כי לא היה מידע מטעה"],"a":1,"e":"ההבדל בין התנאים מצביע על קושי בניטור מקור."},{"q":"בניסוי של היימן ועמיתים (1995) הוצגו לנבדקים תיאורים של אירועי ילדות אמיתיים ומומצאים, כאילו נמסרו מהוריהם. מה נמצא?","o":["הנבדקים דחו את כל האירועים המומצאים","הנבדקים \"נזכרו\" והרחיבו לגבי כ-20% מהאירועים המומצאים","הנבדקים זכרו רק אירועים מומצאים","הנבדקים לא זכרו אירועים אמיתיים"],"a":1,"e":"למשל קערת הפונץ' בחתונה. סוגסטיה יכולה ליצור זיכרונות ילדות שגויים."},{"q":"במקרה של הולי רומונה, איזו תופעה מהפרק הודגמה?","o":["זיכרון הבזק","יצירת זיכרון ילדות שגוי בעקבות סוגסטיה של מטפל","היזכרות מוגברת","הסקה פרגמטית"],"a":1,"e":"האב תבע את המטפל על השתלת זיכרון שגוי וזכה במשפט. אליזבת לופטוס העידה כעדה מומחית."},{"q":"בניסוי של ווייד ועמיתים (2002) הוצגו לנבדקים תמונות פוטושופ שלהם בטיסה בכדור פורח שלא התקיימה. מה נמצא אחרי כמה ראיונות?","o":["אף נבדק לא זכר את האירוע","כ-50% תיארו \"מזיכרונם\" את החוויה המומצאת","כל הנבדקים זיהו שהתמונה מזויפת","הנבדקים שכחו את האירועים האמיתיים"],"a":1,"e":"אחרי שדמיינו, 35% זכרו את האירוע, ואחרי שני ראיונות נוספים 50%. לתמונות יש כוח ליצור זיכרונות שגויים."},{"q":"איזו המלצה לעריכת מסדר זיהוי נובעת ממחקרי הזיכרון?","o":["לומר לעד שהחשוד בוודאות במסדר","להציג את הניצבים בזה אחר זה (מסדר סדרתי), לומר לעד שייתכן שהעבריין אינו במסדר, ושעורך המסדר לא יידע מי החשוד","להשתמש בניצבים שונים מאוד מהחשוד","לתת לעד משוב חיובי אחרי הזיהוי"],"a":1,"e":"מסדר סדרתי מוריד זיהויים מוטעים מ-43% ל-17%. משוב חיובי מגביר ביטחון שגוי (וולס ובראדפילד, 1998)."},{"q":"מהי \"תופעת ההתמקדות בנשק\" (סטני וג'ונסון, 2000)?","o":["נוכחות נשק משפרת את הזיכרון","נוכחות של נשק שיורה מסיטה את הקשב ומובילה לירידה בזיכרון על העבריין, הקורבן וכלי הנשק","עדים זוכרים רק את הנשק","אין השפעה"],"a":1,"e":"זו טעות של עדי ראייה שקשורה לתפיסה ולקשב."}],"hard":[{"q":"עדה לתאונה נשאלה \"באיזו מהירות נסעה המכונית כשניפצה את המעקה?\". לאחר שבוע היא מדווחת שראתה רסיסי זכוכית על הכביש, אף שלא היו. אילו שתי תופעות מהפרק מעורבות?","o":["היזכרות מוגברת וזיכרון הבזק","השפעת התיאור שלאחר האירוע (לופטוס ופאלמר) ואפקט המידע המטעה, שמוסבר בניטור מקור שגוי","הסקה פרגמטית וסכמה בלבד","הפרעה למאוחר בלבד"],"a":1,"e":"ניסוח השאלה הוא מידע שנמסר אחרי האירוע, והוא שינה את הערכת האירוע והרחיב אותו."},{"q":"אדם בטוח במאה אחוז בזיכרונו ממה עשה ברגע ששמע על רצח רבין, אבל יומן שכתב באותו ערב מתאר דבר אחר. איזה ממצא זה מדגים?","o":["זיכרונות הבזק מדויקים יותר","זיכרונות הבזק משתנים ודועכים כמו זיכרונות אחרים, אבל הביטחון בהם נשאר גבוה","זיכרונות הבזק אינם קיימים","היזכרות מוגברת"],"a":1,"e":"נייסר והארש וטלריקו ורובין: הדיוק יורד והביטחון לא."},{"q":"לפי השערת שינון הנרטיב, מה צפוי לגבי זיכרון של אירוע דרמטי שכמעט לא סוקר בתקשורת ולא דיברו עליו?","o":["ביטחון גבוה מאוד","הביטחון בזיכרון צפוי לרדת עם הזמן כמו בזיכרון רגיל, כי אין שינון חוזר של הנרטיב","הזיכרון יהיה מדויק לחלוטין","הזיכרון לא ייווצר"],"a":1,"e":"לפי ההשערה, הביטחון הגבוה נובע מחזרה על הסיפור, למשל בתקשורת."},{"q":"מהגרת שעלתה לארץ בגיל 40 מתבקשת להיזכר באירועים מחייה. לפי ההשערה הקוגניטיבית, היכן צפויה ההיזכרות המוגברת?","o":["רק בגילאי 15–25","גם סביב גיל ההגירה (40 ומעט אחריו), כי זו תקופה של שינויים מהירים שאחריה באה יציבות","רק בילדות","אין היזכרות מוגברת אצל מהגרים"],"a":1,"e":"זה מה שמצאו שראוף ורובין: ההיזכרות המוגברת תואמת את גיל ההגירה."},{"q":"שחקנית מספרת בראיון בדיחה שהיא בטוחה שהמציאה, אבל בפועל שמעה אותה מחבר לפני שנים. איזו תופעה זו, ולאיזה ניסוי היא קרובה?","o":["סכמה, כמו בניסוי המשרד","טעות בניטור מקור (קריפטומנזיה), קרובה ל\"להתפרסם בין לילה\": המוכרות נשמרה, אבל המקור אבד","הסקה פרגמטית","זיכרון הבזק"],"a":1,"e":"המידע זמין, אבל מקורו מיוחס בטעות."},{"q":"בניסוי \"להתפרסם בין לילה\", מדוע האפקט הופיע במבחן המושהה ולא במבחן המיידי?","o":["כי במבחן המיידי הנבדקים לא ראו את השמות","כי במבחן המיידי הנבדקים עדיין זכרו שהשמות הגיעו מרשימת הלמידה. אחרי 24 שעות נשארה רק תחושת המוכרות, וזו יוחסה בטעות למפורסמות","כי במבחן המושהה הוצגו שמות אחרים","כי המבחן המושהה היה קשה יותר"],"a":1,"e":"זיכרון המקור נחלש מהר יותר מתחושת המוכרות."},{"q":"חוקר רוצה להכריע אם אפקט המידע המטעה נובע מהחלפת הזיכרון המקורי, או מבלבול בניטור מקור. איזה ממצא יתמוך דווקא בהחלפת הזיכרון?","o":["שהנבדקים טועים פחות כשמזהירים אותם שהמידע שאחרי האירוע שגוי","שגם אחרי אזהרה מפורשת ובמבחן שדורש לזהות את המקור, הנבדקים כבר אינם מסוגלים להיזכר בפרט המקורי כלל","שהנבדקים זוכרים את שני הפרטים","שאין אפקט"],"a":1,"e":"אם המקור המקורי אינו נגיש כלל, גם בתנאים שמעודדים ניטור מקור, זה מצביע על שינוי של הזיכרון עצמו."},{"q":"בניסוי של מארש ועמיתים, באילו תנאים הטעויות בניטור המקור צפויות להיות הכי נמוכות?","o":["כשהמשפט סטריאוטיפי ונאמר על ידי דובר מהמגדר שאינו תואם","כשהמשפט סטריאוטיפי ונאמר על ידי דובר שמגדרו תואם את הסטריאוטיפ","כשאין סטריאוטיפ","הטעויות זהות בכל התנאים"],"a":1,"e":"כשלא זוכרים, מנחשים לפי הסטריאוטיפ, וכשהסטריאוטיפ תואם את האמת הניחוש נכון."},{"q":"מדוע המקרים של S. (שרשבסקי) ו-A.J. מוצגים בפרק כעדות לכך שהבניה של זיכרונות היא כנראה יתרון?","o":["כי לשניהם הייתה מנת משכל גבוהה","כי לשניהם היה זיכרון כמעט מושלם, ובכל זאת הם התקשו בהסקה, בהשלמת חסר, בארגון ובחשיבה מופשטת","כי שניהם שכחו הכול","כי שניהם היו עדי ראייה"],"a":1,"e":"זיכרון מדויק מדי, בלי הכללה ובלי שכחה, אינו בהכרח הישרדותי."},{"q":"משטרה עורכת מסדר זיהוי. איזה צירוף נהלים צפוי להפחית במידה הרבה ביותר זיהויים שגויים של חפים מפשע?","o":["מסדר סימולטני, ניצבים שונים מהחשוד, ומשוב לעד אחרי הזיהוי","מסדר סדרתי, ניצבים דומים לחשוד, אמירה לעד שייתכן שהעבריין אינו במסדר, ועורך מסדר שאינו יודע מי החשוד","מסדר סימולטני בלבד","להראות לעד תמונה של החשוד לפני המסדר"],"a":1,"e":"כל אחד מהרכיבים האלה הוצג בפרק כמפחית זיהויים שגויים. משוב ותמונה מוקדמת מגבירים טעויות."}]},{"id":"c9","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 9: ייצוג ידע בזיכרון – הזיכרון הסמנטי","questions":[{"q":"מהו מושג (קטגוריה) בזיכרון הסמנטי?","o":["זיכרון של אירוע אחד","ייצוג מנטלי של קבוצת כל המקרים שנכללים במושג, ושל התכונות המשותפות להם כקבוצה","מילה בודדת","תמונה מנטלית"],"a":1,"e":"קטגוריזציה היא התהליך של שיוך מקרים לקטגוריה."},{"q":"מהי הבעיה המרכזית בגישת ההגדרה לקטגוריזציה?","o":["היא מורכבת מדי","פעמים רבות הגדרות אינן כוללות את כל המקרים במושג, ורק אותם","אין הגדרות במילון","היא מתאימה רק לבעלי חיים"],"a":1,"e":"למשל, יש כיסאות שאינם עונים להגדרה המילונית של כיסא."},{"q":"\"דמיון משפחתי\" (ויטגנשטיין) משמעו שכל מקרה בקטגוריה –","o":["חולק את כל התכונות שלו עם כל המקרים האחרים בקטגוריה","חולק תכונות עם כל המקרים האחרים בקטגוריה","חולק תכונות עם רוב המקרים האחרים בקטגוריה","חולק תכונות עם חלק מהמקרים האחרים בקטגוריה"],"a":3,"e":"אין תכונה אחת שמשותפת לכולם, אלא רשת של יחסי דמיון. זו שאלה מהמבחן לדוגמה."},{"q":"לפי גישת אב-הטיפוס (רוש, 1973), כיצד נקבע שיוך מקרה לקטגוריה?","o":["לפי הגדרה מילונית","לפי השוואה של המקרה לאב-טיפוס, מקרה \"טיפוסי\" שמבוסס על מיצוע של מקרים שכיחים בקטגוריה","לפי השוואה לכל הדוגמאות שנפגשו בעבר","לפי מיקום ברשת היררכית"],"a":1,"e":"מקרים טיפוסיים דומים מאוד לאב-הטיפוס, ומקרים לא טיפוסיים דומים לו פחות."},{"q":"מה מצאה רוש (1975) במחקר דירוגי הטיפוסיות?","o":["כל המקרים דורגו כמייצגים באותה מידה","דוגמאות טיפוסיות (כמו דרור לציפור) נתפסות כמייצגות יותר את הקטגוריה מדוגמאות לא טיפוסיות","דוגמאות לא טיפוסיות נתפסו כמייצגות יותר","הנבדקים לא הצליחו לדרג"],"a":1,"e":"הסולם היה מ-1 (דוגמה טובה מאוד) עד 7 (לא שייך)."},{"q":"מה מצאו רוש ומרוויס (1975) כשנבדקים פירטו מאפיינים של עצמים מקטגוריית הרהיטים?","o":["אין הבדל בחפיפת המאפיינים","מקרים טיפוסיים (ספה, כיסא) חולקים הרבה מאפיינים עם מקרים אחרים בקטגוריה, ומקרים לא טיפוסיים (טלפון, מראה) חולקים מעט","מקרים לא טיפוסיים חולקים יותר מאפיינים","לרהיטים אין מאפיינים משותפים"],"a":1,"e":"למקרים טיפוסיים יש דמיון משפחתי גדול יותר."},{"q":"מהו אפקט הטיפוסיות במטלת אימות משפטים (סמית' ועמיתים, 1974)?","o":["אימות משפטים על מקרים לא טיפוסיים מהיר יותר","אימות משפטים על מקרים טיפוסיים (כמו \"תפוח הוא פרי\") מהיר יותר מאשר על מקרים לא טיפוסיים (כמו \"גזר הוא פרי\")","אין הבדל בזמני התגובה","כל המשפטים נשללים"],"a":1,"e":"המשתנה התלוי הוא זמן התגובה לאימות."},{"q":"מה מצאו מרוויס ועמיתים (1976) כשנבדקים מנו מקרים של קטגוריה?","o":["הנבדקים מנו קודם מקרים לא טיפוסיים","הנבדקים נטו למנות קודם מקרים טיפוסיים","הנבדקים מנו באופן אקראי","הנבדקים לא הצליחו למנות"],"a":1,"e":"זהו אפקט הטיפוסיות במניית מקרים."},{"q":"בניסוי של רוש (1975b), הושמע שם צבע (למשל \"ירוק\") לפני שני כתמי צבע שהיה צריך לשפוט אם הם זהים. מה נמצא כשהייתה הטרמה?","o":["שיפוטי \"זהה\" היו מהירים יותר למקרים לא טיפוסיים","שיפוטי \"זהה\" היו מהירים יותר למקרים טיפוסיים (610 לעומת 780 אלפיות השנייה)","לא היה הבדל","ההטרמה האטה את כל התגובות"],"a":1,"e":"שם הצבע מפעיל את אב-הטיפוס (הירוק הטיפוסי), וכך מאיץ את התגובה לגוונים טיפוסיים. בלי הטרמה לא היה הבדל."},{"q":"מה ההבדל בין גישת אב-הטיפוס לגישת הדוגמאות?","o":["אין הבדל","בגישת אב-הטיפוס הקטגוריה מיוצגת על ידי ממוצע של מקרים שכיחים, ובגישת הדוגמאות על ידי דוגמאות ספציפיות שפגשנו בעבר","גישת הדוגמאות משתמשת בהגדרות","גישת אב-הטיפוס משתמשת ברשת היררכית"],"a":1,"e":"שתיהן יכולות להסביר את אפקט הטיפוסיות."},{"q":"כיצד מסבירה גישת הדוגמאות את אפקט הטיפוסיות?","o":["מקרים טיפוסיים דומים ליותר דוגמאות של הקטגוריה שמיוצגות בזיכרון, ולכן קל יותר לשייך אותם","מקרים טיפוסיים הם הממוצע","מקרים טיפוסיים מוגדרים במילון","גישת הדוגמאות אינה מסבירה את אפקט הטיפוסיות"],"a":0,"e":"מקרה טיפוסי מזכיר דוגמאות רבות בזיכרון."},{"q":"מהו יתרון של גישת הדוגמאות על פני גישת אב-הטיפוס?","o":["היא חסכונית יותר בזיכרון","היא מסבירה בקלות שמירה של מקרים לא טיפוסיים, ומתמודדת טוב יותר עם קטגוריות הטרוגניות שקשה למצע, כמו \"משחק\"","היא מסבירה את רמת הבסיס","היא תואמת את המודל ההיררכי"],"a":1,"e":"קשה לחשב ממוצע בין כדורסל, סוליטייר ומשחק של גורי כלבים."},{"q":"מה המסקנה לגבי הוויכוח בין גישת אב-הטיפוס לגישת הדוגמאות?","o":["רק גישת אב-הטיפוס נכונה","רק גישת הדוגמאות נכונה","ככל הנראה שתיהן פועלות: בתחילה יוצרים אב-טיפוס ואחר כך מוסיפים דוגמאות (בעיקר חריגות). דוגמאות מתאימות לקטגוריות קטנות, ואב-טיפוס לקטגוריות גדולות","אף אחת מהן אינה נכונה"],"a":2,"e":"למשל, \"נשיאי ארה\"ב\" היא קטגוריה קטנה ו\"ציפורים\" היא קטגוריה גדולה."},{"q":"מהן שלוש רמות המושגים בארגון ההיררכי?","o":["חושית, קצרה, ארוכה","גלובלית (עליונה), בסיסית, ומפרטת (תחתונה)","אפיזודית, סמנטית, פרוצדורלית","טיפוסית, לא טיפוסית, חריגה"],"a":1,"e":"למשל: רהיט (גלובלית), שולחן (בסיסית), שולחן מטבח (מפרטת)."},{"q":"מדוע, לפי רוש ועמיתים (1976), רמת הבסיס היא המועדפת?","o":["כי יש בה הכי הרבה מאפיינים משותפים","כי מעבר לרמה הגלובלית מאבד מידע רב (פירוט חסר), ומעבר לרמה המפרטת מוסיף מעט מידע (פירוט יתר)","כי היא הקצרה ביותר","כי ילדים לומדים אותה אחרונה"],"a":1,"e":"רמת הבסיס מכילה כמות מיטבית של מאפיינים משותפים."},{"q":"כשנבדקים מתבקשים לשיים תמונה של כיסא מטבח, הם בדרך כלל יאמרו –","o":["\"רהיט\"","\"כיסא\"","\"כיסא מטבח\"","\"עץ\""],"a":1,"e":"שיום נעשה בדרך כלל ברמת הבסיס."},{"q":"מה מצאו טנאקה וטיילור (1991) כשהשוו צפרים ללא צפרים?","o":["כולם שיימו ציפורים ברמת הבסיס","הצפרים שיימו ציפורים ברמה המפרטת (למשל \"דרור\"), והלא מומחים ברמת הבסיס (\"ציפור\")","הצפרים שיימו ברמה הגלובלית","לא היה הבדל"],"a":1,"e":"הרמה המועדפת אינה זהה אצל כולם, והיא תלויה בידע ובמומחיות."},{"q":"מהו עקרון ה\"חיסכון הקוגניטיבי\" במודל ההיררכי של קולינס וקיליאן?","o":["כל תכונה מצוינת בכל מושג","תכונות משותפות מצוינות רק פעם אחת, ברמה הגבוהה ביותר שאליה הן שייכות","אין תכונות במודל","תכונות מצוינות רק ברמה הנמוכה"],"a":1,"e":"למשל, \"נושם\" מופיע ברמת \"בעל חיים\" ולא אצל כל חיה."},{"q":"מה מנבא המודל ההיררכי לגבי זמני התגובה לאימות משפטים?","o":["כל המשפטים יאומתו באותה מהירות","זמן התגובה יגדל ככל שצריך לטפס גבוה יותר במדרג כדי לבדוק את המשפט","זמן התגובה תלוי בטיפוסיות בלבד","זמן התגובה יקטן ככל שמטפסים גבוה"],"a":1,"e":"למשל, \"קנרית היא ציפור\" מהיר יותר מ\"קנרית היא בעל חיים\"."},{"q":"בניסוי של קולינס וקיליאן (1969) שתמך במודל שלהם, מה היה סדר זמני התגובה, מהקצר לארוך?","o":["קנרית יכולה לעוף, קנרית יכולה לשיר, לקנרית יש עור","קנרית יכולה לשיר, קנרית יכולה לעוף, לקנרית יש עור","לקנרית יש עור, קנרית יכולה לעוף, קנרית יכולה לשיר","קנרית יכולה לעוף, לקנרית יש עור, קנרית יכולה לשיר"],"a":1,"e":"\"שר\" נמצא ברמת קנרית, \"עף\" ברמת ציפור ו\"עור\" ברמת בעל חיים. זו שאלה מהמבחן לדוגמה."},{"q":"מהי \"הפעלה מתפשטת\" ברשת הסמנטית?","o":["הפעלה של כל הרשת בבת אחת","כשמושג מופעל, ההפעלה מתפשטת לצמתים שקשורים אליו וגורמת להם להטרמה סמנטית","שכחה של מושגים לא בשימוש","למידה של מושגים חדשים"],"a":1,"e":"הניבוי: מושג יעובד מהר יותר אם הוטרם על ידי מושג קשור."},{"q":"במטלת ההחלטה הלקסיקלית של מאייר ושבנבלדט (1971), מה נדרש מהנבדקים?","o":["לקרוא מילים בקול","ללחוץ \"כן\" אם שני הגירויים בזוג הם מילים, ו\"לא\" אם לפחות אחד מהם אינו מילה","לשפוט אם המילים קשורות","לזכור את המילים"],"a":1,"e":"המשתנה הבלתי תלוי היה קיום או העדר קשר סמנטי בין המילים בזוג."},{"q":"מה נמצא בניסוי של מאייר ושבנבלדט?","o":["זמן התגובה לזוג קשור (לחם-חיטה) היה קצר יותר מזמן התגובה לזוג לא קשור (כיסא-כסף)","זמן התגובה לזוג לא קשור היה קצר יותר","לא היה הבדל","הנבדקים טעו בזוגות קשורים"],"a":0,"e":"זו הטרמה סמנטית, שתומכת בהפעלה מתפשטת."},{"q":"איזה ממצא המודל ההיררכי של קולינס וקיליאן אינו מסוגל להסביר?","o":["\"קנרית היא ציפור\" מהיר יותר מ\"קנרית היא בעל חיים\"","\"קנרית היא ציפור\" מהיר יותר מ\"יען היא ציפור\" (אפקט הטיפוסיות)","הטרמה סמנטית","\"קנרית יכולה לשיר\" מהיר יותר מ\"לקנרית יש עור\""],"a":1,"e":"לפי המודל, שני המשפטים דורשים אותו מספר צמתים ולכן אותו זמן. בפועל הקנרית מהירה יותר (סמית' ועמיתים, 1974)."},{"q":"ריפס ועמיתים (1973) מצאו ש\"חזיר הוא יונק\" מאומת לאט יותר מ\"חזיר הוא בעל חיים\". מדוע זה בעייתי למודל ההיררכי?","o":["כי המודל מנבא שהמשפט הראשון יהיה מהיר יותר, כי הוא דורש לעלות צומת אחת במקום שתיים","כי המודל מנבא שהשניים יהיו באותה מהירות","כי המודל אינו עוסק ביונקים","זה אינו בעייתי"],"a":0,"e":"זהו ממצא שסותר את ניבוי המודל."},{"q":"במודל הקונקציוניסטי (מקללנד ורומלהרט, 1986), כיצד מיוצגים מושגים?","o":["כל מושג בצומת אחד","על ידי פעילות מבוזרת על פני הרשת, שנקבעת לפי הקלט ולפי משקלי הקשר","כרשימת הגדרות","כתמונות מנטליות"],"a":1,"e":"משקל קשר קובע כמה אות מיחידה אחת מגביר או מפחית את הפעילות ביחידה הבאה."},{"q":"כיצד \"לומדת\" רשת קונקציוניסטית?","o":["בבת אחת, מהצגה אחת","מהצגה של מקרים רבים: אחרי כל שגיאה היא מעדכנת את משקלי הקשרים כדי שיתאימו לתגובה הנכונה","היא אינה לומדת","על ידי הוספת צמתים חדשים בלבד"],"a":1,"e":"התהליך דורש חזרות רבות. למשל, אחרי 2500 צעדי למידה דפוסי הפעילות השתנו משמעותית."},{"q":"איזו תמיכה יש למודל הקונקציוניסטי מתחום הפגיעות המוחיות?","o":["פגיעה ברשת משבשת אותה לחלוטין","מכיוון שהמידע מבוזר, פגיעה ברשת אינה משבשת אותה לחלוטין. זה תואם את אובדן התפקוד החלקי אצל בני אדם","הרשת אינה מושפעת מפגיעה","המודל מנבא אמנזיה מלאה"],"a":1,"e":"התמיכה השנייה היא הכללה בעת למידה."},{"q":"כיצד מסביר המודל הקונקציוניסטי הכללה בלמידה?","o":["למקרים דומים יש דפוסי הפעלה דומים, ולכן אימון על מקרה אחד משפר את הביצוע במקרה דומה","הרשת זוכרת כל מקרה בנפרד","אין הכללה במודל","הכללה נובעת מהגדרות"],"a":0,"e":"למשל, למידה על קנריות מאפשרת לנבא תכונות של ציפורים אחרות."},{"q":"איזה מהממצאים הבאים תומך בגישת אב-הטיפוס?","o":["\"חזיר הוא יונק\" איטי מ\"חזיר הוא בעל חיים\"","מקרים טיפוסיים נמנים ראשונים, מאומתים מהר יותר, ומקבלים דירוג ייצוגיות גבוה","צפרים משיימים ברמה המפרטת","זמן התגובה גדל עם הטיפוס במדרג"],"a":1,"e":"כל אלה ביטויים של אפקט הטיפוסיות."}],"hard":[{"q":"ילד קטן קורא ללוויתן \"דג\". איזו גישה לקטגוריזציה מסבירה את הטעות בצורה הטבעית ביותר?","o":["גישת ההגדרה","גישת אב-הטיפוס או הדוגמאות: הלוויתן דומה מאוד לאב-הטיפוס של דג, או לדוגמאות של דגים שהילד פגש","המודל ההיררכי","המודל הקונקציוניסטי בלבד"],"a":1,"e":"הגדרה (יונק) הייתה מונעת את הטעות. שיוך לפי דמיון מנבא אותה."},{"q":"לפי המודל ההיררכי של קולינס וקיליאן, איזה משפט ייקח הכי הרבה זמן לאמת?","o":["סלמון הוא דג","לסלמון יש סנפירים","לסלמון יש עור","סלמון ורוד"],"a":2,"e":"\"עור\" מאוחסן ברמת בעל חיים, שתי רמות מעל סלמון. \"ורוד\" ברמת סלמון, ו\"סנפירים\" ברמת דג."},{"q":"נבדקים מאמתים את \"תרנגולת היא ציפור\" לאט יותר מ\"דרור הוא ציפור\", אבל את \"תרנגולת היא בעל חיים\" מהר יותר מ\"תרנגולת היא ציפור\". מה הממצאים האלה מראים לגבי המודל ההיררכי?","o":["שהם תואמים את המודל","שניהם בעייתיים למודל: הראשון הוא אפקט טיפוסיות, והשני הפוך מהניבוי שטיפוס במדרג מאט את האימות","רק הראשון בעייתי","רק השני בעייתי"],"a":1,"e":"אלה בדיוק סוגי הממצאים של סמית' ועמיתים וריפס ועמיתים."},{"q":"במטלת החלטה לקסיקלית מוצגים הזוגות \"רופא-אחות\" ו\"רופא-חמאה\". מה צפוי ומדוע?","o":["\"רופא-חמאה\" ייענה מהר יותר","\"רופא-אחות\" ייענה מהר יותר, כי ההפעלה של \"רופא\" מתפשטת למושגים קשורים ברשת הסמנטית (הטרמה סמנטית)","לא יהיה הבדל","שניהם ייענו \"לא\""],"a":1,"e":"זה הממצא של מאייר ושבנבלדט."},{"q":"איזה מהממצאים הבאים קשה יותר להסביר לפי גישת אב-הטיפוס מאשר לפי גישת הדוגמאות?","o":["אפקט הטיפוסיות","היכולת לזכור שפינגווין ויען הם ציפורים, למרות שהם רחוקים מאוד מהממוצע","מניית מקרים טיפוסיים ראשונים","דירוגי טיפוסיות"],"a":1,"e":"מקרים חריגים נשמרים בקלות כדוגמאות, אבל ממוצע אינו מייצג אותם."},{"q":"צפר ולא-צפר רואים תמונה של אנקור. מה צפוי, ומה זה מלמד על רמת הבסיס?","o":["שניהם יאמרו \"ציפור\"","הצפר יאמר \"אנקור\" והלא-צפר יאמר \"ציפור\". כלומר הרמה המועדפת תלויה במומחיות ואינה קבועה","שניהם יאמרו \"בעל חיים\"","הצפר יאמר \"ציפור\""],"a":1,"e":"זה ממצא טנאקה וטיילור."},{"q":"מדוע, לפי רוש, אנשים מעדיפים לומר \"שולחן\" ולא \"רהיט\" או \"שולחן מטבח\"?","o":["כי זו המילה הקצרה ביותר","כי ברמה הגלובלית יש מעט מאפיינים משותפים (פירוט חסר), וברמה המפרטת מתווסף מעט מידע (פירוט יתר), ורמת הבסיס היא האיזון המיטבי","כי ילדים לומדים קודם את \"רהיט\"","כי זה תלוי בשפה בלבד"],"a":1,"e":"רמת הבסיס מכילה כמות מיטבית של מאפיינים משותפים."},{"q":"בניסוי של רוש עם כתמי צבע, ההטרמה בשם הצבע (\"אדום\") האיצה שיפוטי \"זהה\" רק לגוונים טיפוסיים. מה הייתה צפויה להיות התוצאה אילו הקטגוריה הייתה מיוצגת רק כרשימת הגדרות?","o":["אותה תוצאה","לא היה צפוי הבדל בין גוונים טיפוסיים ללא טיפוסיים, כי כולם עונים להגדרה של \"אדום\" באותה מידה","הגוונים הלא טיפוסיים היו מהירים יותר","לא הייתה הטרמה"],"a":1,"e":"ההבדל בין הגוונים מראה שהקטגוריה מיוצגת סביב אב-טיפוס."},{"q":"מטופלת שנפגעה במוח מאבדת חלק מהידע על בעלי חיים, אבל לא את כולו. כיצד המודל הקונקציוניסטי מסביר זאת טוב יותר ממודל של צמתים בודדים?","o":["הוא אינו מסביר","במודל הקונקציוניסטי הידע מבוזר על פני יחידות וקשרים רבים, ולכן פגיעה חלקית מובילה לירידה הדרגתית בתפקוד ולא לאובדן מלא של מושג","הוא מנבא אובדן מלא","הוא מסביר רק זט\"ק"],"a":1,"e":"במודל של צמתים, פגיעה בצומת מוחקת את המושג כולו."},{"q":"ויטגנשטיין טען שלמשחקים אין תכונה אחת שמשותפת לכולם. איזו גישה הטענה הזו מערערת יותר מכול?","o":["גישת אב-הטיפוס","גישת ההגדרה, שלפיה שיוך לקטגוריה דורש לעמוד בקריטריונים מוחלטים שמשותפים לכל המקרים","גישת הדוגמאות","הרשת הקונקציוניסטית"],"a":1,"e":"\"דמיון משפחתי\" מחליף הגדרה ברשת של יחסי דמיון."}]},{"id":"c10","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 10: דמיון חזותי","questions":[{"q":"מהו דמיון מנטלי?","o":["תפיסה של גירוי שנמצא מולנו","יצירת חוויה של גירוי חושי כשהגירוי אינו נקלט באותו זמן בחושים","זיכרון של עובדות","חלום בלבד"],"a":1,"e":"דמיון חזותי הוא \"תמונה מנטלית\" שנוצרת בהעדר גירוי חזותי. יש דמיון גם בחושים אחרים."},{"q":"מה השאלה המרכזית ב\"דיון על הדמיון\"?","o":["האם אנשים חווים דמיון","האם הייצוג שבבסיס הדמיון תמונתי-מרחבי (כמו בתפיסה) או טענתי (מושגים ותיאורים, כמו בחשיבה)","האם דמיון קיים רק בחלומות","האם יש דמיון שמיעתי"],"a":1,"e":"הדיון אינו על החוויה עצמה, אלא על הייצוג שבבסיסה."},{"q":"מי מזוהה עם הגישה התמונתית (המרחבית) לדמיון, ומי עם הגישה הטענתית?","o":["פילישין עם התמונתית, וקוסלין עם הטענתית","קוסלין עם התמונתית, ופילישין עם הטענתית","ספרלינג וטריזמן","רוש וקולינס"],"a":1,"e":"לפי פילישין, החוויה התמונתית היא תופעת לוואי."},{"q":"מה מדגים ניסיון לצייר מטבע של שקל מהדמיון?","o":["שתמונת הדמיון מדויקת כמו צילום","שתמונת הדמיון סלקטיבית וחלקית מאוד, ונכללים בה בעיקר היבטים שיש לנו עליהם מושג","שאי אפשר לדמיין מטבעות","שהדמיון טוב יותר מהתפיסה"],"a":1,"e":"זה ממחיש שאין זה מובן מאליו שהדמיון מבוסס על תמונה."},{"q":"בניסוי הסריקה המנטלית של קוסלין (1973) עם תמונת הסירה, מה נמצא?","o":["זמן התגובה לא הושפע מהמרחק","זמן התגובה למציאת חלק רחוק מנקודת המוצא היה ארוך יותר מזמן התגובה למציאת חלק קרוב","הנבדקים לא מצאו חלקים","זמן התגובה לחלקים קרובים היה ארוך יותר"],"a":1,"e":"הממצא תואם לניבוי הגישה התמונתית: סורקים את התמונה המנטלית כמו תמונה ממשית."},{"q":"מהו ההסבר החלופי של לי (Lea, 1975) לתוצאות הסריקה המנטלית?","o":["הנבדקים לא הבינו את ההוראות","ככל שהמרחק גדול יותר, \"נתקלים\" ביותר חלקים (טענות) בדרך, ולכן לוקח יותר זמן, בלי סריקה של תמונה","הנבדקים סרקו תמונה","אין הסבר חלופי"],"a":1,"e":"זהו הסבר טענתי לממצא."},{"q":"כיצד ענה קוסלין על ההסבר החלופי של לי?","o":["בניסוי מפת האי: זמן התגובה גדל עם המרחק בין שני עצמים, גם כשאין ביניהם עצמים אחרים","הוא קיבל את ההסבר","הוא בדק רק סירות","בניסוי חיבורים אשלייתיים"],"a":0,"e":"כך נשלל הצורך ב\"היתקלות\" בחלקים, וזה תומך בגישה התמונתית."},{"q":"פילישין (1973, 2003) טען, כנגד הגישה התמונתית, שאפשר להסביר את ממצאי ניסויי הדמיון כנובעים מ –","o":["ייצוג טענתי וייצוג תמונתי","ייצוג תמונתי וידע חבוי","ידע חבוי וידע גלוי","ייצוג טענתי וידע חבוי"],"a":3,"e":"לפי הסבר הידע החבוי, הנבדקים יודעים איך זה לראות את הדבר, ומחקים את משכי הזמן. זו שאלה מהמבחן לדוגמה."},{"q":"בניסוי של פינקה ופינקר (1982), החץ הופיע רק אחרי שהנקודות נעלמו. מדוע הממצא קשה להסבר הידע החבוי?","o":["כי הנבדקים לא הגיבו","כי הנבדקים לא יכלו לדעת מראש את המרחקים בין החץ לנקודה, ולכן לא יכלו \"לחקות\" משך סריקה, ובכל זאת זמן התגובה גדל עם המרחק","כי החץ הצביע תמיד על נקודה","כי לא נמדד זמן תגובה"],"a":1,"e":"גם לא נאמר לנבדקים לסרוק, ולכן הממצא תומך בגישה התמונתית."},{"q":"בניסוי של קוסלין (1978), נבדקים דמיינו ארנב ליד פיל או ליד זבוב. מתי ענו מהר יותר על שאלה לגבי הארנב (\"האם יש לו שערות בשפם?\")?","o":["כשדמיינו אותו ליד פיל (קטן בשדה החזותי)","כשדמיינו אותו ליד זבוב (גדול בשדה החזותי)","אין הבדל","הם לא הצליחו לענות"],"a":1,"e":"1,870 לעומת 2,020 אלפיות השנייה. כמו בתפיסה, קל יותר לראות פרטים בעצם גדול."},{"q":"במטלת ההליכה המנטלית של קוסלין (1978), מה דיווחו הנבדקים?","o":["שהם צריכים להתקרב יותר לפיל מאשר לעכבר","שהם צריכים להתקרב יותר לבעלי חיים קטנים (כ-30 ס\"מ לעכבר) מאשר לגדולים (כ-4 מטר לפיל) עד שהדימוי ממלא את השדה החזותי","שהמרחק זהה לכל החיות","שאינם יכולים לדמיין הליכה"],"a":1,"e":"כמו בראייה, גודל העצם המדומיין גדל ככל שהמרחק המדומיין ממנו קטן."},{"q":"בניסוי של פרקי (1910), נבדקים \"הקרינו\" בדמיונם עצם על מסך, כשבלי ידיעתם הוקרנה עליו תמונה חלשה. מה נמצא?","o":["הנבדקים זיהו את התמונה המוקרנת","הנבדקים תיארו את העצם שדמיינו כדומה לתמונה החלשה, וטענו שלא הבחינו בה","התמונה לא השפיעה","הנבדקים הפסיקו לדמיין"],"a":1,"e":"התפיסה מתחת לסף המודעות השפיעה על הדמיון, וזה תומך במנגנון משותף."},{"q":"בניסוי של פארה (1985), נבדקים דמיינו את האות H או T ואחר כך היה עליהם לגלות אות שהובזקה. מה נמצא?","o":["הדיוק היה גבוה יותר כשדמיינו אות שונה","הדיוק היה גבוה יותר כשדמיינו ואז ראו את אותה האות","הדמיון לא השפיע","הדמיון פגע בכל התנאים"],"a":1,"e":"זו השפעה של הדמיון על התפיסה, שתומכת במנגנון תמונתי משותף."},{"q":"מה מצאו קריימן ועמיתים (2000) ברישום מנוירונים באונה הרקתית המדיאלית?","o":["נוירונים הגיבו רק לתפיסה","נוירונים מסוימים הגיבו באופן דומה גם כשתופסים עצם וגם כשמדמיינים אותו (\"נוירונים של דמיון\")","לא הייתה פעילות בדמיון","הנוירונים הגיבו רק לצלילים"],"a":1,"e":"זה תומך בגישה התמונתית, אבל לא בהכרח מופעלים באונה הרקתית ייצוגים תמונתיים."},{"q":"מה מצאו לה ביאן ועמיתים (1993) ב-fMRI של קורטקס הראייה הראשוני?","o":["פעילות רק בזמן תפיסה","פעילות גבוהה גם בזמן תפיסה וגם בזמן דמיון של הגירוי, ופעילות נמוכה כשאין גירוי ממשי או מדומיין","פעילות רק בזמן דמיון","אין פעילות"],"a":1,"e":"זה תומך בגישה התמונתית."},{"q":"מה מצא קוסלין (1995) לגבי גודל הדימוי והפעילות בקורטקס הראייה?","o":["גודל הדימוי לא השפיע","ככל שהדימוי גדול יותר, שטח הפעילות התפשט לעבר החלק הקדמי של קורטקס הראייה, כמו בתפיסה (מפה טופוגרפית)","הדימויים הקטנים הפעילו את כל הקורטקס","רק אונת המצח הופעלה"],"a":1,"e":"הדמיון פועל באופן טופוגרפי כמו התפיסה, וזה תומך בגישה התמונתית."},{"q":"מה מצאו גניס ועמיתים (2004) בהשוואת הפעלה מוחית בתפיסה ובדמיון?","o":["חפיפה מלאה בכל האזורים","חפיפה רבה באונות המצח, הרקה והקודקוד, אבל תפיסה מפעילה את הקורטקס החזותי (באונה העורפית) יותר מדמיון","אין חפיפה כלל","דמיון מפעיל יותר את הקורטקס החזותי"],"a":1,"e":"יש חפיפה, אבל גם הבדלים. זו תמיכה חלקית בגישה התמונתית."},{"q":"מהי מטרת השימוש ב-TMS בניסוי של קוסלין ועמיתים (1999)?","o":["לשפר את הדמיון","לבדוק אם הפעילות בקורטקס החזותי משפיעה על הדמיון בפועל, או שהיא רק תופעת לוואי","למדוד זרימת דם","לגרום לחלומות"],"a":1,"e":"אם שיבוש האזור משבש את הדמיון, האזור משפיע על הדמיון."},{"q":"מה נמצא כשהופעל TMS על קורטקס הראייה הראשוני בניסוי של קוסלין ועמיתים (1999)?","o":["זמן התגובה התארך רק בתפיסה","זמן התגובה לשיפוט הפסים התארך גם בתפיסה וגם בדמיון","לא הייתה השפעה","זמן התגובה התקצר"],"a":1,"e":"הפעילות בקורטקס החזותי משפיעה על הדמיון ואינה תופעת לוואי. זה תומך בגישה התמונתית."},{"q":"מה קרה למטופלת M.G.S. אחרי כריתה של חלק מהאונה העורפית הימנית (פארה ועמיתים, 1993)?","o":["הדמיון שלה השתפר","השדה החזותי שלה הצטמצם גם בדמיון: היא \"עמדה\" רחוק יותר מהסוס המדומיין עד שמילא את השדה (11 מטר לעומת 4.5 לפני הניתוח)","היא איבדה את התפיסה בלבד","לא חל שינוי"],"a":1,"e":"זו פגיעה מקבילה בתפיסה ובדמיון, שתומכת בגישה התמונתית."},{"q":"מה מצאו ביסיאק ולוצאטי (1978) אצל מטופלים עם תסמונת הזנחת צד, שהתבקשו לדמיין את כיכר הדואומו במילאנו?","o":["הם תיארו את כל הכיכר","הם הזניחו את צד שמאל, ביחס לנקודת התצפית המדומיינת, גם בדמיון וגם בתפיסה","הם הזניחו את צד ימין","הם לא הצליחו לדמיין כלל"],"a":1,"e":"כשהחליפו נקודת תצפית, הם תיארו את הצד שהזניחו קודם. זו פגיעה מקבילה, שתומכת בגישה התמונתית."},{"q":"R.M. (פארה ועמיתים, 1988) היה מסוגל לזהות ולצייר עצמים שמולו, אך לא לצייר מהזיכרון. מה מדגים המקרה?","o":["פגיעה מקבילה בתפיסה ובדמיון","דיסוציאציה: תפיסה תקינה ודמיון פגוע","תפיסה פגועה ודמיון תקין","דמיון ותפיסה תקינים"],"a":1,"e":"זה תומך בגישה הטענתית, כלומר במנגנונים נפרדים."},{"q":"C.K., שסובל מאגנוזיה חזותית (בהרמן ועמיתים, 1994), אינו מזהה עצמים שמוצגים לפניו אך מצייר עצמים מהזיכרון. מה מדגים המקרה?","o":["תפיסה תקינה ודמיון פגוע","תפיסה פגועה ודמיון תקין","פגיעה מקבילה","דמיון ותפיסה פגועים"],"a":1,"e":"יחד עם R.M. נוצרת דיסוציאציה כפולה."},{"q":"דיסוציאציה כפולה בפגיעות בתפיסה ובדמיון (פגיעה מוחית שפוגעת בדמיון ולא בתפיסה, ופגיעה שפוגעת בתפיסה ולא בדמיון) תומכת בכך ש –","o":["יש חפיפה מלאה בין המנגנונים של תפיסה ודמיון","לתפיסה ולדמיון אחראים מנגנונים שונים","יש חפיפה חלקית בין המנגנונים","המנגנונים של התפיסה נמצאים במרכזים חזותיים גבוהים יותר מאלה של הדמיון"],"a":1,"e":"זו שאלה מהמבחן לדוגמה."},{"q":"כיצד מסבירים בהרמן ועמיתים את הממצאים הנוירופסיכולוגיים המעורבים?","o":["אין חפיפה בין תפיסה לדמיון","התפיסה נשענת יותר על עיבוד מלמטה-למעלה, והדמיון רק על עיבוד מלמעלה-למטה. נזק מוקדם פוגע בתפיסה (C.K.), ונזק מאוחר פוגע בדמיון (R.M.)","הדמיון נשען על עיבוד מלמטה-למעלה","שני המנגנונים זהים"],"a":1,"e":"עדיין אין הסבר מלא, למשל למקרה של M.G.S."},{"q":"מה המסקנה הכללית בדיון על הדמיון?","o":["הדמיון זהה לחלוטין לתפיסה","יש מנגנונים שמשותפים לדמיון ולתפיסה, אבל לא כל המנגנונים משותפים","אין קשר בין דמיון לתפיסה","הדמיון טענתי בלבד"],"a":1,"e":"מחקרי הדמיה ופגיעות מוחיות מראים חפיפה חלקית."},{"q":"מהו הבדל בין דמיון לתפיסה שעולה מהפרק?","o":["הדמיון אוטומטי והתפיסה מצריכה מאמץ","התפיסה אוטומטית ויציבה, והדמיון מצריך מאמץ ושברירי","שניהם אוטומטיים","שניהם שבריריים"],"a":1,"e":"יש גם פעולות שקשה יותר לבצע על תמונות מדומיינות."},{"q":"מה מצאו צ'למרס וריסברג (1985) לגבי צורות דו-משמעיות?","o":["גם בתפיסה וגם בדמיון קל לעבור בין שתי הפרשנויות","בתפיסה מצליחים לעבור לפרשנות השנייה של הצורה, אבל בדמיון לא מצליחים","בדמיון קל יותר לעבור בין הפרשנויות","אין צורות דו-משמעיות בדמיון"],"a":1,"e":"זה הבדל בין דמיון לתפיסה."},{"q":"איזה מהממצאים הבאים תומך בגישה הטענתית?","o":["ניסוי הסריקה המנטלית של מפת האי","הניסוי של פרקי","מטופל שסובל מהזנחת צד בדמיון ולא בתפיסה (גואריליה ועמיתים, 1993)","ניסוי ה-TMS"],"a":2,"e":"דיסוציאציה בין תפיסה לדמיון מצביעה על מנגנונים נפרדים."},{"q":"לפי הגישה התמונתית, אם דמיון ותפיסה חולקים מנגנון משותף, מה צפוי?","o":["שלא תהיה השפעה ביניהם","שגורמים שמשפיעים על מטלות תפיסה ישפיעו באופן דומה על מטלות דמיון מקבילות, ושתהיה השפעה הדדית בין דמיון לתפיסה","שדמיון יהיה תמיד מהיר יותר","שתפיסה תפגע בזיכרון"],"a":1,"e":"זה ההיגיון של המחקרים בפרק, ברמה ההתנהגותית וברמה המוחית."}],"hard":[{"q":"נבדקים מדמיינים אות גדולה וסורקים אותה מקצה לקצה. נמצא שזמן הסריקה תלוי במרחק. פילישין טוען שזה נובע מידע חבוי. איזה ניסוי עונה על הטענה בצורה הטובה ביותר?","o":["ניסוי שבו אומרים לנבדקים במפורש לסרוק לאט","ניסוי שבו הנבדקים אינם יודעים מראש את המרחקים ואינם מתבקשים לסרוק, ובכל זאת זמן התגובה גדל עם המרחק (פינקה ופינקר)","ניסוי עם מילים בלבד","ניסוי עם פגועי מוח בלבד"],"a":1,"e":"כשאין ידע על המרחקים ואין הוראה לסרוק, קשה לחקות את משכי הזמן."},{"q":"ההסבר של לי (Lea) לניסוי הסירה טוען שהמרחק משפיע רק דרך מספר החלקים שבדרך. איזה ממצא יחליש את ההסבר הזה?","o":["זמן תגובה ארוך יותר כשיש יותר חלקים בדרך","זמן תגובה ארוך יותר למרחק גדול גם כשאין שום חלק או עצם בין שתי הנקודות, כמו במפת האי","זמן תגובה קבוע","זמן תגובה קצר יותר לחלקים רחוקים"],"a":1,"e":"זו בדיוק התשובה של קוסלין."},{"q":"מטופל עם הזנחת צד שמאל מדמיין שהוא עומד בכניסה לביתו ומתאר רק את החדרים שמימין. כשמבקשים ממנו לדמיין שהוא עומד בצד השני של הבית, מה צפוי?","o":["הוא יתאר אותם חדרים","הוא יתאר את החדרים שהזניח קודם (שעכשיו נמצאים מימינו), ויזניח את אלה שתיאר קודם","הוא לא יתאר כלום","הוא יתאר את כל החדרים"],"a":1,"e":"זה הממצא של ביסיאק ולוצאטי. ההזנחה נקבעת לפי נקודת המבט המדומיינת, וזה מתאים לייצוג מרחבי."},{"q":"איך ניסוי ה-TMS של קוסלין ועמיתים (1999) מוסיף מעבר לממצאי ה-fMRI שהראו הפעלה של קורטקס הראייה בדמיון?","o":["הוא אינו מוסיף דבר","fMRI מראה רק מתאם, כלומר שהאזור פעיל. TMS מראה סיבתיות: שיבוש של האזור פוגע בדמיון, ולכן הפעילות אינה רק תופעת לוואי","TMS מודד זרימת דם","TMS מראה שהאזור אינו קשור"],"a":1,"e":"זה ההבדל בין \"פעיל בזמן\" לבין \"נדרש ל-\"."},{"q":"R.M. מזהה עצמים מולו אבל אינו מצליח לצייר מהזיכרון, ו-C.K. אינו מזהה עצמים אבל מצייר מהזיכרון. לפי ההסבר של בהרמן, היכן נמצאת הפגיעה של כל אחד?","o":["שניהם פגועים באותו שלב","אצל C.K. הנזק בשלב מוקדם (מלמטה-למעלה), שהתפיסה נשענת עליו. אצל R.M. הנזק בשלב מאוחר יותר, שהדמיון (מלמעלה-למטה) נשען עליו","אצל R.M. בשלב מוקדם ואצל C.K. בשלב מאוחר","אין הסבר"],"a":1,"e":"הדמיון נשען על מעבר מידע מאזורים גבוהים אל הקורטקס החזותי."},{"q":"מדוע המקרה של M.G.S. אינו מתיישב בקלות עם ההסבר של בהרמן?","o":["כי היא לא נפגעה","כי הנזק שלה היה בשלב מוקדם (אונה עורפית), ובכל זאת נפגעו גם התפיסה וגם הדמיון, ואילו C.K., עם נזק מוקדם, נפגע רק בתפיסה","כי היא נפגעה רק בדמיון","כי היא לא עשתה הליכה מנטלית"],"a":1,"e":"לכן הפרק מציין שעדיין אין הסבר מלא לכלל התוצאות."},{"q":"בניסוי של פרקי, הנבדקים תיארו את הבננה שדמיינו בדומה לתמונה חלשה שהוקרנה, בלי לדעת על ההקרנה. מה הייתה הביקורת האפשרית מצד הגישה הטענתית?","o":["שהנבדקים ראו את התמונה במודע","שהמנגנון המשותף לתפיסה ולדמיון אינו חייב להיות תמונתי. ייתכן שהתפיסה הלא מודעת השפיעה על הידע או על התיאור שהנבדקים בנו","שאין אפקט","שהבננה לא הייתה צהובה"],"a":1,"e":"השקף שואל \"האם ייתכן שהמנגנון המשותף אינו תמונתי?\""},{"q":"נבדקים מדמיינים פיל ליד עכבר ונשאלים \"האם לעכבר יש שפם?\". אחר כך הם מדמיינים עכבר ליד זבוב ונשאלים אותה שאלה. מה צפוי, ואיך זה קשור לתפיסה?","o":["שאין הבדל","תשובה מהירה יותר כשהעכבר מדומיין ליד הזבוב, כי הוא תופס חלק גדול יותר מהשדה החזותי המדומיין ופרטיו בולטים יותר, כמו בתפיסה","תשובה מהירה יותר ליד הפיל","הנבדקים לא יענו"],"a":1,"e":"זה ניסוי הגודל בשדה החזותי של קוסלין (1978)."},{"q":"מה ההבדל בין דמיון לתפיסה שמודגם בכך שקשה \"להפוך\" צורה דו-משמעית בדמיון?","o":["שהדמיון אוטומטי","שהדמיון מתבסס על פרשנות שכבר נבחרה ואינו מאפשר פרשנות חדשה בקלות, בעוד שבתפיסה הגירוי עצמו זמין לפרשנות מחדש","שהתפיסה שבירה יותר","שאין הבדל"],"a":1,"e":"זה ממצא צ'למרס וריסברג (1985)."},{"q":"איזה מהממצאים הבאים הכי פחות מתיישב עם הטענה שדמיון ותפיסה משתמשים בדיוק באותו מנגנון?","o":["שהדמיון מפעיל את קורטקס הראייה","שבתפיסה ההפעלה בקורטקס החזותי גדולה יותר מאשר בדמיון, ויש מטופלים שנפגעו רק באחד מהם","שגודל הדימוי מפעיל קורטקס באופן טופוגרפי","שהליכה מנטלית מתנהגת כמו תפיסה"],"a":1,"e":"החפיפה חלקית. ההבדלים בהפעלה והדיסוציאציות מצביעים על מנגנונים שלא כולם משותפים."}]},{"id":"c11","book":"הספר התכלת – פסיכולוגיה קוגניטיבית","title":"פרק 11: שפה","source":"book","questions":[{"q":"אילו שתי תכונות של השפה האנושית מאפשרות ליצור משפטים חדשים וייחודיים, בשונה מתקשורת של בעלי חיים?","o":["מבנה היררכי וכפיפות לכללים","צלילים וסמלים","שמות עצם ופעלים","אוצר מילים גדול וקצב דיבור מהיר"],"a":0,"e":"רכיבים קטנים מצטרפים ליחידות גדולות יותר (היררכיה), ומסודרים לפי כללים. כך אפשר לבטא כל מה שרוצים."},{"q":"מה מדגים הממצא שילדים חירשים בסביבה שאין בה שפת סימנים ממציאים שפת סימנים בעצמם (גולדין-מדו, 1982)?","o":["ששפת סימנים נלמדת רק מחיזוקים","את הצורך האוניברסלי לתקשר דרך שפה","ששפה אינה קיימת בכל התרבויות","שחירשות פוגעת ביכולת הלשונית"],"a":1,"e":"הצורך לתקשר חזק כל כך שהוא מתקיים בכל מקום שיש בו אנשים."},{"q":"מה טען סקינר בספרו \"התנהגות מילולית\" (1957)?","o":["שהיכולת לשפה מקודדת בגנים","ששפה נלמדת באמצעות חיזוקים: תגמול על שימוש נכון ועונש על שימוש שגוי","שיש בסיס יסודי אחד לכל השפות","שתהליכים מנטליים הם הבסיס לשפה"],"a":1,"e":"זוהי העמדה הביהביוריסטית."},{"q":"מה היה אחד הטיעונים המשכנעים של חומסקי נגד הסבר החיזוקים של סקינר?","o":["ילדים לומדים שפה מהר מאוד","ילדים מפיקים משפטים שלא שמעו מעולם ולא קיבלו עליהם חיזוק, כמו \"אני שונא אותך, אמא\"","מבוגרים אינם לומדים שפות","בעלי חיים אינם מדברים"],"a":1,"e":"חומסקי טען שהיכולת לרכוש שפה מקודדת בגנים. הביקורת שלו הייתה אירוע חשוב במהפכה הקוגניטיבית."},{"q":"מהם ארבעת תחומי העניין העיקריים של הפסיכו-בלשנות?","o":["הבנה, הפקת דיבור, ייצוג ורכישה","תחביר, סמנטיקה, פונטיקה ומורפולוגיה","קריאה, כתיבה, שמיעה ודיבור","ברוקה, ורניקה, חומסקי וסקינר"],"a":0,"e":"הפרק מתמקד בשלושת הראשונים."},{"q":"מהו \"הגה\" (phoneme)?","o":["יחידת השפה הקטנה ביותר שיש לה משמעות","חלק הדיבור הקצר ביותר ששינויו משנה את משמעות המילה","אות בכתב","הברה"],"a":1,"e":"למשל, החלפת /g/ ב-/t/ הופכת \"גיל\" ל\"טיל\". הגאים אינם זהים לאותיות."},{"q":"מהי \"מורפמה\"?","o":["חלק הדיבור הקצר ביותר ששינויו משנה משמעות","יחידת השפה הקטנה ביותר שיש לה משמעות מוגדרת או תפקיד דקדוקי","הברה במילה","צליל של אות"],"a":1,"e":"\"פח\" היא מורפמה אחת. \"פילון\" מורכבת משתי מורפמות: \"פיל\" ו\"ון\" (הקטנה)."},{"q":"כמה מורפמות יש במילה \"פילים\"?","o":["אחת","שתיים: \"פיל\" ו\"ים\" (מורפמה של ריבוי, בעלת תפקיד דקדוקי)","שלוש","ארבע"],"a":1,"e":"מורפמה שמציינת ריבוי, מין או זמן היא מורפמה בעלת תפקיד דקדוקי."},{"q":"בניסוי של וורן (1970) הוחלף צליל /s/ במילה legislatures בקול שיעול. מה קרה?","o":["הנבדקים זיהו בדיוק איפה היה השיעול","אף נבדק לא זיהה נכון את מקום השיעול, ואף אחד לא הבחין שה-/s/ חסר","הנבדקים לא הבינו את המשפט","הנבדקים שמעו מילה אחרת"],"a":1,"e":"זהו אפקט השחזור הפונמי: השלמת הגה חסר על סמך ההקשר. זו דוגמה לעיבוד מלמעלה-למטה."},{"q":"וורן הראה שבמשפט \"There was time to *ave\" הנבדקים שמעו wave כשהמשך המשפט עסק בפרידה מחבר. מה זה מראה?","o":["שאפקט השחזור הפונמי מושפע גם ממשמעות המילים שמופיעות אחרי ההגה החסר","שהנבדקים לא שמעו את השיעול","שהשחזור תלוי רק במילים שלפני ההגה","שאין עיבוד מלמעלה-למטה"],"a":0,"e":"הידע על משמעות המילים והמשפט משפיע על תפיסת הדיבור."},{"q":"מה מצאו פולק ופיקט (1964) כשהשמיעו לנבדקים מילים בודדות שהוצאו מתוך השיחות שלהם עצמם?","o":["הנבדקים זיהו את כל המילים","הנבדקים זיהו רק כמחצית מהמילים, אף שהקשיבו לקולם שלהם","הנבדקים זיהו רק מילים ארוכות","הנבדקים לא זיהו את קולם"],"a":1,"e":"ההקשר שמספקים המילים והמשפטים בשיחה מסייע לתפיסת מילים."},{"q":"מהי \"סגמנטציה של דיבור\"?","o":["חלוקת מילים להברות בכתב","היכולת לתפוס מילים נפרדות, אף שלעיתים קרובות אין הפסקות פיזיות בין מילים בדיבור","שחזור של הגה חסר","זיהוי מבטא זר"],"a":1,"e":"היא נעזרת בידיעת משמעות המילים ובידע על צלילים שבאים בדרך כלל יחד בתוך מילה (ספראן ועמיתים, 1999)."},{"q":"מהו \"אפקט עליונות המילה\" (רייכר, 1969)?","o":["קל יותר לקרוא מילים ארוכות","קל יותר ומהיר יותר לזהות אות כשהיא בתוך מילה (FORK) מאשר כשהיא לבדה (K) או בתוך מילת תפל (RFOK)","מילים שכיחות נקראות מהר יותר","קל יותר לזכור מילים מאותיות"],"a":1,"e":"אותיות בתוך מילים אינן מעובדות ביחידות. כל אות מושפעת מההקשר שבו היא מופיעה."},{"q":"מהו \"קורפוס\" של שפה?","o":["רשימת כללי הדקדוק","מדגם מייצג גדול של מבעים או טקסט כתוב, שמעיד על שכיחות השימוש במילים, במשמעויות ובמבנים","מילון","אזור במוח"],"a":1,"e":"הקורפוס משקף את אופן השימוש האופייני בשפה בזמן נתון."},{"q":"מהו \"אפקט שכיחות המילה\"?","o":["מילים נדירות נזכרות טוב יותר","אנו מגיבים מהר יותר למילים שכיחות (כמו home) מאשר למילים נדירות (כמו hike)","מילים שכיחות נשכחות מהר","אין הבדל בין מילים"],"a":1,"e":"האפקט
