 מבוסס על תכונית בודדת ולא דורש קשב, וחיפוש חיבורי דורש חיבור תכוניות ולכן הפניות קשב."},{"t":"sameobject","q":"מוצגים שני מלבנים. רמז מופיע בקצה אחד של מלבן, והתגובה מהירה יותר למטרה בקצה השני של אותו מלבן מאשר למטרה במלבן השני באותו מרחק. באיזה ממצא מדובר?","o":["חיבורים אשלייתיים","עיוורון לשינוי","יתרון אותו-עצם","חיפוש תכוניתי"],"a":2,"e":"יתרון אותו-עצם הוא תגובה מהירה יותר למטרה באותו עצם שבו הופיע הרמז המטרים, גם כשהמרחק מהרמז זהה."},{"t":"sameobject","q":"מה מראה יתרון אותו-עצם על הקשב?","o":["שהקשב פועל רק על המיקום המדויק שאליו הופנה","שהקשב משפר את העיבוד של העצם כולו, כולל אזורים אחרים שלו","שהקשב דורש הזזת מבט כדי לפעול","שהקשב מחבר תכוניות רק אחרי זיהוי סמנטי"],"a":1,"e":"הפניית קשב למקום אחד בעצם משפרת את התגובה לכל העצם, יותר מאשר לאזורים קרובים שאינם חלק ממנו."},{"t":"sameobject","q":"למה בניסוי יתרון אותו-עצם הנבדקים קיבעו את העיניים על סימן + במרכז המסך?","o":["כדי לבדוק קשב סמוי, בלי השפעה של הפניית מבט","כדי לגרום לעומס תפיסתי גבוה","כדי לבדוק אם הם רואים את הגורילה","כדי למנוע חיבורים אשלייתיים"],"a":0,"e":"הקיבוע נועד לבדוק קשב סמוי שאינו מערב את ההשפעה של הפניית מבט."},{"t":"broadbent","q":"לפי איזה מודל המילים הלא-קשובות נשארות צלילים בלבד, שקיבלו עיבוד פיזיקלי ולא זוהו?","o":["מודל המחלש של הקשב","מודל של סלקציה מאוחרת","תאוריית העומס של הקשב","מודל הפילטר של ברודבנט"],"a":3,"e":"אצל ברודבנט רק מה שעבר את הפילטר מגיע לגלאי ומזוהה, והשאר נשאר צלילים שלא זוהו."},{"t":"broadbent","q":"איפה ממוקם הפילטר במודל של ברודבנט?","o":["לפני העיבוד הפיזיקלי","אחרי העיבוד הפיזיקלי ולפני הזיהוי הסמנטי","אחרי הזיהוי הסמנטי ולפני המודעות","ביחידת המילון, לפי סף ההפעלה"],"a":1,"e":"זה מודל סלקציה מוקדמת: הפילטר נמצא מוקדם, אחרי העיבוד הפיזיקלי ולפני העיבוד/הזיהוי הסמנטי."},{"t":"broadbent","q":"לפי ברודבנט, על סמך מה הפילטר בוחר את המסר הקשוב?","o":["לפי המשמעות של המילים","לפי השכיחות של המילים","לפי מאפיין פיזיקלי, כמו קול הדובר או האוזן","לפי העומס התפיסתי של המטלה"],"a":2,"e":"הפילטר בורר את המסר הקשוב לפי מאפיין פיזיקלי, למשל מאפייני קול הדובר או האוזן."},{"t":"attenuation","q":"את מרוכזת בשיחה ולא שומעת את הדיבורים מסביב, אבל כשמישהו אומר את השם שלך את קולטת אותו מיד. איזה מודל מסביר את זה בעזרת סף הפעלה נמוך?","o":["מודל הפילטר של ברודבנט","מודל המחלש של הקשב","שיטת הרמז המטרים של פוזנר","תאוריית האינטגרציה של תכוניות"],"a":1,"e":"לפי מודל המחלש, למילים חשובות כמו השם יש סף הפעלה נמוך ביחידת המילון, ולכן הן מזוהות למרות ההחלשה."},{"t":"attenuation","q":"מה ההבדל בין מודל המחלש למודל הפילטר?","o":["במחלש הקשב פועל אחרי העיבוד הסמנטי","במחלש כל המילים הלא-קשובות מזוהות","במחלש הבחירה נעשית לפי משמעות ולא לפי מאפיין פיזיקלי","במחלש המסר הלא-קשוב מוחלש ולא נחסם לגמרי, ולכן מילים חשובות יכולות להיות מזוהות"],"a":3,"e":"שני המודלים פועלים לפני העיבוד הסמנטי, אבל המחלש רק מחליש את המסר הלא-קשוב, ולכן החסימה לא מלאה."},{"t":"attenuation","q":"למה מודל המחלש מכונה \"הפילטר הדולף\"?","o":["כי חסימת הזיהוי של המילים הלא-קשובות לא מלאה","כי כל המילים עוברות את הפילטר","כי הפילטר נמצא אחרי יחידת המילון","כי הקשב מתפשט מהמיקום לכל העצם"],"a":0,"e":"רוב המילים הלא-קשובות לא מזוהות, אבל חשובות ושכיחות כן לעיתים, כלומר משהו \"דולף\" דרך הפילטר."},{"t":"late","q":"לפי איזה מודל כל המילים, גם הלא-קשובות, מקבלות עיבוד סמנטי עוד לפני הסלקציה?","o":["מודל המחלש של הקשב","מודל הפילטר של ברודבנט","מודל של סלקציה מאוחרת","תאוריית העומס של הקשב"],"a":2,"e":"בסלקציה מאוחרת כל המילים מזוהות באופן קדם-קשבי, והסלקציה קורית מאוחר יותר בעיבוד."},{"t":"late","q":"מה תפקיד הסלקציה הקשבית לפי מודל הסלקציה המאוחרת?","o":["לחסום את המילים הלא-קשובות לפני הזיהוי","להחליש את המסר הלא-קשוב","לחבר תכוניות של גירויים חזותיים","לבחור מתוך המילים שזוהו את המידע הרלוונטי שימשיך למודעות ולזיכרון"],"a":3,"e":"לפי המודל כל המילים כבר זוהו, והסלקציה בוחרת מה יגיע למודעות ולזיכרון."},{"t":"late","q":"בניסוי bank, מה הראה שמילים לא-קשובות עברו עיבוד סמנטי?","o":["מילה באוזן הלא-קשובה שינתה את המשמעות שיוחסה למילה הדו-משמעית, בלי שהנבדקים היו מודעים לה","הנבדקים זכרו את כל המילים מהאוזן הלא-קשובה","הנבדקים הגיבו מהר יותר למילים באוזן הקשובה","הנבדקים זיהו רק את השם שלהם באוזן הלא-קשובה"],"a":0,"e":"המילה הלא-קשובה השפיעה על הבנת המילה הדו-משמעית, כלומר עובדה סמנטית, אבל לא הגיעה למודעות כי לא עברה את הסלקציה."},{"t":"changeblind","q":"מבזיקים שתי תמונות של אותו רחוב, ובשנייה חסר עמוד חשמל. רוב הנבדקים לא שמים לב. באיזו תופעה מדובר?","o":["עיוורון קשבי","עיוורון לשינוי","חיבורים אשלייתיים","אפקט מסיבת הקוקטייל"],"a":1,"e":"עיוורון לשינוי הוא פספוס של שינויים חזותיים בין תמונות או סצנות עוקבות."},{"t":"changeblind","q":"מה קרה בניסויי עיוורון לשינוי כשהפנו מראש את הקשב לאזור השינוי?","o":["לא היה הבדל באיתור השינוי","הנבדקים ראו חיבורים אשלייתיים","הנבדקים הצליחו הרבה יותר לאתר את השינוי","הנבדקים הגיבו לאט יותר"],"a":2,"e":"כשהקשב הופנה מראש לאזור השינוי, השינוי אותר הרבה יותר. זה מראה את כוח הקשב על התפיסה."},{"t":"changeblind","q":"מה תופעת העיוורון לשינוי מראה?","o":["שגירוי לא רלוונטי חזק לא ניתן לסינון","שזיהוי תכוניות נעשה באופן קדם-קשבי","שהקשב משפר את העיבוד של כל העצם","שבאזורים שלא קשובים אליהם יכולים לחול שינויים בלי שנרגיש, כלומר לקשב החזותי השפעה חזקה על התפיסה"],"a":3,"e":"התופעה מעידה על עוצמת ההשפעה של הקשב החזותי על התפיסה החזותית."},{"t":"inattentional","q":"נבדקים סופרים מסירות בין שחקנים בחולצות לבנות, ורובם לא רואים גורילה שעוברת במרכז המסך. באיזו תופעה מדובר?","o":["עיוורון קשבי","עיוורון לשינוי","אפקט סטרופ","חיפוש חיבורי"],"a":0,"e":"עיוורון קשבי הוא אי-ראייה של גירוי בולט ומרכזי כי הקשב מופנה לגירויים אחרים."},{"t":"inattentional","q":"איזה משפט נכון לגבי עיוורון קשבי?","o":["הוא קורה רק כשהגירוי מופיע בשולי שדה הראייה","הוא פספוס של שינוי בין שתי תמונות עוקבות","לא רואים גירוי גם כשהוא בולט ובמרכז, כי הקשב מופנה לגירויים אחרים, אפילו באותו אזור","הוא נובע מכך שהגירוי הוצג קצר מדי מכדי להיקלט באוזן"],"a":2,"e":"ההגדרה מדגישה שאפילו גירוי בולט ובמרכז לא נראה כשהקשב מופנה לגירויים אחרים, גם באותו אזור."},{"t":"inattentional","q":"מה ההבדל בין עיוורון קשבי לעיוורון לשינוי?","o":["עיוורון קשבי נוגע לשמיעה, ועיוורון לשינוי לראייה","בעיוורון קשבי לא רואים גירוי שמופיע מול העיניים, ובעיוורון לשינוי מפספסים שינוי בין תמונות עוקבות","בעיוורון קשבי הקשב מופנה מראש לגירוי, ובעיוורון לשינוי לא","אין הבדל, אלה שני שמות לאותה תופעה"],"a":1,"e":"שתיהן מראות את השפעת הקשב על התפיסה, אבל בעיוורון קשבי מפספסים גירוי, ובעיוורון לשינוי מפספסים שינוי בין סצנות."},{"t":"posner","q":"חץ במרכז המסך מצביע ימינה, ומיד אחריו מופיעה מטרה. הנבדק מגיב מהר יותר כשהמטרה מימין מאשר כשהיא משמאל, בלי להזיז את העיניים. באיזו שיטה מדובר?","o":["חיפוש תכוניתי","האזנה דיכוטית","שיטת הרמז המטרים של פוזנר","תאוריית העומס של הקשב"],"a":2,"e":"שיטת פוזנר משתמשת ברמז שמכוון את הקשב, ומודדת זמן תגובה בצעדים תקפים ולא-תקפים, בלי הזזת מבט."},{"t":"posner","q":"מה זה צעד \"לא-תקף\" בשיטת פוזנר?","o":["צעד שבו המטרה מופיעה בצד ההפוך מזה שהחץ הצביע עליו","צעד שבו הנבדק הזיז את העיניים","צעד שבו לא הופיעה מטרה בכלל","צעד שבו החץ הופיע אחרי המטרה"],"a":0,"e":"ברוב הצעדים הרמז תקף, ובמיעוטם הוא לא-תקף: המטרה מופיעה בצד ההפוך לחץ."},{"t":"posner","q":"מה הסיק פוזנר מהממצאים?","o":["שהקשב פועל רק כשמזיזים את העיניים","שהקשב מחבר את התכוניות של המטרה","שהקשב מתפשט על כל העצם","שהקשב הופנה באופן סמוי ופעל כזרקור ששיפר וזירז את העיבוד באזור שאליו הופנה"],"a":3,"e":"בצעדים התקפים התגובה הייתה מהירה יותר, ובלי אפשרות להזיז מבט פוזנר הסיק שהקשב הסמוי פועל כזרקור."},{"t":"fit","q":"לפי איזו תיאוריה בשלב הראשון מזהים תכוניות באזורים נפרדים במוח, ורק בשלב שני הקשב מחבר אותן לעצם מודע?","o":["מודל של סלקציה מאוחרת","תאוריית האינטגרציה של תכוניות","תאוריית העומס של הקשב","מודל המחלש של הקשב"],"a":1,"e":"תאוריית האינטגרציה של תכוניות מתארת שלב קדם-קשבי של זיהוי תכוניות ושלב קשב ממוקד שבו הן מתחברות."},{"t":"fit","q":"מה נכון לגבי השלב הקדם-קשבי לפי תאוריית האינטגרציה של תכוניות?","o":["מזוהות התכוניות באזורים השונים במוח, ועדיין לא מודעים לעצמים","הקשב מחבר את התכוניות לעצם","כל המילים מזוהות סמנטית","מתרחשים החיבורים האשלייתיים בכוונה"],"a":0,"e":"בשלב הקדם-קשבי התכוניות מזוהות בנפרד, ועוד אין מודעות לעצמים כשילוב של תכוניות."},{"t":"fit","q":"איזה ממצא לא שייך לממצאים שתמכו בתאוריית האינטגרציה של תכוניות?","o":["חיבורים אשלייתיים כשאין מספיק קשב","חיפוש חיבורי מתארך עם מסיחים וחיפוש תכוניתי לא","מטופלי תסמונת בלינט נכשלים בחיפוש חיבורי ומצליחים בתכוניתי","מילה לא-קשובה שינתה את משמעות המילה bank"],"a":3,"e":"ניסוי bank תומך במודל הסלקציה המאוחרת בקשב שמיעתי, לא בתאוריית האינטגרציה של תכוניות."},{"t":"load","q":"דמות אנימציה מתחת למעגל אותיות מאטה את חיפוש האות דווקא כשהמשימה קלה. איזו תיאוריה מנבאת את זה?","o":["אפקט סטרופ","תאוריית האינטגרציה של תכוניות","תאוריית העומס של הקשב","מודל הפילטר של ברודבנט"],"a":2,"e":"לפי תאוריית העומס, בעומס נמוך נשארים משאבים פנויים שמעבדים את הגירוי הלא רלוונטי, והתגובה מאטה."},{"t":"load","q":"לפי תאוריית העומס, מה קורה לגירוי לא רלוונטי במשימה בעומס גבוה?","o":["הוא מעובד במלואו ומאט את התגובה","הוא לא זוכה לעיבוד ולא משפיע על זמן התגובה, כי רוב הקיבולת מנוצלת","הוא מוחלש ומזוהה רק אם הוא חשוב","הוא מתחבר לגירוי המטרה בחיבור אשלייתי"],"a":1,"e":"בעומס גבוה המטלה מנצלת את רוב קיבולת העיבוד, ולכן לגירויים לא רלוונטיים לא נשאר עיבוד."},{"t":"load","q":"איך נוצרו תנאי העומס הנמוך והגבוה במחקר של תאוריית העומס?","o":["בעומס נמוך האותיות המסיחות היו זהות, ובעומס גבוה הן היו שונות זו מזו","בעומס נמוך הייתה דמות אנימציה, ובעומס גבוה לא","בעומס נמוך הציגו מילה אחת לכל אוזן, ובעומס גבוה שתיים","בעומס נמוך הרמז היה תקף, ובעומס גבוה לא-תקף"],"a":0,"e":"במחקר חיפשו אות מטרה במעגל אותיות: מסיחים זהים יצרו עומס נמוך, ומסיחים שונים יצרו עומס גבוה."}]},{"ch":"c5","title":"פרק 5: זיכרון לטווח קצר וזיכרון עבודה","terms":[{"id":"wordlen","name":"אפקט אורך המילה","one":"מרשימה של מילים קצרות זוכרים יותר מילים מאשר מרשימה של מילים ארוכות.","simple":"מציגים רשימת מילים ומבקשים להיזכר בהן מיד. מרשימה של מילים קצרות נזכרים ביותר מילים. מרשימה של מילים ארוכות נזכרים בפחות.","why":"ההסבר הוא השינון ההגייתי בלולאה הפונולוגית. לוקח יותר זמן להגות בראש מילה ארוכה, ולכן באותו זמן משננים פחות מילים ארוכות. זה אחד משלושת הממצאים שתומכים בקיום הלולאה הפונולוגית.","example":"קל יותר לזכור רשימת קניות כמו חלב, לחם, ביצים מאשר רשימה כמו אבוקדו, פטרוזיליה, קורנפלקס.","points":["מרשימת מילים קצרות נזכרים ביותר מילים מאשר מרשימת מילים ארוכות","ההסבר: תהליך השינון ההגייתי, שהוא חלק מהלולאה הפונולוגית","מילים ארוכות לוקחות יותר זמן להגות בראש, ולכן באותו זמן שינון מספיקים לשנן פחות מהן ולכן זוכרים פחות","אחד משלושה ממצאים שתומכים בלולאה הפונולוגית כמנגנון ששומר מידע כצלילי מילים (יחד עם אפקט הדמיון הפונולוגי ודיכוי הגייתי)"],"confuse":"אפקט הדמיון הפונולוגי: שם מדובר בסוג הטעות (צליל דומה), וכאן בכמה מילים זוכרים לפי האורך שלהן.","original":"על פי אפקט זה מרשימת מילים קצרות נצליח להחזיק בזיכרון ולהיזכר תוך זמן קצר ביותר מילים מאשר מרשימת מילים ארוכות. ממצא זה הוסבר על ידי תהליך השינון ההגייתי, שהוא חלק מהלולאה הפונולוגית במודל זיכרון העבודה. על פי הסבר השינון ההגייתי לוקח יותר זמן להגות בראשנו מילים ארוכות מאשר מילים קצרות. כתוצאה מכך, באותו משך זמן שינון נספיק להגות בראשנו כמות קטנה יותר של מילים ארוכות לעומת קצרות, ולכן נזכור כמות קטנה יותר של מילים ארוכות. כיון שניתן להסביר את אפקט אורך המילה באמצעות תהליך השינון ההגייתי בלולאה הפונולוגית, אפקט זה מהווה אחד משלושת הממצאים שתומכים בקיום הלולאה הפונולוגית כמנגנון שבו מידע מוחזק כצלילי מילים. שני הממצאים הנוספים שתומכים בקיום מנגנון הלולאה הפונולוגית הם: אפקט הדמיון הפונולוגי, ודיכוי הגייתי."},{"id":"phonsim","name":"אפקט הדמיון הפונולוגי","one":"כשטועים בזכירת אותיות, אומרים אות שנשמעת דומה, כמו P במקום B.","simple":"מציגים לנבדקים סדרת אותיות ומבקשים לחזור עליהן מיד לפי הסדר. כשהם טועים, הם אומרים במקום אות אחרת ששמה נשמע דומה, למשל P במקום B או F במקום S. אותן טעויות בדיוק קורות כשמשמיעים אות על רקע רעש.","why":"הטעויות הן טעויות של צליל, גם כשהאותיות הוצגו לעיניים. זה מראה שהמידע נשמר בזיכרון לטווח קצר בקוד פונולוגי (צלילי), ולכן תומך בקיום הלולאה הפונולוגית. הייצוג הצלילי דועך חלקית, נהיה פחות ברור ומתבלבל עם צלילים דומים.","example":"מישהו אומר לך שם של מקום, ורגע אחר כך את זוכרת \"רמת גן\" במקום \"רמת חן\".","points":["דפוס פונולוגי של טעויות: אות מוחלפת באות ששמה נשמע דומה (P במקום B, F במקום S)","המשימה: לחזור מיד ולפי הסדר על סדרות אותיות שהוצגו","אותן טעויות מופיעות בזיהוי אות שהושמעה על רקע רעש","מראה שהמילים נשמרות בזיכרון לטווח קצר בקוד פונולוגי/צלילי, גם אם הוצגו חזותית, ולכן תומך בלולאה הפונולוגית","הסבר: הייצוג הפונולוגי במאגר הפונולוגי דועך חלקית, נהיה פחות מובחן ומתבלבל עם צלילים דומים"],"confuse":"אפקט אורך המילה: הוא עוסק בכמה מילים זוכרים, ואפקט הדמיון הפונולוגי עוסק בסוג הטעות.","original":"זהו ממצא שמראה דפוס פונולוגי של טעויות זכירה: כאשר נבדקים התבקשו לחזור מיידית על פי הסדר על סדרות אותיות שהוצגו להם, כאשר הם טעו בדיווח אות אחת מהסדרה הם דיווחו במקומה אות אחרת ששמה דומה, למשל P במקום B ו-F במקום S. (טעויות זהות ביצעו הנבדקים כשהתבקשו לזהות איזו אות הושמעה להם כשהיא הושמעה על רקע רעש). אפקט הדמיון הפונולוגי, כלומר העובדה שהטעויות הן של החלפה של צליל בצליל דומה, מעיד על כך שהמילים נשמרות בזיכרון לטווח קצר באמצעות קוד פונולוגי/צלילי (גם אם הוצגו חזותית), ולכן הוא תומך בקיום מנגנון הלולאה הפונולוגית כמנגנון לשמירת מילים לטווח קצר. (שני הממצאים הנוספים שתומכים בקיום הלולאה הפונולוגית הם: אפקט אורך המילה, ודיכוי הגייתי). ההסבר המלא להתרחשות האפקט בלולאה הפונולוגית הוא שהקוד/הייצוג הפונולוגי של שמות האותיות שהנבדקים החזיקו במאגר הפונולוגי דעך חלקית כך שהייצוג שלהן נהיה פחות מובחן, בדיוק כמו בשמיעת מילה על רקע רעש, ולכן התחיל להתבלבל עם צלילים דומים לו."},{"id":"changedet","name":"גילוי שינויים (ומדידת קיבולת הזיכרון לטווח קצר החזותי)","one":"מראים שתי תמונות של ריבועים צבעוניים אחת אחרי השנייה ושואלים אם משהו השתנה.","simple":"מבזיקים תמונה, אחריה מסך חשוך לכשנייה, ואז תמונה שנייה. הנבדק צריך להגיד אם חל שינוי, למשל ריבוע אחד שינה צבע. עד ארבעה ריבועים מזהים שינוי טוב. מעבר לזה ההצלחה יורדת.","why":"בזמן המסך החשוך הזיכרון האיקוני דועך, ונשאר רק הזיכרון לטווח קצר. מכאן הסיקו שהקיבולת של הזיכרון לטווח קצר החזותי היא כ-4 פריטים. כשהגירויים מורכבים יותר הקיבולת יורדת, ולכן המגבלה היא על כמות המידע.","example":"מסתכלים על שולחן, מסתובבים לשנייה, ומנסים לגלות אם מישהו הזיז משהו. עם מעט חפצים קל לשים לב. עם הרבה חפצים כבר מפספסים.","points":["שיטה לבדיקת הזיכרון לטווח קצר החזותי (הלוח החזותי-מרחבי): מבזיקים שתי תמונות זו אחר זו, והמשימה היא לזהות אם חל שינוי","תצוגות עם מספר משתנה של ריבועים צבעוניים, ובחלק מהצעדים ריבוע אחד משנה צבע","מסך חשוך של כשנייה בין התמונות: הזיכרון האיקוני דועך ונשאר רק הזיכרון לטווח קצר","ממצא: הצלחה עד 4 פריטים וירידה מעבר לכך, ולכן הקיבולת היא כ-4 פריטים","בגירויים מורכבים יותר הקיבולת יורדת אף מתחת ל-4: המגבלה היא על כמות המידע"],"confuse":"שיטת הדיווח החלקי: שם בודקים את הזיכרון האיקוני מיד אחרי התצוגה, ובגילוי שינויים מחכים שהוא ידעך כדי לבדוק את הזיכרון לטווח קצר.","original":"זוהי שיטה שמשמשת לבדיקת הזכרון לטווח קצר/הלוח החזותי-מרחבי, שבה מבזיקים לנבדקים שתי תמונות זו אחר זו והמטלה של הנבדקים היא לזהות אם חל שינוי בין התמונה הראשונה לשנייה. בשימוש בשיטה זו לצורך מדידת קיבולת הזיכרון לטווח קצר השתמשו בתצוגות שכוללות מספר משתנה של ריבועים צבעוניים, שבחלק מצעדי הניסוי אחד מהם שינה את צבעו בתמונה השניה. בין הצגת שתי התמונות הופיע מסך חשוך למשך כשניה, שבה אמור הזיכרון האיקוני לדעוך, ולכן הנבדקים יכולים להסתמך רק על המידע שנשאר בזיכרון לטווח קצר. הממצא בניסוי זה היה שהנבדקים מצליחים להבחין בשינוי בין התמונות כאשר הן מכילות עד ארבעה פריטים, וכשמספר הפריטים גדל מעבר לכך ההצלחה יורדת. מכך הסיקו החוקרים שקיבולת הזיכרון לטווח קצר (החזותי) עומדת על 4 פריטים. במחקר המשך נמצא שככל שהגירויים מורכבים יותר הנבדקים מצליחים בגילוי שינויים עבור מספר הולך וקטן של גירויים, מה שמעיד שמגבלת הקיבולת היא על כמות המידע שניתן להחזיק, וכאשר הגירויים מורכבים הקיבולת יורדת אף מתחת ל-4 פריטים."},{"id":"artsupp","name":"דיכוי הגייתי","one":"חוזרים בקול על \"זה, זה, זה\" בזמן שמנסים לזכור מילים, והזכירה נפגעת.","simple":"מבקשים מהנבדק לחזור בקול על צליל לא רלוונטי, כמו \"זה, זה, זה\", בזמן שמציגים לו רשימת מילים, וגם בזמן שהוא כותב את מה שזכר. התוצאה: יותר טעויות בשחזור הסדר של המילים. בנוסף, אפקט אורך המילה נעלם.","why":"החזרה בקול תופסת את השינון ההגייתי, ולכן אי אפשר להשתמש בו כדי לשנן את המילים. בלי שינון, למילים קצרות כבר אין יתרון. שתי ההשפעות תומכות בקיום השינון ההגייתי, ולכן בקיום הלולאה הפונולוגית.","example":"מנסים לזכור קוד שקיבלת ב-SMS בזמן ששרים שיר בקול. קשה מאוד לחזור על הקוד בראש.","points":["הליך: הנבדק חוזר בקול על צליל לא רלוונטי (\"זה, זה, זה...\") בזמן הצגת רשימת המילים ובזמן כתיבת המילים שזכר","פוגע בהיזכרות מיידית לפי הסדר: יותר טעויות בשחזור הרצף, בהשוואה ללמידה בלי דיכוי","מבטל את אפקט אורך המילה, גם בהצגה חזותית וגם בהצגה שמיעתית","הסבר: הדיכוי מעסיק את תהליך השינון ההגייתי ומבטל את היתרון של ההגייה המהירה של מילים קצרות","תומך בקיום השינון ההגייתי ולכן בלולאה הפונולוגית (יחד עם אפקט הדמיון הפונולוגי ואפקט אורך המילה)"],"confuse":"אפקט אורך המילה: הוא ממצא שנוצר בזכות השינון, ודיכוי הגייתי הוא הליך שחוסם את השינון ולכן מבטל את האפקט.","original":"דיכוי הגייתי הוא הליך שבו מבקשים מהנבדקים לחזור על צליל לא רלוונטי כמו: \"זה, זה, זה...\" בזמן שבו מוצגת להם רשימת מילים שאותן הם מתבקשים לזכור, ולהמשיך בכך גם כשהם כותבים מיד אחר כך את המילים שהם זוכרים מהרשימה. נמצא שהליך זה של דיכוי הגייתי פוגע בהיזכרות מיידית על פי סדר: הנבדקים טועים יותר בשחזור הרצף הנכון של המילים (בהשוואה ללמידת המילים ללא דיכוי הגייתי). ההסבר שהוצע לכך טוען שהדיכוי ההגייתי מעסיק את תהליך השינון ההגייתי של הלולאה הפונולוגית ומפחית את היכולת להשתמש בו לשינון של המילים, ולכן מקשה על שמירתן בלולאה הפונולוגית. במחקר המשך נמצא שהדיכוי ההגייתי גם מבטל את אפקט אורך המילה (הן בהצגה חזותית והן בהצגה שמיעתית של המילים), וזה הוסבר בכך שהנטרול/הדיכוי של השינון ההגייתי מבטל את היתרון בהגייה המהירה יותר שיש למילים קצרות לעומת מילים ארוכות. שתי השפעות אלה של הדיכוי ההגייתי מחזקות את הרעיון של קיומו של תהליך השינון ההגייתי, שהוא אחד מהמנגנונים בלולאה הפונולוגית, ולכן השפעות הדיכוי ההגייתי תומכות בקיום הלולאה הפונולוגית (יחד עם שני הממצאים הנוספים התומכים בה: אפקט הדמיון הפונולוגי ואפקט אורך המילה)."},{"id":"proactive","name":"הפרעה למאוחר (כהסבר לתוצאות ניסוי זכירת השלשות)","one":"מה שלמדתי קודם מפריע לי לזכור את מה שלמדתי אחר כך.","simple":"מידע ישן מתבלבל עם מידע חדש ומקשה לזכור את החדש. בניסוי השלשות הנבדקים ראו שלשת עיצורים ואז ביצעו פעילות מסיחה. ככל שההסחה ארוכה יותר, השלשות הקודמות מפריעות יותר לזכור את השלשה הנוכחית.","why":"זה הסבר חלופי להסבר הדעיכה. הקושי הוא לא שהשלשה דעכה מהזיכרון לטווח קצר, אלא שהיא מתבלבלת עם השלשות שלפניה. החיזוק: את השלשה הראשונה זכרו טוב גם אחרי הסחה ארוכה, כי לפניה לא היו שלשות שיפריעו.","example":"עברת דירה, ובחודשים הראשונים כשמבקשים את הכתובת שלך יוצאת לך בטעות הכתובת הישנה.","points":["הגדרה: הפרעה לזכירת מידע שנלמד מאוחר יותר, שנגרמת מהמידע שנלמד לפניו","להבדיל מהפרעה למוקדם: פריטים שנלמדו מאוחר יותר מפריעים לזכירת מידע מוקדם","בניסוי השלשות: ככל שההסחה אחרי השלשה ארוכה יותר, ההפרעה מהשלשות הקודמות גדלה, ולכן השליפה יורדת","הסבר חלופי להסבר הדעיכה: הקושי נובע מהתבלבלות עם שלשות קודמות ולא מדעיכה","חיזוק: את השלשה הראשונה זכרו גם אחרי הסחה ארוכה, כי אין לפניה שלשות שיפריעו"],"confuse":"הפרעה למוקדם: שם המידע החדש מפריע לזכור את הישן, ובהפרעה למאוחר הישן מפריע לזכור את החדש.","original":"הפרעה למאוחר היא ההפרעה לזכירת מידע שנלמד מאוחר יותר שנגרמת מהמידע שנלמד לפניו. סוג שני של הפרעה הוא הפרעה למוקדם - ההפרעה לזכירת מידע מוקדם שנגרמת מצד פריטים שלמדנו מאוחר יותר. בפרק 5 הוצגה ההפרעה למאוחר כהסבר לתוצאות בניסוי ההיזכרות בשלשות של עיצורים. על פי הסבר זה ככל שגדל משך הזמן שבו הנבדקים מבצעים פעילות מסיחה לאחר שהוצגה להם שלשת עיצורים, כך מתגברת ההפרעה לזכירת שלשה זו מצד השלשות הקודמות שנלמדו לפניה בניסוי, וזו הסיבה לירידה בהצלחת שליפתה ככל שמתארכת ההסחה. הסבר ההפרעה למאוחר הוא הסבר חלופי להסבר הדעיכה, כיוון שהוא מייחס את הקושי בזכירת השלשה לא לדעיכה שלה מהזיכרון לטווח קצר, אלא להתבלבלות שלה עם שלשות שהופיעו לפניה. החיזוק להסבר ההפרעה למאוחר הוא שלנבדקים לא הייתה בעיה להיזכר בשלשה הראשונה גם לאחר הסחה ארוכה. ממצא זה מנוגד להסבר הדעיכה ותומך בהסבר ההפרעה למאוחר כיון שבשלשה הראשונה אין שלשות קודמות שיגרמו להפרעה למאוחר בשליפתה."},{"id":"iconic","name":"זיכרון איקוני","one":"התמונה של מה שראינו נשארת עוד רגע קטן אחרי שהיא נעלמת.","simple":"זה זיכרון חושי של הראייה, והוא השלב הראשון בכניסת מידע לזיכרון לפי המודל המודאלי. הוא שומר את מה שראינו לזמן קצרצר. לכן אנחנו ממשיכים לחוות גירוי חזותי רגע אחרי שהוא נעלם. זו ההתמשכות החזותית.","why":"הוא מסביר למה סרט נראה רציף למרות שהוא בנוי מתמונות נפרדות, ולמה זיקוק שמסובבים מהר נראה כמו עיגול של אור. ניסוי ספרלינג הראה שהקיבולת שלו גבוהה, אולי בלתי מוגבלת, אבל התמונה נשמרת כשנייה ודועכת בעיקר בחצי השנייה הראשונה.","example":"מכבים את האור בחדר, ולשבריר שנייה עדיין רואים את צורת המנורה.","points":["זיכרון חושי חזותי, השלב הראשון בכניסה לזיכרון לפי המודל המודאלי","משמר לזמן קצרצר את השפעת הגירוי החזותי ומתבטא בהתמשכות החזותית: ממשיכים לחוות גירוי רגע אחרי שנעלם","מסביר למה סרט קולנוע נחווה כרציף ולמה זיקוק מסתובב נראה כעיגול של אור","נבדק בניסוי של ספרלינג: דיווח אותיות ממטריצה של 12 אותיות מיד אחרי שנראתה","מסקנה: קיבולת גבוהה, אולי בלתי מוגבלת, משך של כשנייה, ועיקר הדעיכה בחצי השנייה הראשונה"],"confuse":"זיכרון לטווח קצר: מחזיק כמה פריטים לכמה שניות, והזיכרון האיקוני מחזיק הרבה מאוד אבל רק לכשנייה.","original":"זהו זיכרון חושי חזותי שהוא השלב הראשון בכניסה לזיכרון על פי המודל המודאלי. זיכרון זה משמר למשך פרקי זמן קצרצרים את השפעותיה של הגרייה החושית החזותית, והוא מתבטא בתופעת ההתמשכות החזותית. תופעה זו מתבטאת בכך שאנו ממשיכים לחוות גירוי חזותי לזמן קצרצר לאחר שהוא נעלם. תופעה זו יכולה להסביר מדוע אנו חווים סרט קולנוע כרציף וללא הפסקות למרות שהוא מורכב מתמונות נפרדות, ומדוע אנו חווים עיגול של אור כשאנו מסובבים במהירות זיקוק. המחקר שבדק את הקיבולת של הזיכרון האיקוני ואת משכו היה הניסוי של ספרלינג שבו נבדקים נתבקשו לדווח על אותיות מטריצה של 12 אותיות מיד לאחר שראו אותה. המסקנה הסופית מכל חלקי ניסוי זה הייתה שקיבולת הזיכרון האיקוני גבוהה, אולי אף בלתי מוגבלת, אך התמונה שנקלטת בו נשמרת לזמן קצרצר של שניה בודדת, ודועכת בעיקר בחצי השניה הראשונה שלאחר היעלמות התצוגה."},{"id":"stm","name":"זיכרון לטווח קצר","one":"המקום שבו מחזיקים מעט מידע לכמה שניות, כמו קוד שמקלידים מיד.","simple":"לפי המודל המודאלי זה השלב השני בזיכרון, אחרי הזיכרון החושי ולפני הזיכרון לטווח ארוך. הוא שומר כמות קטנה של מידע, כמה פריטים, לכמה שניות. זה המידע שאנחנו חושבים עליו עכשיו ובשניות האחרונות.","why":"הקיבולת נבדקה בזכירת ספרות (מילר) ובגילוי שינויים. היא כמה פריטים בודדים: לפעמים עד כ-9 (7 פלוס מינוס 2), ובפריטים מורכבים פחות מ-2, ולכן נכון יותר למדוד כמות מידע. בלי שינון המידע נשמר כ-15-20 שניות (בראון ופטרסון).","example":"מכתיבים לך קוד אימות של שש ספרות. את מחזיקה אותו בראש בדיוק עד שאת מקלידה, ואחר כך הוא נעלם.","points":["השלב השני במודל המודאלי: אחרי הזיכרון החושי ולפני הזיכרון לטווח ארוך","שומר כמויות קטנות של מידע (כמה פריטים) לכמה שניות, כולל מה שחושבים עליו עכשיו ובשניות שלפני","קיבולת של כמה פריטים: בניסוי הספרות של מילר 7 פלוס מינוס 2, ובגילוי שינויים עם פריטים מורכבים פחות מ-2, ולכן נכון להגדיר לפי כמות מידע","הקיבולת נכונה כל עוד לא מחברים פריטים יחד, למשל ביצירת גושים","משך בלי שינון: כ-15-20 שניות (בראון ופטרסון, שלשות עם הסחה)"],"confuse":"זיכרון עבודה: פיתוח של הזיכרון לטווח קצר שגם מעבד מידע ובנוי מכמה מנגנונים, ולא רק מחזיק אותו.","original":"זהו המנגנון שעל פי המודל המודאלי הוא השלב השני בכניסת מידע לזיכרון, לאחר הזכרון החושי ולפני הזכרון לטווח ארוך. הזיכרון לטווח קצר אחראי לשמירת כמויות קטנות של מידע (כמה פריטים) לפרקי זמן קצרים של כמה שניות. הזיכרון לטווח קצר כולל את המידע שאנו חושבים עליו בהווה, ובשניות שקדמו לו. החוקרים בדקו את קיבולתו של הזיכרון לטווח קצר באמצעות ניסויי היזכרות בסדרת ספרות (הניסוי של מילר), וכן באמצעות ניסויי גילוי שינויים בין שתי תמונות שהוצגו זמן קצר זו אחר זו. ממצאי הניסויים השונים שנערכו לא היו זהים אך הראו שמגבלת הקיבולת של הזיכרון לטווח קצר כולל מספר פריטים בודדים: בניסוי גילוי שינויים מסוים הקיבולת עבור הפריטים הכי מורכבים ירדה עד מתחת לשני פריטים בממוצע (ניסוי זה גם הראה שנכון יותר להגדיר את הקיבולת על פי כמות מידע ולא כמות פריטים), ובניסוי זכירת ספרות (של מילר) היא יכלה להגיע לפעמים עד כתשעה פריטים (7+/-2 פריטים). קיבולת זו מתקיימת כל עוד הנבדקים לא מבצעים חיבור של פריטים ביחד, למשל על ידי יצירת גושים. משך הזיכרון לטווח קצר, כשלא ניתן לשמר בו את המידע על ידי שינון, עומד על כ-15-20 שניות (על פי הניסוי של בראון ופטרסון עם השלשות וההסחה)."},{"id":"wm","name":"זיכרון עבודה","one":"זיכרון לטווח קצר שלא רק מחזיק מידע, אלא גם עובד איתו.","simple":"זה פיתוח של מודל הזיכרון לטווח קצר. התברר שהוא לא רק שומר מידע לזמן קצר, אלא גם מעבד אותו, למשל כשפותרים תרגיל או מבינים משפט. הוא בנוי מכמה מנגנונים נפרדים שעובדים במקביל, ולכן אפשר לבצע כמה משימות בו-זמנית.","why":"במקום מחסן אחד יש כמה רכיבים: לולאה פונולוגית למידע מילולי, לוח חזותי-מרחבי לתמונות, ומנהל מרכזי שמנהל את המידע ביניהם. בגרסה המעודכנת נוסף המאגר האפיזודי.","example":"את מחשבת בראש כמה עולה הקנייה, וזוכרת תוך כדי את הסכום שכבר חישבת עד עכשיו.","points":["פיתוח של מודל הזיכרון לטווח קצר: התפקיד שלו יותר מרק שמירה פעילה של מידע לזמן קצר","משמש גם לעיבוד דינאמי של מידע (פתירת תרגילים במתמטיקה, הבנת שפה) ומאפשר כמה משימות בו-זמנית","מורכב מכמה מנגנונים נפרדים שפועלים במקביל כדי להחזיק מידע ולעבד אותו","לולאה פונולוגית: מידע מילולי בקוד פונולוגי ושינון הגייתי. לוח חזותי-מרחבי: מידע חזותי כתמונה על מסך מנטלי. מנהל מרכזי: מנהל את העברת המידע לשניהם, מסנן ומכניס מידע מהחושים ומהזיכרון לטווח ארוך, ומעביר לזיכרון לטווח ארוך","בגרסה המעודכנת נוסף מרכיב רביעי: המאגר האפיזודי"],"confuse":"זיכרון לטווח קצר: מאגר אחד שרק מחזיק מידע, וזיכרון העבודה בנוי מכמה מנגנונים שגם מעבדים אותו.","original":"זהו פיתוח של המודל של הזיכרון לטווח קצר, שנבע מכך שעם התקדמות המחקר לגבי הזיכרון לטווח קצר התברר שתפקידו הוא יותר מאשר רק לשמור מידע באופן פעיל לזמן קצר. על פי המודל, זיכרון העבודה משמש גם לביצוע תהליכים דינאמיים של עיבוד מידע כמו פתירת תרגילים במתמטיקה והבנת שפה, ומאפשר לבצע כמה משימות בו-זמנית ולא רק אחת. על פי המודל זיכרון העבודה מורכב מכמה מנגנונים נפרדים שמסוגלים לפעול במקביל כדי להחזיק מידע לזמן קצר ולבצע עליו עיבודים. המרכיבים במודל המקורי של זיכרון העבודה היו: 1. הלולאה הפונולוגית שאחראית לשמירה של מידע מילולי בקוד פונולוגי (צלילי מילים מדוברות), ומאפשרת שינון הגייתי שלהן בראש, 2. הלוח החזותי-מרחבי שמחזיק מידע חזותי כתמונה על מסך מנטלי פנימי, 3. המנהל המרכזי שמנהל את העברת המידע לשני המנגנונים הללו וכן אחראי על הסינון וההכנסה של מידע לזיכרון העבודה (שמגיע מהחושים ומהזיכרון לטווח ארוך) ועל העברתו לזיכרון לטווח ארוך. בגרסה המעודכנת יותר של המודל נוסף לו גם מרכיב רביעי: המאגר האפיזודי, מנגנון שמאפייניו נמצאים כעת בחקירה."},{"id":"chunking","name":"יצירת גושים","one":"לזכור 1948 כשנה אחת ולא כארבע ספרות נפרדות.","simple":"מחברים כמה פריטים עוקבים ליחידה אחת גדולה יותר, למשל מילים למשפט או ספרות למספר. הפריטים בתוך הגוש קשורים חזק זה לזה, ורק חלש לפריטים בגושים אחרים. כך אפשר להחזיק בזיכרון לטווח קצר יותר פריטים.","why":"הקשר החזק בתוך הגוש עוזר לשלוף פריט אחד בעזרת האחרים. כך עוברים את המגבלה של שבע פלוס מינוס שתיים. החיבור מבוסס הרבה פעמים על קשר שכבר קיים בין הפריטים בזיכרון לטווח ארוך.","example":"את המספר 0521234567 זוכרים בקלות כשלושה חלקים, 052, 123 ו-4567, ולא כעשר ספרות נפרדות.","points":["תהליך להחזקת פריטים בזיכרון לטווח קצר על ידי חיבור כמה פריטים עוקבים ליחידה גדולה יותר (משפטים, מספרים מכמה ספרות)","גוש: פריטים עם קשר חזק ביניהם, לעומת קשר חלש לפריטים בגושים אחרים","בזכות הקשר החזק, הפריטים בגוש עוזרים לשליפה זה של זה","מגדיל את כמות הפריטים בזיכרון לטווח קצר מעבר למגבלה של שבע פלוס מינוס שתיים","מתבסס פעמים רבות על קשר שיש בין המילים בזיכרון לטווח ארוך"],"original":"זהו תהליך המשמש להחזקת פריטים בזיכרון לטווח קצר על ידי חיבור כמה מילים עוקבות ליחידה גדולה יותר (לדוגמא למשפטים או למספרים שמורכבים מכמה ספרות). הגוש שנוצר הוא אוסף פריטים שביניהם יש קשר חזק, לעומת הקשר החלש שיש להם לפריטים בגושים אחרים. בזכות הקשר החזק בין הפריטים בגוש הם מסייעים לשליפה זה של זה. יצירת גושים מגדילה את כמות הפריטים שניתן להחזיק בזיכרון לטווח קצר מעבר למגבלת הקיבולת שנמצאה עבור סדרת מילים ללא יצירת גושים (שבע פלוס מינוס שתיים), והיא מתבססת פעמים רבות על חיבור כמה מילים ביחד בזכרון לטווח קצר, על סמך קשר שיש ביניהן בזיכרון לטווח ארוך."},{"id":"vssp","name":"לוח חזותי-מרחבי","one":"המסך הפנימי בראש, שעליו מחזיקים ומסובבים תמונות.","simple":"זה רכיב של זיכרון העבודה, לצד הלולאה הפונולוגית והמנהל המרכזי. הוא מחזיק מידע חזותי ומרחבי באופן פעיל לזמן קצר. אפשר גם לעשות עליו פעולות, כמו לסובב צורה בדמיון.","why":"שלושה ממצאים תומכים בקיומו, ובמבחן מספיק להציג אחד ולהסביר איך הוא תומך: רוטציה מנטלית, זכירת תבניות מקריות במטריצה, וההפרעה בין דמיון של אות לבין הצבעה בטבלה.","example":"מסבירים לך איך להגיע למקום, ואת מדמיינת את המפה בראש ואיפה צריך לפנות.","points":["רכיב של זיכרון העבודה (לצד הלולאה הפונולוגית והמנהל המרכזי)","מחזיק מידע חזותי ומרחבי באופן פעיל לזמן קצר ומאפשר לבצע עליו עיבוד חזותי","ממצא 1, רוטציה מנטלית: ככל שפער זווית הסיבוב גדול יותר, זמן התגובה ארוך יותר, כי מסובבים את הצורה על מסך פנימי","ממצא 2: זוכרים תבניות מקריות של משבצות שחורות במטריצה. אין להן חוק או שם לשמור בלולאה הפונולוגית, ולכן זוכרים אותן כתמונה","ממצא 3: בשיפוט פינות של אות מדומיינת קשה יותר להצביע בטבלה מאשר לענות בקול. הפרעה מראה ששתי המשימות החזותיות מתחרות על אותו מנגנון חזותי"],"confuse":"לולאה פונולוגית: מחזיקה מילים כצלילים, והלוח החזותי-מרחבי מחזיק תמונות ומיקומים.","original":"זהו מנגנון שהוא חלק מזיכרון העבודה (בנוסף ללולאה הפונולוגית ולמנהל המרכזי), והוא מיועד להחזקת מידע חזותי ומרחבי באופן פעיל לזמן קצר, ולביצוע פעולות עיבוד חזותיות עליו. דוגמא לממצא שתומך בקיומו של הלוח החזותי-מרחבי הוא (*יש להציג אחד משלושת הממצאים הבאים באופן הבא כך שיבהיר כיצד הוא תומך בקיום הלוח החזותי-מרחבי): 1. במטלת השוואת עצמים שמופיעים בזוויות סיבוב שונות מוצאים שככל שהפער בזווית הסיבוב גדול יותר כך מתארך זמן התגובה לנתינת התשובה, מה שתומך בכך שהנבדקים עורכים רוטציה מנטלית, כלומר משתמשים במסך פנימי (הלוח החזותי-מרחבי) שעל גביו הם מסובבים את הצורה. 2. נבדקים מצליחים להחזיק לזמן קצר בזכרונם תבניות חזותיות מקריות של משבצות שחורות בתוך מטריצה של משבצות, ולשחזרן לאחר כמה שניות מהופעתן. בגלל שהתבניות הן מקריות הנבדקים לא יכלו לזכור אותן באמצעות זיהוי חוקים או שמות ושמירתם בלולאה הפונולוגית, אלא באמצעות תמונה של המטריצה בזכרונם, מה שתומך בקיום הלוח החזותי-מרחבי. 3. במשימה שבה נבדקים התבקשו לשפוט את הפינות של אות שהם מדמיינים נמצא שקשה להם יותר להגיב בהצבעה על המיקום של התשובה בתוך טבלת תשובות, מאשר להגיד את התשובה בקול. ממצא זה תומך בכך שנוצרת הפרעה בין הדמיון החזותי לבין הצבעה על מיקום. מאחר שהפרעה נוצרת כאשר משימות שונות דורשות ומתחרות על אותו מנגנון, ממצא זה מחזק את ההשערה ששתי המשימות - ההצבעה על התשובה בטבלה, ודמיון האות באמצעות זיכרון העבודה - משתמשות במנגנון משותף. מאחר ששתי המשימות הן חזותיות, ניתן לשער שהמנגנון המשותף הוא חזותי, ולכן זה מחזק את הטענה שזיכרון העבודה כולל לוח חזותי-מרחבי."},{"id":"phonloop","name":"לולאה פונולוגית","one":"הקול הפנימי בראש, שחוזר על מילים כדי שלא יישכחו.","simple":"זה רכיב של זיכרון העבודה שמחזיק מידע מילולי באופן פעיל. יש בו שני חלקים. המאגר הפונולוגי שומר צלילי מילים לכמה שניות, והקיבולת שלו מוגבלת. תהליך השינון ההגייתי חוזר על המילים בראש ומונע מהן לדעוך מהמאגר.","why":"שלושה ממצאים תומכים בקיומה, ובמבחן מספיק להציג אחד ולהסביר איך הוא תומך: אפקט הדמיון הפונולוגי, אפקט אורך המילה, והשפעת הדיכוי ההגייתי.","example":"מנסים לזכור את מספר החנייה, וחוזרים עליו בלב שוב ושוב עד שמגיעים לרכב.","points":["רכיב של זיכרון העבודה (לצד הלוח החזותי-מרחבי והמנהל המרכזי) שמחזיק מידע מילולי באופן פעיל","מורכב מהמאגר הפונולוגי (קיבולת מוגבלת, שומר צלילי מילים לשניות מעטות) ומתהליך השינון ההגייתי (מונע דעיכה מהמאגר)","ממצא, אפקט הדמיון הפונולוגי: טעויות של מילה בעלת צליל דומה מראות שהמילים מוחזקות בקוד פונולוגי","ממצא, אפקט אורך המילה: מדווחים פחות מילים ארוכות, כי השינון ההגייתי (דיבור פנימי) שלהן לוקח יותר זמן","ממצא, דיכוי הגייתי: הגייה בקול של מילה לא רלוונטית פוגעת בזכירה ומבטלת את אפקט אורך המילה, כי היא פוגעת בשינון ההגייתי"],"confuse":"לוח חזותי-מרחבי: מחזיק תמונות ומיקומים, והלולאה הפונולוגית מחזיקה צלילי מילים.","original":"זהו מנגנון שהוא חלק מזיכרון העבודה (בנוסף ללוח החזותי-מרחבי ולמנהל המרכזי) והוא מיועד להחזקת מידע מילולי באופן פעיל. הוא מורכב מהמאגר הפונולוגי שקיבולתו מוגבלת והוא משמר קוד פונולוגי (כלומר צלילי מילים) למשך שניות מועטות, ומתהליך השינון ההגייתי שאחראי לשינון המונע את הדעיכה מהמאגר. להלן דוגמה לממצא שתומך בקיום הלולאה הפונולוגית (*יש להציג אחד מהממצאים הבאים באופן הבא, שמבהיר כיצד הוא תומך בקיום הלולאה הפונולוגית): 1. אפקט הדמיון הפונולוגי שהוא דפוס טעויות פונולוגי (החלפת המילה שהוצגה במילה בעלת צליל דומה) שהתקבל כשנבדקים היו צריכים להחזיק סדרות מילים בזיכרון למשך טווח זמן קצר. דפוס כזה תומך בכך שהמילים מוחזקות כצלילי דיבור, כלומר בקוד פונולוגי, ובכך מהווה תמיכה לקיומה של הלולאה הפונולוגית בזיכרון העבודה. 2. אפקט אורך המילה: כשמציגים לנבדקים רשימת מילים הם מסוגלים לדווח פחות מילים מרשימת מילים ארוכות לעומת מרשימת מילים קצרות. ממצא זה תומך בכך שהנבדקים משתמשים בתהליך השינון ההגייתי (דיבור פנימי ללא קול) להחזקת המילים בזכרונם למשך טווח זמן קצר, והם מצליחים לחזור על יותר מילים קצרות, מפני שמשך הגייתן קצר יותר. ממצא זה תומך בלולאה הפונולוגית, כיון שתהליך השינון ההגייתי הוא חלק ממנה. 3. השפעת דיכוי הגייתי: הגייה בקול של מילים לא רלוונטיות (למשל חזרה בקול על המילה \"זה\") פוגעת ביכולת לשמור מילים בזיכרון לטווח קצר, ומבטלת את אפקט אורך המילה. שתי השפעות אלה מוסברות בכך שההגייה של המילים הלא-רלוונטיות פוגעת בשינון ההגייתי (דיבור פנימי ללא קול) של המילים לזכירה. ממצא זה תומך בלולאה הפונולוגית, כיון שתהליך השינון ההגייתי הוא חלק ממנה."},{"id":"modal","name":"מודל מודאלי של הזיכרון","one":"הזיכרון כשלושה שלבים ברצף: חושי, טווח קצר, טווח ארוך.","simple":"זה המודל שהיה מקובל בשנות ה-50 וה-60, והוא השפיע מאוד על המודלים שבאו אחריו. לפיו מידע עובר שלושה מאגרים: זיכרון חושי לזמן קצרצר, זיכרון לטווח קצר לכמה שניות, וזיכרון לטווח ארוך ששומר כמות עצומה של מידע. בנוסף יש תהליכי בקרה שמעבירים מידע ביניהם.","why":"המודל מתאר את הזיכרון כמבנה של מאגרים עוקבים ותהליכי בקרה. שינון מאריך את ההחזקה בזיכרון לטווח קצר, קידוד מכניס מידע לזיכרון לטווח ארוך, ושליפה מחזירה מידע לזיכרון לטווח קצר כדי להיות מודעים אליו ולהשתמש בו.","example":"שומעים שם של מישהי, חוזרים עליו בראש כמה פעמים, ואחרי שבוע עדיין זוכרים אותו. כשפוגשים אותה שוב, השם עולה מהזיכרון.","points":["המודל המקובל בשנות ה-50 וה-60 של המאה ה-20, שהשפיע על המודלים שאחריו","שלושה רכיבים מבניים שהם שלבים עוקבים: זיכרון חושי, זיכרון לטווח קצר, זיכרון לטווח ארוך","חושי: מידע בצורתו החושית לזמן קצרצר (כמו הזיכרון האיקוני, כשנייה). טווח קצר: כמות מוגבלת של פריטים, באופן פעיל, לכמה שניות. טווח ארוך: כמות עצומה באופן סביל (זכרונות, ידע על העולם, מיומנויות)","תהליכי בקרה: שינון (מאריך את ההחזקה בטווח קצר), קידוד (מטווח קצר לטווח ארוך), שליפה (מטווח ארוך לטווח קצר)"],"confuse":"זיכרון עבודה: מפרק את השלב של הטווח הקצר לכמה מנגנונים שעובדים במקביל, ובמודל המודאלי זה מאגר אחד.","original":"זהו המודל לגבי הזיכרון שהיה מקובל בשנות החמישים והשישים של המאה העשרים והשפיע רבות על המודלים שבאו אחריו. מודל זה מחלק את הזיכרון לשלושה רכיבים מבניים שהם שלבים עוקבים: 1. הזיכרון החושי ששומר מידע בצורתו החושית לזמנים קצרצרים (למשל הזיכרון האיקוני שמחזיק את תמונת הגירוי לאחר היעלמותו למשך של שניה), 2. הזיכרון לטווח קצר ששומר כמות מוגבלת של פריטים באופן פעיל לזמן של כמה שניות, 3. הזיכרון לטווח ארוך ששומר כמות עצומה של מידע באופן סביל/רדום, ובכלל זה זכרונות מעברנו, הידע שלנו על העולם סביבנו, והמיומנויות שלמדנו. בנוסף למאגרי הזיכרון הללו המודל כולל גם תהליכי בקרה כגון תהליך השינון שהוא תהליך שבו אנו נעזרים להארכת משך הזמן של החזקת הפריטים בזיכרון לטווח קצר, תהליך הקידוד שמשמעו הכנסה וקליטה של מידע מהזיכרון לטווח קצר אל הזיכרון לטווח ארוך, ותהליך השליפה שמשמעו הוצאה של מידע מהזיכרון לטווח ארוך אל הזיכרון לטווח קצר כדי להיות מודעים אליו ולהשתמש בו באופן פעיל."},{"id":"rotation","name":"רוטציה מנטלית","one":"ככל שצורה מסובבת יותר, לוקח יותר זמן להחליט אם היא זהה לאחרת.","simple":"מראים שתי צורות בזוויות סיבוב שונות ושואלים אם הן זהות או שונות. ככל שההבדל בזווית גדול יותר, התשובה לוקחת יותר זמן. ההסבר: הנבדקים מסובבים את הצורה בראש, על מסך פנימי.","why":"כדי להגיע לזווית גדולה צריך להעביר את הצורה דרך כל הזוויות שבדרך, ולכן זה לוקח יותר זמן. כדי לסובב תמונה בזיכרון צריך לוח חזותי פנימי, ולכן הממצא תומך בקיום הלוח החזותי-מרחבי בזיכרון העבודה.","example":"בודקים בדמיון אם הספה תיכנס בדלת. מסובבים אותה בראש לאט עד הזווית המתאימה, וככל שצריך לסובב יותר זה לוקח יותר זמן.","points":["ניסוי: השוואה של שתי צורות בזוויות סיבוב שונות, האם הן זהות או שונות","ממצא: ככל שההבדל בזווית גדול יותר, זמן התגובה ארוך יותר","הסבר: הנבדקים מסובבים את הצורות ומשווים אותן חזותית על מסך פנימי, ועוברים דרך כל הזוויות עד הזווית הנדרשת","תומך בקיום הלוח החזותי-מרחבי, אחד המנגנונים במודל זיכרון העבודה"],"confuse":"לוח חזותי-מרחבי: הוא המנגנון עצמו, ורוטציה מנטלית היא הממצא וההסבר שתומכים בקיומו.","original":"זהו ההסבר לממצאים בניסוי השוואת צורות שמופיעות בזוויות סיבוב שונות, הטוען שנבדקים מבצעים זאת באמצעות סיבוב של הצורות על גבי מסך פנימי. בניסויי רוטציה מנטלית נמצא שככל שההבדל בזווית/בנטייה של שתי הצורות גדול יותר לקח לנבדקים יותר זמן להשיב אם הצורות זהות או שונות. ממתאם זה הסיקו החוקרים שהנבדקים מסובבים ומשווים את הצורות באופן חזותי, וכיון שכדי להגיע לזוית סיבוב גדולה יותר עליהם להעביר את הצורה דרך כל זויות הסיבוב עד לזווית הנדרשת, זמן התגובה מתארך ככל שגדל הפער בזווית שתי הצורות. כדי שהנבדקים יוכלו לבצע רוטציה מנטלית כזו עליהם להיות מסוגלים להתבונן בזכרונם בתמונה של הצורה מסתובבת, מה שמצריך לוח חזותי פנימי, ולכן ממצא זה תומך בקיום לוח החזותי-מרחבי שהוא אחד מהמנגנונים הכלולים במודל זיכרון העבודה."},{"id":"partial","name":"שיטת הדיווח החלקי","one":"מבקשים לדווח רק שורה אחת מהמטריצה, לפי צליל שנשמע אחרי שהיא נעלמה.","simple":"זה החלק השני בניסוי של ספרלינג. מבזיקים מטריצה של 12 אותיות בשלוש שורות. מיד אחרי שהיא נעלמת נשמע צליל באחד משלושה גבהים, והוא אומר איזו שורה לדווח. הנבדקים דיווחו בממוצע 3.3 מתוך 4 אותיות, בלי הבדל בין השורות.","why":"הנבדקים לא ידעו מראש על איזו שורה ישאלו, ולכן כנראה החזיקו את רוב האותיות ואולי את כולן. מכאן שקיבולת הזיכרון האיקוני גבוהה, אולי בלתי מוגבלת. בדיווח המלא מה שהגביל היה הדעיכה המהירה בזמן הדיווח, ולא הקיבולת.","example":"מראים לך לשנייה מדף מלא בחפצים, ואז שואלים רק על השורה העליונה. כמעט תמיד תצליחי, כך שכנראה ראית את כל המדף.","points":["החלק השני בניסוי של ספרלינג, נועד לבדוק את קיבולת הזיכרון האיקוני בלי השפעת הדעיכה בזמן הדיווח","מטריצה של 12 אותיות מוצגת לזמן קצר מדי לשינון, כך שאפשר להסתמך רק על הזיכרון האיקוני","מיד אחרי שהמטריצה נעלמת, צליל באחד משלושה גבהים מסמן איזו שורה לדווח (הרמז מקרי ומגיע אחרי ההצגה)","תוצאה: בממוצע 3.3 מתוך 4 אותיות בשורה, בלי הבדל בין השורות","מסקנה: קיבולת הזיכרון האיקוני גבוהה, אולי בלתי מוגבלת, ובדיווח המלא הגבילה הדעיכה המהירה ולא הקיבולת"],"confuse":"שיטת הדיווח המלא: שם מדווחים את כל האותיות (בממוצע 4.5 מתוך 12), וכאן רק שורה אחת שנבחרת אחרי שהמטריצה נעלמת.","original":"זהו החלק השני בניסוי של ספרלינג וחלק זה נועד לבדוק את קיבולת הזיכרון האיקוני, מתוך רצון לנטרל את ההשפעה האפשרית של דעיכת התמונה מהזיכרון האיקוני על כמות האותיות שהנבדקים מסוגלים לדווח. בחלק זה הובזקה לנבדקים מטריצה של 12 אותיות לזמן קצר מספיק בשביל שלנבדקים לא תהיה אפשרות לשנן את האותיות, כך שיוכלו להשתמש לשמירתן רק בזיכרון האיקוני שלהם. מיד לאחר היעלמות המטריצה שמעו הנבדקים צליל באחד משלושה גבהים, שהנחה אותם על איזו שורה משלוש שורות המטריצה עליהם לדווח (לכן זהו דיווח חלקי ולא דיווח מלא של כל המטריצה) בהתאם לגובה הצליל שהושמע. התוצאות שהתקבלו היו שהנבדקים דיווחו בממוצע 3.3 מתוך 4 אותיות השורה, ולא היה הבדל בין השורות. כיון שהנבדקים לא ידעו איזו שורה יתבקשו לדווח כאשר צפו באותיות (שכן הרמז השתנה באופן מקרי והושמע לאחר היעלמות מטריצת האותיות) הסיק ספרלינג מתוצאות אלה שהנבדקים שימרו בזכרונם האיקוני את רוב, ואולי אפילו כל, אותיות המטריצה, ומכאן שקיבולת הזיכרון האיקוני גבוהה, אולי אף לא מוגבלת. על סמך מסקנה זו הסיק ספרלינג שמה שהגביל את שליפת האותיות בתנאי הדיווח המלא לא היה מגבלת קיבולת, אלא הדעיכה המהירה שהתרחשה בעת דיווח האותיות."},{"id":"delayed","name":"שיטת הדיווח החלקי המושהה","one":"כמו הדיווח החלקי, אבל הצליל שאומר איזו שורה לדווח מגיע באיחור.","simple":"זה החלק השלישי בניסוי של ספרלינג. מבזיקים מטריצה של 12 אותיות. אחרי שהיא נעלמת יש השהיה באורך משתנה, ורק אז נשמע הצליל שמסמן איזו שורה לדווח. ככל שההשהיה ארוכה יותר, מדווחים פחות אותיות.","why":"הירידה בדיווח נמשכה עד השהיה של כשנייה, ורובה קרתה בחצי השנייה הראשונה. מכאן הסיק ספרלינג שמשך הזיכרון האיקוני הוא כשנייה, ושרוב הדעיכה קורית תוך כחצי שנייה.","example":"מראים לך לרגע מדף ושואלים על השורה העליונה. אם שואלים מיד, את זוכרת הרבה. אם שואלים אחרי שנייה, כבר נשאר מעט.","points":["החלק השלישי בניסוי של ספרלינג, נועד לבדוק את משך הדעיכה של הזיכרון האיקוני","מטריצה של 12 אותיות מוצגת לזמן קצר מדי לשינון, כך שאפשר להסתמך רק על הזיכרון האיקוני","אחרי שהמטריצה נעלמת יש השהיה באורך משתנה ומקרי, ואז צליל באחד משלושה גבהים מסמן איזו שורה לדווח","תוצאה: אחוז האותיות שדווחו ירד ככל שההשהיה התארכה עד לשנייה, ועיקר הירידה בחצי השנייה הראשונה","מסקנה: משך הזיכרון האיקוני הוא כשנייה, ורוב הדעיכה מתרחשת תוך כחצי שנייה"],"confuse":"שיטת הדיווח החלקי: שם הצליל מגיע מיד ובודקים קיבולת, וכאן הצליל מושהה ובודקים משך.","original":"זהו החלק השלישי בניסוי של ספרלינג וחלק זה נועד לבדוק את משך הדעיכה של הזיכרון האיקוני. בחלק זה הובזקה לנבדקים מטריצה של 12 אותיות לזמן קצר מספיק בשביל שלנבדקים לא תהיה אפשרות לשנן את האותיות כך שיוכלו להשתמש לשמירתן רק בזיכרון האיקוני שלהם. לאחר היעלמות המטריצה היתה השהייה באורך משתנה באופן מקרי, שלאחריה הושמע לנבדקים צליל באחד משלושה גבהים, שהנחה אותם איזו שורה משלושת שורות המטריצה עליהם לדווח. נמצא שאחוז האותיות שהנבדקים הצליחו לדווח מתוך השורה שסומנה להם על ידי הרמז הלך וירד ככל שהתארך משך ההשהיה של צליל הרמז עד לשניה, ועיקר הירידה באחוז הדיווח התרחשה בחצי השניה הראשונה של ההשהיה. ספרלינג הסיק מתוצאות אלה שמשך הזיכרון האיקוני הוא כשניה (כאשר מרבית הדעיכה שלו מתרחשת תוך כחצי שניה)."},{"id":"whole","name":"שיטת הדיווח המלא","one":"מבזיקים 12 אותיות ומבקשים לדווח את כולן. מצליחים בערך 4.5.","simple":"זה החלק הראשון בניסוי של ספרלינג. מבזיקים מטריצה של 12 אותיות לזמן קצר מדי לשינון. מיד אחרי שהיא נעלמת מבקשים לדווח את כל האותיות שהיו בה. בממוצע הנבדקים דיווחו 4.5 מתוך 12.","why":"חלק מהנבדקים אמרו שראו את כל האותיות, אבל הן התפוגגו מהר ולא הספיקו לדווח את כולן. לכן ספרלינג עבר לשיטת הדיווח החלקי, כדי לבדוק אם מה שהגביל את הדיווח הוא הדעיכה בזמן הדיווח ולא מגבלת קיבולת.","example":"רואים לשנייה לוח מודעות מלא, ומבקשים ממך לפרט כל מה שהיה עליו. בזמן שאת מונה שלושה ארבעה דברים, השאר כבר נמחק.","points":["החלק הראשון בניסוי של ספרלינג, נועד לבדוק את קיבולת הזיכרון האיקוני","מטריצה של 12 אותיות מוצגת לזמן קצר מדי לשינון, כך שאפשר להסתמך רק על הזיכרון האיקוני","מיד אחרי שהמטריצה נעלמת מבקשים לדווח את כל האותיות שהופיעו בה","תוצאה: בממוצע 4.5 מתוך 12 אותיות, אבל חלק מהנבדקים אמרו שראו את כולן והן התפוגגו מהר","לכן עבר ספרלינג לשיטת הדיווח החלקי, כדי לבדוק אם הגבילה הדעיכה תוך כדי הדיווח ולא מגבלת קיבולת"],"confuse":"שיטת הדיווח החלקי: שם מדווחים רק שורה אחת ומגלים שהקיבולת גבוהה, ובדיווח המלא מדווחים הכול ונראה שהקיבולת נמוכה.","original":"זהו החלק הראשון בניסוי של ספרלינג וחלק זה נועד לבדוק את קיבולת הזיכרון האיקוני. בניסוי זה הובזקה לנבדקים מטריצה של 12 אותיות לזמן קצר מספיק בשביל שלנבדקים לא תהיה אפשרות לשנן את האותיות, כך שיוכלו להשתמש לשמירתן רק בזיכרון האיקוני שלהם. מיד לאחר היעלמות המטריצה הנבדקים התבקשו לדווח מהן האותיות שהופיעו בה. הנבדקים דיווחו בממוצע 4.5 מתוך 12 אותיות. עם זאת חלק מהנבדקים דיווחו שראו את כל האותיות, אך הן התפוגגו במהירות, ולכן לא הספיקו לדווח את כולן. לכן בהמשך הניסוי השתמש ספרלינג בשיטת הדיווח החלקי כדי לבדוק אם אכן הדעיכה תוך כדי דיווח האותיות היא שהגבילה את כמות האותיות שדיווחו הנבדקים, ולא מגבלת קיבולת של הזיכרון האיקוני."}],"drill":[{"t":"wordlen","q":"נבדקת זוכרת 6 מילים מרשימה של מילים קצרות, אבל רק 4 מרשימה של מילים ארוכות. איזה מושג מתאר את זה?","o":["אפקט הדמיון הפונולוגי","אפקט אורך המילה","יצירת גושים","הפרעה למאוחר"],"a":1,"e":"אפקט אורך המילה: מרשימת מילים קצרות נזכרים ביותר מילים מאשר מרשימת מילים ארוכות."},{"t":"wordlen","q":"מה ההסבר לאפקט אורך המילה?","o":["מילים ארוכות דועכות מהר יותר מהזיכרון האיקוני","מילים ארוכות תופסות יותר מקום בלוח החזותי-מרחבי","לוקח יותר זמן לשנן בראש מילים ארוכות, ולכן באותו זמן משננים פחות מהן","מילים ארוכות מתבלבלות עם מילים קודמות ברשימה"],"a":2,"e":"ההסבר הוא השינון ההגייתי בלולאה הפונולוגית: הגייה פנימית של מילה ארוכה לוקחת יותר זמן."},{"t":"wordlen","q":"במה תומך אפקט אורך המילה?","o":["בקיום הלוח החזותי-מרחבי","בהסבר הדעיכה לניסוי השלשות","בכך שקיבולת הזיכרון לטווח קצר היא 4 פריטים","בקיום הלולאה הפונולוגית, כמנגנון שמחזיק מידע כצלילי מילים"],"a":3,"e":"זה אחד משלושה ממצאים שתומכים בלולאה הפונולוגית, יחד עם אפקט הדמיון הפונולוגי ודיכוי הגייתי."},{"t":"phonsim","q":"נבדק ראה את הסדרה B, F, K וחזר עליה מיד כ-P, S, K. איזה מושג מתאר את סוג הטעות?","o":["אפקט הדמיון הפונולוגי","אפקט אורך המילה","דיכוי הגייתי","הפרעה למאוחר"],"a":0,"e":"הטעויות הן החלפה של אות באות ששמה נשמע דומה, וזה אפקט הדמיון הפונולוגי."},{"t":"phonsim","q":"איזו טענה נכונה לגבי אפקט הדמיון הפונולוגי?","o":["הטעויות מופיעות רק כשהאותיות מושמעות, לא כשהן מוצגות לעיניים","הטעויות דומות לטעויות בזיהוי אות שהושמעה על רקע רעש","הטעויות הן בעיקר החלפה של אות באות שנראית דומה","האפקט נעלם כשמבקשים לחזור על האותיות מיד"],"a":1,"e":"הטעויות זהות לטעויות בשמיעת אות על רקע רעש, והן מופיעות גם כשהאותיות הוצגו חזותית."},{"t":"phonsim","q":"מה מראה אפקט הדמיון הפונולוגי?","o":["שהזיכרון לטווח קצר מוגבל לכ-4 פריטים","שמידע ישן מפריע לזכירת מידע חדש","שהמילים נשמרות בזיכרון לטווח קצר בקוד צלילי, גם כשהוצגו חזותית","שהזיכרון האיקוני דועך תוך חצי שנייה"],"a":2,"e":"הטעויות של צליל דומה מעידות על קוד פונולוגי, ולכן האפקט תומך בלולאה הפונולוגית."},{"t":"changedet","q":"מבזיקים לנבדקת תמונה עם ריבועים צבעוניים, אחריה מסך חשוך לשנייה ואז תמונה נוספת. היא צריכה להגיד אם ריבוע שינה צבע. מה השיטה?","o":["שיטת הדיווח החלקי","רוטציה מנטלית","שיטת הדיווח החלקי המושהה","גילוי שינויים"],"a":3,"e":"בגילוי שינויים מציגים שתי תמונות זו אחר זו והמשימה היא לזהות אם חל ביניהן שינוי."},{"t":"changedet","q":"למה מוצג מסך חשוך של כשנייה בין שתי התמונות בגילוי שינויים?","o":["כדי שהזיכרון האיקוני ידעך וייבדק רק הזיכרון לטווח קצר","כדי למנוע שינון הגייתי של הצבעים","כדי לגרום להפרעה למאוחר מהתמונה הראשונה","כדי לאפשר לנבדקים ליצור גושים"],"a":0,"e":"בשנייה הזאת הזיכרון האיקוני אמור לדעוך, ולכן הנבדקים יכולים להסתמך רק על הזיכרון לטווח קצר."},{"t":"changedet","q":"איזה ממצא מגילוי שינויים לא מתאים למה שנמצא?","o":["הצלחה טובה בגילוי שינוי בתצוגות של עד 4 ריבועים","ירידה בהצלחה כשמספר הפריטים עולה מעבר ל-4","ככל שהגירויים מורכבים יותר, מצליחים לגלות שינוי בפחות פריטים","בגירויים מורכבים הקיבולת עולה אל מעל 4 פריטים"],"a":3,"e":"בגירויים מורכבים הקיבולת יורדת, אף מתחת ל-4, ולכן המגבלה היא על כמות המידע."},{"t":"artsupp","q":"נבדקת חוזרת בקול על \"זה, זה, זה\" בזמן שמוצגת לה רשימת מילים, ואחר כך טועה יותר בסדר המילים. מה ההליך?","o":["אפקט הדמיון הפונולוגי","דיכוי הגייתי","הפרעה למאוחר","שיטת הדיווח החלקי"],"a":1,"e":"דיכוי הגייתי הוא חזרה בקול על צליל לא רלוונטי בזמן הלמידה, והוא פוגע בהיזכרות לפי הסדר."},{"t":"artsupp","q":"מה קורה לאפקט אורך המילה תחת דיכוי הגייתי?","o":["הוא מתחזק, כי מילים ארוכות קשות יותר להגייה","הוא נשאר רק בהצגה שמיעתית","הוא נעלם, גם בהצגה חזותית וגם בהצגה שמיעתית","הוא מתהפך: זוכרים יותר מילים ארוכות"],"a":2,"e":"הדיכוי חוסם את השינון ההגייתי, ולכן מתבטל היתרון של ההגייה המהירה של מילים קצרות."},{"t":"artsupp","q":"למה הדיכוי ההגייתי פוגע בזכירה?","o":["הוא מעסיק את תהליך השינון ההגייתי, ולכן אי אפשר לשנן בו את המילים","הוא מוחק את הזיכרון האיקוני של המילים","הוא תופס את הלוח החזותי-מרחבי","הוא יוצר הפרעה למוקדם מהמילים החדשות"],"a":0,"e":"החזרה בקול מעסיקה את השינון ההגייתי של הלולאה הפונולוגית, וזה תומך בקיום הלולאה."},{"t":"proactive","q":"בניסוי השלשות, ככל שההסחה ארוכה יותר זוכרים פחות את השלשה, אבל את השלשה הראשונה זוכרים טוב גם אחרי הסחה ארוכה. איזה הסבר מתאים לזה?","o":["דעיכה מהזיכרון לטווח קצר","הפרעה למוקדם","דיכוי הגייתי","הפרעה למאוחר"],"a":3,"e":"השלשות הקודמות מפריעות לזכירת השלשה הנוכחית, ולפני השלשה הראשונה אין שלשות שיפריעו."},{"t":"proactive","q":"מהי הפרעה למאוחר?","o":["מידע שנלמד קודם מפריע לזכור מידע שנלמד אחריו","מידע שנלמד אחר כך מפריע לזכור מידע שנלמד קודם","מידע דועך מהזיכרון לטווח קצר עם הזמן","מילה מתבלבלת עם מילה שנשמעת דומה"],"a":0,"e":"בהפרעה למאוחר הישן מפריע לחדש. ההפך, חדש שמפריע לישן, הוא הפרעה למוקדם."},{"t":"proactive","q":"איזה ממצא הוא החיזוק להסבר ההפרעה למאוחר, בניגוד להסבר הדעיכה?","o":["ככל שההסחה ארוכה יותר, הזכירה יורדת","גם השלשה הראשונה נשכחה אחרי הסחה ארוכה","השלשה הראשונה נזכרה היטב גם אחרי הסחה ארוכה","נבדקים זכרו יותר שלשות קצרות"],"a":2,"e":"אם הייתה דעיכה, גם הראשונה הייתה נשכחת. היא נזכרה כי לפניה אין שלשות שמפריעות."},{"t":"iconic","q":"מסובבים זיקוק דולק במהירות ורואים עיגול של אור. איזה מושג מסביר את זה?","o":["זיכרון לטווח קצר","זיכרון איקוני","לוח חזותי-מרחבי","רוטציה מנטלית"],"a":1,"e":"הזיכרון האיקוני מתבטא בהתמשכות החזותית: ממשיכים לחוות גירוי חזותי רגע אחרי שנעלם."},{"t":"iconic","q":"מה המסקנה מניסוי ספרלינג לגבי הזיכרון האיקוני?","o":["קיבולת של 7 פלוס מינוס 2 פריטים ומשך של כ-15-20 שניות","קיבולת של 4 פריטים ומשך של כשנייה","קיבולת נמוכה מאוד ומשך ארוך","קיבולת גבוהה, אולי בלתי מוגבלת, ומשך של כשנייה"],"a":3,"e":"הקיבולת גבוהה, אבל התמונה נשמרת כשנייה ודועכת בעיקר בחצי השנייה הראשונה."},{"t":"iconic","q":"מה המקום של הזיכרון האיקוני במודל המודאלי?","o":["השלב הראשון: זיכרון חושי חזותי","השלב השני: זיכרון לטווח קצר","תהליך בקרה שמעביר מידע לזיכרון לטווח ארוך","רכיב של זיכרון העבודה"],"a":0,"e":"הזיכרון האיקוני הוא זיכרון חושי חזותי, השלב הראשון בכניסה לזיכרון לפי המודל המודאלי."},{"t":"stm","q":"קיבלת קוד של שש ספרות, את מחזיקה אותו בראש עד שאת מקלידה, ואז הוא נעלם. באיזה מאגר הוא הוחזק?","o":["זיכרון איקוני","זיכרון לטווח ארוך","זיכרון לטווח קצר","מאגר אפיזודי"],"a":2,"e":"הזיכרון לטווח קצר שומר כמה פריטים לכמה שניות, וזה המידע שחושבים עליו עכשיו."},{"t":"stm","q":"מה משך הזיכרון לטווח קצר כשלא משננים את המידע?","o":["כשנייה","כ-15-20 שניות","כמה דקות","ללא הגבלה"],"a":1,"e":"לפי הניסוי של בראון ופטרסון עם השלשות וההסחה, בלי שינון המשך הוא כ-15-20 שניות."},{"t":"stm","q":"איזו טענה נכונה לגבי קיבולת הזיכרון לטווח קצר?","o":["היא תמיד בדיוק 7 פריטים","היא גבוהה ואולי בלתי מוגבלת","היא לא משתנה גם כשיוצרים גושים","היא כמה פריטים בודדים, ונכון יותר להגדיר אותה לפי כמות מידע"],"a":3,"e":"הממצאים נעו מפחות מ-2 פריטים מורכבים ועד כ-9 ספרות, ולכן נכון להגדיר לפי כמות מידע."},{"t":"wm","q":"מה ההבדל המרכזי בין זיכרון עבודה לזיכרון לטווח קצר?","o":["זיכרון העבודה גם מעבד מידע ובנוי מכמה מנגנונים שפועלים במקביל","זיכרון העבודה שומר מידע לזמן ארוך יותר","זיכרון העבודה הוא זיכרון חושי","זיכרון העבודה מחזיק רק מידע חזותי"],"a":0,"e":"זיכרון העבודה הוא פיתוח של הזיכרון לטווח קצר: לא רק שמירה, אלא גם עיבוד דינאמי בכמה מנגנונים."},{"t":"wm","q":"מה תפקיד המנהל המרכזי בזיכרון העבודה?","o":["לשמור מידע מילולי בקוד פונולוגי","להחזיק תמונה על מסך מנטלי","לנהל את העברת המידע לשני המנגנונים, לסנן ולהכניס מידע, ולהעביר לזיכרון לטווח ארוך","לשמור את התמונה החזותית כשנייה אחרי שנעלמה"],"a":2,"e":"המנהל המרכזי מנהל את המידע ללולאה ולוח, מסנן מידע מהחושים ומהזיכרון לטווח ארוך ומעביר לטווח ארוך."},{"t":"wm","q":"איזה רכיב נוסף בגרסה המעודכנת של מודל זיכרון העבודה?","o":["הלולאה הפונולוגית","המאגר האפיזודי","הלוח החזותי-מרחבי","הזיכרון האיקוני"],"a":1,"e":"במודל המקורי היו שלושה רכיבים, ובגרסה המעודכנת נוסף רכיב רביעי: המאגר האפיזודי."},{"t":"chunking","q":"נבדקת זוכרת רצף של 12 ספרות כי היא מחלקת אותו לשלושה מספרים מוכרים. איזה תהליך היא מפעילה?","o":["שינון הגייתי","רוטציה מנטלית","הפרעה למאוחר","יצירת גושים"],"a":3,"e":"יצירת גושים מחברת פריטים עוקבים ליחידה גדולה יותר, ולכן מחזיקים יותר פריטים."},{"t":"chunking","q":"איזו טענה נכונה לגבי גוש?","o":["הפריטים בתוכו קשורים חזק זה לזה, וחלש לפריטים בגושים אחרים","הפריטים בתוכו נשמרים בלוח החזותי-מרחבי","הגוש מקטין את כמות הפריטים שאפשר להחזיק","הפריטים בתוכו מפריעים לשליפה זה של זה"],"a":0,"e":"גוש הוא אוסף פריטים עם קשר חזק ביניהם, והקשר הזה עוזר לשלוף אותם זה בעזרת זה."},{"t":"chunking","q":"על מה מתבסס פעמים רבות חיבור מילים לגוש?","o":["על דמיון בצליל בין המילים","על קשר שיש בין המילים בזיכרון לטווח ארוך","על התמונה שנשארה בזיכרון האיקוני","על אורך המילים"],"a":1,"e":"החיבור בזיכרון לטווח קצר מבוסס הרבה פעמים על קשר שכבר קיים בין המילים בזיכרון לטווח ארוך."},{"t":"vssp","q":"נבדקים זוכרים תבנית מקרית של משבצות שחורות במטריצה. למה זה תומך דווקא בלוח החזותי-מרחבי?","o":["כי התבנית דועכת תוך חצי שנייה","כי נוצרת הפרעה למאוחר מתבניות קודמות","כי התבנית מקרית, אין לה חוק או שם לשמור בלולאה הפונולוגית, ולכן זוכרים אותה כתמונה","כי התבנית מחולקת לגושים לפי צבע"],"a":2,"e":"אי אפשר לתרגם תבנית מקרית למילים, ולכן היא נשמרת כתמונה, וזה תומך בלוח החזותי-מרחבי."},{"t":"vssp","q":"בשיפוט פינות של אות מדומיינת, קשה יותר להצביע על תשובה בטבלה מאשר לענות בקול. מה זה מראה?","o":["שהלולאה הפונולוגית מחזיקה את צורת האות","ששתי המשימות החזותיות מתחרות על אותו מנגנון חזותי","שקיבולת הזיכרון האיקוני גבוהה","שהצבעה מעסיקה את השינון ההגייתי"],"a":1,"e":"הפרעה נוצרת כשמשימות מתחרות על אותו מנגנון. שתיהן חזותיות, ולכן המנגנון המשותף הוא הלוח החזותי-מרחבי."},{"t":"vssp","q":"מה צריך להופיע בהגדרה מלאה של הלוח החזותי-מרחבי?","o":["רכיב בזיכרון העבודה שמחזיק מידע חזותי ומרחבי לזמן קצר ומעבד אותו, וממצא אחד שתומך בו","זיכרון חושי חזותי שמשמר תמונה כשנייה, וניסוי ספרלינג","מאגר ששומר צלילי מילים, ואפקט אורך המילה","מודל משנות ה-50 עם שלושה שלבים עוקבים"],"a":0,"e":"ההגדרה: רכיב של זיכרון העבודה למידע חזותי ומרחבי, ועוד ממצא תומך עם הסבר איך הוא תומך."},{"t":"phonloop","q":"משהו בזיכרון העבודה מחזיק מילים כצלילים וחוזר עליהן בדיבור פנימי כדי שלא ידעכו. איזה רכיב זה?","o":["המנהל המרכזי","הלוח החזותי-מרחבי","המאגר האפיזודי","הלולאה הפונולוגית"],"a":3,"e":"הלולאה הפונולוגית בנויה ממאגר פונולוגי ששומר צלילי מילים ומשינון הגייתי שמונע דעיכה."},{"t":"phonloop","q":"מאילו שני חלקים בנויה הלולאה הפונולוגית?","o":["זיכרון איקוני וזיכרון לטווח קצר","מאגר פונולוגי ותהליך השינון ההגייתי","מנהל מרכזי ומאגר אפיזודי","קידוד ושליפה"],"a":1,"e":"המאגר הפונולוגי שומר קוד צלילי לשניות מעטות, והשינון ההגייתי מונע את הדעיכה ממנו."},{"t":"phonloop","q":"איזה ממצא לא תומך בקיום הלולאה הפונולוגית?","o":["טעויות של החלפת מילה במילה בעלת צליל דומה","זוכרים פחות מילים ארוכות מאשר קצרות","זמן התגובה מתארך ככל שגדל פער זווית הסיבוב של צורות","חזרה בקול על \"זה\" פוגעת בזכירה ומבטלת את אפקט אורך המילה"],"a":2,"e":"פער זווית הסיבוב הוא רוטציה מנטלית, והוא תומך בלוח החזותי-מרחבי ולא בלולאה הפונולוגית."},{"t":"modal","q":"לפי איזה מודל מידע עובר מזיכרון חושי, לזיכרון לטווח קצר ואז לזיכרון לטווח ארוך?","o":["המודל המודאלי של הזיכרון","מודל זיכרון העבודה","מודל הלולאה הפונולוגית","הסבר ההפרעה למאוחר"],"a":0,"e":"המודל המודאלי מחלק את הזיכרון לשלושה רכיבים מבניים שהם שלבים עוקבים."},{"t":"modal","q":"במודל המודאלי, מה פירוש תהליך הקידוד?","o":["הוצאת מידע מהזיכרון לטווח ארוך לזיכרון לטווח קצר","הארכת ההחזקה של פריטים בזיכרון לטווח קצר","שמירת התמונה החזותית אחרי שנעלמה","הכנסה של מידע מהזיכרון לטווח קצר אל הזיכרון לטווח ארוך"],"a":3,"e":"קידוד מכניס מידע מטווח קצר לטווח ארוך. שליפה היא הכיוון ההפוך, ושינון מאריך את ההחזקה."},{"t":"modal","q":"איזו טענה נכונה לגבי הזיכרון לטווח ארוך במודל המודאלי?","o":["הוא שומר כמה פריטים באופן פעיל לכמה שניות","הוא שומר כמות עצומה של מידע באופן סביל, כולל זכרונות, ידע ומיומנויות","הוא שומר את המידע בצורתו החושית","הוא השלב הראשון בכניסת מידע"],"a":1,"e":"הזיכרון לטווח ארוך שומר כמות עצומה באופן סביל/רדום. שמירה פעילה לכמה שניות היא הטווח הקצר."},{"t":"rotation","q":"נבדקת צריכה להחליט אם שתי צורות זהות. כשאחת מסובבת ב-120 מעלות היא עונה לאט יותר מאשר כשהיא מסובבת ב-40 מעלות. מה ההסבר?","o":["אפקט הדמיון הפונולוגי","יצירת גושים","רוטציה מנטלית","הפרעה למאוחר"],"a":2,"e":"ברוטציה מנטלית מסובבים את הצורה בראש, ולכן פער זווית גדול יותר דורש יותר זמן."},{"t":"rotation","q":"למה זמן התגובה מתארך כשפער הזווית גדל?","o":["כי צריך להעביר את הצורה דרך כל זוויות הסיבוב עד הזווית הנדרשת","כי צורה מסובבת דועכת מהר יותר מהזיכרון האיקוני","כי קשה יותר לתת שם לצורה מסובבת","כי צורות מסובבות מתבלבלות עם צורות קודמות"],"a":0,"e":"הנבדקים מסובבים את הצורה על מסך פנימי ועוברים דרך כל הזוויות, ולכן זווית גדולה לוקחת יותר זמן."},{"t":"rotation","q":"בקיום איזה מנגנון תומכת הרוטציה המנטלית?","o":["הלולאה הפונולוגית","הזיכרון האיקוני","המנהל המרכזי","הלוח החזותי-מרחבי"],"a":3,"e":"כדי לסובב תמונה בזיכרון צריך לוח חזותי פנימי, ולכן זה תומך בלוח החזותי-מרחבי."},{"t":"partial","q":"מבזיקים 12 אותיות, ומיד אחרי שהן נעלמות צליל גבוה אומר לנבדק לדווח רק את השורה העליונה. מה השיטה?","o":["שיטת הדיווח המלא","שיטת הדיווח החלקי","שיטת הדיווח החלקי המושהה","גילוי שינויים"],"a":1,"e":"בדיווח החלקי צליל שמגיע מיד אחרי ההצגה מסמן איזו שורה לדווח."},{"t":"partial","q":"מה התוצאה בשיטת הדיווח החלקי?","o":["בממוצע 4.5 מתוך 12 אותיות","ירידה בדיווח ככל שהצליל מגיע מאוחר יותר","בממוצע 3.3 מתוך 4 אותיות בשורה, בלי הבדל בין השורות","דיווח טוב רק בשורה העליונה"],"a":2,"e":"הנבדקים דיווחו 3.3 מתוך 4 בכל שורה, למרות שלא ידעו מראש על איזו שורה ישאלו."},{"t":"partial","q":"מה הסיק ספרלינג מהדיווח החלקי?","o":["שקיבולת הזיכרון האיקוני גבוהה, ובדיווח המלא הגבילה הדעיכה המהירה ולא הקיבולת","שקיבולת הזיכרון האיקוני היא כ-4.5 אותיות","שמשך הזיכרון האיקוני הוא כ-15-20 שניות","שהאותיות נשמרות בקוד פונולוגי"],"a":0,"e":"אם מכל שורה מקרית מדווחים כמעט הכול, כנראה כל המטריצה נשמרה, ולכן הקיבולת גבוהה."},{"t":"delayed","q":"מבזיקים 12 אותיות, ואחרי השהיה משתנה נשמע צליל שמסמן איזו שורה לדווח. ככל שההשהיה ארוכה יותר, מדווחים פחות. מה השיטה?","o":["שיטת הדיווח החלקי","גילוי שינויים","שיטת הדיווח המלא","שיטת הדיווח החלקי המושהה"],"a":3,"e":"בדיווח החלקי המושהה צליל הרמז מגיע אחרי השהיה, כדי לבדוק כמה זמן הזיכרון האיקוני מחזיק."},{"t":"delayed","q":"מה נועדה לבדוק שיטת הדיווח החלקי המושהה?","o":["את קיבולת הזיכרון האיקוני","את משך הדעיכה של הזיכרון האיקוני","את קיבולת הזיכרון לטווח קצר החזותי","את ההפרעה בין שורות המטריצה"],"a":1,"e":"זה החלק השלישי בניסוי של ספרלינג, והוא בודק משך. שני החלקים הראשונים בדקו קיבולת."},{"t":"delayed","q":"איזו תוצאה מתאימה לדיווח החלקי המושהה?","o":["הדיווח ירד ככל שההשהיה התארכה עד כשנייה, ורוב הירידה בחצי השנייה הראשונה","הדיווח לא השתנה עם ההשהיה","הדיווח ירד רק אחרי השהיה של 15 שניות","הדיווח עלה ככל שההשהיה התארכה"],"a":0,"e":"מכאן הסיק ספרלינג שהזיכרון האיקוני נמשך כשנייה, ורוב הדעיכה קורית תוך כחצי שנייה."},{"t":"whole","q":"מבזיקים 12 אותיות ומבקשים לדווח את כולן מיד. הנבדקים מדווחים בממוצע 4.5. מה השיטה?","o":["שיטת הדיווח החלקי","שיטת הדיווח החלקי המושהה","שיטת הדיווח המלא","גילוי שינויים"],"a":2,"e":"בדיווח המלא מבקשים לדווח את כל האותיות שהופיעו, והתוצאה הייתה 4.5 מתוך 12."},{"t":"whole","q":"מה גרם לספרלינג לעבור משיטת הדיווח המלא לשיטת הדיווח החלקי?","o":["הנבדקים דיווחו יותר אותיות ממה שהוצג","נבדקים אמרו שראו את כל האותיות, אבל הן התפוגגו לפני שהספיקו לדווח","הנבדקים הצליחו לשנן את האותיות","נמצא הבדל גדול בין השורות"],"a":1,"e":"הוא רצה לבדוק אם הדעיכה בזמן הדיווח, ולא מגבלת קיבולת, היא שהגבילה את כמות האותיות."},{"t":"whole","q":"למה המטריצה בדיווח המלא מוצגת לזמן קצר מאוד?","o":["כדי למדוד את משך הזיכרון האיקוני","כדי לגרום להפרעה למאוחר","כדי לבדוק רוטציה מנטלית של האותיות","כדי שלא יהיה אפשר לשנן את האותיות, וישתמשו רק בזיכרון האיקוני"],"a":3,"e":"ההצגה הקצרה מונעת שינון, כך שהדיווח מסתמך רק על הזיכרון האיקוני."}]},{"ch":"c6","title":"פרק 6: מבנה הזיכרון לטווח ארוך","terms":[{"id":"recency","name":"אפקט האחרונות","one":"את המילים האחרונות ברשימה זוכרים טוב יותר מאלה שבאמצע.","simple":"מקריאים לנבדקים רשימת מילים, ומיד אחר כך הם כותבים כל מה שהם זוכרים. המילים האחרונות נזכרות טוב יותר מהמילים שבאמצע. ככל שמילה קרובה יותר לסוף הרשימה, הסיכוי לזכור אותה גדל.","why":"ההסבר: המילים האחרונות נשלפות מהזיכרון לטווח קצר, כי הן עוד לא הספיקו לדעוך ממנו. החיזוק: מטלת הסחה מיד אחרי הרשימה מבטלת את האפקט, כי בזמן ההסחה המילים דועכות מהזיכרון לטווח קצר.","example":"חברה מכתיבה לך רשימת קניות ארוכה בטלפון. כשאת מנסה לחזור עליה מיד, הדברים האחרונים שהיא אמרה עוד \"מהדהדים\" לך בראש.","points":["אחד משני האפקטים במטלת המיקום הסדרתי (השני: אפקט הראשונות)","זכירה טובה יותר של הפריטים האחרונים לעומת האמצעיים, במגמה עולה לקראת סוף הרשימה","הסבר: הפריטים האחרונים נשלפים מהזיכרון לטווח קצר, וככל שהפריט מאוחר יותר הוא דעך פחות","חיזוק: מטלת הסחה מיד אחרי הרשימה מבטלת את אפקט האחרונות"],"confuse":"אפקט הראשונות: שם מדובר בפריטים הראשונים, שנשלפים מהזיכרון לטווח ארוך בזכות שינון. כאן מדובר בפריטים האחרונים, מהזיכרון לטווח קצר.","original":"זהו אחד משני האפקטים במטלת המיקום הסדרתי (הממצא השני הוא אפקט הראשונות), שמשמעו הוא הזכירה הטובה יותר של הפריטים האחרונים בהשוואה לפריטים האמצעיים. במטלה זו מוצגת לנבדקים רשימת פריטים (מילים, אותיות וכו') ומיד לאחר השמעתה הם מתבקשים לדווח את כל מה שהם זוכרים ממנה. נמצא שבפריטים האחרונים שהופיעו ברשימה יש מגמה עולה של סיכויי הזכירה כך שככל שהפריט קרוב יותר לסוף הרשימה כך סיכויי הזכירה שלו גדלים. ההסבר שהוצג בספר לאפקט האחרונות הוא שהפריטים האחרונים נשלפים מהזיכרון לטווח קצר וככל שהפריט קרוב יותר לסוף הרשימה כך הוא הספיק לדעוך פחות מהזט\"ק ולכן סיכויי השליפה שלו טובים יותר. הממצא שחיזק הסבר זה הוא שכאשר הנבדקים מבצעים מטלת הסחה מיד אחרי שמיעת הרשימה ואז שולפים את מילות הרשימה זה מבטל את אפקט האחרונות, וזה מה שצפוי אם יתרונם מלכתחילה נבע מהזט\"ק (כיון שבזמן מטלת ההסחה הם דעכו מהזט\"ק)."},{"id":"primacy","name":"אפקט הראשונות","one":"את המילים הראשונות ברשימה זוכרים טוב יותר מאלה שבאמצע.","simple":"מקריאים רשימת מילים, ומיד אחר כך הנבדקים מדווחים מה הם זוכרים. המילים הראשונות נזכרות טוב יותר מהמילים שבאמצע. ככל שמילה רחוקה יותר מתחילת הרשימה, הסיכוי לזכור אותה קטן.","why":"ההסבר הוא שינון: המילה הראשונה מקבלת שינון לבד, השנייה משותפת עם הראשונה, וכן הלאה. לכן המילים הראשונות מקבלות יותר שינון ונכנסות לזיכרון לטווח ארוך. החיזוק: כששיננו בקול, מספר החזרות על כל מילה ירד בדיוק כמו אחוז הזכירה.","example":"ביום הראשון בעבודה חדשה מציגים לך עשרה אנשים. את השם של הראשון חזרת עליו בראש כמה פעמים, ולכן הוא נשאר.","points":["אחד משני האפקטים במטלת המיקום הסדרתי (השני: אפקט האחרונות)","זכירה טובה יותר של הפריטים הראשונים לעומת האמצעיים, במגמה יורדת מתחילת הרשימה","הסבר השינון: הפריטים הראשונים מקבלים יותר שינון ולכן נשלפים מהזיכרון לטווח ארוך","חיזוק: בשינון בקול, מספר החזרות על מילה ירד בפריטים הראשונים בהתאמה לירידה בזכירה"],"confuse":"אפקט האחרונות: שם הפריטים האחרונים נשלפים מהזיכרון לטווח קצר, והסחה מבטלת אותו. בראשונות ההסבר הוא שינון לזיכרון לטווח ארוך.","original":"זהו אחד משני האפקטים במטלת המיקום הסדרתי (הממצא השני הוא אפקט האחרונות), שמשמעו הוא הזכירה הטובה יותר של הפריטים הראשונים בהשוואה לפריטים האמצעיים. במטלה זו מוצגת לנבדקים רשימת פריטים (מילים, אותיות וכו') ומיד לאחר השמעתה הם מתבקשים לדווח את כל מה שהם זוכרים. נמצא שבתוך הפריטים שהופיעו ראשונים ברשימה יש מגמה יורדת של סיכויי הזכירה כך שככל שהפריט רחוק יותר מתחילת הרשימה כך סיכויי הזכירה שלו קטנים. ההסבר שהוצג בספר לאפקט הראשונות הוא הסבר השינון לזיכרון לטווח ארוך, שעל פיו הפריטים הראשונים נשלפים מהזיכרון לטווח ארוך (זט\"א) וככל שהפריט קרוב יותר לתחילת הרשימה כך הוא מקבל יותר זמן שינון (ולכן סיכוייו להיכנס לזט\"א גדולים יותר): הפריט הראשון מקבל שינון לבד, את הפריט השני משננים במקביל להמשך שינון הפריט הראשון וכו', ולכן הצלחת השליפה יורדת בפריטים הראשונים. הממצא שחיזק הסבר זה הוא שכאשר הנבדקים שיננו בקול את המילים, נמצא שכמות הפעמים שחזרו על מילה ירדה בפריטים הראשונים בהתאמה לירידת הצלחת שליפתם. התאמה זו בין כמות השינון לאחוז הזכירה תומכת בכך שכמות השינון של כל מילה (פרט למילים האחרונות) היא מה שקובע את הצלחת זכירת המילה."},{"id":"repetition-priming","name":"הטרמה על ידי חזרה","one":"מילה שכבר ראית קודם קל לך יותר להשלים, גם אם את לא זוכרת שראית אותה.","simple":"בשלב הלמידה חלק מהנבדקים רואים מילים מסוימות וחלק לא. בשלב המבחן כולם עושים מטלה, למשל משלימים התחלות של מילים, בלי שמבקשים מהם להיזכר במשהו. מי שראה את המילה קודם מצליח בה יותר. היתרון הזה הוא ההטרמה על ידי חזרה.","why":"זהו ממצא של מבחני זיכרון חבוי. אצל אמנזים גודל ההטרמה היה זהה לקבוצות הביקורת, אף שהם זכרו הרבה פחות במבחן הגלוי. זה מראה שהזיכרון החבוי לא תלוי בזיכרון הגלוי.","example":"שמעת ברדיו שיר ברקע בלי לשים לב. אחר כך בתשבץ יש רמז, והמילה מהשיר קופצת לך ראשונה, בלי שאת יודעת למה.","points":["ממצא במבחני זיכרון חבוי: בשלב המבחן מגיבים לגירוי שמול העיניים, בלי צורך להיזכר בשלב הלמידה","משווים ביצועים לגירויים שהוטרמו (הוצגו קודם) מול אותם גירויים כשלא הוטרמו","ההטרמה היא יתרון הביצוע לגירויים שהוטרמו. דוגמאות למטלות: השלמת התחלות מילים, זיהוי אם מילה מובזקת היא בת 4 אותיות","אצל אמנזים גודל ההטרמה זהה לביקורת למרות זיכרון גלוי פגוע, ולכן זיכרון חבוי לא תלוי בגלוי"],"confuse":"זיכרון פרוצדורלי: גם הוא חלק מהזיכרון החבוי, אבל מדובר במיומנויות שנרכשות בהדרגה. בהטרמה מדובר בהשפעה של חשיפה קודמת לגירוי מסוים.","original":"זהו הממצא המתקבל במבחני זיכרון חבוי שמה שמייחד אותם הוא שבשלב המבחן הנבדקים מגיבים לגירויים שמופיעים מולם באותו רגע, מבלי שיידרשו או יזדקקו להיזכר בגירויים שהוצגו להם שלב הלמידה בפרט. החוקרים כוללים בשלב המבחן גירויים שהוצגו לחלק מהנבדקים בשלב הלמידה (ולכן הם \"גירויים שהוטרמו\"), ושלא הוצגו לשאר הנבדקים (\"גירויים שלא הוטרמו\"), ומשווים את הביצועים לגביהם. ההטרמה ע\"י חזרה היא היתרון בביצועים במבחן עבור הגירויים כשהוטרמו לעומת אותם הגירויים כשלא הוטרמו. בספר הוצגו שתי דוגמאות למטלות שמשמשות כמבחני זיכרון חבוי: השלמת התחלות מילים, וזיהוי האם מילה מובזקת היא בת 4 אותיות או לא. בניסוי שתואר בפרק, אפקט ההטרמה על ידי חזרה היה אחוז ההשלמה למילה מסוימת שהיה גדול יותר כשמילה זו הוצגה קודם, כלומר הוטרמה, לעומת כשלא הופיעה קודם. בניסוי נמצא שגודל אפקט ההטרמה ע\"י חזרה אצל האמנזים היה זהה לשתי קבוצות הביקורת, למרות שהצלחתם במבחן הזיכרון הגלוי (הצלחתם להיזכר בגירויים שהוצגו להם) היה אצלם נמוך משמעותית בהשוואה לקבוצות הביקורת. ניסוי זה תומך בכך שהזיכרון החבוי, המתבטא באפקט ההטרמה ע\"י חזרה, הוא בלתי תלוי בזיכרון הגלוי."},{"id":"remember-know","name":"הליך זוכר/יודע","one":"על כל פרט שואלים: את זוכרת את הרגע, או רק יודעת את העובדה?","simple":"זו שיטה לבדוק אם מידע נשלף מהזיכרון האפיזודי או מהזיכרון הסמנטי. על כל פרט שנחשף אליו קודם, הנבדק אומר אם הוא \"זוכר\" אותו או רק \"יודע\" אותו. \"זוכר\" אומר שהוא חוזר לרגע עצמו עם ההקשר. \"יודע\" אומר שהוא מכיר את הפרט, בלי לזכור מתי ואיפה נחשף אליו.","why":"ההליך מבדיל בין שני חלקי הזיכרון הגלוי. בעזרתו נמצאה הסמנטיזציה של זכרונות מהעבר הרחוק: ככל שעובר יותר זמן מאירוע, יש פחות תחושות \"זוכר\" ויותר תחושות \"יודע\".","example":"את זוכרת בדיוק איפה ישבת כששמעת שעברת את מבחן הנהיגה. לעומת זאת, את רק יודעת שנולדת בבית חולים מסוים, בלי שום זיכרון של הרגע.","points":["מטרה: להבחין אם שולפים מהזיכרון האפיזודי או מהסמנטי (שני מרכיבי הזיכרון הגלוי/המוצהר)","הנבדק אומר על כל פרט שנחשף אליו אם הוא \"זוכר\" (אפיזודי) או רק \"יודע\" (סמנטי)","אפיזודי: שחזור האפיזודה עם ההקשר שלה. סמנטי: שליפת הפרט בלבד ממאגר הידע, בלי מסע בזמן ובלי הקשר","בעזרתו נמצאה סמנטיזציה של זכרונות מהעבר הרחוק: עם הזמן פחות \"זוכר\" ויותר \"יודע\""],"confuse":"סמנטיזציה של זכרונות מהעבר הרחוק: זו התופעה שנמצאה. הליך זוכר/יודע הוא הכלי שבעזרתו מצאו אותה.","original":"זהו הליך שנועד להבחין האם אנו שולפים מידע מהזיכרון האפיזודי או מהזיכרון הסמנטי, שהם שני המרכיבים של הזיכרון הגלוי/המוצהר. בהליך זה הנבדק מתבקש לומר לגבי כל פרט שנחשף אליו קודם לכן - האם הוא זוכר אותו (אפיזודי) או רק יודע/מכיר אותו אך לא זוכר את הרגע בו נחשף אליו (סמנטי). על פי הבחנה זו כשאנו שולפים פרט מהזיכרון האפיזודי, אנו מנסים לשחזר אפיזודה שחווינו בעברנו שבה נכלל פרט זה יחד עם ההקשר שסביבו באותו רגע. לעומת זאת כשאנו שולפים פרט מהזיכרון הסמנטי, אנו שולפים רק פרט זה מתוך מאגר הידע שלנו, ללא מסע בזמן לרגע בעבר, וללא ההקשר שהתקיים באותו רגע. במחקרים שהשתמשו בהליך זוכר/יודע נמצא הממצא של סמנטיזציה של זכרונות מהעבר הרחוק כלומר שככל שחולף יותר זמן מאז ארוע בעברנו כך הוא מעורר בנו פחות תחושות \"זוכר\" (שאנו נזכרים באפיזודה בעברנו שבה נחשפנו אליו) ויותר תחושות \"יודע\" (יודעים עובדות לגבי אותו ארוע, אך לא כחווייה מחדש של רגע בעבר עם ההקשר שלו)."},{"id":"explicit","name":"זיכרון גלוי","one":"הזיכרון שאפשר להיזכר בו במודע ולספר מה יש בו.","simple":"זה זיכרון לטווח ארוך שנקרא גם זיכרון מוצהר. ממנו שולפים מידע באופן מודע. יש בו שני חלקים: הזיכרון האפיזודי, שבו חוזרים לרגעים מהעבר וחווים אותם מחדש, והזיכרון הסמנטי, שהוא מאגר הידע הכללי שלנו, בלי חזרה לרגע מסוים.","why":"יש דיסוציאציות נוירופסיכולוגיות: הזיכרון הגלוי נפגע והחבוי נשאר תקין. למשל HM לא יצר זכרונות אפיזודיים חדשים אבל למד ציור מבעד למראה, ואמנזים הראו הטרמה על ידי חזרה רגילה. זה מראה שמדובר במערכות נפרדות.","example":"כשמישהי שואלת אותך מה עשית בחתונה של אחותך, או מה בירת צרפת, את מחפשת את התשובה במודע ואומרת אותה במילים.","points":["זיכרון לטווח ארוך, נקרא גם מוצהר (בניגוד לחבוי/לא-מוצהר), שליפה מודעת","כולל: 1. זיכרון אפיזודי (חזרה לרגעים מהעבר וחוויה מחדש) 2. זיכרון סמנטי (מאגר ידע כללי, בלי הקשר של רגע מהעבר)","יש בין האפיזודי לסמנטי גם הבדלים ודיסוציאציות וגם שיתוף פעולה","דיסוציאציה: פגיעה בגלוי בלי פגיעה בחבוי. דוגמה אחת: HM למד ציור מבעד למראה, או אמנזים עם הטרמה על ידי חזרה תקינה"],"confuse":"זיכרון חבוי: משפיע עלינו בלי שנוכל להצהיר מה המידע. בגלוי השליפה מודעת.","original":"זהו סוג זיכרון של טווח ארוך שנקרא גם זיכרון מוצהר (הנבדל מהזיכרון החבוי/הלא-מוצהר), והוא הזיכרון שאנו מסוגלים לשלוף ממנו מידע באופן מודע. הזיכרון הגלוי כולל את: 1. הזיכרון האפיזודי שהוא היכולת לחזור לרגעים בעברנו ולחוות אותם מחדש, 2. הזיכרון הסמנטי שהוא מאגר הידע הכללי שלנו שממנו אנו יכולים לשלוף עובדות ספציפיות, ללא הקשר של חזרה לרגע מהעבר. מחקרים שונים הצביעו גם על הבדלים ודיסוציאציות בין הזיכרון האפיזודי והסמנטי, וגם על שיתוף הפעולה ביניהם. בנוסף מחקרים שונים הראו דיסוציאציות נוירופסיכולוגיות שבהן לפגיעה בזיכרון הגלוי לא מתלווה פגיעה בזיכרון החבוי, למשל (*יש להציג אחד משני הממצאים הבאים): 1. הפציינט HM מרגע הפגיעה המוחית לא היה מסוגל ליצור זכרונות אפיזודיים חדשים לטווח ארוך שיוכל להיזכר בהם, אך כן היה מסוגל לרכוש מיומנויות חדשות כמו ציור מבעד למראה בדיוק כל נבדק בריא. זוהי דוגמא לזיכרון פרוצדורלי (שהוא חלק מהזיכרון החבוי) תקין לצד זיכרון אפיזודי (שהוא חלק מהזיכרון הגלוי) פגוע. 2. ההטרמה על ידי חזרה (אחוז ההשלמה למילה מסוימת כשהיא הופיעה קודם לעומת כשלא הופיעה קודם) שנמצאה אצל נבדקים אמנזים שפגועים בזיכרון הגלוי (התקשו להיזכר בגירויים שהוצגו להם קודם) הייתה זהה לזו שנמצאה אצל נבדקים לא אמנזים. זוהי דוגמא לפגיעה בזיכרון הגלוי בצד זיכרון חבוי תקין שמתבטא בגודל תקין של אפקט ההטרמה ע\"י חזרה."},{"id":"implicit","name":"זיכרון חבוי","one":"העבר משפיע עלייך, גם כשאת לא יכולה להגיד מה בדיוק את זוכרת.","simple":"זה זיכרון לטווח ארוך שנקרא גם זיכרון לא-מוצהר. הוא מתבטא בהשפעה של העבר עלינו, בלי שנוכל להצהיר מה המידע שגורם לה, ובלי צורך להכיר או להיזכר בגירויים מהעבר. יש בו שלושה סוגים: זיכרון פרוצדורלי, הטרמה על ידי חזרה, והתניה קלאסית בלי היזכרות מודעת.","why":"מחקרים הראו שהזיכרון החבוי לא תלוי בזיכרון הגלוי. HM למד מיומנות חדשה למרות פגיעה בזיכרון האפיזודי, ואמנזים הראו הטרמה על ידי חזרה כמו כולם.","example":"את מקלידה סיסמה בטלפון באצבעות בלי לחשוב, אבל כשמבקשים ממך להגיד אותה בקול, את צריכה לעצור ולחשוב.","points":["זיכרון לטווח ארוך, נקרא גם לא-מוצהר (בניגוד לגלוי/המוצהר)","השפעה של העבר שלא תלויה ביכולת להצהיר מהו המידע, או להכיר ולהיזכר בגירויי העבר","כולל: 1. זיכרון פרוצדורלי (מיומנויות) 2. הטרמה על ידי חזרה 3. התניה קלאסית בלי היזכרות מודעת (למשל ריור לצליל הפעמון אצל הכלבים של פבלוב)","לא תלוי בזיכרון הגלוי. דוגמה אחת: HM למד ציור מבעד למראה, או אמנזים עם הטרמה תקינה"],"confuse":"זיכרון גלוי: שם השליפה מודעת ואפשר להצהיר מה יודעים. בחבוי ההשפעה קיימת גם בלי היזכרות.","original":"זהו סוג זיכרון של טווח ארוך שנקרא גם זיכרון לא-מוצהר (הנבדל מהזיכרון הגלוי/המוצהר), שמתבטא בהשפעה של העבר עלינו שאיננה תלויה ביכולת להצהיר מהו המידע מהעבר שנמצא בזכרוננו שגורם להשפעה זו, וכך אינה תלויה ביכולת להכיר את גירויי העבר או להיזכר בהם. הזיכרון החבוי כולל את 1. הזיכרון הפרוצדורלי: הזיכרון של מיומנויות שרכשנו, 2. אפקט ההטרמה על ידי חזרה: ההשפעה שיש להיחשפות קודמת לגירויים על התגובה להם, למרות שאיננה כוללת היזכרות מודעת בהם, ו- 3. התניה קלאסית ללא היזכרות מודעת, למשל למידת תגובת ריור לצליל הפעמון בניסוי של פבלוב על כלבים. מחקרים שונים תמכו בכך שהזכרון החבוי איננו תלוי בזיכרון הגלוי ולהלן דוגמה לממצא כזה (*יש להציג ממצא אחד מהבאים, ובאופן הבא): 1. הפציינט HM מרגע הפגיעה המוחית לא היה מסוגל ליצור זכרונות אפיזודיים חדשים לטווח ארוך שיוכל להיזכר בהם, אך כן היה מסוגל לרכוש מיומנויות חדשות כמו ציור מבעד למראה בדיוק כל נבדק בריא. זוהי דוגמא לזיכרון פרוצדורלי (שהוא חלק מהזיכרון החבוי) שממשיך לתפקד באופן תקין למרות הפגיעה בזיכרון אפיזודי (שהוא חלק מהזיכרון הגלוי). 2. ההטרמה על ידי חזרה, כלומר אחוז ההשלמה הגבוה יותר למילה מסוימת כאשר היא הוצגה קודם לעומת כשלא הוצגה קודם, שנמצאה אצל נבדקים אמנזים שפגועים בזיכרון הגלוי (התקשו להיזכר בגירויים שהוצגו להם קודם) הייתה זהה לזו שנמצאה אצל נבדקים לא אמנזים. זוהי דוגמא לאפקט הטרמה ע\"י חזרה תקין (שהוא חלק מהזיכרון החבוי) שמתקיים למרות הפגיעה בזיכרון הגלוי."},{"id":"procedural","name":"זיכרון פרוצדורלי (תהליכי)","one":"הזיכרון של \"איך עושים\": ללכת, לנהוג, לרכוב על אופניים.","simple":"זה סוג של זיכרון חבוי, כלומר משתמשים בו בלי היזכרות מודעת. הוא הזיכרון של כל המיומנויות שרכשנו: מוטוריות, תפיסתיות וקוגניטיביות. זה מתחיל מדברים בסיסיים כמו אחיזה בחפצים והליכה, ועד נהיגה ונגינה בפסנתר. הלמידה הדרגתית: ככל שמתרגלים, הביצוע משתפר.","why":"מחקרים על פגועי מוח מראים שהזיכרון הפרוצדורלי לא תלוי בזיכרון האפיזודי. HM לא יכול היה ליצור זכרונות אפיזודיים חדשים, אבל למד ציור מבעד למראה בדיוק כמו נבדקים בריאים.","example":"אחרי עשר שנים בלי אופניים, את עולה ופשוט רוכבת, בלי לחשוב איך שומרים על שיווי משקל.","points":["סוג של זיכרון חבוי/לא-מוצהר: שימוש בלי היזכרות מודעת","הזיכרון לכל המיומנויות שרכשנו: מוטוריות, תפיסתיות וקוגניטיביות, מבסיסיות (אחיזה, הליכה) ועד מורכבות (נהיגה, אופניים, פסנתר)","מטלה לדוגמה: ציור מבעד למראה. גרף הלמידה הדרגתי, הביצוע משתפר עם התרגול","לא תלוי בזיכרון האפיזודי: HM לא יצר זכרונות אפיזודיים חדשים אבל רכש מיומנות כמו נבדקים בריאים"],"confuse":"זיכרון אפיזודי: חזרה מודעת לרגע מהעבר. HM איבד את היכולת ליצור זכרונות כאלה, אבל הזיכרון הפרוצדורלי שלו נשאר תקין.","original":"זהו סוג זיכרון של טווח ארוך שהוא אחד מן הסוגים של זיכרון החבוי/הלא-מוצהר, כלומר זיכרון שאנו משתמשים בו ללא היזכרות מודעת. הזיכרון הפרוצדורלי הוא הזיכרון לכלל המיומנויות שרכשנו במהלך חיינו, הן מוטוריות, הן תפיסתיות והן קוגניטיביות, והוא כולל מיומנויות מהראשוניות ביותר כגון אחיזה בחפצים או הליכה ועד המיומנויות המורכבות והמאוחרות ביותר שרכשנו בחיינו כמו נהיגה, רכיבה על אופניים או נגינה על פסנתר. דוגמא למטלה שבודקת רכישת זיכרון פרוצדורלי/מיומנות חדש הוא למידת ציור מבעד למראה. כפי שרואים במטלה זו בפרט ובכלל ברכישת מיומנויות - גרף הלמידה הוא הדרגתי והביצועים של המיומנות משתפרים בהדרגה ככל שמתרגלים אותה. מחקרים על פגועי מוח מראים שהזיכרון הפרוצדורלי איננו תלוי בזיכרון האפיזודי (ששייך לזיכרון הגלוי/מוצהר). לדוגמה הפציינט HM שמרגע הפגיעה המוחית לא היה מסוגל ליצור זכרונות אפיזודיים חדשים לטווח ארוך שיוכל להיזכר בהם, כן היה מסוגל לרכוש מיומנויות חדשות כמו ציור מבעד למראה בדיוק כמו נבדקים בריאים."},{"id":"semanticization","name":"סמנטיזציה של זכרונות מהעבר הרחוק","one":"עם השנים, זיכרון של חוויה הופך לסתם עובדה שאת יודעת.","simple":"זכרונות מהעבר הרחוק מאבדים את האופי האפיזודי שלהם והופכים לידע עובדתי. במחקר הציגו לנבדקים אירועים ציבוריים מחמישים השנים האחרונות. על כל אירוע הם אמרו אם הם \"זוכרים\" אותו (איפה היו, ממי שמעו), רק \"יודעים\" עליו, או לא מכירים. ככל שהאירוע ישן יותר, יותר ענו \"יודע\" ופחות \"זוכר\".","why":"התופעה תומכת בכך שהזיכרון האפיזודי והסמנטי אינם מערכות נפרדות ובלתי תלויות, אלא יש ביניהם רצף. בהתחלה הזיכרון מלא בפרטים אפיזודיים, ועם הזמן הם מתמעטים והוא נעשה ידע של עובדות בלבד.","example":"על הטיול השנתי בכיתה ט' את יודעת שנסעתם לגליל, אבל כמעט לא נשאר לך זיכרון של איך זה הרגיש או עם מי ישבת באוטובוס.","points":["זכרונות מהעבר הרחוק מאבדים את האופי האפיזודי והופכים לידע סמנטי/עובדתי","הודגם בהליך זוכר/יודע: אירועים ציבוריים מ-50 השנים האחרונות, תשובה \"זוכר\", \"יודע\" או \"לא מכיר\"","ממצא: ככל שהאירוע רחוק יותר בעבר, עולה הסיכוי ל\"יודע\" ויורד הסיכוי ל\"זוכר\"","מסקנה: אפיזודי וסמנטי אינם מערכות נפרדות ובלתי תלויות, יש ביניהם רצף"],"confuse":"הליך זוכר/יודע: זו השיטה. הסמנטיזציה היא הממצא שהשיטה גילתה.","original":"זוהי תופעה שבה זכרונות מהעבר הרחוק מאבדים את האופי האפיזודי שלהם, והופכים לידע סמנטי/עובדתי. תופעה זו הודגמה במחקר שבו השתמשו החוקרים ב\"הליך זוכר/יודע\". החוקרים הציגו לנבדקים אירועים ציבוריים שונים שנחשפו אליהם במהלך חמישים השנים האחרונות, והנבדקו התבקשו לדווח האם הם זוכרים את הארוע (כלומר זוכרים פרטים הקשורים לחוויה של ההיחשפות לאירוע כמו איפה היו, ממי ובאיזה אופן שמעו עליו וכדומה), או רק יודעים על הארוע (מכירים אותו אבל לא זוכרים פרטים חווייתיים ספציפיים לגביו), או שלא מכירים כלל את הארוע. תוצאות המחקר הראו שלגבי אותם ארועים שעליהם השיבו הנבדקים \"זוכר\" או \"יודע\", ככל שהארוע המוכר לנבדקים נלקח מהעבר הרחוק יותר כך גדל הסיכוי שהנבדקים יסמנו \"יודע\" ובהתאמה קטן הסיכוי שיסמנו \"זוכר\". תופעה זו של היהפכות זכרון אפיזודי של ארוע לזכרון סמנטי/עובדתי ככל שחולף הזמן מאז התרחשותו, תומכת בכך שהזיכרון האפיזודי והסמנטי אינם מערכות זכרון נפרדות ובלתי תלויות, אלא שקיים רצף ביניהם: הזכרון של ארועי העבר משתנה עם הזמן כאשר בתחילה הוא מכיל הרבה פריטים אפיזודיים של האופן הספציפי בו נחווה הארוע, וככל שחולף הזמן כך הפריטים האפיזודיים מתמעטים והזכרון הופך יותר ויותר לזיכרון סמנטי, כלומר לידע של עובדות הארוע בלבד."},{"id":"serial-position","name":"עקומת מיקום סדרתי","one":"גרף בצורת U: זוכרים את ההתחלה ואת הסוף של הרשימה, ופחות את האמצע.","simple":"זו התוצאה של מטלת המיקום הסדרתי. העקומה מראה כמה סיכוי יש לזכור מילה לפי המקום שלה ברשימה. מהמילה הראשונה הזכירה יורדת, ובמילים האחרונות היא עולה שוב עד המילה האחרונה. הצד הראשון נקרא אפקט הראשונות, והשני אפקט האחרונות.","why":"העקומה חיזקה את ההבחנה של המודל המודאלי בין שני סוגי זיכרון. הפריטים הראשונים נשלפים מהזיכרון לטווח ארוך כי קיבלו יותר שינון. הפריטים האחרונים נשלפים מהזיכרון לטווח קצר כי עוד לא דעכו. מחקרים הראו שמספר החזרות יורד לאורך המילים הראשונות, ושהסחה לפני ההיזכרות מבטלת את אפקט האחרונות.","example":"אחרי שיעור ארוך את זוכרת טוב את מה שהמרצה אמרה בפתיחה ואת מה שאמרה רגע לפני הסוף. מה שהיה באמצע מטושטש.","points":["תוצאת מטלת המיקום הסדרתי: סיכוי ההיזכרות במילה כפונקציה של מקומה ברשימה","צורת U: זכירה יורדת מהמילה הראשונה, ועולה שוב במילים האחרונות (אפקט הראשונות ואפקט האחרונות)","חיזוק למודל המודאלי: ראשונים מהזיכרון לטווח ארוך (יותר שינון), אחרונים מהזיכרון לטווח קצר (עוד לא דעכו)","חיזוקים: מספר החזרות יורד לאורך המילים הראשונות, והסחה לפני ההיזכרות מבטלת את אפקט האחרונות"],"confuse":"אפקט הראשונות / אפקט האחרונות: כל אחד מהם הוא רק צד אחד של העקומה. העקומה היא התמונה המלאה.","original":"זוהי התוצאה של מטלת המיקום הסדרתי. העקומה מתארת את סיכויי ההיזכרות במילה כפונקציה של מקומה הסדרתי (כלומר מקומו בתוך הסדרה שבו הוצגו המילים). העקומה שהתקבלה במטלה זו היא בצורת האות U כך שיש מגמת זכירה יורדת מהמילה הראשונה ברשימה והלאה, אך במילים האחרונות של הרשימה המגמה מתהפכת והזכירה עולה עד למילה האחרונה. שתי מגמות זכירה הפוכות אלה זכו לכינויים: אפקט הראשונות ואפקט האחרונות (בהתאמה). עקומת המיקום הסדרתי שימשה כחיזוק לטענת ההבחנה בין שני סוגי זיכרון, שהיא חלק מהמודל המודאלי: הזיכרון לטווח ארוך (זט\"א) שממנו נשלפים הפריטים הראשונים כיוון שזכו ליותר שינון, והזיכרון לטווח קצר (זט\"ק) שממנו נשלפים הפריטים האחרונים כיון שהופיעו בסמוך לתחילת ההיזכרות ועדיין לא הספיקו לדעוך ממנו. הסבר זה של העקומה על פי זט\"ק וזט\"א קיבל חיזוק במחקרים נוספים שהראו שכמות החזרות על כל מילה אכן יורדת לאורך המילים הראשונות, ושהוספת הסחה לפני ההיזכרות מבטלת את אפקט האחרונות כי גורמת לפריטים האחרונים לדעוך מהזט\"ק."}],"drill":[{"t":"recency","q":"נבדקת שומעת רשימת מילים וכותבת מיד את מה שזכרה. את המילים מסוף הרשימה היא זוכרת הכי טוב. איך נקרא הממצא?","o":["אפקט הראשונות","הטרמה על ידי חזרה","אפקט האחרונות","סמנטיזציה של זכרונות"],"a":2,"e":"זכירה טובה יותר של הפריטים האחרונים לעומת האמצעיים היא אפקט האחרונות."},{"t":"recency","q":"מה ההסבר שהוצג בספר לאפקט האחרונות?","o":["הפריטים האחרונים נשלפים מהזיכרון לטווח קצר, כי עוד לא דעכו ממנו","הפריטים האחרונים קיבלו יותר שינון ולכן נכנסו לזיכרון לטווח ארוך","הפריטים האחרונים הוטרמו על ידי הפריטים שלפניהם ברשימה","הפריטים האחרונים נשלפים מהזיכרון הסמנטי ולא מהאפיזודי"],"a":0,"e":"לפי הספר הפריטים האחרונים נשלפים מהזיכרון לטווח קצר, וככל שהם מאוחרים יותר הם דעכו פחות."},{"t":"recency","q":"איזה ממצא חיזק את ההסבר לאפקט האחרונות?","o":["שינון בקול הראה ירידה במספר החזרות לאורך הרשימה","מטלת הסחה מיד אחרי הרשימה ביטלה את אפקט האחרונות","אמנזים הראו אפקט אחרונות זהה לקבוצות הביקורת","ככל שהרשימה ארוכה יותר, אפקט האחרונות גדל"],"a":1,"e":"הסחה גורמת לפריטים לדעוך מהזיכרון לטווח קצר. אם האפקט נעלם, סימן שהיתרון שלהם בא משם."},{"t":"primacy","q":"במטלת רשימה, המילה הראשונה נזכרת הכי טוב, והזכירה יורדת ככל שמתרחקים מתחילת הרשימה. מה זה?","o":["אפקט האחרונות","אפקט הראשונות","הליך זוכר/יודע","הטרמה על ידי חזרה"],"a":1,"e":"מגמה יורדת של זכירה מתחילת הרשימה, עם יתרון לפריטים הראשונים, היא אפקט הראשונות."},{"t":"primacy","q":"איזו טענה נכונה לגבי ההסבר של אפקט הראשונות?","o":["הפריטים הראשונים נשלפים מהזיכרון לטווח קצר כי הם הכי טריים","הפריטים הראשונים נזכרים טוב כי ההסחה לא פוגעת בהם","הפריטים הראשונים מקבלים יותר שינון ולכן נשלפים מהזיכרון לטווח ארוך","הפריטים הראשונים נזכרים טוב כי הם מוטרמים על ידי שאר הרשימה"],"a":2,"e":"לפי הסבר השינון, הפריט הראשון משונן לבד והבאים אחריו מתחלקים בשינון. יותר שינון אומר יותר סיכוי להיכנס לזיכרון לטווח ארוך."},{"t":"primacy","q":"איזה ממצא תומך בהסבר השינון לאפקט הראשונות?","o":["מטלת הסחה אחרי הרשימה ביטלה את אפקט הראשונות","אמנזים לא הראו אפקט ראשונות בכלל","הנבדקים ענו \"יודע\" על המילים הראשונות ו\"זוכר\" על האחרונות","בשינון בקול, מספר החזרות על מילה ירד בפריטים הראשונים בהתאמה לזכירה"],"a":3,"e":"ההתאמה בין כמות השינון לאחוז הזכירה מראה שכמות השינון היא שקובעת את זכירת המילה."},{"t":"repetition-priming","q":"חצי מהנבדקים ראו את המילה \"שולחן\" קודם. במבחן כולם משלימים \"שול__\". מי שראה אותה משלים אותה יותר, גם בלי שהתבקש להיזכר. מה זה?","o":["זיכרון פרוצדורלי","הטרמה על ידי חזרה","אפקט הראשונות","סמנטיזציה של זכרונות"],"a":1,"e":"יתרון בביצוע לגירוי שהוצג קודם, במבחן שלא דורש היזכרות, הוא הטרמה על ידי חזרה."},{"t":"repetition-priming","q":"מה נמצא אצל אמנזים בניסוי ההטרמה על ידי חזרה שתואר
